{id:"l1s1",topic:"hybrid",type:"mc",diff:2,prompt:"Pi (π) bonds are formed by:",choices:["Side-on overlap of two UNhybridized p orbitals","Head-on overlap of hybridized orbitals","Side-on overlap of hybridized orbitals","Overlap of two s orbitals"],answer:0,why:"σ bonds = head-on overlap of <b>hybridized</b> orbitals; π bonds = side-on overlap of <b>unhybridized p</b> orbitals (they must be in the same plane; there's a node at the nucleus plane). Lecture 8/20: she called this a classic glitch."},
{id:"l1s2",topic:"hybrid",type:"mc",diff:1,prompt:"Hydrogen forms its sigma bonds using:",choices:["Its 1s orbital — H is never hybridized","An sp orbital","An sp³ orbital","An unhybridized p orbital"],answer:0,why:"<b>Hydrogen is the exception</b>: it always bonds with its 1s orbital, never hybridized. Every other σ bond in Ch 1 uses hybridized orbitals."},
{id:"l1s5",topic:"hybrid",type:"mc",diff:2,prompt:"A LOCALIZED lone pair sits in:",choices:["A hybridized orbital matching the hybridization of its atom","An unhybridized p orbital, always","An sp³ orbital, always","The 1s orbital"],answer:0,why:"Her exact rule (8/20): <b>localized lone pairs live in hybridized orbitals</b> — and WHICH one is set by the hybridization of the atom they sit on. sp³ N → lone pair in sp³ orbital; sp² N → sp². In Ch 1, every lone pair you'll be asked about is localized. (Delocalized pairs arrive in Ch 2.)"},
{id:"l1s3",topic:"hybrid",type:"text",diff:2,prompt:"A nitrogen is sp² hybridized and carries a localized lone pair. Which orbital is the lone pair in? (type like sp2)",answer:"sp2",why:"Lone pair orbital = the atom's hybridization → <b>sp²</b>. She said: 'you need to be able to tell me which orbital the lone pair is in.'"},
{id:"l1s4",topic:"hybrid",type:"text",diff:2,prompt:"An sp³ nitrogen (3 bonds + 1 lone pair) holds its lone pair in which orbital? (type like sp3)",answer:"sp3",why:"Same rule: localized lone pair lives in a hybridized orbital matching its atom → <b>sp³</b>."},
{id:"l1g1",topic:"hybrid",type:"num",diff:1,prompt:"Bond angle (degrees) for a trigonal planar electron geometry?",answer:120,why:"Tetrahedral 109.5° · trigonal planar <b>120°</b> · linear 180°."},
{id:"l1g2",topic:"hybrid",type:"mc",diff:2,prompt:"NH₃'s H–N–H bond angle is:",choices:["≈107° — the lone pair takes more volume and compresses the bonds below 109.5°","Exactly 109.5° — 4 electron domains","120° — three atoms attached","90° — p orbitals"],answer:0,why:"Lone pairs occupy MORE volume than bonding pairs → repulsion pushes the N–H bonds together → <b>less than 109.5°</b> (~107°; water ~105° with two lone pairs). She requires: know it's <b>less than 109.5</b>, not the exact numbers."},
{id:"l1g3",topic:"hybrid",type:"mc",diff:3,prompt:"SO₂: what is the O–S–O bond angle?",choices:["Slightly LESS than 120° — steric number 3 (sp², trigonal planar) with a lone pair compressing","109.5° — like water","Exactly 120°","180° — linear like CO₂"],answer:0,why:"Her named trap: students answer 109.5 by pattern-matching to H₂O. Work it: S has 2 bonded atoms + 1 lone pair → steric number <b>3</b> → sp², trigonal planar electron geometry, bent shape → base angle 120°, compressed slightly below by the lone pair. <b>To get a bond angle you MUST go through the geometry.</b>"},
{id:"l1p1",topic:"polarity",type:"mc",diff:3,prompt:"ΔEN for C–Br is 0.3 (below the 0.5 'pure covalent' cutoff). The C–Br bond is:",choices:["Polar — carbon bonded to ANY halogen is always polar, regardless of ΔEN","Pure covalent — ΔEN < 0.5","Ionic — Br is much bigger","Nonpolar — the electrons are shared equally"],answer:0,why:"Her TOP TIP, verbatim: <b>'carbon bonded to a halogen is ALWAYS a polar bond, regardless of the ΔEN.'</b> ΔEN alone oversimplifies — real polarity is charge distribution over DISTANCE, and Br is a big atom. Named trap: assessments hand you EN values hoping you'll calculate and answer 'pure covalent.'"},
{id:"l1p2",topic:"polarity",type:"num",diff:1,prompt:"Below what ΔEN (course values) is a bond considered 'pure covalent'? (e.g. 0.4)",answer:0.5,why:"Course cutoffs: ΔEN &lt; <b>0.5</b> pure covalent · 0.5–1.7 polar covalent · &gt; 1.7 ionic. (Use OUR values — homework is based on them.) But remember the C–halogen override."},
{id:"l1p4",topic:"polarity",type:"mc",diff:2,prompt:"CCl₄ (carbon tetrachloride) has four polar C–Cl bonds. The MOLECULE is:",choices:["Nonpolar — four identical bond dipoles on a tetrahedron cancel (sum to zero)","Polar — it contains polar bonds","Ionic","Nonpolar — C–Cl bonds aren't polar"],answer:0,why:"Bond polarity ≠ molecular polarity. Four identical vectors on a tetrahedron <b>sum to zero</b> → no net dipole → nonpolar molecule, despite four polar bonds. The four cancel cases: tetrahedral-identical (CCl₄), trigonal-planar-identical (BF₃), linear (CO₂), and trans-disubstituted alkenes."},
{id:"l1p5",topic:"polarity",type:"mc",diff:2,prompt:"Swap one Cl of CCl₄ for Br → CCl₃Br. Now the molecule is:",choices:["Polar — the C–Br dipole is smaller than C–Cl, so the vectors no longer cancel","Still nonpolar — it's still tetrahedral","Nonpolar — Br isn't electronegative enough","Ionic"],answer:0,why:"Cancellation requires <b>identical</b> atoms at every position. C–Br has a smaller bond dipole than C–Cl (Cl is more electronegative), so the vector sum ≠ 0 → polar."},
{id:"l1p6",topic:"polarity",type:"mc",diff:2,prompt:"BF₃ (trigonal planar, three polar B–F bonds) is:",choices:["Nonpolar — three identical dipoles at 120° sum to zero","Polar — F is the most electronegative element","Polar — boron is electron-poor","Ionic"],answer:0,why:"Trigonal planar with the <b>same atom at every position</b> → vectors cancel → nonpolar. Her classic example (hard to build with carbon, easy with boron)."},
{id:"l1p7",topic:"polarity",type:"mc",diff:3,prompt:"1,2-dichloroethene, two isomers:<svg viewBox='0 0 330 115' width='300' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='55' y1='53' x2='105' y2='53'/><line x1='55' y1='59' x2='105' y2='59'/><line x1='55' y1='56' x2='30' y2='31'/><line x1='55' y1='56' x2='30' y2='83'/><line x1='105' y1='56' x2='130' y2='31'/><line x1='105' y1='56' x2='130' y2='83'/><line x1='215' y1='53' x2='265' y2='53'/><line x1='215' y1='59' x2='265' y2='59'/><line x1='215' y1='56' x2='190' y2='31'/><line x1='215' y1='56' x2='190' y2='83'/><line x1='265' y1='56' x2='290' y2='31'/><line x1='265' y1='56' x2='290' y2='83'/></g><g font-size='13' fill='currentColor'><text x='12' y='28'>Cl</text><text x='22' y='95'>H</text><text x='133' y='28'>H</text><text x='128' y='95'>Cl</text><text x='68' y='108'>A</text><text x='172' y='28'>Cl</text><text x='182' y='95'>H</text><text x='293' y='28'>Cl</text><text x='288' y='95'>H</text><text x='228' y='108'>B</text></g></svg>Which isomer is NONPOLAR?",choices:["A (trans) — the two C–Cl dipoles point opposite ways and cancel","B (cis) — both Cl on the same side","Both are nonpolar","Neither — C–Cl bonds are polar so both molecules are polar"],answer:0,why:"<b>A is trans</b> (Cl on opposite sides): equal C–Cl vectors in opposite directions sum to zero → nonpolar. <b>B is cis</b>: both dipoles point the same general way → net dipole → polar. Containing polar bonds is necessary but NOT sufficient for a polar molecule."},
{id:"l1i1",topic:"imf",type:"mc",diff:2,prompt:"When water boils, what breaks?",choices:["Intermolecular forces only — every H₂O molecule stays intact","The O–H covalent bonds","Both the H-bonds and the O–H bonds","The hydrogen turns to gas first"],answer:0,why:"Her top emphasis: <b>phase changes break INTERMOLECULAR FORCES, never bonds.</b> Liquid→gas hexanol is still hexanol — nothing happened to the structure. Writing 'the bonds are harder to break' on an exam explanation = wrong."},
{id:"l1i2",topic:"imf",type:"mc",diff:3,prompt:"cis- and trans-1,2-dichloroethene (same molecular formula — stereoisomers). Which boils higher, and why?",choices:["cis — it's polar, so it has dipole–dipole ON TOP of dispersion; trans's dipoles cancel","trans — it's more symmetric so it packs better","They boil at the same temperature — same mass","cis — it has hydrogen bonding"],answer:0,why:"Same formula → mass is irrelevant. Neither has H-bonding (no H on N/O). trans: dipoles cancel → nonpolar → dispersion only. cis: net dipole → <b>dipole–dipole + dispersion</b> → stronger IMFs → higher boiling point. This was her closing worked example."},
{id:"l1i3",topic:"imf",type:"mc",diff:2,prompt:"'Hydrogen bonding' is:",choices:["An intermolecular ATTRACTION between an H (δ+) on N/O and a lone pair on another N/O — not a covalent bond","A covalent bond between hydrogen atoms","Any bond containing hydrogen","A bond between H and any electronegative atom, including C"],answer:0,why:"'And by the way, it's not a bond.' Requires H <b>directly bonded</b> to N or O (F in organic molecules is bonded to C, so no H-bonding through it). Strength order: H-bonding &gt; dipole–dipole &gt; dispersion (which everything has)."},
{id:"l1b1",topic:"bondline",type:"num",diff:1,prompt:"Bond-line structure (each line-end/vertex = a carbon; H's on carbon are NOT drawn):<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>How many implicit hydrogens are on <b>C4</b>?",answer:3,why:"C4 shows ONE bond (to C3). Carbon wants 4 → <b>3 hidden H's</b> (a CH₃). Reading rule: carbon's H's are never drawn; you supply them by counting to four."},
{id:"l1b2",topic:"bondline",type:"num",diff:2,prompt:"Same structure:<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>How many implicit hydrogens are on <b>C2</b>?",answer:1,why:"C2 has a DOUBLE bond to C1 (counts as 2) + a single bond to C3 = 3 bonds shown → <b>1 hidden H</b>. Her homework for next class is exactly this skill."},

/* v3.3 written items — lecture 1 */
{id:"WR-CH1-007",topic:"hybrid",type:"written",diff:3,prompt:"<b>Lone-pair orbitals:</b> a molecule has two nitrogens — N1 has three single bonds + 1 lone pair; N2 has a double bond, a single bond + 1 lone pair. For EACH nitrogen: give its hybridization AND name the orbital holding its lone pair. Then state the general rule.",
 model:"<b>N1:</b> 4 electron domains (3 bonds + 1 LP) → <b>sp³</b>; its lone pair is in an <b>sp³ orbital</b>. <b>N2:</b> 3 domains (double bond counts as ONE domain, + single bond + LP) → <b>sp²</b>; lone pair in an <b>sp² orbital</b>. <b>Rule:</b> a localized lone pair lives in a hybridized orbital, and WHICH one is set by the hybridization of the atom it sits on.",
 rubric:["Both hybridizations derived from domain count (double bond = one domain)","Lone-pair orbital = atom's hybridization, stated as the rule","sp³/sp² assigned to the right nitrogens"]},
{id:"WR-CH1-008",topic:"polarity",type:"written",diff:2,prompt:"<b>The C–Br trap:</b> ΔEN(C–Br) = 0.3, below the 0.5 cutoff — 'pure covalent' by the numbers. Is the C–Br bond polar? Explain what the ΔEN method misses.",
 model:"<b>Polar.</b> Course rule: carbon bonded to ANY halogen is always polar, regardless of ΔEN. The cutoff method oversimplifies: bond polarity is really <b>charge distribution over distance</b> — bromine is a much larger atom than carbon, so even a small EN difference produces a real dipole. (Related: C–Li at ΔEN 1.5 is drawn BOTH as ionic and polar covalent — it's a spectrum.)",
 rubric:["Answers polar despite the cutoff","States the C–halogen-always-polar rule","Mentions size / charge-over-distance as what ΔEN misses"]},
/* ===== v3.10 SO₂ SCAFFOLD (2026-08-25, from his report: he drew SO₂ LINEAR on WR-CH1-009
   and picked "109.5, like water" on l1g3 — same root cause, the lone pair on S is missing
   from his model. These build it one step at a time, the same way f0→f2 scaffold FC. ===== */
{id:"x3-so1",topic:"lewis",type:"num",diff:1,prompt:"SO₂ — total valence electrons? (S and O are both group 6)",answer:18,why:"<b>18</b> = 6 (S) + 6 + 6. Nothing to adjust — SO₂ is neutral, so no charge correction to the total."},
{id:"x3-so2",topic:"lewis",type:"num",diff:2,prompt:"Sulfur brings 6 valence electrons to SO₂. In the O=S=O structure it uses 4 of them to make its two double bonds. How many of sulfur's own electrons are LEFT OVER?",answer:2,why:"<b>2.</b> 6 − 4 = 2. Those two leftover electrons don't disappear — they sit on sulfur as a lone pair. <b>This is the step that decides the shape of the whole molecule</b>, and it's the one that gets skipped."},
{id:"x3-so3",topic:"hybrid",type:"num",diff:2,prompt:"Those 2 leftover electrons on sulfur in SO₂ make how many LONE PAIRS?",answer:1,why:"<b>1</b> — two electrons is one pair. So sulfur ends up with 2 bonded atoms + 1 lone pair."},
{id:"x3-so4",topic:"hybrid",type:"num",diff:2,prompt:"SO₂: sulfur has 2 bonded atoms and 1 lone pair. What is its steric number (electron domains)?",answer:3,why:"<b>3</b> — each double bond counts as ONE domain, and the lone pair counts as one. 2 + 1 = 3 → sp² → trigonal planar electron geometry → <b>bent</b> molecular shape, angle just under 120°."},
{id:"x3-so5",topic:"hybrid",type:"mc",diff:3,prompt:"CO₂ is linear but SO₂ is BENT. Both are O=X=O with two double bonds. What is the actual difference?",choices:["Sulfur has a lone pair (6 valence e⁻ − 4 bonding = 2 left); carbon has none (4 − 4 = 0)","Sulfur is heavier","CO₂'s bonds are stronger","SO₂ has more oxygens"],answer:0,why:"<b>Two electrons, and that's the whole story.</b> Carbon (group 4) spends all 4 of its valence electrons on the two double bonds → 2 domains → <b>linear</b>. Sulfur (group 6) spends 4 and has <b>2 left over</b> → a lone pair → 3 domains → <b>bent</b>. Same skeleton, different group number, different shape. If you ever draw SO₂ linear, this is the step you skipped."},
{id:"x3-so6",topic:"hybrid",type:"mc",diff:3,prompt:"You've established SO₂ is bent. What is the O–S–O angle?",choices:["Just under 120°","104.5° — same as water","109.5°","180°"],answer:0,why:"<b>Just under 120°.</b> Bent is not one angle — it's a shape that several different steric numbers can produce. SO₂ is bent from <b>SN 3</b> (base 120°); water is bent from <b>SN 4</b> (base 109.5°). Both bent, ~15° apart. Reaching for water's number whenever you see 'bent' is the exact trap Ciesla called out — <b>the steric number sets the angle, not the shape word.</b>"},
{id:"WR-CH1-009",topic:"lewis",type:"written",diff:3,prompt:"<b>SO₂ from scratch:</b> draw a Lewis structure for SO₂ (S and O are both group 6). Then give the electron geometry and the O–S–O bond angle, justified. (Two different valid structures exist — name both if you can.)",
 model:"<b>Structure 1 (minimized FC, expanded octet):</b> O=S=O with one lone pair on S — S holds 10 electrons, allowed because sulfur is period 3. <b>Structure 2:</b> O=S–O⁻ with S⁺ (octet kept, charges +1/−1). BOTH are valid and give the same answer: S has 2 bonded atoms + 1 lone pair → steric number <b>3</b> → sp², <b>trigonal planar electron geometry</b>, bent molecular shape → bond angle just <b>under 120°</b> (lone pair compression). NOT 109.5 — that's the H₂O pattern-match trap.",
 rubric:["Valid Lewis structure including the lone pair on S","Steric number 3 → trigonal planar (not tetrahedral)","Angle <120° with lone-pair justification — and not 109.5"]},
{id:"WR-CH1-010",topic:"imf",type:"written",diff:2,prompt:"<b>Exam-wording drill.</b> Setup: molecules X and Y have the SAME molecular formula. Y is polar, X is not. Y boils higher. An exam asks you to explain why.<br><br>Write your answer in two labelled parts:<br><b>Part 1 —</b> write the tempting answer that would LOSE marks, and say in one line why it's wrong.<br><b>Part 2 —</b> write the answer you'd actually hand in for full credit.<br><br>(The point is to practise spotting the losing phrasing so you don't write it under pressure.)",
 model:"<b>(1) Loses points:</b> 'Y's bonds are harder to break.' — wrong because phase changes never break covalent bonds. <b>(2) Full credit:</b> 'Y has a net dipole, so it has dipole–dipole forces in addition to dispersion; X's bond dipoles cancel, leaving dispersion only. Stronger INTERMOLECULAR forces require more energy to separate the molecules, so Y has the higher boiling point. The molecules themselves are unchanged.'",
 rubric:["Identifies 'breaking bonds' as the losing phrase","Full-credit version names the specific IMF difference","Links IMF strength → energy → boiling point, molecules intact"]},
{id:"WR-CH1-011",topic:"bondline",type:"written",diff:2,prompt:"<b>Add every hydrogen:</b> for the bond-line structure below, list the number of hydrogens on EACH carbon, then give the molecular formula.<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>",
 model:"Count each carbon to 4 bonds: <b>C1</b>: double bond (2) → <b>2 H</b>. <b>C2</b>: double (2) + single to C3 (1) = 3 → <b>1 H</b>. <b>C3</b>: two singles → <b>2 H</b>. <b>C4</b>: one single → <b>3 H</b>. Total: <b>C₄H₈</b> (1-butene). Rule: H's on carbon are implicit; H's on N/O/S are always drawn.",
 rubric:["Every carbon brought to exactly 4 bonds","Correct per-carbon counts (2,1,2,3)","Correct formula C₄H₈"]},
/* ---- v3.3 TUTORIAL-STANDARD SET — modeled on Ciesla's Ch-1 tutorial + official quiz scope ---- */
{id:"T-CH1-01",topic:"lewis",type:"mc",diff:1,prompt:"Two compounds are <b>constitutional isomers</b>. Which MUST be true?",choices:["Same molecular formula, different connectivity of atoms","Same connectivity, different 3-D arrangement","Same properties, different formulas","They are the same compound drawn differently"],answer:0,why:"Constitutional isomers share a molecular formula but connect their atoms differently — and structure (connectivity), not formula, determines properties. (Same connectivity/different 3-D = stereoisomers.)"},
{id:"T-CH1-02",topic:"lewis",type:"mc",diff:1,prompt:"Which bonding pattern is <b>WRONG</b> for a neutral atom in an organic molecule?",choices:["C — 4 bonds","N — 3 bonds + 1 lone pair","O — 2 bonds + 2 lone pairs","F — 2 bonds + 2 lone pairs"],answer:3,why:"Neutral halogens form 1 bond + 3 lone pairs. Memorize the neutral patterns: C=4 bonds · N=3+1LP · O=2+2LP · H=1 · halogen=1+3LP. Any deviation means a formal charge."},
{id:"T-CH1-03",topic:"hybrid",type:"mc",diff:2,prompt:"Rank C–H bond strength: ethyne (HC≡CH), ethene (H₂C=CH₂), ethane (H₃C–CH₃).",choices:["ethyne > ethene > ethane","ethane > ethene > ethyne","ethene > ethyne > ethane","all equal — they're all C–H bonds"],answer:0,why:"More s-character = shorter, stronger bond. sp (50% s, ethyne) > sp² (33%, ethene) > sp³ (25%, ethane). s orbitals hold electrons closer to the nucleus."},
{id:"T-CH1-04",topic:"hybrid",type:"mc",diff:1,prompt:"A C=C double bond consists of:",choices:["1 σ bond + 1 π bond","2 σ bonds","2 π bonds","1 σ + 2 π"],answer:0,why:"Every bond's FIRST connection is a σ (head-on overlap of hybridized orbitals). The second is a π — side-on overlap of unhybridized p orbitals. π is the weaker of the two."},
{id:"T-CH1-05",topic:"hybrid",type:"mc",diff:2,prompt:"A p orbital has:",choices:["two lobes of opposite phase separated by a node","one spherical lobe, no nodes","two lobes of the same phase","a node only at infinite distance"],answer:0,why:"p orbitals are dumbbells: two lobes of opposite phase (+/−) with a node (zero electron density) at the nucleus. Bonding requires CONSTRUCTIVE overlap — same-phase lobes meeting."},
{id:"T-CH1-06",topic:"polarity",type:"mc",diff:1,prompt:"On an electrostatic potential map of water, the <b>red</b> region sits on:",choices:["the oxygen (high electron density, δ−)","the hydrogens (δ+)","the O–H bond midpoints","nowhere — water is nonpolar"],answer:0,why:"EPM color code: red = electron-rich (δ−), blue = electron-poor (δ+). O is the most electronegative atom in water, so red concentrates there; the H end reads blue."},
{id:"T-CH1-07",topic:"imf",type:"mc",diff:2,prompt:"Pentane and neopentane (2,2-dimethylpropane) are both C₅H₁₂. Which boils higher, and why?",choices:["Pentane — linear shape gives more surface contact for London forces","Neopentane — branching adds strain","They boil identically — same formula, same mass","Neopentane — spheres pack tighter"],answer:0,why:"Same mass → same-strength question comes down to CONTACT AREA. Linear pentane molecules touch along their whole length (more LDF); branched neopentane is ball-shaped with less contact. Branching LOWERS boiling point."},
{id:"T-CH1-08",topic:"imf",type:"mc",diff:1,prompt:'"Like dissolves like": which pair actually mixes?',choices:["CH₃OH and H₂O — both hydrogen-bond","hexane and H₂O — both contain H","NaCl and hexane — opposites attract","CO₂ and H₂O — both contain oxygen"],answer:0,why:"Polar/H-bonding dissolves polar/H-bonding; nonpolar dissolves nonpolar. Methanol H-bonds with water. Hexane (nonpolar, LDF-only) can't pay the energy cost of breaking water's H-bond network."},
{id:"T-CH1-09",topic:"imf",type:"mc",diff:2,prompt:"Why does oil NOT dissolve in water?",choices:["Mixing would break water's H-bonds but oil offers only weak LDF in return","Oil is denser than water","Oil molecules repel water electrostatically","Oil's covalent bonds can't break in water"],answer:0,why:"Solubility is an energy trade. Water gives up strong H-bonding interactions to make room; nonpolar oil can only repay with weak dispersion forces. Bad trade → no mixing. (No covalent bonds break in dissolving.)"},
{id:"T-CH1-10",topic:"valence",type:"mc",diff:2,prompt:"On the potential-energy curve for H + H approaching, the bond length corresponds to:",choices:["the minimum of the curve — attraction and repulsion balanced","the point where PE = 0","the closest possible approach","where attraction is strongest"],answer:0,why:"Bonds form because energy is RELEASED as atoms approach (attraction between each nucleus and both electrons). Too close, nucleus–nucleus repulsion spikes. The PE minimum = most stable separation = bond length."},
{id:"WR-CH1-101",topic:"lewis",type:"written",diff:3,prompt:"<b>Tutorial standard:</b> C₃H₉N has FOUR constitutional isomers. Describe (or draw in your notebook) all four — name the connectivity of each.<br><span class='muted'>Hint: move the N through the chain: end, middle, in-chain, fully branched.</span>",
 model:"1) <b>CH₃CH₂CH₂–NH₂</b> (propan-1-amine: N on the end). 2) <b>(CH₃)₂CH–NH₂</b> (propan-2-amine: N on the middle carbon). 3) <b>CH₃–NH–CH₂CH₃</b> (N-methylethanamine: N inside the chain). 4) <b>(CH₃)₃N</b> (trimethylamine: N bonded to three CH₃). All are C₃H₉N; each N keeps 3 bonds + 1 lone pair.",
 rubric:["All four connectivities found","Same formula C₃H₉N verified for each","N has 3 bonds + 1 lone pair in every isomer"]},
{id:"WR-CH1-102",topic:"polarity",type:"written",diff:2,prompt:"<b>Tutorial standard:</b> label δ+ and δ− in each bond and justify: (a) Cl–P (b) C–Br (c) H–N.",
 model:"(a) Cl is more electronegative than P → <b>Cl δ−, P δ+</b>. (b) <b>Br δ−, C δ+</b> — and remember: C bonded to ANY halogen counts as a polar bond even when ΔEN looks small (C–Br ΔEN ≈ 0.3). (c) N is more electronegative than H → <b>N δ−, H δ+</b> (this polarity is what enables hydrogen bonding).",
 rubric:["δ− on the more electronegative atom in all three","C–halogen treated as polar despite small ΔEN","Reasoning references electronegativity, not memorization"]},
{id:"WR-CH1-103",topic:"polarity",type:"written",diff:3,prompt:"<b>Tutorial standard:</b> CHCl₃ has a LARGER molecular dipole moment than CFCl₃. Use the 3-D (tetrahedral) structures and bond dipoles to explain why.",
 model:"Both are tetrahedral. In <b>CHCl₃</b>, the three C–Cl dipoles sum to a net vector and the C–H bond adds almost no opposing dipole → large net dipole. In <b>CFCl₃</b>, the C–F bond is strongly polar in the OPPOSITE direction of the three C–Cl sum — F pulls against the chlorines, partially canceling → smaller net dipole. Molecular polarity is a VECTOR SUM: an opposing strong dipole shrinks the total.",
 rubric:["Treats bond dipoles as vectors in 3-D","C–F opposes the C–Cl resultant in CFCl₃","Concludes partial cancellation → smaller net dipole"]},
{id:"WR-CH1-104",topic:"hybrid",type:"written",diff:3,prompt:"<b>Tutorial standard (real molecule):</b> in tert-butyl isonitrile, (CH₃)₃C–N⁺≡C⁻ — (a) hybridization of the central C of the tert-butyl group, the N, and the terminal C; (b) which orbital holds the terminal carbon's lone pair; (c) predict the C–N–C angle.",
 model:"(a) tert-butyl C: 4 σ bonds → <b>sp³</b>. N: 2 σ domains (C–N σ + N≡C σ), no lone pair on N⁺ → <b>sp</b>. Terminal C: 1 σ + 1 lone pair = 2 domains → <b>sp</b>. (b) A LOCALIZED lone pair lives in a HYBRID orbital matching its atom's hybridization → the terminal C's lone pair is in an <b>sp orbital</b>. (c) N is sp with no lone pairs → C–N–C = <b>180° (linear)</b>.",
 rubric:["Hybridizations from domain counts (sp³ / sp / sp)","Lone pair placed in the atom's hybrid orbital (sp)","180° from sp nitrogen"]},
{id:"WR-CH1-105",topic:"hybrid",type:"written",diff:3,prompt:"<b>Tutorial standard (real molecule):</b> in the isonitrile dihalide (CH₃)₃C–N=CCl₂ the N carries a lone pair — (a) hybridization of N; (b) which orbital holds N's lone pair; (c) predict the C–N=C angle.",
 model:"(a) N has 3 domains: σ to C(CH₃)₃, σ+π to CCl₂ (the double bond counts once), and 1 lone pair → <b>sp²</b>. (b) The localized lone pair sits in an <b>sp² orbital</b> (lone pairs live in hybrid orbitals matching the atom's hybridization). (c) sp² base angle 120°, compressed slightly by the bulky lone pair → <b>a bit less than 120°</b>.",
 rubric:["3 domains → sp² (double bond = one domain)","Lone pair in sp² hybrid orbital","<120° with lone-pair compression reasoning"]},

/* ===== v3.4 CONSTITUTIONAL ISOMER SET (complements T-CH1-01 definition + WR-CH1-101 C₃H₉N) ===== */
{id:"iso2",topic:"bondline",type:"mc",diff:1,prompt:"Both structures below are C₄H₁₀:<svg viewBox='0 0 260 90' width='240' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='12' y1='60' x2='38' y2='32'/><line x1='38' y1='32' x2='64' y2='60'/><line x1='64' y1='60' x2='90' y2='32'/><line x1='150' y1='62' x2='176' y2='34'/><line x1='176' y1='34' x2='202' y2='62'/><line x1='176' y1='34' x2='176' y2='8'/></g><g font-size='12' fill='currentColor'><text x='44' y='82'>A</text><text x='170' y='82'>B</text></g></svg>They are:",choices:["Constitutional isomers — same formula, different connectivity (butane vs isobutane)","The same molecule drawn differently","Stereoisomers","Not isomers — different formulas"],answer:0,why:"A = butane (4-carbon chain). B = isobutane/2-methylpropane (3-carbon chain + branch). Same C₄H₁₀, <b>different connectivity</b> → constitutional isomers. Different compounds, different boiling points."},
{id:"iso8",topic:"bondline",type:"mc",diff:2,prompt:"Both structures below are C₅H₁₂:<svg viewBox='0 0 280 95' width='250' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='10' y1='60' x2='34' y2='34'/><line x1='34' y1='34' x2='58' y2='60'/><line x1='58' y1='60' x2='82' y2='34'/><line x1='82' y1='34' x2='106' y2='60'/><line x1='150' y1='30' x2='176' y2='56'/><line x1='176' y1='56' x2='202' y2='30'/><line x1='202' y1='30' x2='228' y2='56'/><line x1='228' y1='56' x2='228' y2='84'/></g><g font-size='12' fill='currentColor'><text x='52' y='84'>A</text><text x='185' y='84'>B</text></g></svg>They are:",choices:["The SAME molecule — both are an unbranched 5-carbon chain (pentane), just drawn with different kinks","Constitutional isomers","Stereoisomers","Different compounds entirely"],answer:0,why:"<b>Trap.</b> Trace the connectivity: both are C–C–C–C–C with no branches — the drawing's kinks mean nothing. Same connectivity = <b>same compound</b> (pentane). Before calling two drawings isomers, CHECK the connectivity, not the shape on paper."},
{id:"iso3",topic:"lewis",type:"mc",diff:2,prompt:"cis- and trans-1,2-dichloroethene are:",choices:["STEREOisomers — same connectivity, different 3-D arrangement (NOT constitutional)","Constitutional isomers — the Cl's are in different places","The same compound","Not isomers — different formulas"],answer:0,why:"Every atom is bonded to the same partners in both — only the 3-D arrangement across the rigid C=C differs → <b>stereoisomers</b>. (In lecture 8/20 she said 'constitutional' then corrected herself to 'stereoisomers' — this exact distinction.) Constitutional requires DIFFERENT connectivity."},
{id:"iso4",topic:"lewis",type:"num",diff:1,prompt:"How many constitutional isomers exist for C₄H₁₀?",answer:2,why:"<b>2</b>: butane (straight chain) and isobutane/2-methylpropane (branched). That's the whole set."},
{id:"iso5",topic:"lewis",type:"num",diff:2,prompt:"How many constitutional isomers exist for C₅H₁₂?",answer:3,why:"<b>3</b>: pentane (straight), 2-methylbutane (one branch), and 2,2-dimethylpropane / neopentane (two methyls on the middle carbon). Systematic method: longest chain first, then shorten by one and place branches, never duplicating a connectivity."},
{id:"iso6",topic:"lewis",type:"mc",diff:2,prompt:"Ethanol (CH₃CH₂–OH) and dimethyl ether (CH₃–O–CH₃) are both C₂H₆O. They are:",choices:["Constitutional isomers — and their boiling points differ by over 100 °C","The same compound","Stereoisomers","Resonance structures"],answer:0,why:"Same formula, different connectivity (O–H vs C–O–C) → constitutional isomers with different FUNCTIONAL GROUPS. Consequence: ethanol H-bonds (bp 78 °C); dimethyl ether can't (no O–H; bp −24 °C). Constitutional isomers can have wildly different properties — this pair is the classic exam example."},
{id:"iso7",topic:"lewis",type:"mc",diff:1,prompt:"Which pair is NOT a pair of isomers at all?",choices:["CH₄ and C₂H₆ — different molecular formulas","Butane and isobutane","Ethanol and dimethyl ether","cis- and trans-2-butene"],answer:0,why:"Isomer = same molecular formula, full stop. CH₄ vs C₂H₆ are just different compounds. (Butane/isobutane and ethanol/DME = constitutional; cis/trans-2-butene = stereo.)"},
{id:"WR-CH1-012",topic:"lewis",type:"written",diff:3,prompt:"<b>Classify with justification</b> — for each pair, write: constitutional isomers, stereoisomers, or same compound — plus ONE line of reasoning each.<br>(a) butane & 2-methylpropane &nbsp; (b) cis- & trans-2-butene &nbsp; (c) pentane drawn as a zigzag & pentane drawn with a U-bend",
 model:"<b>(a) Constitutional isomers</b> — same C₄H₁₀, different connectivity (straight chain vs branched). <b>(b) Stereoisomers</b> — same connectivity everywhere; only the 3-D arrangement across the rigid C=C differs. <b>(c) Same compound</b> — connectivity identical (unbranched C₅ chain); a drawing's bends are not chemistry. Decision routine: 1) same formula? if no → not isomers. 2) same connectivity? if no → constitutional. 3) same connectivity, different 3-D → stereo.",
 rubric:["All three classified correctly (constitutional / stereo / same)","Reasoning uses CONNECTIVITY, not drawing shape","States or implies the 3-step decision routine"]},

/* ===== v3.9 EXPANSION — PRELIMINARIES (pre-gen-chem foundation, mostly diff 0-1) ===== */
/* --- p_atom: atoms & electrons --- */
{id:"x2-pa01",topic:"p_atom",type:"mc",diff:0,prompt:"Which particle carries a NEGATIVE charge?",choices:["Electron","Proton","Neutron","Nucleus"],answer:0,why:"<b>Electron</b> — negative, tiny, orbits outside the nucleus. Protons are positive, neutrons are neutral. Every single thing in organic chemistry is electrons moving; this is the particle you'll track all year."},
{id:"x2-pa02",topic:"p_atom",type:"num",diff:0,prompt:"How many protons does a carbon atom have?",answer:6,why:"<b>6</b> — that's what makes it carbon. Atomic number = proton count = the element's identity. Change it and it stops being carbon."},
{id:"x2-pa03",topic:"p_atom",type:"num",diff:0,prompt:"How many electrons does a NEUTRAL oxygen atom have?",answer:8,why:"<b>8</b>. Neutral means protons = electrons, and oxygen has 8 protons. Neutral atom → electron count = atomic number, always."},
{id:"x2-pa04",topic:"p_atom",type:"mc",diff:0,prompt:"Where do the electrons sit?",choices:["In shells/orbitals around the nucleus","Inside the nucleus","Glued to the protons","Randomly scattered through the atom"],answer:0,why:"<b>Around</b> the nucleus, in shells. The nucleus (protons + neutrons) is a tiny dense core; the electrons occupy the huge space around it. Bonding happens out there, never in the nucleus."},
{id:"x2-pa05",topic:"p_atom",type:"mc",diff:0,prompt:"'Valence electrons' means:",choices:["The electrons in the outermost shell","All the electrons in the atom","The electrons in the nucleus","The electrons an atom has lost"],answer:0,why:"<b>Outermost shell only.</b> Inner-shell electrons are locked away and never react. Valence electrons are the ones that bond, and they're the only ones you'll ever draw."},
{id:"x2-pa06",topic:"p_atom",type:"num",diff:1,prompt:"Maximum number of electrons in the FIRST shell?",answer:2,why:"<b>2</b>. That's why hydrogen is 'full' at 2 electrons instead of 8 — it only has a first shell to fill. This is the whole reason H is the octet rule's exception."},
{id:"x2-pa07",topic:"p_atom",type:"num",diff:1,prompt:"Maximum number of electrons in the SECOND shell?",answer:8,why:"<b>8</b>. This is where the octet rule comes from — C, N, O, F all fill their second shell at 8. 'Octet' literally just means 'the second shell is full'."},
{id:"x2-pa08",topic:"p_atom",type:"mc",diff:1,prompt:"A neutral atom always has equal numbers of:",choices:["Protons and electrons","Protons and neutrons","Electrons and neutrons","All three"],answer:0,why:"<b>Protons = electrons</b> in anything neutral. + charges cancel − charges. Break that balance and you've made an ion — which is the next topic."},
{id:"x2-pa09",topic:"p_atom",type:"num",diff:1,prompt:"A neutral atom has 15 protons. How many electrons does it have?",answer:15,why:"<b>15</b> — neutral means the counts match. (That element is phosphorus, by the way.)"},
{id:"x2-pa10",topic:"p_atom",type:"mc",diff:1,prompt:"Why does organic chemistry care about the OUTER shell specifically?",choices:["That's where bonding and reactions happen","It holds the most electrons","It's closest to the nucleus","It contains the protons"],answer:0,why:"<b>Bonding happens in the outer shell.</b> Inner electrons are shielded and inert. Every Lewis structure, every curved arrow, every mechanism you'll draw involves only valence electrons."},
{id:"x2-pa11",topic:"p_atom",type:"num",diff:2,prompt:"Neutral sulfur has 16 protons. How many electrons are in its OUTER shell? (shells fill 2, then 8, then the rest)",answer:6,why:"16 electrons total → 2 in shell 1, 8 in shell 2, leaving <b>6</b> in shell 3. Six valence electrons — same as oxygen, which is why S and O behave alike (both group 6)."},
{id:"x2-pa12",topic:"p_atom",type:"mc",diff:2,prompt:"Two atoms have the same number of protons but different numbers of neutrons. They are:",choices:["Isotopes of the same element","Different elements","Ions of each other","Impossible"],answer:0,why:"<b>Isotopes</b> — same element (proton count fixed), different mass. Neutrons change mass and barely touch chemistry, so for bonding purposes you can ignore them. (One exception surfaces much later: swapping H for deuterium measurably slows certain reactions, which becomes evidence for mechanism.)"},

/* --- p_ptable: reading the periodic table --- */
{id:"x2-pt01",topic:"p_ptable",type:"num",diff:0,prompt:"How many valence electrons does an element in group 6 have? (using the 1-8 main-group numbering)",answer:6,why:"<b>6</b> — for main-group elements the group number IS the valence electron count. Group 6 → 6. This one shortcut replaces a lot of memorization."},
{id:"x2-pt02",topic:"p_ptable",type:"num",diff:0,prompt:"How many valence electrons does nitrogen have?",answer:5,why:"<b>5</b> — nitrogen is group 5. And 5 valence electrons is exactly why N makes 3 bonds + 1 lone pair (3 bonds share 3 of them, the last 2 pair up)."},
{id:"x2-pt03",topic:"p_ptable",type:"num",diff:1,prompt:"How many valence electrons does chlorine have?",answer:7,why:"<b>7</b> — group 7 (halogen). Needs just 1 more for an octet, which is why halogens make exactly 1 bond and carry 3 lone pairs."},
{id:"x2-pt04",topic:"p_ptable",type:"num",diff:1,prompt:"How many valence electrons does phosphorus have?",answer:5,why:"<b>5</b> — group 5, directly under nitrogen. Same column = same valence count = similar bonding. P behaves like a bigger, softer N."},
{id:"x2-pt05",topic:"p_ptable",type:"mc",diff:1,prompt:"The ROW (period) number tells you:",choices:["How many electron shells the atom has","How many valence electrons it has","Its charge","Its mass"],answer:0,why:"<b>Row = number of shells.</b> Column = valence electrons. Two different readings of the same table — mixing them up is a classic early mistake."},
{id:"x2-pt06",topic:"p_ptable",type:"mc",diff:1,prompt:"Noble gases (group 8) barely react. Why?",choices:["Their outer shell is already full","They have no electrons","They're too heavy","They're always ions"],answer:0,why:"<b>Full outer shell</b> = nothing to gain by reacting. Everything else on the table is essentially trying to reach a noble-gas configuration — that's what the octet rule is chasing."},
{id:"x2-pt07",topic:"p_ptable",type:"mc",diff:1,prompt:"Metals sit on the ___ of the periodic table and tend to ___ electrons.",choices:["left · lose","right · lose","left · gain","right · gain"],answer:0,why:"<b>Left, and they lose.</b> Metals hold their outer electrons loosely → they give them up → become cations (+). Nonmetals on the right grab electrons → anions (−)."},
{id:"x2-pt08",topic:"p_ptable",type:"mc",diff:2,prompt:"Moving LEFT → RIGHT across a period, electronegativity:",choices:["Increases","Decreases","Stays flat","Increases then decreases"],answer:0,why:"<b>Increases.</b> More protons pulling on the same shell = tighter grip on electrons. That's why fluorine — last column before the unreactive noble gases — is the most electronegative element, while the left side is the least."},
{id:"x2-pt09",topic:"p_ptable",type:"mc",diff:2,prompt:"Moving DOWN a group, electronegativity:",choices:["Decreases","Increases","Stays flat","Doubles each row"],answer:0,why:"<b>Decreases.</b> Each row adds a shell, so the outer electrons sit farther from the nucleus and are held more loosely. F > Cl > Br > I going down the halogens."},
{id:"x2-pt10",topic:"p_ptable",type:"mc",diff:2,prompt:"Moving DOWN a group, atomic SIZE:",choices:["Increases — you're adding shells","Decreases","Stays the same","Depends on charge"],answer:0,why:"<b>Bigger going down.</b> More shells = bigger atom. This is why Br⁻ is more stable than F⁻ (charge spread over more volume) — the 'size' half of the ARIO Atom rule you'll meet in Chapter 3."},
{id:"x2-pt11",topic:"p_ptable",type:"mc",diff:2,prompt:"Carbon, silicon and germanium are all in group 4. What do they share?",choices:["4 valence electrons each","The same number of shells","Identical electronegativity","The same mass"],answer:0,why:"<b>4 valence electrons.</b> Same column = same valence count = same bonding pattern (all three make 4 bonds). Column predicts chemistry; row predicts size."},
{id:"x2-pt12",topic:"p_ptable",type:"num",diff:2,prompt:"An element in period 3, group 6. How many valence electrons? (that's sulfur)",answer:6,why:"<b>6</b> — the group number gives valence electrons regardless of the row. Period 3 only tells you it has 3 shells, not how many outer electrons."},

/* --- p_ions: ions & charges --- */
{id:"x2-pi01",topic:"p_ions",type:"mc",diff:0,prompt:"A CATION is:",choices:["A positively charged ion","A negatively charged ion","A neutral atom","A type of bond"],answer:0,why:"<b>Cation = positive</b> (lost electrons). Anion = negative (gained electrons). Memory hook: the 't' in cation looks like a + sign."},
{id:"x2-pi02",topic:"p_ions",type:"mc",diff:0,prompt:"An ANION is:",choices:["A negatively charged ion","A positively charged ion","An uncharged atom","A metal"],answer:0,why:"<b>Anion = negative</b>, made by GAINING electrons. Extra electrons = extra negative charge. A-N-ion → A-Negative-ion."},
{id:"x2-pi03",topic:"p_ions",type:"num",diff:1,prompt:"An atom LOSES one electron. What is its charge now? (enter like 1 or -1)",answer:1,why:"<b>+1</b>. Losing a negative leaves you net positive. Removing electrons drives charge UP; adding them drives it DOWN. Getting this direction backwards is the single most common ion mistake."},
{id:"x2-pi04",topic:"p_ions",type:"num",diff:1,prompt:"An atom GAINS two electrons. What is its charge? (enter like 2 or -2)",answer:-2,why:"<b>−2</b>. Two extra negatives = net 2−. Oxygen does exactly this to become the oxide ion O²⁻."},
{id:"x2-pi05",topic:"p_ions",type:"num",diff:1,prompt:"Sodium has 11 protons. Na⁺ has how many ELECTRONS?",answer:10,why:"<b>10</b>. The + means it lost one electron: 11 protons − 10 electrons = +1 net. Note the protons never changed — <b>ions are made by moving electrons, never protons</b>."},
{id:"x2-pi06",topic:"p_ions",type:"mc",diff:1,prompt:"Why do atoms form ions at all?",choices:["To reach a full outer shell (noble-gas configuration)","To get heavier","To become metals","Randomly"],answer:0,why:"<b>Full outer shell.</b> Na has 1 lonely valence electron — dumping it leaves a full shell underneath. Cl has 7 — grabbing 1 completes the octet. Everything is chasing the noble-gas setup."},
{id:"x2-pi07",topic:"p_ions",type:"mc",diff:1,prompt:"Group 1 metals (Na, K, Li) typically form ions with charge:",choices:["+1","−1","+2","−2"],answer:0,why:"<b>+1</b> — one valence electron to shed. The pattern splits by side: groups 1–3 LOSE electrons, so charge = group number (+1, +2, +3). Groups 5–7 GAIN, so charge = group number − 8 (−3, −2, −1). Left side goes positive, right side negative — never just read the group number straight across."},
{id:"x2-pi08",topic:"p_ions",type:"mc",diff:1,prompt:"Group 7 halogens (F, Cl, Br, I) typically form ions with charge:",choices:["−1","+1","−7","+7"],answer:0,why:"<b>−1</b> — 7 valence electrons, need 1 more for an octet, so they gain exactly one. That's why you see Cl⁻, Br⁻, I⁻ constantly as leaving groups later on."},
{id:"x2-pi09",topic:"p_ions",type:"num",diff:2,prompt:"An ion has 17 protons and 18 electrons. What is its charge? (enter like 1 or -1)",answer:-1,why:"<b>−1</b>: 17 positives vs 18 negatives → one extra negative. Formula: charge = protons − electrons = 17 − 18 = −1. (This is chloride, Cl⁻.)"},
{id:"x2-pi10",topic:"p_ions",type:"num",diff:2,prompt:"Sulfur has 16 protons. How many electrons does S²⁻ have?",answer:18,why:"<b>18</b>. The 2− means it GAINED two electrons: 16 + 2 = 18. Charge = protons − electrons = 16 − 18 = −2. ✓"},
{id:"x2-pi11",topic:"p_ions",type:"num",diff:2,prompt:"Magnesium has 12 protons. How many electrons does Mg²⁺ have?",answer:10,why:"<b>10</b>. The 2+ means it LOST two: 12 − 2 = 10. Positive charge → fewer electrons than protons. Always."},
{id:"x2-pi12",topic:"p_ions",type:"mc",diff:2,prompt:"When you build a Lewis structure for an ion like OH⁻, the negative charge means you:",choices:["ADD one electron to your total valence-electron count","Subtract one from oxygen's group number","Add one proton","Ignore it"],answer:0,why:"<b>Add an electron to the TOTAL.</b> This is the exact distinction that trips people on formal charge: an ion's charge changes the total electron budget in step 1 — it <b>never</b> changes an atom's group number. Oxygen is group 6 in OH⁻, in H₂O, in everything."},

/* --- p_bondtypes: ionic vs covalent --- */
{id:"x2-pb01",topic:"p_bondtypes",type:"mc",diff:0,prompt:"A COVALENT bond is formed by:",choices:["Sharing electrons between two atoms","Transferring electrons from one atom to another","Magnetic attraction","Neutrons pairing up"],answer:0,why:"<b>Sharing.</b> Both atoms count the shared pair toward their own octet — that's the trick that lets everyone get to 8 without anyone actually owning 8. All of organic chemistry runs on covalent bonds."},
{id:"x2-pb02",topic:"p_bondtypes",type:"mc",diff:0,prompt:"An IONIC bond is formed by:",choices:["Transferring electrons, then opposite charges attracting","Sharing electrons equally","Sharing electrons unequally","Overlapping nuclei"],answer:0,why:"<b>Transfer, then attraction.</b> One atom hands electrons over completely; the resulting + and − ions stick together electrostatically. Think NaCl, not CH₄."},
{id:"x2-pb03",topic:"p_bondtypes",type:"num",diff:0,prompt:"How many electrons are in ONE single covalent bond?",answer:2,why:"<b>2</b> — one shared pair. A double bond is 4 electrons (2 pairs), a triple is 6 (3 pairs). This number does a lot of work in the formal-charge formula."},
{id:"x2-pb04",topic:"p_bondtypes",type:"mc",diff:1,prompt:"Metal + nonmetal usually gives you a(n):",choices:["Ionic bond","Covalent bond","Hydrogen bond","No bond"],answer:0,why:"<b>Ionic.</b> Metals give electrons away, nonmetals take them — a big electronegativity gap means outright transfer. Nonmetal + nonmetal, by contrast, means sharing → covalent."},
{id:"x2-pb05",topic:"p_bondtypes",type:"mc",diff:1,prompt:"NaCl (table salt) is held together by:",choices:["Ionic bonds","Covalent bonds","Hydrogen bonds","London dispersion only"],answer:0,why:"<b>Ionic.</b> Na (metal, EN 0.9) hands its electron to Cl (nonmetal, EN 3.0). ΔEN ≈ 2.1, well past the 1.7 ionic cutoff."},
{id:"x2-pb06",topic:"p_bondtypes",type:"mc",diff:1,prompt:"CH₄ (methane) is held together by:",choices:["Covalent bonds","Ionic bonds","Metallic bonds","Hydrogen bonds"],answer:0,why:"<b>Covalent.</b> C (2.5) and H (2.1) are both nonmetals and close in EN — they share. Essentially every bond you draw this semester is covalent."},
{id:"x2-pb07",topic:"p_bondtypes",type:"mc",diff:2,prompt:"Using ΔEN: a bond with a difference GREATER than 1.7 is classified as:",choices:["Ionic","Polar covalent","Pure covalent","Metallic"],answer:0,why:"<b>Ionic</b> (Wiley's cutoff). The full scale: ΔEN &lt; 0.5 pure covalent · 0.5–1.7 polar covalent · &gt; 1.7 ionic. It's a spectrum with arbitrary lines drawn on it, not three separate phenomena."},
{id:"x2-pb08",topic:"p_bondtypes",type:"mc",diff:2,prompt:"A bond where electrons are shared but UNEQUALLY is called:",choices:["Polar covalent","Ionic","Pure covalent","Coordinate"],answer:0,why:"<b>Polar covalent</b> — still shared (so still covalent), but one atom hogs the density and gets a δ−. The middle of the spectrum, and where almost all interesting organic reactivity lives."},
{id:"x2-pb09",topic:"p_bondtypes",type:"mc",diff:2,prompt:"Ciesla's standing exception: a carbon bonded to a HALOGEN is:",choices:["Always treated as a polar bond, whatever ΔEN says","Always pure covalent","Always ionic","Only polar if ΔEN > 1.7"],answer:0,why:"<b>Always polar.</b> C–Br has ΔEN ≈ 0.3, which the &lt;0.5 rule would call pure covalent — but it isn't, because polarity depends on charge distribution over DISTANCE and Br is a big atom. Her warning: you'll be handed EN values on an exam and start calculating. Don't. C–halogen = polar, done."},
{id:"x2-pb10",topic:"p_bondtypes",type:"mc",diff:2,prompt:"Which type of bond does organic chemistry deal with almost exclusively?",choices:["Covalent","Ionic","Metallic","Nuclear"],answer:0,why:"<b>Covalent.</b> Carbon is right in the middle of the EN scale, so it shares rather than transfers. Ions show up (as reagents, intermediates and leaving groups) but the molecular skeleton is always covalent."},

/* --- p_formulas: reading molecular formulas --- */
{id:"x2-pf01",topic:"p_formulas",type:"num",diff:0,prompt:"How many hydrogen atoms are in CH₄?",answer:4,why:"<b>4</b> — the subscript after H. No subscript means 1 (so there's 1 carbon here)."},
{id:"x2-pf02",topic:"p_formulas",type:"num",diff:0,prompt:"How many atoms TOTAL are in H₂O?",answer:3,why:"<b>3</b> — 2 hydrogens + 1 oxygen. 'Total atoms' means add every subscript up, don't just count the letters."},
{id:"x2-pf03",topic:"p_formulas",type:"mc",diff:0,prompt:"In a formula, a subscript number tells you:",choices:["How many of that atom are present","The charge on that atom","How many bonds it makes","Its mass"],answer:0,why:"<b>A head count</b> of that element. C₂H₆ = 2 carbons, 6 hydrogens. Charges are written as superscripts instead (like O²⁻) — different position, different meaning."},
{id:"x2-pf04",topic:"p_formulas",type:"num",diff:1,prompt:"How many hydrogen atoms are in C₂H₆ (ethane)?",answer:6,why:"<b>6</b>. Two carbons, each carrying 3 H's: 3 + 3 = 6. Each carbon's fourth bond is the C–C bond joining them, which holds no hydrogen."},
{id:"x2-pf05",topic:"p_formulas",type:"num",diff:1,prompt:"How many oxygen atoms are in H₂SO₄?",answer:4,why:"<b>4</b> — the subscript on O. Reading formulas fluently matters because in a minute you'll be counting valence electrons from them."},
{id:"x2-pf06",topic:"p_formulas",type:"num",diff:2,prompt:"Parentheses multiply everything inside. How many hydrogens are in (CH₃)₃N?",answer:9,why:"<b>9</b>. Three CH₃ groups × 3 H each = 9. The nitrogen has no H of its own here (it's using all three bonds to hold the methyls). This is trimethylamine."},
{id:"x2-pf07",topic:"p_formulas",type:"num",diff:2,prompt:"How many CARBON atoms are in (CH₃)₂CHCH₃?",answer:4,why:"<b>4</b>: two from (CH₃)₂, one from the CH, one from the final CH₃. That's isobutane — same formula as butane (C₄H₁₀), different connectivity. Your first constitutional isomer."},
{id:"x2-pf08",topic:"p_formulas",type:"num",diff:2,prompt:"How many atoms TOTAL are in C₂H₅OH (ethanol)?",answer:9,why:"<b>9</b>: 2 C + 6 H (five in C₂H₅, one in OH) + 1 O = 9. Written this way the formula hints at structure — the OH hanging off the end is the alcohol group."},
{id:"x2-pf09",topic:"p_formulas",type:"num",diff:2,prompt:"How many hydrogens are in CH₃CH₂CH₂CH₃ (butane)?",answer:10,why:"<b>10</b>: 3 + 2 + 2 + 3. Condensed formulas like this are read left to right, each carbon carrying the H's written right after it."},
{id:"x2-pf10",topic:"p_formulas",type:"num",diff:3,prompt:"How many hydrogens are in (CH₃CH₂)₂NH?",answer:11,why:"<b>11</b>: each CH₃CH₂ (ethyl) has 5 H, ×2 = 10, plus the 1 H on nitrogen = 11. Two things to track at once — the parenthesis multiplier AND the lone H outside it. This is diethylamine."},
/* ===== v3.9 EXPANSION — CH 1 CORE, part A: valence · lewis · formal charge ===== */
/* --- valence electrons --- */
{id:"x2-v01",topic:"valence",type:"num",diff:0,prompt:"Valence electrons in hydrogen?",answer:1,why:"<b>1</b> — group 1, one electron, one bond. And it fills at 2, not 8, because it only has a first shell."},
{id:"x2-v02",topic:"valence",type:"num",diff:0,prompt:"Valence electrons in fluorine?",answer:7,why:"<b>7</b> — group 7. One short of an octet → makes exactly 1 bond and carries 3 lone pairs. Every halogen behaves this way."},
{id:"x2-v03",topic:"valence",type:"num",diff:0,prompt:"Valence electrons in nitrogen?",answer:5,why:"<b>5</b> — group 5. Three of them go into bonds, the remaining two pair up as a lone pair. Hence N's neutral pattern: 3 bonds + 1 LP."},
{id:"x2-v04",topic:"valence",type:"num",diff:1,prompt:"Valence electrons in sulfur?",answer:6,why:"<b>6</b> — group 6, same column as oxygen. Neutral pattern mirrors O: 2 bonds + 2 lone pairs (though S can break the octet in ways O can't)."},
{id:"x2-v05",topic:"valence",type:"num",diff:1,prompt:"Valence electrons in bromine?",answer:7,why:"<b>7</b> — group 7, just a bigger halogen than F or Cl. Column decides valence count; row only decides size."},
{id:"x2-v06",topic:"valence",type:"num",diff:1,prompt:"TOTAL valence electrons in H₂O (add up every atom)?",answer:8,why:"<b>8</b>: O contributes 6, each H contributes 1 → 6 + 1 + 1 = 8. This total is step 1 of every Lewis structure — get it wrong and everything downstream is wrong."},
{id:"x2-v07",topic:"valence",type:"num",diff:1,prompt:"TOTAL valence electrons in CH₄?",answer:8,why:"<b>8</b>: C gives 4, four H's give 1 each → 4 + 4 = 8. Exactly enough for four C–H single bonds (4 bonds × 2 e⁻)."},
{id:"x2-v08",topic:"valence",type:"num",diff:2,prompt:"TOTAL valence electrons in CO₂?",answer:16,why:"<b>16</b>: C gives 4, each O gives 6 → 4 + 12 = 16. Those 16 build two C=O double bonds (8 e⁻) plus four lone pairs on the oxygens (8 e⁻)."},
{id:"x2-v09",topic:"valence",type:"num",diff:2,prompt:"TOTAL valence electrons in NH₃?",answer:8,why:"<b>8</b>: N gives 5, three H's give 3 → 8. Three N–H bonds use 6, leaving 2 for nitrogen's lone pair."},
{id:"x2-v10",topic:"valence",type:"num",diff:2,prompt:"TOTAL valence electrons in the HYDROXIDE ion, OH⁻?",answer:8,why:"<b>8</b>: O gives 6, H gives 1 = 7, then <b>+1 for the negative charge</b> = 8. Negative charge adds electrons to the total; positive charge subtracts them."},
{id:"x2-v11",topic:"valence",type:"num",diff:2,prompt:"TOTAL valence electrons in the AMMONIUM ion, NH₄⁺?",answer:8,why:"<b>8</b>: N gives 5, four H's give 4 = 9, then <b>−1 for the positive charge</b> = 8. Read that again — the charge adjusts the TOTAL, not nitrogen's group number. N is still group 5 here."},
{id:"x2-v12",topic:"valence",type:"num",diff:3,prompt:"TOTAL valence electrons in the CARBONATE ion, CO₃²⁻?",answer:24,why:"<b>24</b>: C gives 4, three O's give 18 = 22, then <b>+2 for the 2− charge</b> = 24. Two-electron adjustment for a 2− ion — the charge number is the number of electrons you add."},

/* --- lewis structures --- */
{id:"x2-l01",topic:"lewis",type:"num",diff:0,prompt:"How many bonds does a NEUTRAL carbon atom make?",answer:4,why:"<b>4</b>, always, with 0 lone pairs. Neutral carbon with anything other than 4 bonds is a drawing error — this is the single most useful sanity check you have."},
{id:"x2-l02",topic:"lewis",type:"num",diff:0,prompt:"How many bonds does a NEUTRAL oxygen atom make?",answer:2,why:"<b>2 bonds + 2 lone pairs.</b> 6 valence electrons: 2 go into bonds, 4 sit as two pairs. Memorize the neutral patterns — C 4/0, N 3/1, O 2/2, halogen 1/3."},
{id:"x2-l03",topic:"lewis",type:"num",diff:0,prompt:"How many LONE PAIRS does a neutral nitrogen atom carry?",answer:1,why:"<b>1</b>, alongside 3 bonds. That lone pair is nitrogen's whole personality — it's what makes amines basic and nucleophilic."},
{id:"x2-l04",topic:"lewis",type:"num",diff:1,prompt:"How many LONE PAIRS does a neutral chlorine atom carry when bonded in a molecule?",answer:3,why:"<b>3</b>, plus its 1 bond. 7 valence electrons: 1 shared in the bond, 6 left as three pairs. Students routinely forget to draw these."},
{id:"x2-l05",topic:"lewis",type:"mc",diff:1,prompt:"Hydrogen is NEVER the central atom in a Lewis structure because:",choices:["It can only make 1 bond, so it can't connect two things","It's too small","It has no electrons","It's always positive"],answer:0,why:"<b>1 bond only.</b> A central atom must link to at least two others; H physically can't. H is always on the outside — no exceptions."},
{id:"x2-l06",topic:"lewis",type:"mc",diff:1,prompt:"In a Lewis structure, a line between two atoms represents:",choices:["2 shared electrons","1 electron","1 lone pair","An ionic attraction"],answer:0,why:"<b>2 electrons</b>, one shared pair. Every line = 2. This conversion is exactly where the formal-charge formula gets its 'number of bonds' term."},
{id:"x2-l07",topic:"lewis",type:"num",diff:1,prompt:"A double bond contains how many electrons?",answer:4,why:"<b>4</b> — two shared pairs (1 σ + 1 π). Triple = 6. When counting electrons around an atom, a double bond contributes 4 to the shared total but counts as ONE domain for geometry."},
{id:"x2-l08",topic:"lewis",type:"mc",diff:2,prompt:"You've drawn all single bonds and filled the outer atoms, but the central atom is 4 electrons short of an octet. You should:",choices:["Convert TWO neighboring lone pairs into bonds (making a triple bond, or two doubles)","Add 4 more electrons from nowhere","Move the central atom","Leave it — close enough"],answer:0,why:"<b>Short by 4 → convert 2 lone pairs.</b> The rule: (electrons short ÷ 2) = number of lone pairs to convert into bonds. Short by 2 → one double bond. Short by 4 → a triple, or two separate doubles. Sharing works because BOTH atoms count the same pair."},
{id:"x2-l09",topic:"lewis",type:"mc",diff:2,prompt:"Why does converting a lone pair into a bond fix an electron-deficient central atom, when just rearranging lone pairs doesn't?",choices:["Shared electrons are counted by BOTH atoms toward their octets","It creates new electrons","It removes the deficiency by ignoring it","It changes the formal charge to zero"],answer:0,why:"<b>Both atoms count a shared pair.</b> A lone pair on oxygen counts only for oxygen; move it into a bond and now carbon counts it too — 2 electrons doing the work of 4. That double-counting is the entire reason multiple bonds exist."},
{id:"x2-l10",topic:"lewis",type:"num",diff:2,prompt:"In CH₃OH (methanol), how many lone pairs are on the oxygen?",answer:2,why:"<b>2</b>. The O has 2 bonds (one to C, one to H) — that's the neutral oxygen pattern, so 2 lone pairs. Neutral O is always 2 bonds + 2 LP."},
{id:"x2-l11",topic:"lewis",type:"num",diff:2,prompt:"In H₂C=O (formaldehyde), how many lone pairs are on the oxygen?",answer:2,why:"<b>2</b>. Still neutral oxygen, so still 2 LP — the double bond counts as O's 2 bonds' worth. Bonds and lone pairs always trade off to keep the octet at 8."},
{id:"x2-l12",topic:"lewis",type:"mc",diff:2,prompt:"Which of these is a legal NEUTRAL structure?",choices:["N with 3 bonds and 1 lone pair","N with 4 bonds and 1 lone pair","N with 5 bonds","C with 3 bonds, no lone pair and no unpaired electron, uncharged"],answer:0,why:"<b>3 bonds + 1 LP</b> = neutral nitrogen (5 valence e⁻ accounted for). The others all fail: 4 bonds + 1 LP is <b>10 electrons</b>, over the octet — impossible for a second-row atom (real N⁺ is 4 bonds and <b>zero</b> lone pairs). 5 bonds is likewise over the octet. And carbon with only 3 bonds and 6 electrons has to be a carbocation, which carries a +1 — not neutral."},
{id:"x2-l13",topic:"lewis",type:"mc",diff:3,prompt:"For the formula HCN, why is H–C≡N preferred over H–N≡C?",choices:["H–N≡C forces formal charges (N is +1, C is −1); H–C≡N leaves every atom neutral","H–N≡C breaks the octet rule","Nitrogen can't form a triple bond","They are equally acceptable"],answer:0,why:"Both satisfy octets — that's exactly why this is a good test. In H–N≡C, N has 4 bonds and 0 LP → FC = 5−0−4 = <b>+1</b>, and C has 3 bonds and 1 LP → FC = 4−2−3 = <b>−1</b>. In H–C≡N, carbon has 1+3 = 4 bonds (FC 0) and nitrogen has 3 bonds + 1 LP (FC 0) — <b>all neutral</b>, so it's the better structure. (H–N≡C is a real molecule, hydrogen isocyanide — just a higher-energy isomer.) Fewer formal charges wins."},
{id:"x2-l14",topic:"lewis",type:"mc",diff:3,prompt:"Charge-separated CO₂ (drawn as ⁻O–C≡O⁺) satisfies every octet. Why is O=C=O still the accepted structure?",choices:["It achieves the same octets with every atom neutral","The charged one breaks the octet rule","Carbon can't make double bonds","They're equally correct"],answer:0,why:"<b>Minimize charge separation.</b> Both satisfy octets, but O=C=O gets there with no formal charges at all. When two structures both fill octets, the one with fewer charges is the better representation. Note this is a tie-breaker, not an absolute — some species (ozone, nitrate) have no charge-free option and must carry formal charges. You'll use this ranking constantly in resonance."},
{id:"x2-l15",topic:"lewis",type:"num",diff:3,prompt:"In the nitrate ion NO₃⁻ (24 total valence electrons, N central with one N=O and two N–O⁻), how many bonds does the nitrogen have?",answer:4,why:"<b>4</b> — one double bond (counts as 2) plus two single bonds = 4 bonds total. That's why the nitrogen carries a <b>+1</b> formal charge: N with 4 bonds is always +1."},

/* --- FORMAL CHARGE — heaviest expansion (weakest topic, gates Ch 2 resonance) --- */
{id:"x2-f01",topic:"formal",type:"num",diff:0,prompt:"WARM-UP: how many ELECTRONS are in one lone pair?",answer:2,why:"<b>2.</b> A lone pair is a PAIR — two electrons, drawn as two dots. Two lone pairs = 4 electrons, three lone pairs = 6. The formal-charge formula wants ELECTRONS in that slot, so get this conversion right in both directions: don't enter 3 when you mean 3 pairs (that's 6), and don't enter 6 when there's only one pair (that's 2)."},
{id:"x2-f02",topic:"formal",type:"num",diff:0,prompt:"WARM-UP: how many electrons are in THREE lone pairs?",answer:6,why:"<b>6</b> — three pairs × 2 electrons. Count pairs first, then double. Never eyeball it."},
{id:"x2-f03",topic:"formal",type:"num",diff:0,prompt:"WARM-UP: in the formula FC = group# − (lone-pair e⁻) − (number of bonds), what number do you use for OXYGEN's group number?",answer:6,why:"<b>6</b>, every single time. Oxygen is group 6 in H₂O, in OH⁻, in H₃O⁺, in ozone — in everything. <b>An ion's charge NEVER changes an atom's group number.</b> It only changes the total electron budget when you're building the structure."},
{id:"x2-f04",topic:"formal",type:"num",diff:0,prompt:"WARM-UP: what group number do you use for NITROGEN in the formal-charge formula, when the molecule is the ammonium ion NH₄⁺?",answer:5,why:"<b>5.</b> Still 5. The + charge on the ion does not demote nitrogen to group 4. This is the exact trap that has cost you points before: <b>group number is a property of the ELEMENT, not the molecule.</b>"},
{id:"x2-f05",topic:"formal",type:"num",diff:1,prompt:"An oxygen atom has 2 bonds and 2 lone pairs. Formal charge? (enter like 0, 1, or -1)",answer:0,why:"FC = 6 − 4 − 2 = <b>0</b>. Group 6, two lone pairs = 4 electrons, 2 bonds. This is neutral oxygen's standard pattern — water, alcohols, ethers all look like this."},
{id:"x2-f06",topic:"formal",type:"num",diff:1,prompt:"An oxygen atom has 1 bond and 3 lone pairs. Formal charge?",answer:-1,why:"FC = 6 − 6 − 1 = <b>−1</b>. Fewer bonds than the neutral pattern (2) → negative. This is the oxygen in hydroxide, OH⁻, and in every alkoxide you'll meet."},
{id:"x2-f07",topic:"formal",type:"num",diff:1,prompt:"An oxygen atom has 3 bonds and 1 lone pair. Formal charge?",answer:1,why:"FC = 6 − 2 − 3 = <b>+1</b>. MORE bonds than neutral (2) → positive. That's the oxygen in hydronium H₃O⁺ — and note the lone-pair count dropped to 1 to make room for the extra bond."},
{id:"x2-f08",topic:"formal",type:"num",diff:1,prompt:"A nitrogen atom has 4 bonds and 0 lone pairs. Formal charge?",answer:1,why:"FC = 5 − 0 − 4 = <b>+1</b>. Nitrogen's neutral pattern is 3 bonds; a fourth bond costs it the lone pair and makes it +1. Ammonium NH₄⁺, and every protonated amine."},
{id:"x2-f09",topic:"formal",type:"num",diff:1,prompt:"A nitrogen atom has 2 bonds and 2 lone pairs. Formal charge?",answer:-1,why:"FC = 5 − 4 − 2 = <b>−1</b>. Fewer bonds than the neutral 3 → negative. This is an amide anion, and it's a very strong base."},
{id:"x2-f10",topic:"formal",type:"num",diff:1,prompt:"A carbon atom has 3 bonds and 1 lone pair. Formal charge?",answer:-1,why:"FC = 4 − 2 − 3 = <b>−1</b>. A carbanion. <b>Careful here:</b> carbon with 3 bonds can be + OR −, and only the lone pair tells you which. Never guess carbon's sign from bond count alone."},
{id:"x2-f11",topic:"formal",type:"num",diff:1,prompt:"A carbon atom has 3 bonds and 0 lone pairs. Formal charge?",answer:1,why:"FC = 4 − 0 − 3 = <b>+1</b>. A carbocation — same 3 bonds as the carbanion, opposite charge. <b>The lone pair is the whole difference.</b> This pair of questions is the reason 'more bonds = +' fails on carbon."},
{id:"x2-f12",topic:"formal",type:"num",diff:2,prompt:"In H₃O⁺, what is the formal charge on the OXYGEN atom specifically?",answer:1,why:"O has 3 bonds and 1 lone pair: FC = 6 − 2 − 3 = <b>+1</b>. Group number stays 6 despite the ion's + charge. Notice the whole ion's charge (+1) sits on this one atom — the hydrogens are each 0."},
{id:"x2-f13",topic:"formal",type:"num",diff:2,prompt:"In OH⁻, what is the formal charge on the OXYGEN atom specifically?",answer:-1,why:"O has 1 bond and 3 lone pairs: FC = 6 − 6 − 1 = <b>−1</b>. Watch the middle term — 3 lone pairs is <b>6 electrons</b>, not 3. Using 3 there gives you +2, which is the classic wrong answer."},
{id:"x2-f14",topic:"formal",type:"num",diff:2,prompt:"In NH₄⁺, what is the formal charge on the NITROGEN atom specifically?",answer:1,why:"N has 4 bonds, 0 lone pairs: FC = 5 − 0 − 4 = <b>+1</b>. Group number is <b>5</b> — not 4. The ion being positive does not change nitrogen's group."},
{id:"x2-f15",topic:"formal",type:"num",diff:2,prompt:"In NH₄⁺, what is the formal charge on each HYDROGEN atom?",answer:0,why:"Each H: FC = 1 − 0 − 1 = <b>0</b>. The hydrogens are neutral; all of the ion's charge lives on nitrogen. Formal charge is assigned <b>per atom</b>, and most atoms in a charged species are still 0."},
{id:"x2-f16",topic:"formal",type:"num",diff:2,prompt:"In NH₄⁺, what do all the formal charges ADD UP to?",answer:1,why:"<b>+1</b> — N is +1, each H is 0, total +1. <b>The sum of formal charges always equals the overall charge on the species.</b> For a neutral molecule that sum is 0. This is your free check on every structure you draw."},
{id:"x2-f17",topic:"formal",type:"num",diff:2,prompt:"In a NEUTRAL molecule like CH₃OH, what must all the formal charges add up to?",answer:0,why:"<b>0.</b> Neutral overall → charges sum to zero. If you compute the individual atoms and get anything else, you've made an arithmetic error or drawn the structure wrong."},
{id:"x2-f18",topic:"formal",type:"mc",diff:2,prompt:"Formal charge is a property of:",choices:["A single ATOM within a structure","The whole molecule","The bond between two atoms","The lone pairs only"],answer:0,why:"<b>One atom at a time.</b> 'The formal charge of NH₄⁺' isn't quite a real question — the ion has an overall CHARGE of +1, and the nitrogen ATOM has a formal charge of +1. Compute per atom, then sum to check against the overall charge."},
{id:"x2-f19",topic:"formal",type:"num",diff:2,prompt:"Ozone O₃ is bent, with the CENTRAL oxygen having 3 bonds and 1 lone pair. Formal charge on that central O?",answer:1,why:"FC = 6 − 2 − 3 = <b>+1</b>. One lone pair is <b>2 electrons</b>. If you plugged in 6 there you'd get −3, which is impossible for oxygen — a nonsense answer is itself a signal you miscounted the lone pairs."},
{id:"x2-f20",topic:"formal",type:"num",diff:3,prompt:"Ozone O₃: the SINGLE-bonded terminal oxygen has 1 bond and 3 lone pairs. Its formal charge?",answer:-1,why:"FC = 6 − 6 − 1 = <b>−1</b>. Ozone's three oxygens are +1 (center), −1 (single-bonded end), 0 (double-bonded end) — summing to 0 ✓ for a neutral molecule. A neutral molecule can absolutely contain charged atoms as long as they cancel."},
{id:"x2-f21",topic:"formal",type:"num",diff:3,prompt:"Ozone O₃: the DOUBLE-bonded terminal oxygen has 2 bonds and 2 lone pairs. Its formal charge?",answer:0,why:"FC = 6 − 4 − 2 = <b>0</b>. Neutral oxygen pattern. Together with the +1 center and −1 end, ozone sums to zero overall ✓."},
{id:"x2-f22",topic:"formal",type:"num",diff:3,prompt:"In the nitrate ion NO₃⁻, the nitrogen has 4 bonds (one double, two single) and 0 lone pairs. Formal charge on N?",answer:1,why:"FC = 5 − 0 − 4 = <b>+1</b>. Group 5 even though the ion is negative — the ion's charge never touches the group number. (The two single-bonded oxygens are each −1, so the total is +1 −1 −1 = −1 ✓.)"},
{id:"x2-f23",topic:"formal",type:"num",diff:3,prompt:"In the nitrate ion NO₃⁻, each SINGLE-bonded oxygen has 1 bond and 3 lone pairs. Formal charge on one of them?",answer:-1,why:"FC = 6 − 6 − 1 = <b>−1</b>. Two of these at −1, plus N at +1, plus the double-bonded O at 0 → sums to −1 ✓, matching the ion's charge."},
{id:"x2-f24",topic:"formal",type:"mc",diff:3,prompt:"You compute a formal charge of −3 on an oxygen atom. What's the right response?",choices:["Recount — you almost certainly miscounted lone pairs or bonds","Accept it, oxygen can be −3","Change oxygen's group number","Add three protons"],answer:0,why:"<b>Recount.</b> Oxygen realistically runs −1, 0, or +1. An answer outside that range means an input error — usually lone pairs counted as pairs instead of electrons. <b>Use the plausible range as a built-in error detector.</b>"},
{id:"x2-f25",topic:"formal",type:"mc",diff:3,prompt:"Which single input error most often flips a formal charge to the wrong sign?",choices:["Using the number of lone PAIRS instead of the number of lone-pair ELECTRONS","Forgetting the molecule is a liquid","Using the wrong temperature","Counting protons"],answer:0,why:"<b>Pairs vs electrons.</b> The formula wants ELECTRONS: 3 lone pairs = 6, not 3. Writing 3 there turns a −1 into a +2. Say 'pairs times two' out loud every time before you plug in."},
{id:"x2-f26",topic:"formal",type:"num",diff:2,prompt:"A carbon atom has 4 bonds and 0 lone pairs. Formal charge?",answer:0,why:"FC = 4 − 0 − 4 = <b>0</b>. Standard neutral carbon — the overwhelming majority of carbons you'll ever draw. If a carbon in your structure isn't 4 bonds / 0 LP, it had better have a charge on it."},
{id:"x2-f27",topic:"formal",type:"num",diff:2,prompt:"A boron atom (group 3) has 3 bonds and 0 lone pairs. Formal charge?",answer:0,why:"FC = 3 − 0 − 3 = <b>0</b>. Neutral boron is happy with only 6 electrons — an octet EXCEPTION. That empty orbital is why BF₃ is such a strong Lewis acid."},
{id:"x2-f28",topic:"formal",type:"num",diff:3,prompt:"A boron atom has 4 bonds and 0 lone pairs (as in BF₄⁻). Formal charge?",answer:-1,why:"FC = 3 − 0 − 4 = <b>−1</b>. Group 3 with 4 bonds → negative. Boron runs the opposite direction from nitrogen because its group number is lower — which is exactly why you compute rather than memorize 'more bonds = +'."},
{id:"x2-f29",topic:"formal",type:"num",diff:3,prompt:"In the cyanide ion, ⁻C≡N, the carbon has a triple bond and 1 lone pair. Formal charge on carbon?",answer:-1,why:"A triple bond is <b>3 bonds</b>, and 1 lone pair is 2 electrons: FC = 4 − 2 − 3 = <b>−1</b>. Counting the triple bond as 1 instead of 3 is a frequent slip — 'number of bonds' means the count of lines' worth of connections, not the number of neighbors."},
{id:"x2-f30",topic:"formal",type:"num",diff:3,prompt:"In the cyanide ion ⁻C≡N, what is the formal charge on the NITROGEN?",answer:0,why:"N has a triple bond (3) and 1 lone pair (2 e⁻): FC = 5 − 2 − 3 = <b>0</b>. So cyanide's −1 sits entirely on carbon — which is precisely why cyanide attacks through carbon as a nucleophile."},
/* ===== v3.9 EXPANSION — CH 1 CORE, part B: polarity · hybridization · IMF ===== */
/* --- polarity & dipoles --- */
{id:"x2-p01",topic:"polarity",type:"mc",diff:0,prompt:"Electronegativity means:",choices:["How strongly an atom pulls shared electrons toward itself","How many electrons an atom has","How big an atom is","How many bonds an atom makes"],answer:0,why:"<b>Pulling power</b> in a bond. High EN = greedy for the shared pair = ends up δ−. It's a tug-of-war rating, not an electron count."},
{id:"x2-p02",topic:"polarity",type:"mc",diff:0,prompt:"In any polar bond, the δ− (partial negative) goes on:",choices:["The MORE electronegative atom","The LESS electronegative atom","The bigger atom","The one with more lone pairs"],answer:0,why:"<b>More electronegative gets δ−.</b> It wins the tug-of-war, so electron density piles up there. The other atom gets δ+ by default. One rule, every polar bond."},
{id:"x2-p03",topic:"polarity",type:"mc",diff:0,prompt:"A bond between two IDENTICAL atoms (like the Cl–Cl in Cl₂) is:",choices:["Nonpolar — equal pull, no dipole","Polar — chlorine is electronegative","Ionic","Impossible"],answer:0,why:"<b>Nonpolar.</b> Identical atoms pull identically, so the pair sits dead center. Polarity requires a DIFFERENCE — an atom's own electronegativity is irrelevant if it's bonded to its twin."},
{id:"x2-p04",topic:"polarity",type:"mc",diff:1,prompt:"In an N–H bond, which atom is δ−?",choices:["Nitrogen","Hydrogen","Neither","Both"],answer:0,why:"<b>Nitrogen</b> (EN 3.0) beats hydrogen (2.1), so N is δ− and H is δ+. That δ+ hydrogen is exactly what lets amines hydrogen-bond."},
{id:"x2-p05",topic:"polarity",type:"mc",diff:1,prompt:"In a C–Li bond, which atom is δ−?",choices:["Carbon","Lithium","Neither","Both"],answer:0,why:"<b>Carbon</b> — this is the rare case where carbon is the more electronegative partner (C 2.5 vs Li 1.0). That δ− carbon makes organolithiums extremely strong nucleophiles and bases."},
{id:"x2-p06",topic:"polarity",type:"num",diff:1,prompt:"Using Wiley's values (Cl 3.0, C 2.5), what is ΔEN for a C–Cl bond? (one decimal)",answer:0.5,tolerance:0.05,why:"<b>0.5</b> — sitting right on the pure/polar-covalent boundary. Classify it as polar: partly because 0.5 is where polar covalent begins, and partly because of Ciesla's standing C–halogen rule, which settles every borderline case of this kind in the same direction."},
{id:"x2-p07",topic:"polarity",type:"num",diff:1,prompt:"Using Wiley's values (O 3.5, H 2.1), what is ΔEN for an O–H bond? (one decimal)",answer:1.4,tolerance:0.05,why:"<b>1.4</b> — between 0.5 and 1.7, so <b>polar covalent</b>. Strongly polar but still sharing, which is why water is a polar molecule rather than a salt."},
{id:"x2-p08",topic:"polarity",type:"mc",diff:2,prompt:"Which bond is the MOST polar?",choices:["H–F","H–Cl","H–Br","H–I"],answer:0,why:"<b>H–F</b>. Going down the halogens EN drops (F 4.0 → I 2.5), so ΔEN with hydrogen shrinks: HF 1.9 > HCl 0.9 > HBr 0.7 > HI 0.4. Biggest gap = most polar bond. (HF's 1.9 technically clears the 1.7 'ionic' line — but HF is a genuine polar covalent molecule, not a salt. Those cutoffs are guidelines on a spectrum, not hard walls.)"},
{id:"x2-p09",topic:"polarity",type:"mc",diff:2,prompt:"A molecule has polar bonds. Is the MOLECULE necessarily polar?",choices:["No — geometry can cancel the bond dipoles","Yes, always","Only if it has oxygen","Only if it's bent"],answer:0,why:"<b>No.</b> Bond polarity and molecular polarity are two different questions. CO₂ and CCl₄ both have very polar bonds and zero net dipole, because symmetry cancels the vectors. Geometry decides the second question."},
{id:"x2-p10",topic:"polarity",type:"mc",diff:2,prompt:"Water is bent rather than linear. What does that do to its polarity?",choices:["Makes it polar — the two O–H dipoles add instead of cancelling","Makes it nonpolar","Nothing","Makes the bonds nonpolar"],answer:0,why:"<b>Bent → polar.</b> Both O–H dipoles point toward oxygen and, at 104.5°, partially reinforce rather than oppose. Straighten water out to 180° and it would be nonpolar — geometry is doing all the work."},
{id:"x2-p11",topic:"polarity",type:"mc",diff:2,prompt:"NH₃ (trigonal pyramidal, one lone pair on N) is:",choices:["Polar — the lone pair breaks the symmetry","Nonpolar — three identical N–H bonds cancel","Ionic","Nonpolar because N is central"],answer:0,why:"<b>Polar.</b> Three N–H dipoles pointing 'up' toward N plus a lone pair on top — nothing balances it. Compare BF₃: also three bonds, but trigonal PLANAR with no lone pair, so it cancels and is nonpolar."},
{id:"x2-p12",topic:"polarity",type:"mc",diff:2,prompt:"CH₄ (tetrahedral, four identical C–H bonds) is:",choices:["Nonpolar — symmetric, and C–H is barely polar anyway","Polar","Ionic","Polar because carbon is central"],answer:0,why:"<b>Nonpolar</b> twice over: C–H has a tiny ΔEN (0.4), and perfect tetrahedral symmetry cancels whatever little dipole exists. This is why hydrocarbons don't dissolve in water."},
{id:"x2-p13",topic:"polarity",type:"mc",diff:3,prompt:"CCl₄ is nonpolar but CHCl₃ (chloroform) is polar. Why?",choices:["Swapping one Cl for H breaks the symmetry, so the dipoles no longer cancel","CHCl₃ has more chlorines","H is more electronegative than Cl","CCl₄ has no polar bonds"],answer:0,why:"<b>Symmetry broken.</b> Four identical C–Cl dipoles at tetrahedral angles sum to exactly zero. Replace one with a much weaker C–H and the vectors no longer cancel — a net dipole survives, pointing away from the H."},
{id:"x2-p14",topic:"polarity",type:"mc",diff:3,prompt:"CFCl₃ is polar even though it's tetrahedral with four halogen-ish substituents. Why?",choices:["F and Cl have different electronegativities, so their dipoles differ in size and can't cancel","It isn't tetrahedral","Fluorine is nonpolar","Three Cl always cancel"],answer:0,why:"<b>Cancellation requires IDENTICAL substituents.</b> C–F (ΔEN 1.5) pulls harder than C–Cl (0.5), so the vectors are unequal and leave a net dipole. Symmetric SHAPE isn't enough — you need symmetric ATOMS too."},
{id:"x2-p15",topic:"polarity",type:"mc",diff:3,prompt:"CO₂ is linear and nonpolar; SO₂ is bent and polar. Both are O=X=O. What's the difference?",choices:["SO₂'s sulfur has a lone pair, which bends it so the dipoles don't cancel","SO₂ has more oxygens","Sulfur isn't electronegative","CO₂'s bonds aren't polar"],answer:0,why:"<b>A lone pair on sulfur.</b> S has 3 electron domains (2 bonds + 1 LP) → bent, so the two S=O dipoles partially add. Carbon in CO₂ has only 2 domains → linear → exact cancellation. One lone pair is the entire difference in polarity."},
{id:"x2-p16",topic:"polarity",type:"mc",diff:3,prompt:"Ciesla's stated rule: a carbon bonded to a halogen counts as a POLAR bond regardless of ΔEN. Applying HER rule, how do you classify C–Br (ΔEN 0.3)?",choices:["Polar — the C–halogen rule overrides the ΔEN cutoff","Pure covalent — 0.3 is below 0.5","Ionic","Not enough information"],answer:0,why:"<b>Polar.</b> This is her exact worked example. ΔEN 0.3 sits below the 0.5 cutoff, so the arithmetic alone says 'pure covalent' — and that's the trap. Her reasoning: ΔEN is a simplification, and a real bond dipole also depends on how the charge is spread over distance, which means atom size matters. Bromine is much larger than carbon. <b>Her instruction: when you see C–halogen on an exam, answer polar and don't start calculating.</b>"},

/* --- hybridization & VSEPR --- */
{id:"x2-h01",topic:"hybrid",type:"num",diff:0,prompt:"How many electron domains does an sp³ atom have?",answer:4,why:"<b>4</b>. Domain count IS the hybridization: 4 → sp³, 3 → sp², 2 → sp. Count domains first, everything else follows."},
{id:"x2-h02",topic:"hybrid",type:"mc",diff:0,prompt:"When counting electron DOMAINS, a double bond counts as:",choices:["ONE domain","Two domains","Four domains","Half a domain"],answer:0,why:"<b>One.</b> A domain is a direction that electron density points, and both halves of a double bond point the same way. Counting a double bond as 2 domains is the fastest way to get every hybridization wrong."},
