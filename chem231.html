<script>
"use strict";

/* ================= STORAGE (safe wrapper) ================= */
const safeStore = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){ ok = false; }
  return {
    get(k, fallback){ try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? fallback : JSON.parse(v); } catch(e){ return fallback; } },
    set(k, v){ try { const s = JSON.stringify(v); if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch(e){} },
    persistent: ok
  };
})();

/* ============ CLOUD SYNC (same Supabase project as B250) ============
   One row in the `progress` table, profile "gabe-c231".
   Pull + merge on load, debounced push on every change →
   iPad / iPhone / Mac / any browser all see the same progress.  */
const SB_URL = "https://tzdreklmkntpopqncada.supabase.co";
const SB_KEY = "sb_publishable_PWdbyaBoBg8hM2kptSrwBA_I4lFrnQr";
const SB_PROFILE = "gabe-c231";
let cloudState = "init";
let _pushT = null;
function sbHeaders(){ return {"apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json"}; }
function mergeRemote(remote){
  if (!remote) return;
  ["doneDays","molDone","visits","fcMastery"].forEach(k=>{ S[k] = [...new Set([...(remote[k]||[]), ...(S[k]||[])])]; });
  if (remote.lastEval && (!S.lastEval || remote.lastEval.date > S.lastEval.date)) S.lastEval = remote.lastEval;
  const seenM = new Set(S.missed);
  (remote.missed||[]).forEach(id=>{ if(!seenM.has(id)){ S.missed.push(id); seenM.add(id); } });
  Object.entries(remote.qstats||{}).forEach(([id,st])=>{
    const loc = S.qstats[id];
    if (!loc || (st.r+st.w) > (loc.r+loc.w)) S.qstats[id] = st;   // keep the copy with more attempts
  });
  // v3.0: merge diagnostics runs (unique by date+type), written log (unique by ts), nextQuiz (latest setAt wins)
  const dk = new Set(S.diags.map(d=>d.date+"|"+d.type));
  (remote.diags||[]).forEach(d=>{ if(!dk.has(d.date+"|"+d.type)){ S.diags.push(d); dk.add(d.date+"|"+d.type); } });
  S.diags.sort((a,b)=>a.date<b.date?-1:1);
  const wk = new Set(S.wrLog.map(w=>w.ts));
  (remote.wrLog||[]).forEach(w=>{ if(!wk.has(w.ts)){ S.wrLog.push(w); wk.add(w.ts); } });
  S.wrLog.sort((a,b)=>a.ts<b.ts?-1:1); if(S.wrLog.length>120) S.wrLog=S.wrLog.slice(-120);
  // v3.2: attempts = UNION by id|ts — every device's events survive; nothing is overwritten
  const ak = new Set(S.attempts.map(a=>a.id+"|"+a.ts));

}
async function cloudPull(){
  try {
    const r = await fetch(SB_URL+"/rest/v1/progress?profile=eq."+SB_PROFILE+"&select=data", {headers:sbHeaders()});
    if (!r.ok) throw 0;

  } catch(e){ cloudState = "offline"; renderSyncDot(); }
}
async function cloudPush(now){
  if (!now){ clearTimeout(_pushT); _pushT = setTimeout(()=>cloudPush(true), 2500); return; }
  try {
    const body = JSON.stringify({ profile: SB_PROFILE,
      data: {doneDays:S.doneDays, qstats:S.qstats, missed:S.missed, molDone:S.molDone, visits:S.visits, fcMastery:S.fcMastery, lastEval:S.lastEval, diags:S.diags, nextQuiz:S.nextQuiz, wrLog:S.wrLog, attempts:S.attempts},

  } catch(e){ cloudState = "offline"; }
  renderSyncDot();
}

function startDiag2(type){
  const cov=coveredTopics();
  let scopeTopics, scopeName;
  let missing=[]; // v3.1 (audit F3): topics the checkpoint requires but the bank can't test — NAMED, never silent
  if(type==="scope"){ const cp=nextCheckpoint();
    const wanted=(cp&&cp.topics)?cp.topics:cov;
    scopeTopics=wanted.filter(k=>cov.includes(k)&&QUESTIONS.some(q=>q.topic===k&&q.type!=="written")); // covered AND testable only
    missing=wanted.filter(k=>!scopeTopics.includes(k));
    scopeName=cp?cp.name+" ("+fmtDay(cp.date)+")":"next assessment";
  } else { scopeTopics=cov; scopeName="semester so far (wk "+Math.max(courseWeek(),1)+")";
    // cumulative: name any covered course topic the bank has no items for (e.g. Ch 4 from wk 4)
    missing=(SEMESTER.filter(w=>w.wk<=courseWeek()).flatMap(w=>w.topics)).filter(k=>!QUESTIONS.some(q=>q.topic===k));
    const wkNow=SEMESTER.find(w=>w.wk===courseWeek());
    if(wkNow&&!wkNow.topics.length&&courseWeek()>=4) missing.push("Ch 4 (no bank items yet)");
  }
  scopeTopics=scopeTopics.filter(k=>QUESTIONS.some(q=>q.topic===k&&q.type!=="written"));
  if(!scopeTopics.length){ alert("No in-scope topics in the bank yet."+(missing.length?" Uncovered: "+missing.join(", "):"")); return; }
  if(missing.length) alert("⚠ HONESTY NOTE — this "+(type==="scope"?"scoped":"cumulative")+" run does NOT cover: "+missing.join(", ")+".\nThe score below excludes those. Study them from the book/Canvas — the app can't see them.");
  // 2 MCQ/num per topic (recall-weighted: missed → guessed-shaky → least-seen), + up to 2 written items in scope
  const seen=id=>(S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
  // v3.2: misconception (confident-wrong) ranked above guessed-wrong; difficulty is MEASURED (qDiffM), not the static constant
  const needScore=q=>{ const s=S.qstats[q.id]; let n=0; if(s&&(s.w-(s.gw||0))>0)n+=4; else if(s&&s.w>0)n+=2; if(s&&(s.gr||0)>0&&s.r<= (s.gr||0))n+=2; if(seen(q.id)===0)n+=2; if(type==="scope")n+=qDiffM(q); return n+Math.random(); };
  const pool=[];
  scopeTopics.forEach(k=>{ const qs=QUESTIONS.filter(q=>q.topic===k&&q.type!=="written").sort((a,b)=>needScore(b)-needScore(a)); pool.push(...qs.slice(0,2)); });
  const wr=shuffle(QUESTIONS.filter(q=>q.type==="written"&&scopeTopics.includes(q.topic))).slice(0,2);
  S.drill={queue:shuffle(pool).concat(wr), i:0, right:0, wrong:0, topic:"__"+type, answered:false, byTopic:{}, cold:true, guessedRight:0, scopeName};

}

{id:"h8",topic:"hybrid",type:"num",prompt:"Bond angle in CH₄ (tetrahedral), in degrees? (one decimal)",answer:109.5,why:"4 equal domains → <b>109.5°</b>. The set to memorize: sp 180° · sp² 120° · sp³ 109.5° (squeezed slightly by lone pairs: NH₃ ~107°, H₂O ~104.5°)."},
{id:"h9",topic:"hybrid",type:"mc",prompt:"CO₂'s shape and angle?",choices:["Linear, 180°","Bent, ~120°","Trigonal planar, 120°","Bent, ~104.5°"],answer:0,why:"C has 2 domains (each double bond counts ONCE) → sp, <b>linear, 180°</b>. Domain counting, not bond counting."},
{id:"h10",topic:"hybrid",type:"mc",prompt:"CH₂O (formaldehyde) — shape around the C?",choices:["Trigonal planar, ~120°","Tetrahedral, 109.5°","Bent","Linear"],answer:0,why:"3 domains (2 H + the C=O counted once) → sp², <b>trigonal planar, 120°</b>."},
{id:"h6",topic:"hybrid",type:"text",prompt:"In CH₂=CH–C≡N, the hybridization of the carbon in C≡N?",answer:"sp",why:"Triple-bonded carbon: 2 domains → <b>sp</b>. Walking a molecule assigning sp/sp²/sp³ per atom should take seconds by day one of class."},
/* --- imf (v2.6 — on Prof. Ciesla's review list) --- */
{id:"i1",topic:"imf",type:"mc",prompt:"Strongest intermolecular force in pure water?",choices:["Hydrogen bonding","London dispersion","Dipole-dipole only","Covalent bonds between molecules"],answer:0,why:"O–H bonds + lone pairs on O → water both donates and accepts <b>H-bonds</b>. (H-bonding IS a strong dipole-dipole special case — name the strongest force present.)"},
{id:"i2",topic:"imf",type:"mc",prompt:"A hydrogen bond requires:",choices:["H bonded to N, O, or F + a lone pair on another N, O, or F","Any H near any O","A charged molecule","A metal atom"],answer:0,why:"Both halves matter: a polarized <b>H on N/O/F</b> (the donor) and a <b>lone pair on N/O/F</b> (the acceptor). C–H hydrogens don't count — carbon isn't electronegative enough."},
{id:"i3",topic:"imf",type:"mc",prompt:"CH₄'s only intermolecular force?",choices:["London dispersion","Hydrogen bonding","Dipole-dipole","Ion-dipole"],answer:0,why:"No polar bonds worth counting, no net dipole → only <b>London dispersion</b> (present in EVERYTHING, and the only thing nonpolar molecules get). Hence bp −162 °C."},
{id:"i4",topic:"imf",type:"mc",prompt:"Higher boiling point: ethanol (CH₃CH₂OH) or dimethyl ether (CH₃OCH₃)? Same formula!",choices:["Ethanol — it can H-bond with itself (O–H); the ether can't","The ether — oxygen in the middle","Identical, same atoms","Depends on pressure"],answer:0,why:"Same C₂H₆O, wildly different bp (+78° vs −24°). Ethanol has an <b>O–H</b> → H-bond donor. The ether's H's are all on carbon → acceptor only, no donation between its own molecules. Connectivity beats formula."},
{id:"i5",topic:"imf",type:"mc",prompt:"Why does octane (C₈) boil higher than butane (C₄)?",choices:["More surface area → stronger London dispersion","Octane has hydrogen bonds","Octane is polar","It doesn't"],answer:0,why:"Dispersion scales with <b>contact surface area</b> — more electrons, more molecule to stick. This is why 'weakest force' ≠ 'small effect': in big molecules dispersion dominates."},
{id:"i6",topic:"imf",type:"mc",prompt:"Acetone (CH₃)₂C=O has a polar C=O but no O–H. Strongest IMF between acetone molecules?",choices:["Dipole-dipole","Hydrogen bonding","London only","Ionic"],answer:0,why:"Net dipole (that C=O) → <b>dipole-dipole</b>. No O–H/N–H means it can't H-bond donate to itself. (It CAN accept H-bonds from water — why acetone mixes with water — but between acetone molecules, dipole-dipole is the ceiling.)"},
/* --- resonance --- */
{id:"r1",topic:"resonance",type:"mc",prompt:"Resonance structures are…",choices:["Imaginary snapshots; the real molecule is one blended hybrid","Structures the molecule flips between rapidly","Different molecules in equilibrium","Excited states"],answer:0,why:"The molecule is <b>always the hybrid</b> — it never 'flips.' Resonance is a limitation of drawing, not a motion of the molecule."},
{id:"r2",topic:"resonance",type:"mc",prompt:"When drawing resonance structures, what is allowed to move?",choices:["Electrons only (lone pairs and π bonds)","Atoms only","Both atoms and electrons","Protons"],answer:0,why:"<b>Only electrons move</b> — lone pairs ↔ π bonds. If an atom moved, it's a different molecule (an isomer), not resonance."},
{id:"r3",topic:"resonance",type:"num",prompt:"How many equivalent resonance structures does the nitrate ion NO₃⁻ have?",answer:3,why:"The double bond can sit on any of the 3 oxygens → <b>3 equivalent structures</b>; the real ion has three identical 1⅓ bonds."},
{id:"r4",topic:"resonance",type:"mc",prompt:"The two C–O bonds in acetate (CH₃CO₂⁻) are the same length because…",choices:["The true structure is a hybrid — each bond is order 1.5","They alternate quickly","One is sigma, one is pi","Measurement error"],answer:0,why:"Two equivalent resonance forms average to <b>bond order 1.5 on both C–O bonds</b>, charge spread over both oxygens. Delocalized charge = stabilized charge — this becomes the #1 acidity argument."},
{id:"r5",topic:"resonance",type:"mc",prompt:"Which resonance structure contributes MOST to the hybrid?",choices:["Full octets, least charge separation, − on the most electronegative atom","The one with the most charges","The one drawn first","They always contribute equally"],answer:0,why:"Ranking rules: <b>octets full > minimal charge > negative on the EN atom</b>. Equivalent structures (like acetate's) contribute equally."},
/* --- acid-base I --- */
{id:"a1",topic:"acidbase1",type:"mc",prompt:"Lower pKa means…",choices:["Stronger acid","Weaker acid","Stronger base","Higher pH always"],answer:0,why:"<b>pKa down = acid strength up</b> (it's a log scale: each unit = 10×). Burn this in — every ochem acid-base question routes through it."},
{id:"a2",topic:"acidbase1",type:"num",prompt:"Approximate pKa of a carboxylic acid (like acetic acid)?",answer:5,tolerance:1,why:"≈ <b>5</b> (4.76 for acetic — either is accepted). Landmarks to know cold: HCl −7 · H₃O⁺ −1.7 · RCOOH 5 · H₂O 15.7 · ROH 16 · alkyne 25 · alkane 50."},
{id:"a3",topic:"acidbase1",type:"num",prompt:"Approximate pKa of water?",answer:16,why:"<b>15.7</b> (we accept 16). Water is a far weaker acid than a carboxylic acid — 10 pKa units ≈ 10 billion times weaker.",tolerance:1},
{id:"a4",topic:"acidbase1",type:"mc",prompt:"An acid-base equilibrium favors the side with…",choices:["The weaker acid (higher pKa)","The stronger acid","More molecules","The heavier compounds"],answer:0,why:"Equilibrium runs <b>downhill to the weaker acid</b>. Compare the two pKa values; the side holding the higher-pKa acid wins."},
{id:"a5",topic:"acidbase1",type:"mc",prompt:"Acetate (CH₃CO₂⁻) + water — is the equilibrium for acetate pulling a proton OFF water favored?",choices:["No — that would form acetic acid (pKa 5) from water (pKa 15.7), uphill","Yes, strongly favored","Yes, about half-way","Only when heated"],answer:0,why:"Going acetate + H₂O → acetic acid + OH⁻ converts a pKa-15.7 acid into a pKa-5 acid — <b>uphill by ~10¹¹</b>. Equilibrium says no."},
{id:"a6",topic:"acidbase1",type:"text",prompt:"Conjugate base of H₂O? (type a formula, e.g. NH2-)",answer:"oh-",accept:["oh-","ho-","oh−","ho−"],why:"Remove H⁺ from H₂O → <b>OH⁻</b>. Conjugate pairs differ by exactly one proton."},
/* --- acid-base II: ARIO --- */
{id:"b1",topic:"acidbase2",type:"mc",prompt:"ARIO ranks what makes an acid strong. The letters stand for:",choices:["Atom, Resonance, Induction, Orbital","Acidity, Reactivity, Ionization, Orbital","Atom, Radius, Ion, Octet","Angle, Resonance, Induction, Overlap"],answer:0,why:"<b>A</b>tom → <b>R</b>esonance → <b>I</b>nduction → <b>O</b>rbital, checked in that order on the <b>conjugate base</b>: whatever stabilizes the conjugate base makes the acid stronger."},
{id:"b2",topic:"acidbase2",type:"mc",prompt:"Why is acetic acid (pKa 5) a much stronger acid than ethanol (pKa 16)?",choices:["Resonance: acetate's charge spreads over 2 oxygens; ethoxide's sits on 1","Acetic acid has more hydrogens","Ethanol is bigger","Induction from the CH₃"],answer:0,why:"Same atom (O) holds the charge in both — the difference is <b>R: resonance delocalization</b> in acetate. Delocalized charge = stable conjugate base = stronger acid. This exact comparison is an Exam-1 classic."},
{id:"b3",topic:"acidbase2",type:"mc",prompt:"Rank acidity: HF vs H₂O vs NH₃",choices:["HF > H₂O > NH₃","NH₃ > H₂O > HF","H₂O > HF > NH₃","All equal"],answer:0,why:"<b>A (atom)</b>: across a row, more electronegative atom stabilizes − better: F⁻ > OH⁻ > NH₂⁻. So HF (pKa 3.2) > H₂O (15.7) > NH₃ (38)."},
{id:"b4",topic:"acidbase2",type:"mc",prompt:"Which effect explains why CF₃COOH (pKa 0.2) beats CH₃COOH (pKa 4.8)?",choices:["Induction — the F's pull electron density through the bonds","Resonance","A heavier molecule","Orbital size"],answer:0,why:"Both have identical resonance; the F's add <b>I: induction</b> — electron-withdrawal through σ bonds that further stabilizes the anion. Closer + more EN groups = bigger effect."},
{id:"b5",topic:"acidbase2",type:"mc",prompt:"Terminal alkynes (pKa 25) are more acidic than alkanes (pKa 50) because…",choices:["The sp carbanion holds the lone pair closer to the nucleus","Triple bonds are weak","Resonance","Alkynes are polar molecules"],answer:0,why:"<b>O: orbital.</b> sp (50% s-character) holds electrons tighter than sp³ (25%) → more stable carbanion → more acidic. The O factor only matters when A/R/I tie."},
{id:"b6",topic:"acidbase2",type:"mc",prompt:"HBr is a stronger acid than HF. But F is more electronegative! Why?",choices:["Size wins down a column — Br⁻ spreads charge over a bigger volume","It isn't stronger","Br has resonance","HF hydrogen-bonds"],answer:0,why:"<b>A has two sub-rules</b>: across a row → electronegativity; down a column → <b>size</b>. Big soft Br⁻ dilutes the charge → very stable → HBr pKa −9 vs HF +3.2."},
/* --- bond-line + functional groups --- */
{id:"c1",topic:"bondline",type:"num",prompt:"In bond-line notation, a plain zigzag of 4 line-ends/vertices (no letters) = butane. How many H's on each END carbon?",answer:3,why:"End carbons have 1 C–C bond → need <b>3 H's</b> to reach 4 bonds. Interior carbons with 2 C–C bonds carry 2 H's. Hydrogens are implied, never drawn."},
{id:"c2",topic:"bondline",type:"num",prompt:"Total hydrogens in cyclohexane (the plain hexagon)?",answer:12,why:"6 carbons, each with 2 ring bonds → 2 H's each → <b>12</b>. Formula C₆H₁₂ ✓ (CₙH₂ₙ for one ring/double bond)."},
{id:"c3",topic:"bondline",type:"num",prompt:"CH₃CH(OH)CH₂CH₃ — how many H's on the carbon bearing the OH?",answer:1,why:"That C has bonds to: CH₃, OH, CH₂CH₃ = 3 → needs <b>1 H</b>. Translating condensed ↔ bond-line and counting hidden H's is a day-one class skill."},
{id:"c4",topic:"bondline",type:"mc",prompt:"A C=O with an H directly on the carbonyl carbon is a(n)…",choices:["Aldehyde","Ketone","Carboxylic acid","Ester"],answer:0,why:"<b>Aldehyde</b> = C=O at a chain END (has H). Ketone = C=O between two carbons. Acid = C=O with OH. Ester = C=O with OR."},
{id:"c5",topic:"bondline",type:"mc",prompt:"CH₃–O–CH₃ contains which functional group?",choices:["Ether","Ester","Alcohol","Aldehyde"],answer:0,why:"C–O–C with no C=O = <b>ether</b>. Ester needs C(=O)O, alcohol needs O–H, aldehyde needs C(=O)H."},
{id:"c6",topic:"bondline",type:"mc",prompt:"Ibuprofen contains a benzene ring and which acidic group?",choices:["Carboxylic acid (–COOH)","Amide","Ester","Phenol"],answer:0,why:"Ibuprofen = aromatic ring + <b>carboxylic acid</b> (pKa ≈ 4.9). Spotting groups on real drugs is exactly how exams dress up easy questions."},
{id:"c7",topic:"bondline",type:"mc",prompt:"An N between two carbons (R–NH–R), no C=O anywhere near it:",choices:["Amine","Amide","Nitrile","Imine"],answer:0,why:"<b>Amine</b> = N with C/H neighbors. <b>Amide</b> = N attached to a C=O — totally different behavior. This pair is the most-confused of all groups."},
// v2.13: bank expansion — +30 Lewis, +8 each valence/formal/polarity/hybrid, +6 IMF.
{id:"lx1",topic:"lewis",type:"num",prompt:"Total valence electrons in CCl₄?",answer:32,why:"C(4) + 4×Cl(7) = <b>32</b>. Count every atom's group number; no charge to adjust."},
{id:"lx2",topic:"lewis",type:"num",prompt:"Total valence electrons in PCl₃?",answer:26,why:"P(5) + 3×Cl(7) = <b>26</b>."},
{id:"lx3",topic:"lewis",type:"num",prompt:"Total valence electrons in SO₂?",answer:18,why:"S(6) + 2×O(6) = <b>18</b>."},
{id:"lx4",topic:"lewis",type:"num",prompt:"Total valence electrons in ozone, O₃?",answer:18,why:"3×O(6) = <b>18</b>. Same count as SO₂ — both bent with a resonance-shared double bond."},
{id:"lx5",topic:"lewis",type:"num",prompt:"Total valence electrons in carbonate, CO₃²⁻?",answer:24,why:"C(4) + 3×O(6) + 2 (for the 2− charge) = <b>24</b>. Add electrons for negative charge."},
{id:"lx6",topic:"lewis",type:"num",prompt:"Total valence electrons in nitrate, NO₃⁻?",answer:24,why:"N(5) + 3×O(6) + 1 = <b>24</b>. Isoelectronic with carbonate."},
{id:"lx7",topic:"lewis",type:"num",prompt:"Total valence electrons in sulfate, SO₄²⁻?",answer:32,why:"S(6) + 4×O(6) + 2 = <b>32</b>."},
{id:"lx8",topic:"lewis",type:"num",prompt:"Total valence electrons in ammonium, NH₄⁺?",answer:8,why:"N(5) + 4×H(1) − 1 (for the + charge) = <b>8</b>. Subtract for positive charge."},
{id:"lx9",topic:"lewis",type:"num",prompt:"Total valence electrons in cyanide, CN⁻?",answer:10,why:"C(4) + N(5) + 1 = <b>10</b>. Drawn C≡N with a lone pair on each — like N₂."},
{id:"lx10",topic:"lewis",type:"num",prompt:"Total valence electrons in acetylene, C₂H₂?",answer:10,why:"2×C(4) + 2×H(1) = <b>10</b>. Structure H–C≡C–H."},
{id:"lx11",topic:"lewis",type:"num",prompt:"Total valence electrons in BF₃?",answer:24,why:"B(3) + 3×F(7) = <b>24</b>. Boron ends with only 6 around it — a real octet exception."},
{id:"lx12",topic:"lewis",type:"num",prompt:"Total valence electrons in hydrogen peroxide, H₂O₂?",answer:14,why:"2×H(1) + 2×O(6) = <b>14</b>. Structure H–O–O–H."},
{id:"lx13",topic:"lewis",type:"num",prompt:"Total valence electrons in chloromethane, CH₃Cl?",answer:14,why:"C(4) + 3×H(1) + Cl(7) = <b>14</b>."},
{id:"lx14",topic:"lewis",type:"num",prompt:"Total valence electrons in nitric acid, HNO₃?",answer:24,why:"H(1) + N(5) + 3×O(6) = <b>24</b>."},
{id:"lx15",topic:"lewis",type:"num",prompt:"Total valence electrons in hydrazine, N₂H₄?",answer:14,why:"2×N(5) + 4×H(1) = <b>14</b>. Structure H₂N–NH₂."},
{id:"lx16",topic:"lewis",type:"mc",prompt:"Central atom of SO₂?",answer:1,choices:["Oxygen","Sulfur","It has no central atom","Both equally"],why:"<b>Sulfur</b> — the least electronegative atom (excluding H) goes in the center; oxygens hang off it."},
{id:"lx17",topic:"lewis",type:"num",prompt:"In CO₂ (O=C=O), how many lone pairs are on the central carbon?",answer:0,why:"<b>0</b> — carbon's octet is full from two double bonds. Every leftover electron sat on the oxygens."},
{id:"lx18",topic:"lewis",type:"num",prompt:"In one resonance structure of CO₃²⁻, how many of the three C–O bonds is a DOUBLE bond?",answer:1,why:"<b>1</b> double + 2 single. Resonance averages them to 1.33, but any single drawn structure shows exactly one C=O."},
{id:"lx19",topic:"lewis",type:"num",prompt:"In BF₃, how many electrons end up around the boron?",answer:6,why:"<b>6</b> (3 single bonds, no lone pairs). Boron is a Group-13 exception — electron-deficient, which makes BF₃ a strong Lewis acid."},
{id:"lx20",topic:"lewis",type:"mc",prompt:"Which atom is NEVER a central atom?",answer:0,choices:["Hydrogen","Carbon","Nitrogen","Oxygen"],why:"<b>Hydrogen</b> — it forms only 1 bond, so it can never sit in the middle. Always terminal."},
{id:"lx21",topic:"lewis",type:"mc",prompt:"In acetylene, H–C≡C–H, the bond between the two carbons is a:",answer:0,choices:["Triple bond","Double bond","Single bond","Ionic bond"],why:"<b>Triple bond</b> (1 sigma + 2 pi). Each carbon: 1 bond to H + triple to C = 4 bonds, octet complete."},
{id:"lx22",topic:"lewis",type:"num",prompt:"In N₂ (:N≡N:), how many lone pairs are on EACH nitrogen?",answer:1,why:"<b>1</b> each. Triple bond (6 e⁻) + 1 lone pair (2 e⁻) = 8 around each N. 10 valence e⁻ total."},
{id:"lx23",topic:"lewis",type:"mc",prompt:"In HCN, carbon bonds once to H and how to the nitrogen?",answer:0,choices:["Triple bond","Double bond","Single bond","No bond"],why:"A <b>triple bond</b> to N. Carbon: 1 (to H) + 3 (to N) = 4 bonds ✓. Nitrogen keeps one lone pair."},
{id:"lx24",topic:"lewis",type:"num",prompt:"In ozone (O₃), how many lone pairs are on the CENTRAL oxygen?",answer:1,why:"<b>1</b>. The center O has one single bond, one double bond, and one lone pair → formal charge +1."},
{id:"lx25",topic:"lewis",type:"num",prompt:"A second-row atom (C, N, O, F) holds at most how many electrons in its valence shell?",answer:8,why:"<b>8</b> — the octet. Period-2 atoms have no d-orbitals, so never exceed 8."},
{id:"lx26",topic:"lewis",type:"num",prompt:"You drew CO₂ with all single bonds; the central C has only 4 electrons. It is short by how many?",answer:4,why:"Octet is 8, it has 4 → short by <b>4</b>. Quantify the deficit — never eyeball it."},
{id:"lx27",topic:"lewis",type:"num",prompt:"An atom short by 4 electrons — convert how many neighbor lone pairs into bonds?",answer:2,why:"Short ÷ 2 = <b>2</b> pairs. Each converted lone pair becomes a shared bond. (CO₂: one from each O → two C=O.)"},
{id:"lx28",topic:"lewis",type:"mc",prompt:"In formaldehyde, CH₂O, the carbon–oxygen bond is a:",answer:0,choices:["Double bond","Single bond","Triple bond","No direct bond"],why:"<b>Double bond</b> (C=O). Carbon: 2 bonds to H + double to O = 4 bonds."},
{id:"lx29",topic:"lewis",type:"num",prompt:"Total number of lone pairs in the whole H₂O molecule?",answer:2,why:"<b>2</b> — both on oxygen; hydrogens have none. O: 2 bonds + 2 lone pairs."},
{id:"lx30",topic:"lewis",type:"num",prompt:"In NH₃, how many lone pairs does the nitrogen have?",answer:1,why:"<b>1</b>. N makes 3 bonds + keeps 1 lone pair → octet complete. That lone pair makes ammonia a base."},
{id:"vx1",topic:"valence",type:"num",prompt:"Valence electrons in a neutral oxygen atom?",answer:6,why:"<b>6</b> — Group 16. Drives O's whole behavior (2 bonds, 2 lone pairs when neutral)."},
{id:"vx2",topic:"valence",type:"num",prompt:"Valence electrons in a neutral nitrogen atom?",answer:5,why:"<b>5</b> — Group 15. Neutral N makes 3 bonds + 1 lone pair."},
{id:"vx3",topic:"valence",type:"num",prompt:"Valence electrons in a neutral carbon atom?",answer:4,why:"<b>4</b> — Group 14. Four bonds, no lone pairs when neutral."},
{id:"vx4",topic:"valence",type:"num",prompt:"Valence electrons in a neutral fluorine atom?",answer:7,why:"<b>7</b> — Group 17. One bond + 3 lone pairs when neutral."},
{id:"vx5",topic:"valence",type:"mc",prompt:"For a main-group atom, the group number tells you its:",answer:0,choices:["Number of valence electrons","Number of neutrons","Atomic mass","Number of rings"],why:"<b>Valence electron count</b> = group number. C group 14 → 4, O group 16 → 6. Sources every Lewis structure."},
{id:"vx6",topic:"valence",type:"num",prompt:"Valence electrons in a neutral chlorine atom?",answer:7,why:"<b>7</b> — Group 17, same as fluorine. Halogens all bring 7."},
{id:"vx7",topic:"valence",type:"num",prompt:"Valence electrons in a hydrogen atom?",answer:1,why:"<b>1</b>. H makes exactly 1 bond and stops at 2 electrons (not 8) — the octet exception."},
{id:"vx8",topic:"valence",type:"num",prompt:"Valence electrons in a neutral sulfur atom?",answer:6,why:"<b>6</b> — Group 16, directly below oxygen, same valence count."},
{id:"fx1",topic:"formal",type:"num",prompt:"Formal charge on N in ammonia, NH₃ (3 bonds, 1 lone pair)?",answer:0,why:"FC = 5 − 2 − 3 = <b>0</b>. Nitrogen's NEUTRAL pattern: 3 bonds + 1 lone pair. The baseline."},
{id:"fx2",topic:"formal",type:"num",prompt:"Formal charge on O in water, H₂O (2 bonds, 2 lone pairs)?",answer:0,why:"FC = 6 − 4 − 2 = <b>0</b>. Oxygen's neutral pattern: 2 bonds + 2 lone pairs."},
{id:"fx3",topic:"formal",type:"num",prompt:"Formal charge on C in methane, CH₄ (4 bonds, 0 lone pairs)?",answer:0,why:"FC = 4 − 0 − 4 = <b>0</b>. Carbon's neutral pattern: 4 bonds, no lone pairs."},
{id:"fx4",topic:"formal",type:"num",prompt:"Formal charge on the CENTRAL oxygen in ozone (3 bonds, 1 lone pair)?",answer:1,why:"FC = 6 − 2 − 3 = <b>+1</b>. More bonds than O's neutral 2 → positive."},
{id:"fx5",topic:"formal",type:"num",prompt:"Formal charge on a terminal oxygen in ozone with 1 bond and 3 lone pairs?",answer:-1,why:"FC = 6 − 6 − 1 = <b>−1</b>. Fewer bonds than neutral → negative. (Ozone: center +1, one end −1, sum 0.)"},
{id:"fx6",topic:"formal",type:"num",prompt:"In any NEUTRAL molecule, the sum of all formal charges equals?",answer:0,why:"<b>0</b>. Individual atoms can be ±, but they must sum to the molecule's overall charge."},
{id:"fx7",topic:"formal",type:"num",prompt:"In NH₄⁺, the sum of all formal charges equals? (enter −1, 0, or 1)",answer:1,why:"<b>+1</b> — the sum always equals the ion's overall charge. N carries the +1; the H's are 0."},
{id:"fx8",topic:"formal",type:"num",prompt:"Formal charge on an N with 2 bonds and 2 lone pairs?",answer:-1,why:"FC = 5 − 4 − 2 = <b>−1</b>. Fewer bonds than nitrogen's neutral 3 → negative (an <b>amide ion / anionic nitrogen</b>, like H₂N⁻ — not the neutral N of a carboxamide)."},
{id:"px1",topic:"polarity",type:"mc",prompt:"Which is more electronegative, oxygen or carbon?",answer:0,choices:["Oxygen","Carbon","They are equal","Depends on the molecule"],why:"<b>Oxygen</b>. EN order: F > O > N ≈ Cl > C ≈ H. A C–O bond is polar with δ− on O."},
{id:"px2",topic:"polarity",type:"mc",prompt:"Is a C–H bond strongly polar?",answer:0,choices:["No — C and H are close in electronegativity","Yes — very polar","Yes — H is much more electronegative","Only in water"],why:"<b>Nearly nonpolar.</b> C and H sit close on the EN scale, so C–H barely has a dipole. That's why hydrocarbons are nonpolar."},
{id:"px3",topic:"polarity",type:"mc",prompt:"In an O–H bond, which atom carries the δ− (partial negative)?",answer:0,choices:["Oxygen","Hydrogen","Neither","Both"],why:"<b>Oxygen</b> — more electronegative, pulls the shared electrons → δ−; H becomes δ+. Why water H-bonds."},
{id:"px4",topic:"polarity",type:"mc",prompt:"CCl₄ is tetrahedral and symmetric. Is the MOLECULE polar?",answer:0,choices:["No — the four C–Cl dipoles cancel","Yes — chlorine is electronegative","Yes — it has polar bonds","Only when cold"],why:"<b>Nonpolar molecule</b> despite four polar bonds — tetrahedral symmetry cancels the dipoles. Same lesson as CO₂: geometry decides."},
{id:"px5",topic:"polarity",type:"mc",prompt:"CH₃Cl (one C–Cl bond on a tetrahedral carbon) — polar molecule?",answer:0,choices:["Yes — nothing cancels the single C–Cl dipole","No — it's symmetric","No — carbon is central","Only as a gas"],why:"<b>Polar.</b> One C–Cl dipole with nothing to oppose it → net dipole. Contrast CCl₄ where four cancel."},
{id:"px6",topic:"polarity",type:"mc",prompt:"NH₃ (trigonal pyramidal) — polar molecule?",answer:0,choices:["Yes — asymmetric shape, and the lone pair adds to the dipole","No — it's symmetric","No — N–H bonds are nonpolar","Only in water"],why:"<b>Polar.</b> The pyramidal shape means the N–H dipoles don't cancel; the lone pair bends it and adds to the dipole."},
{id:"px7",topic:"polarity",type:"mc",prompt:"Which is the most electronegative element on the common scale?",answer:0,choices:["Fluorine","Oxygen","Chlorine","Carbon"],why:"<b>Fluorine</b> — top of the EN order. Whatever F bonds to, F is δ−."},
{id:"px8",topic:"polarity",type:"mc",prompt:"Two identical atoms bonded together (e.g. Cl₂) — is the bond polar?",answer:0,choices:["No — equal electronegativity, no dipole","Yes — chlorine is electronegative","Yes — all bonds are polar","Only if bent"],why:"<b>Nonpolar bond.</b> Identical atoms pull equally → electrons shared evenly. Polarity needs an EN difference."},
{id:"hx1",topic:"hybrid",type:"num",prompt:"An sp³ atom has how many electron domains?",answer:4,why:"<b>4</b> → sp³ → tetrahedral, 109.5°. (Domains = bonded atoms + lone pairs.)"},
{id:"hx2",topic:"hybrid",type:"num",prompt:"Ideal bond angle at an sp² atom (degrees)?",answer:120,why:"<b>120°</b> — 3 domains, trigonal planar. Set: sp 180 · sp² 120 · sp³ 109.5."},
{id:"hx3",topic:"hybrid",type:"mc",prompt:"Geometry of an sp atom (2 electron domains)?",answer:0,choices:["Linear","Bent","Trigonal planar","Tetrahedral"],why:"<b>Linear</b>, 180°. Two domains push as far apart as possible. e.g. the carbons in acetylene, or CO₂."},
{id:"hx4",topic:"hybrid",type:"text",prompt:"Hybridization of the carbon in CO₂? (type like sp2)",answer:"sp",why:"2 domains (each C=O counts as ONE) → <b>sp</b>, linear. Double bonds don't add domains."},
{id:"hx5",topic:"hybrid",type:"text",prompt:"Using the steric-number (VSEPR) model: what hybridization is ASSIGNED to the oxygen in water (2 bonds, 2 lone pairs)? (type like sp3)",answer:"sp3",why:"4 domains → <b>sp³</b> in the steric-number model; lone pairs count. <i>Fine print (Klein §1.11): experimentally at least one lone pair occupies a p orbital — water's O cannot be described as literally sp³. Know both layers; use whichever Ciesla asks for.</i>"},
{id:"hx6",topic:"hybrid",type:"num",prompt:"How many pi bonds are in a triple bond?",answer:2,why:"<b>2</b> pi + 1 sigma. Single = 1σ. Double = 1σ+1π. Triple = 1σ+2π."},
{id:"hx7",topic:"hybrid",type:"mc",prompt:"A single bond consists of:",answer:0,choices:["1 sigma bond","1 pi bond","2 sigma bonds","1 sigma + 1 pi"],why:"<b>1 sigma bond.</b> The first bond between two atoms is always sigma; extra bonds (double/triple) add pi."},
{id:"hx8",topic:"hybrid",type:"text",prompt:"Hybridization of the nitrogen in ammonia, NH₃? (type like sp3)",answer:"sp3",why:"4 domains (3 bonds + 1 lone pair) → <b>sp³</b>. Counting the lone pair is the whole trick."},
{id:"ix1",topic:"imf",type:"mc",prompt:"For molecules of COMPARABLE SIZE, which is the stronger intermolecular force?",answer:0,choices:["Hydrogen bonding","London dispersion","They are equal","Neither is a force"],why:"For comparable size: <b>hydrogen bonding</b> > dipole-dipole > London dispersion (H-bonding = specially strong dipole interaction, H on N/O/F). <i>Careful — 'H-bonding always wins' is NOT a rule: in large, polarizable molecules, summed dispersion can dominate. Size matters.</i>"},
{id:"ix2",topic:"imf",type:"mc",prompt:"Can two CH₄ (methane) molecules hydrogen-bond to each other?",answer:0,choices:["No — no H bonded to N, O, or F","Yes — it has hydrogens","Yes — carbon is electronegative","Only when frozen"],why:"<b>No.</b> H-bonding needs H on N/O/F. Methane's H's are on carbon → only London dispersion."},
{id:"ix3",topic:"imf",type:"mc",prompt:"Which intermolecular force is present in EVERY molecule?",answer:0,choices:["London dispersion","Hydrogen bonding","Dipole-dipole","Ionic bonding"],why:"<b>London dispersion</b> — from temporary electron fluctuations, so everything has it. The only IMF nonpolar molecules get."},
{id:"ix4",topic:"imf",type:"mc",prompt:"HF can hydrogen-bond because its hydrogen is bonded to:",answer:0,choices:["Fluorine (an N/O/F atom)","Carbon","Another hydrogen","Nothing — it can't"],why:"<b>Fluorine.</b> H attached to N, O, or F is the H-bond donor requirement. HF, H₂O, NH₃ all qualify."},
{id:"ix5",topic:"imf",type:"mc",prompt:"A bigger molecule with more electrons has ___ London dispersion forces:",answer:0,choices:["Stronger","Weaker","The same","Zero"],why:"<b>Stronger.</b> More electrons + surface area = more polarizable = stronger dispersion. Why larger alkanes boil higher."},
{id:"ix6",topic:"imf",type:"mc",prompt:"Which boils at a higher temperature, H₂O or H₂S?",answer:0,choices:["H₂O — it hydrogen-bonds","H₂S — it's heavier","They are equal","Neither boils"],why:"<b>H₂O</b> (100°C vs −60°C). Oxygen enables H-bonding; sulfur isn't electronegative enough."},

{id:"WR-CH1-001",topic:"formal",type:"written",diff:2,prompt:"<b>Write out, showing EVERY count:</b> derive the formal charge on O in hydroxide (OH⁻).<br><span class='muted'>Required steps: O's neutral valence count → bonds in OH⁻ → lone pairs derived from the octet (not from memory of water) → the FC formula with numbers.</span>",
 model:"O neutral valence = <b>6</b>. In OH⁻, O has <b>1 bond</b> (2 shared e⁻); octet needs 8 → 8−2 = 6 nonbonding e⁻ = <b>3 lone pairs</b>. FC = 6 − 6 − ½(2) = 6 − 6 − 1 = <b>−1</b>.",
 rubric:["Used 6 (not 7) for O's neutral valence","Derived 3 lone pairs from the octet (not 2 by analogy to H₂O)","FC formula applied with explicit numbers","Final answer −1"]},
{id:"WR-CH1-002",topic:"formal",type:"written",diff:3,prompt:"<b>Write out with every count:</b> derive the formal charge on O in hydronium (H₃O⁺). Then state in one sentence WHY the sign comes out positive.",
 model:"O neutral valence = <b>6</b>. In H₃O⁺: <b>3 bonds</b> (6 shared e⁻) + <b>1 lone pair</b> (2 e⁻). FC = 6 − 2 − ½(6) = 6 − 2 − 3 = <b>+1</b>. Why positive: O 'owns' only 5 electrons here (2 nonbonding + 3 half-shares) vs its neutral 6 — one electron short → +1.",
 rubric:["3 bonds + 1 lone pair identified (not guessed from LP count)","FC = 6−2−3 shown with numbers","Sign explained via owned-vs-neutral electron count, not memorized"]},
{id:"WR-CH1-003",topic:"polarity",type:"written",diff:2,prompt:"<b>Explain to a classmate who missed class:</b> why is CO₂ nonpolar even though each C=O bond is strongly polar?",
 model:"Each C=O bond dipole points from C toward O. But CO₂ is <b>linear</b>, so the two equal dipoles point in exactly opposite directions and their <b>vector sum is zero</b>. Molecular polarity = the vector sum of bond dipoles — geometry decides, not just bond polarity.",
 rubric:["Names the linear geometry","Treats dipoles as vectors that cancel","States the general rule (molecule polarity = vector sum)"]},
{id:"WR-CH1-004",topic:"hybrid",type:"written",diff:2,prompt:"<b>Derive, don't recall:</b> the hybridization of N in NH₃ and the approximate H–N–H angle — and why the angle is smaller than the perfect tetrahedral angle.",
 model:"N has <b>4 electron domains</b> (3 bonds + 1 lone pair) → <b>sp³</b>, electron geometry tetrahedral. The lone pair repels more strongly than bonding pairs, compressing H–N–H to ≈<b>107°</b> (vs 109.5°).",
 rubric:["Counts 4 domains including the lone pair","sp³ from domain count (not memorized)","≈107° with lone-pair-repulsion reasoning"]},
{id:"WR-CH1-005",topic:"lewis",type:"written",diff:3,prompt:"<b>Find the error:</b> a student draws CO₂ as O–C≡O (one single bond, one triple bond). The electron budget (16) checks out and every atom has an octet. What's wrong, and what's the fix? Show the formal charges that prove it.",
 model:"Octets are legal, but the formal charges aren't minimal: single-bonded O = 6−6−1 = <b>−1</b>; triple-bonded O = 6−2−3 = <b>+1</b>; C = 0. The symmetric <b>O=C=O</b> gives ALL atoms FC = 0 (each O: 6−4−2=0). Rule: among octet-legal structures, the best minimizes formal charge — budget + octets alone don't certify a structure.",
 rubric:["Computes FCs on both oxygens (−1 and +1) with numbers","Shows O=C=O gives all zeros","States the minimize-formal-charge rule"]},
{id:"WR-CH1-006",topic:"imf",type:"written",diff:2,prompt:"<b>Rank and justify:</b> order CH₄, CH₃Cl, and CH₃OH by boiling point (lowest→highest), naming the dominant intermolecular force for each.",
 model:"<b>CH₄ &lt; CH₃Cl &lt; CH₃OH.</b> CH₄: London dispersion only (bp −161°C). CH₃Cl: polar C–Cl → dipole–dipole + dispersion (−24°C). CH₃OH: O–H → <b>hydrogen bonding</b>, the strongest of the three (65°C).",
 rubric:["Correct order","Each species matched to its strongest IMF","H-bond requirement (H on N/O/F) stated or implied"]},

/* ===== v3.3 LECTURE 1 BANK (Ciesla lecture, Thu 2026-08-20 — built from Gabe's transcript) =====
   Every item below maps to something she EMPHASIZED or named as a trap. */
{id:"l1s1",topic:"hybrid",type:"mc",diff:2,prompt:"Pi (π) bonds are formed by:",choices:["Side-on overlap of two UNhybridized p orbitals","Head-on overlap of hybridized orbitals","Side-on overlap of hybridized orbitals","Overlap of two s orbitals"],answer:0,why:"σ bonds = head-on overlap of <b>hybridized</b> orbitals; π bonds = side-on overlap of <b>unhybridized p</b> orbitals (they must be in the same plane; there's a node at the nucleus plane). Lecture 8/20: she called this a classic glitch."},
{id:"l1s2",topic:"hybrid",type:"mc",diff:1,prompt:"Hydrogen forms its sigma bonds using:",choices:["Its 1s orbital — H is never hybridized","An sp orbital","An sp³ orbital","An unhybridized p orbital"],answer:0,why:"<b>Hydrogen is the exception</b>: it always bonds with its 1s orbital, never hybridized. Every other σ bond in Ch 1 uses hybridized orbitals."},
{id:"l1s5",topic:"hybrid",type:"mc",diff:2,prompt:"A LOCALIZED lone pair sits in:",choices:["A hybridized orbital matching the hybridization of its atom","An unhybridized p orbital, always","An sp³ orbital, always","The 1s orbital"],answer:0,why:"Her exact rule (8/20): <b>localized lone pairs live in hybridized orbitals</b> — and WHICH one is set by the hybridization of the atom they sit on. sp³ N → lone pair in sp³ orbital; sp² N → sp². In Ch 1, every lone pair you'll be asked about is localized. (Delocalized pairs arrive in Ch 2.)"},
{id:"l1s3",topic:"hybrid",type:"text",diff:2,prompt:"A nitrogen is sp² hybridized and carries a localized lone pair. Which orbital is the lone pair in? (type like sp2)",answer:"sp2",why:"Lone pair orbital = the atom's hybridization → <b>sp²</b>. She said: 'you need to be able to tell me which orbital the lone pair is in.'"},
{id:"l1s4",topic:"hybrid",type:"text",diff:2,prompt:"An sp³ nitrogen (3 bonds + 1 lone pair) holds its lone pair in which orbital? (type like sp3)",answer:"sp3",why:"Same rule: localized lone pair lives in a hybridized orbital matching its atom → <b>sp³</b>."},
{id:"l1g1",topic:"hybrid",type:"num",diff:1,prompt:"Bond angle (degrees) for a trigonal planar electron geometry?",answer:120,why:"Tetrahedral 109.5° · trigonal planar <b>120°</b> · linear 180°."},
{id:"l1g2",topic:"hybrid",type:"mc",diff:2,prompt:"NH₃'s H–N–H bond angle is:",choices:["≈107° — the lone pair takes more volume and compresses the bonds below 109.5°","Exactly 109.5° — 4 electron domains","120° — three atoms attached","90° — p orbitals"],answer:0,why:"Lone pairs occupy MORE volume than bonding pairs → repulsion pushes the N–H bonds together → <b>less than 109.5°</b> (~107°; water ~105° with two lone pairs). She requires: know it's <b>less than 109.5</b>, not the exact numbers."},
{id:"l1g3",topic:"hybrid",type:"mc",diff:3,prompt:"SO₂: what is the O–S–O bond angle?",choices:["Slightly LESS than 120° — steric number 3 (sp², trigonal planar) with a lone pair compressing","109.5° — like water","Exactly 120°","180° — linear like CO₂"],answer:0,why:"Her named trap: students answer 109.5 by pattern-matching to H₂O. Work it: S has 2 bonded atoms + 1 lone pair → steric number <b>3</b> → sp², trigonal planar electron geometry, bent shape → base angle 120°, compressed slightly below by the lone pair. <b>To get a bond angle you MUST go through the geometry.</b>"},
{id:"l1p1",topic:"polarity",type:"mc",diff:3,prompt:"ΔEN for C–Br is 0.3 (below the 0.5 'pure covalent' cutoff). The C–Br bond is:",choices:["Polar — carbon bonded to ANY halogen is always polar, regardless of ΔEN","Pure covalent — ΔEN < 0.5","Ionic — Br is much bigger","Nonpolar — the electrons are shared equally"],answer:0,why:"Her TOP TIP, verbatim: <b>'carbon bonded to a halogen is ALWAYS a polar bond, regardless of the ΔEN.'</b> ΔEN alone oversimplifies — real polarity is charge distribution over DISTANCE, and Br is a big atom. Named trap: assessments hand you EN values hoping you'll calculate and answer 'pure covalent.'"},
{id:"l1p2",topic:"polarity",type:"num",diff:1,prompt:"Below what ΔEN (course values) is a bond considered 'pure covalent'? (e.g. 0.4)",answer:0.5,why:"Course cutoffs: ΔEN &lt; <b>0.5</b> pure covalent · 0.5–1.7 polar covalent · &gt; 1.7 ionic. (Use OUR values — homework is based on them.) But remember the C–halogen override."},
{id:"l1p4",topic:"polarity",type:"mc",diff:2,prompt:"CCl₄ (carbon tetrachloride) has four polar C–Cl bonds. The MOLECULE is:",choices:["Nonpolar — four identical bond dipoles on a tetrahedron cancel (sum to zero)","Polar — it contains polar bonds","Ionic","Nonpolar — C–Cl bonds aren't polar"],answer:0,why:"Bond polarity ≠ molecular polarity. Four identical vectors on a tetrahedron <b>sum to zero</b> → no net dipole → nonpolar molecule, despite four polar bonds. The four cancel cases: tetrahedral-identical (CCl₄), trigonal-planar-identical (BF₃), linear (CO₂), and trans-disubstituted alkenes."},
{id:"l1p5",topic:"polarity",type:"mc",diff:2,prompt:"Swap one Cl of CCl₄ for Br → CCl₃Br. Now the molecule is:",choices:["Polar — the C–Br dipole is smaller than C–Cl, so the vectors no longer cancel","Still nonpolar — it's still tetrahedral","Nonpolar — Br isn't electronegative enough","Ionic"],answer:0,why:"Cancellation requires <b>identical</b> atoms at every position. C–Br has a smaller bond dipole than C–Cl (Cl is more electronegative), so the vector sum ≠ 0 → polar."},
{id:"l1p6",topic:"polarity",type:"mc",diff:2,prompt:"BF₃ (trigonal planar, three polar B–F bonds) is:",choices:["Nonpolar — three identical dipoles at 120° sum to zero","Polar — F is the most electronegative element","Polar — boron is electron-poor","Ionic"],answer:0,why:"Trigonal planar with the <b>same atom at every position</b> → vectors cancel → nonpolar. Her classic example (hard to build with carbon, easy with boron)."},
{id:"l1p7",topic:"polarity",type:"mc",diff:3,prompt:"1,2-dichloroethene, two isomers:<svg viewBox='0 0 330 115' width='300' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='55' y1='53' x2='105' y2='53'/><line x1='55' y1='59' x2='105' y2='59'/><line x1='55' y1='56' x2='30' y2='31'/><line x1='55' y1='56' x2='30' y2='83'/><line x1='105' y1='56' x2='130' y2='31'/><line x1='105' y1='56' x2='130' y2='83'/><line x1='215' y1='53' x2='265' y2='53'/><line x1='215' y1='59' x2='265' y2='59'/><line x1='215' y1='56' x2='190' y2='31'/><line x1='215' y1='56' x2='190' y2='83'/><line x1='265' y1='56' x2='290' y2='31'/><line x1='265' y1='56' x2='290' y2='83'/></g><g font-size='13' fill='currentColor'><text x='12' y='28'>Cl</text><text x='22' y='95'>H</text><text x='133' y='28'>H</text><text x='128' y='95'>Cl</text><text x='68' y='108'>A</text><text x='172' y='28'>Cl</text><text x='182' y='95'>H</text><text x='293' y='28'>Cl</text><text x='288' y='95'>H</text><text x='228' y='108'>B</text></g></svg>Which isomer is NONPOLAR?",choices:["A (trans) — the two C–Cl dipoles point opposite ways and cancel","B (cis) — both Cl on the same side","Both are nonpolar","Neither — C–Cl bonds are polar so both molecules are polar"],answer:0,why:"<b>A is trans</b> (Cl on opposite sides): equal C–Cl vectors in opposite directions sum to zero → nonpolar. <b>B is cis</b>: both dipoles point the same general way → net dipole → polar. Containing polar bonds is necessary but NOT sufficient for a polar molecule."},
{id:"l1i1",topic:"imf",type:"mc",diff:2,prompt:"When water boils, what breaks?",choices:["Intermolecular forces only — every H₂O molecule stays intact","The O–H covalent bonds","Both the H-bonds and the O–H bonds","The hydrogen turns to gas first"],answer:0,why:"Her top emphasis: <b>phase changes break INTERMOLECULAR FORCES, never bonds.</b> Liquid→gas hexanol is still hexanol — nothing happened to the structure. Writing 'the bonds are harder to break' on an exam explanation = wrong."},
{id:"l1i2",topic:"imf",type:"mc",diff:3,prompt:"cis- and trans-1,2-dichloroethene (same molecular formula — stereoisomers). Which boils higher, and why?",choices:["cis — it's polar, so it has dipole–dipole ON TOP of dispersion; trans's dipoles cancel","trans — it's more symmetric so it packs better","They boil at the same temperature — same mass","cis — it has hydrogen bonding"],answer:0,why:"Same formula → mass is irrelevant. Neither has H-bonding (no H on N/O). trans: dipoles cancel → nonpolar → dispersion only. cis: net dipole → <b>dipole–dipole + dispersion</b> → stronger IMFs → higher boiling point. This was her closing worked example."},
{id:"l1i3",topic:"imf",type:"mc",diff:2,prompt:"'Hydrogen bonding' is:",choices:["An intermolecular ATTRACTION between an H (δ+) on N/O and a lone pair on another N/O — not a covalent bond","A covalent bond between hydrogen atoms","Any bond containing hydrogen","A bond between H and any electronegative atom, including C"],answer:0,why:"'And by the way, it's not a bond.' Requires H <b>directly bonded</b> to N or O (F in organic molecules is bonded to C, so no H-bonding through it). Strength order: H-bonding &gt; dipole–dipole &gt; dispersion (which everything has)."},
{id:"l1b1",topic:"bondline",type:"num",diff:1,prompt:"Bond-line structure (each line-end/vertex = a carbon; H's on carbon are NOT drawn):<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>How many implicit hydrogens are on <b>C4</b>?",answer:3,why:"C4 shows ONE bond (to C3). Carbon wants 4 → <b>3 hidden H's</b> (a CH₃). Reading rule: carbon's H's are never drawn; you supply them by counting to four."},
{id:"l1b2",topic:"bondline",type:"num",diff:2,prompt:"Same structure:<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>How many implicit hydrogens are on <b>C2</b>?",answer:1,why:"C2 has a DOUBLE bond to C1 (counts as 2) + a single bond to C3 = 3 bonds shown → <b>1 hidden H</b>. Her homework for next class is exactly this skill."},

/* v3.3 written items — lecture 1 */
{id:"WR-CH1-007",topic:"hybrid",type:"written",diff:3,prompt:"<b>Lone-pair orbitals:</b> a molecule has two nitrogens — N1 has three single bonds + 1 lone pair; N2 has a double bond, a single bond + 1 lone pair. For EACH nitrogen: give its hybridization AND name the orbital holding its lone pair. Then state the general rule.",
 model:"<b>N1:</b> 4 electron domains (3 bonds + 1 LP) → <b>sp³</b>; its lone pair is in an <b>sp³ orbital</b>. <b>N2:</b> 3 domains (double bond counts as ONE domain, + single bond + LP) → <b>sp²</b>; lone pair in an <b>sp² orbital</b>. <b>Rule:</b> a localized lone pair lives in a hybridized orbital, and WHICH one is set by the hybridization of the atom it sits on.",
 rubric:["Both hybridizations derived from domain count (double bond = one domain)","Lone-pair orbital = atom's hybridization, stated as the rule","sp³/sp² assigned to the right nitrogens"]},
{id:"WR-CH1-008",topic:"polarity",type:"written",diff:2,prompt:"<b>The C–Br trap:</b> ΔEN(C–Br) = 0.3, below the 0.5 cutoff — 'pure covalent' by the numbers. Is the C–Br bond polar? Explain what the ΔEN method misses.",
 model:"<b>Polar.</b> Course rule: carbon bonded to ANY halogen is always polar, regardless of ΔEN. The cutoff method oversimplifies: bond polarity is really <b>charge distribution over distance</b> — bromine is a much larger atom than carbon, so even a small EN difference produces a real dipole. (Related: C–Li at ΔEN 1.5 is drawn BOTH as ionic and polar covalent — it's a spectrum.)",
 rubric:["Answers polar despite the cutoff","States the C–halogen-always-polar rule","Mentions size / charge-over-distance as what ΔEN misses"]},
{id:"WR-CH1-009",topic:"lewis",type:"written",diff:3,prompt:"<b>SO₂ from scratch:</b> draw a Lewis structure for SO₂ (S and O are both group 6). Then give the electron geometry and the O–S–O bond angle, justified. (Two different valid structures exist — name both if you can.)",
 model:"<b>Structure 1 (minimized FC, expanded octet):</b> O=S=O with one lone pair on S — S holds 10 electrons, allowed because sulfur is period 3. <b>Structure 2:</b> O=S–O⁻ with S⁺ (octet kept, charges +1/−1). BOTH are valid and give the same answer: S has 2 bonded atoms + 1 lone pair → steric number <b>3</b> → sp², <b>trigonal planar electron geometry</b>, bent molecular shape → bond angle just <b>under 120°</b> (lone pair compression). NOT 109.5 — that's the H₂O pattern-match trap.",
 rubric:["Valid Lewis structure including the lone pair on S","Steric number 3 → trigonal planar (not tetrahedral)","Angle <120° with lone-pair justification — and not 109.5"]},
{id:"WR-CH1-010",topic:"imf",type:"written",diff:2,prompt:"<b>Exam-wording drill:</b> molecule Y boils higher than molecule X (same formula; Y is polar, X is not). Write TWO explanations: (1) the one that LOSES points, (2) the full-credit version.",
 model:"<b>(1) Loses points:</b> 'Y's bonds are harder to break.' — wrong because phase changes never break covalent bonds. <b>(2) Full credit:</b> 'Y has a net dipole, so it has dipole–dipole forces in addition to dispersion; X's bond dipoles cancel, leaving dispersion only. Stronger INTERMOLECULAR forces require more energy to separate the molecules, so Y has the higher boiling point. The molecules themselves are unchanged.'",
 rubric:["Identifies 'breaking bonds' as the losing phrase","Full-credit version names the specific IMF difference","Links IMF strength → energy → boiling point, molecules intact"]},
{id:"WR-CH1-011",topic:"bondline",type:"written",diff:2,prompt:"<b>Add every hydrogen:</b> for the bond-line structure below, list the number of hydrogens on EACH carbon, then give the molecular formula.<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>",
 model:"Count each carbon to 4 bonds: <b>C1</b>: double bond (2) → <b>2 H</b>. <b>C2</b>: double (2) + single to C3 (1) = 3 → <b>1 H</b>. <b>C3</b>: two singles → <b>2 H</b>. <b>C4</b>: one single → <b>3 H</b>. Total: <b>C₄H₈</b> (1-butene). Rule: H's on carbon are implicit; H's on N/O/S are always drawn.",
 rubric:["Every carbon brought to exactly 4 bonds","Correct per-carbon counts (2,1,2,3)","Correct formula C₄H₈"]},
/* ---- v3.3 TUTORIAL-STANDARD SET — modeled on Ciesla's Ch-1 tutorial + official quiz scope ---- */
{id:"T-CH1-01",topic:"lewis",type:"mc",diff:1,prompt:"Two compounds are <b>constitutional isomers</b>. Which MUST be true?",choices:["Same molecular formula, different connectivity of atoms","Same connectivity, different 3-D arrangement","Same properties, different formulas","They are the same compound drawn differently"],answer:0,why:"Constitutional isomers share a molecular formula but connect their atoms differently — and structure (connectivity), not formula, determines properties. (Same connectivity/different 3-D = stereoisomers.)"},
{id:"T-CH1-02",topic:"lewis",type:"mc",diff:1,prompt:"Which bonding pattern is <b>WRONG</b> for a neutral atom in an organic molecule?",choices:["C — 4 bonds","N — 3 bonds + 1 lone pair","O — 2 bonds + 2 lone pairs","F — 2 bonds + 2 lone pairs"],answer:3,why:"Neutral halogens form 1 bond + 3 lone pairs. Memorize the neutral patterns: C=4 bonds · N=3+1LP · O=2+2LP · H=1 · halogen=1+3LP. Any deviation means a formal charge."},
{id:"T-CH1-03",topic:"hybrid",type:"mc",diff:2,prompt:"Rank C–H bond strength: ethyne (HC≡CH), ethene (H₂C=CH₂), ethane (H₃C–CH₃).",choices:["ethyne > ethene > ethane","ethane > ethene > ethyne","ethene > ethyne > ethane","all equal — they're all C–H bonds"],answer:0,why:"More s-character = shorter, stronger bond. sp (50% s, ethyne) > sp² (33%, ethene) > sp³ (25%, ethane). s orbitals hold electrons closer to the nucleus."},
{id:"T-CH1-04",topic:"hybrid",type:"mc",diff:1,prompt:"A C=C double bond consists of:",choices:["1 σ bond + 1 π bond","2 σ bonds","2 π bonds","1 σ + 2 π"],answer:0,why:"Every bond's FIRST connection is a σ (head-on overlap of hybridized orbitals). The second is a π — side-on overlap of unhybridized p orbitals. π is the weaker of the two."},
{id:"T-CH1-05",topic:"hybrid",type:"mc",diff:2,prompt:"A p orbital has:",choices:["two lobes of opposite phase separated by a node","one spherical lobe, no nodes","two lobes of the same phase","a node only at infinite distance"],answer:0,why:"p orbitals are dumbbells: two lobes of opposite phase (+/−) with a node (zero electron density) at the nucleus. Bonding requires CONSTRUCTIVE overlap — same-phase lobes meeting."},
{id:"T-CH1-06",topic:"polarity",type:"mc",diff:1,prompt:"On an electrostatic potential map of water, the <b>red</b> region sits on:",choices:["the oxygen (high electron density, δ−)","the hydrogens (δ+)","the O–H bond midpoints","nowhere — water is nonpolar"],answer:0,why:"EPM color code: red = electron-rich (δ−), blue = electron-poor (δ+). O is the most electronegative atom in water, so red concentrates there; the H end reads blue."},
{id:"T-CH1-07",topic:"imf",type:"mc",diff:2,prompt:"Pentane and neopentane (2,2-dimethylpropane) are both C₅H₁₂. Which boils higher, and why?",choices:["Pentane — linear shape gives more surface contact for London forces","Neopentane — branching adds strain","They boil identically — same formula, same mass","Neopentane — spheres pack tighter"],answer:0,why:"Same mass → same-strength question comes down to CONTACT AREA. Linear pentane molecules touch along their whole length (more LDF); branched neopentane is ball-shaped with less contact. Branching LOWERS boiling point."},
{id:"T-CH1-08",topic:"imf",type:"mc",diff:1,prompt:'"Like dissolves like": which pair actually mixes?',choices:["CH₃OH and H₂O — both hydrogen-bond","hexane and H₂O — both contain H","NaCl and hexane — opposites attract","CO₂ and H₂O — both contain oxygen"],answer:0,why:"Polar/H-bonding dissolves polar/H-bonding; nonpolar dissolves nonpolar. Methanol H-bonds with water. Hexane (nonpolar, LDF-only) can't pay the energy cost of breaking water's H-bond network."},
{id:"T-CH1-09",topic:"imf",type:"mc",diff:2,prompt:"Why does oil NOT dissolve in water?",choices:["Mixing would break water's H-bonds but oil offers only weak LDF in return","Oil is denser than water","Oil molecules repel water electrostatically","Oil's covalent bonds can't break in water"],answer:0,why:"Solubility is an energy trade. Water gives up strong H-bonding interactions to make room; nonpolar oil can only repay with weak dispersion forces. Bad trade → no mixing. (No covalent bonds break in dissolving.)"},
{id:"T-CH1-10",topic:"valence",type:"mc",diff:2,prompt:"On the potential-energy curve for H + H approaching, the bond length corresponds to:",choices:["the minimum of the curve — attraction and repulsion balanced","the point where PE = 0","the closest possible approach","where attraction is strongest"],answer:0,why:"Bonds form because energy is RELEASED as atoms approach (attraction between each nucleus and both electrons). Too close, nucleus–nucleus repulsion spikes. The PE minimum = most stable separation = bond length."},
{id:"WR-CH1-101",topic:"lewis",type:"written",diff:3,prompt:"<b>Tutorial standard:</b> C₃H₉N has FOUR constitutional isomers. Describe (or draw in your notebook) all four — name the connectivity of each.<br><span class='muted'>Hint: move the N through the chain: end, middle, in-chain, fully branched.</span>",

{id:"WR-CH1-102",topic:"polarity",type:"written",diff:2,prompt:"<b>Tutorial standard:</b> label δ+ and δ− in each bond and justify: (a) Cl–P (b) C–Br (c) H–N.",
 model:"(a) Cl is more electronegative than P → <b>Cl δ−, P δ+</b>. (b) <b>Br δ−, C δ+</b> — and remember: C bonded to ANY halogen counts as a polar bond even when ΔEN looks small (C–Br ΔEN ≈ 0.3). (c) N is more electronegative than H → <b>N δ−, H δ+</b> (this polarity is what enables hydrogen bonding).",
 rubric:["δ− on the more electronegative atom in all three","C–halogen treated as polar despite small ΔEN","Reasoning references electronegativity, not memorization"]},
{id:"WR-CH1-103",topic:"polarity",type:"written",diff:3,prompt:"<b>Tutorial standard:</b> CHCl₃ has a LARGER molecular dipole moment than CFCl₃. Use the 3-D (tetrahedral) structures and bond dipoles to explain why.",
 model:"Both are tetrahedral. In <b>CHCl₃</b>, the three C–Cl dipoles sum to a net vector and the C–H bond adds almost no opposing dipole → large net dipole. In <b>CFCl₃</b>, the C–F bond is strongly polar in the OPPOSITE direction of the three C–Cl sum — F pulls against the chlorines, partially canceling → smaller net dipole. Molecular polarity is a VECTOR SUM: an opposing strong dipole shrinks the total.",
 rubric:["Treats bond dipoles as vectors in 3-D","C–F opposes the C–Cl resultant in CFCl₃","Concludes partial cancellation → smaller net dipole"]},
{id:"WR-CH1-104",topic:"hybrid",type:"written",diff:3,prompt:"<b>Tutorial standard (real molecule):</b> in tert-butyl isonitrile, (CH₃)₃C–N⁺≡C⁻ — (a) hybridization of the central C of the tert-butyl group, the N, and the terminal C; (b) which orbital holds the terminal carbon's lone pair; (c) predict the C–N–C angle.",

 rubric:["Hybridizations from domain counts (sp³ / sp / sp)","Lone pair placed in the atom's hybrid orbital (sp)","180° from sp nitrogen"]},
{id:"WR-CH1-105",topic:"hybrid",type:"written",diff:3,prompt:"<b>Tutorial standard (real molecule):</b> in the isonitrile dihalide (CH₃)₃C–N=CCl₂ the N carries a lone pair — (a) hybridization of N; (b) which orbital holds N's lone pair; (c) predict the C–N=C angle.",

{id:"iso2",topic:"bondline",type:"mc",diff:1,prompt:"Both structures below are C₄H₁₀:<svg viewBox='0 0 260 90' width='240' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='12' y1='60' x2='38' y2='32'/><line x1='38' y1='32' x2='64' y2='60'/><line x1='64' y1='60' x2='90' y2='32'/><line x1='150' y1='62' x2='176' y2='34'/><line x1='176' y1='34' x2='202' y2='62'/><line x1='176' y1='34' x2='176' y2='8'/></g><g font-size='12' fill='currentColor'><text x='44' y='82'>A</text><text x='170' y='82'>B</text></g></svg>They are:",choices:["Constitutional isomers — same formula, different connectivity (butane vs isobutane)","The same molecule drawn differently","Stereoisomers","Not isomers — different formulas"],answer:0,why:"A = butane (4-carbon chain). B = isobutane/2-methylpropane (3-carbon chain + branch). Same C₄H₁₀, <b>different connectivity</b> → constitutional isomers. Different compounds, different boiling points."},
{id:"iso8",topic:"bondline",type:"mc",diff:2,prompt:"Both structures below are C₅H₁₂:<svg viewBox='0 0 280 95' width='250' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='10' y1='60' x2='34' y2='34'/><line x1='34' y1='34' x2='58' y2='60'/><line x1='58' y1='60' x2='82' y2='34'/><line x1='82' y1='34' x2='106' y2='60'/><line x1='150' y1='30' x2='176' y2='56'/><line x1='176' y1='56' x2='202' y2='30'/><line x1='202' y1='30' x2='228' y2='56'/><line x1='228' y1='56' x2='228' y2='84'/></g><g font-size='12' fill='currentColor'><text x='52' y='84'>A</text><text x='185' y='84'>B</text></g></svg>They are:",choices:["The SAME molecule — both are an unbranched 5-carbon chain (pentane), just drawn with different kinks","Constitutional isomers","Stereoisomers","Different compounds entirely"],answer:0,why:"<b>Trap.</b> Trace the connectivity: both are C–C–C–C–C with no branches — the drawing's kinks mean nothing. Same connectivity = <b>same compound</b> (pentane). Before calling two drawings isomers, CHECK the connectivity, not the shape on paper."},
{id:"iso3",topic:"lewis",type:"mc",diff:2,prompt:"cis- and trans-1,2-dichloroethene are:",choices:["STEREOisomers — same connectivity, different 3-D arrangement (NOT constitutional)","Constitutional isomers — the Cl's are in different places","The same compound","Not isomers — different formulas"],answer:0,why:"Every atom is bonded to the same partners in both — only the 3-D arrangement across the rigid C=C differs → <b>stereoisomers</b>. (In lecture 8/20 she said 'constitutional' then corrected herself to 'stereoisomers' — this exact distinction.) Constitutional requires DIFFERENT connectivity."},
{id:"iso4",topic:"lewis",type:"num",diff:1,prompt:"How many constitutional isomers exist for C₄H₁₀?",answer:2,why:"<b>2</b>: butane (straight chain) and isobutane/2-methylpropane (branched). That's the whole set."},

{id:"iso6",topic:"lewis",type:"mc",diff:2,prompt:"Ethanol (CH₃CH₂–OH) and dimethyl ether (CH₃–O–CH₃) are both C₂H₆O. They are:",choices:["Constitutional isomers — and their boiling points differ by over 100 °C","The same compound","Stereoisomers","Resonance structures"],answer:0,why:"Same formula, different connectivity (O–H vs C–O–C) → constitutional isomers with different FUNCTIONAL GROUPS. Consequence: ethanol H-bonds (bp 78 °C); dimethyl ether can't (no O–H; bp −24 °C). Constitutional isomers can have wildly different properties — this pair is the classic exam example."},

/* v3.2: measured difficulty — miss rate + guess rate + time vs topic median from the
   event log, blended with the static prior until n is meaningful (weight n/(n+4)). */
function qDiffM(q){
  const ev=(S.attempts||[]).filter(a=>a.id===q.id); const n=ev.length; const prior=qDiff(q);
  if(!n) return prior;
  const miss=ev.filter(a=>!a.ok).length/n, guess=ev.filter(a=>a.g).length/n;
  const med=a=>{const d=a.filter(x=>x.d>0).map(x=>x.d).sort((x,y)=>x-y); return d.length?d[Math.floor(d.length/2)]:null;};
  const m1=med(ev), m2=med((S.attempts||[]).filter(a=>a.t===q.topic));
  let m=1+2*miss+guess+((m1&&m2&&m1>m2*1.5)?0.5:0);
  const w=n/(n+4);
  return Math.max(1,Math.min(3,Math.round((w*m+(1-w)*prior)*10)/10));
}
function logAttempt(q,ok,guessed,D){
  const secs=D&&D._shownAt?Math.min(600,Math.round((Date.now()-D._shownAt)/1000)):0;
  S.attempts.push({id:q.id,ts:Date.now(),ok:ok?1:0,g:guessed?1:0,d:secs,m:(D&&D.topic)||"?",t:q.topic});
  if(S.attempts.length>5000) S.attempts=S.attempts.slice(-5000);
}

  lewis: { primer:"A Lewis structure is a bookkeeping map of every valence electron in a molecule. The 6-step method: (1) count total valence electrons (add 1 per negative charge, subtract 1 per positive), (2) pick the central atom (least electronegative, never H), (3) connect with single bonds, (4) fill lone pairs to give outer atoms octets, (5) put leftovers on the center, (6) if the center is short, convert a neighbor's lone pair into a double/triple bond. The whole game is: every electron accounted for, everyone gets an octet (except H, which stops at 2).",
    klein:"Klein 5e §1.3–1.4 (Lewis structures, formal bonds)",
    links:[{l:"Khan Academy — chemical bonds & Lewis structures",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds"},{l:"The Organic Chemistry Tutor — how to draw Lewis structures",u:"https://www.youtube.com/watch?v=6unef5Hz6SU"}] },
  formal: { primer:"Formal charge = (the atom's group number) − (its lone-pair electrons) − (its number of bonds). It answers 'does this atom own more or fewer electrons than a neutral version of itself?' Key mental model, the one thing to lock in: the atom's group-number valence NEVER changes for the charge — the ion's extra/missing electron shows up in the STRUCTURE (a lone pair added or removed), never by bumping the valence number. O is always 6, N always 5.",
    klein:"Klein 5e §1.4 (formal charges)",
    links:[{l:"Khan Academy — formal charge & dot structures",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds/copy-of-dot-structures/v/formal-charge-and-dot-structures"},{l:"The Organic Chemistry Tutor — formal charge",u:"https://www.youtube.com/watch?v=C2l-76VP8s0"}] },
  polarity: { primer:"Two different questions, don't conflate them. (1) Is a BOND polar? — yes if the two atoms differ in electronegativity (EN order to know: F > O > N ≈ Cl > C ≈ H). (2) Is the MOLECULE polar? — depends on GEOMETRY: if the bond dipoles cancel by symmetry (like linear CO₂) the molecule is nonpolar even with polar bonds; if they don't cancel (bent H₂O) it's polar. Geometry decides #2. This is the single most-tested distinction in the topic.",
    klein:"Klein 5e §1.5–1.11 (electronegativity, bond & molecular polarity)",
    links:[{l:"Khan Academy — chemical bonds (electronegativity, polarity)",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds"},{l:"The Organic Chemistry Tutor — polar or nonpolar",u:OCT_ALLINONE}] },
  hybrid: { primer:"Count ELECTRON DOMAINS on an atom = (number of atoms bonded to it) + (number of lone pairs). A double or triple bond counts as ONE domain. Then: 2 domains → sp, linear, 180°; 3 → sp², trigonal planar, 120°; 4 → sp³, tetrahedral, 109.5°. VSEPR shape names only the ATOMS (so sp³ N with a lone pair = 'trigonal pyramidal', not tetrahedral). The lone pair counts for hybridization but is invisible in the shape name — that's the classic trap.",
    klein:"Klein 5e §1.9–1.10 (VSEPR geometry, orbital hybridization)",
    links:[{l:"Khan Academy — chemical bonds (hybridization, VSEPR)",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds"},{l:"The Organic Chemistry Tutor — hybridization & geometry",u:OCT_ALLINONE}] },
  imf: { primer:"Intermolecular forces are the attractions BETWEEN molecules (not the bonds inside them) — they set boiling point, solubility, etc. Three, weakest to strongest: London dispersion (in everything; scales with size/surface area) < dipole-dipole (polar molecules) < hydrogen bonding (only when H is bonded to N, O, or F, AND there's an N/O/F lone pair to accept). To rank boiling points: identify the strongest force each molecule can do. H-bonding usually wins; among nonpolar molecules, bigger = stronger dispersion = higher bp.",
    klein:"Klein 5e §1.12–1.13 (intermolecular forces, physical properties)",
    links:[{l:"Khan Academy — states of matter & intermolecular forces",u:"https://www.khanacademy.org/science/chemistry/states-of-matter-and-intermolecular-forces"},{l:"The Organic Chemistry Tutor — intermolecular forces",u:"https://www.youtube.com/watch?v=QdwzMPwPA3I"}] },
};

   Six species, cold, inputs labeled: bonds → lone pairs → FC for the key atom.
   A run is CLEAN only if all 18 inputs are right first try. Two clean runs on
   two different days = mastered. Draw each one on paper BEFORE answering. */
const MASTERY_FC = [
  {name:"OH⁻ (hydroxide)",      atom:"O", bonds:1, lp:3, fc:-1},
  {name:"H₃O⁺ (hydronium)",     atom:"O", bonds:3, lp:1, fc:1},
  {name:"NH₄⁺ (ammonium)",      atom:"N", bonds:4, lp:0, fc:1},
  {name:"CH₃O⁻ (methoxide)",    atom:"O", bonds:1, lp:3, fc:-1},
  {name:"R₃C⁺ (a carbocation)", atom:"C", bonds:3, lp:0, fc:1},
  {name:"R₃C⁻ (a carbanion)",   atom:"C", bonds:3, lp:1, fc:-1},
];
function startMastery(){
  S.mastery = {queue: shuffle(MASTERY_FC), i:0, clean:true};
  go("mastery");
}
VIEWS.mastery = (v) => {
  const M = S.mastery;
  if (!M){ go("home"); return; }
  const mastered = new Set(S.fcMastery).size>=2;
  if (M.i>=M.queue.length){ // run over
    const c = el("div",{class:"card"+(M.clean?" teal":"")});
    if (M.clean){
      confetti();
      const t=todayStr(); if(!S.fcMastery.includes(t)) S.fcMastery.push(t); save();
      const days=new Set(S.fcMastery).size;
      c.innerHTML='<span class="tag gold">CLEAN RUN — 6/6, all inputs</span><h2>'+(days>=2?"🏅 MASTERED. Two clean days on record ("+[...new Set(S.fcMastery)].join(", ")+").":"Clean day 1 banked ("+t+"). One more clean run on a DIFFERENT day and formal charge is officially mastered.")+'</h2><p class="muted">Per the audit rule: drill percentages never count as mastery — only this does.</p>';
    } else {
      c.innerHTML='<span class="tag coral">Not clean</span><h2>Run finished with misses</h2><p>No shame, real data: the missed inputs are the exact gap. Reread the charge model (a − is one extra paired-up electron; a + is one missing), then retry — a clean run requires every input right on the first try.</p>';
    }
    const row=el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"});
    row.appendChild(el("button",{class:"btn gold",onclick:()=>startMastery()},"Run again"));
    row.appendChild(el("button",{class:"btn ghost",onclick:()=>{S.mastery=null; go("home");}},"Home"));
    c.appendChild(row); v.appendChild(c); return;
  }
  const sp = M.queue[M.i];
  const c = el("div",{class:"card"});
  c.innerHTML='<span class="tag violet">Mastery check · '+(M.i+1)+'/6'+(mastered?' · 🏅':'')+'</span>'+
    '<h2>'+sp.name+' — the '+sp.atom+'</h2>'+
    '<p class="muted">Draw it on paper first. Then label the inputs — no formula until the last box.</p>';
  const mkRow=(label,id)=>'<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="min-width:210px;font-weight:700">'+label+'</span><input id="'+id+'" type="number" inputmode="numeric" style="width:90px;padding:8px;border:2px solid var(--ink);border-radius:8px;font-family:var(--mono);font-size:1rem"></div>';
  c.innerHTML += mkRow("Bonds on the "+sp.atom+":","m_b") + mkRow("Lone PAIRS on the "+sp.atom+":","m_l") + mkRow("Formal charge:","m_f");
  const fb=el("div");
  const btn=el("button",{class:"btn teal",onclick:()=>{
    const b=parseInt($("#m_b").value,10), l=parseInt($("#m_l").value,10), f=parseInt($("#m_f").value,10);
    if ([b,l,f].some(x=>Number.isNaN(x))){ fb.innerHTML='<p class="muted">Fill all three boxes.</p>'; return; }
    const ok = b===sp.bonds && l===sp.lp && f===sp.fc;
    if (!ok) M.clean=false;
    fb.innerHTML = ok
      ? '<p style="color:var(--ok);font-weight:700">✓ All three inputs right.</p>'
      : '<p style="color:var(--coral);font-weight:700">✗ Correct: '+sp.bonds+' bond(s), '+sp.lp+' LP, FC '+(sp.fc>0?"+":"")+sp.fc+'.</p><p class="muted">FC = '+VALENCE[sp.atom]+' − '+(2*sp.lp)+' (LP e⁻) − '+sp.bonds+' (bonds) = '+(sp.fc>0?"+":"")+sp.fc+'</p>';
    btn.replaceWith(el("button",{class:"btn gold",onclick:()=>{M.i++; render();}},"Next →"));
  }},"Check all three");
  c.appendChild(btn); c.appendChild(fb);
  v.appendChild(c);
  v.appendChild(el("div",{class:"card cream"},'<p class="muted">Status: '+new Set(S.fcMastery).size+'/2 clean days'+(S.fcMastery.length?' ('+[...new Set(S.fcMastery)].join(", ")+')':'')+'. A single miss anywhere makes the run not-clean — that\'s the point.</p>'));
};

function startDiagnostic(){
  // v2.8: PREREQUISITE-ONLY readiness check (the prof's review list). Course-taught
  // topics (resonance, acid-base, bond-line) are excluded — a miss there would read
  // as "not ready" for material he isn't expected to know yet (round-2 audit, P1-A).
  const PREREQ=["valence","lewis","formal","polarity","hybrid","imf"];
  const pool=[];
  PREREQ.forEach(k=>{
    const qs=QUESTIONS.filter(q=>q.topic===k&&q.type!=="written");
    if(!qs.length)return;
    const seen=id=>(S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
    pool.push(shuffle(qs).sort((a,b)=>seen(a.id)-seen(b.id))[0]);
  });

}
// v2.12: the Evaluator — the gap-finding engine. One question per prereq topic, cold,
// tracked per-topic; ends with a color-coded gap map + a priority-ordered study list.
// Result is stashed to S.lastEval so the Report export (→ Learning Profile) carries it.
const GAP_PRIORITY=["valence","lewis","formal","polarity","hybrid","imf"]; // foundational first
function startEvaluator(){
  const PREREQ=["valence","lewis","formal","polarity","hybrid","imf"];
  const pool=[];
  PREREQ.forEach(k=>{ const qs=QUESTIONS.filter(q=>q.topic===k&&q.type!=="written"); if(!qs.length)return;
    const seen=id=>(S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
    pool.push(shuffle(qs).sort((a,b)=>seen(a.id)-seen(b.id))[0]); });
  S.drill={queue:shuffle(pool),i:0,right:0,wrong:0,topic:"__eval",answered:false,byTopic:{}};
  go("drill");
}
// compute gap report from a byTopic tally; returns {gaps:[topic], solid:[topic], pct}
function gapReport(byTopic){
  const gaps=[], solid=[];
  // v3.2 honest scoring: a topic is only "solid" if CLEAN rights (right minus guessed-right) beat wrongs
  Object.entries(byTopic).forEach(([k,bt])=>{ ((bt.r-(bt.g||0))>bt.w?solid:gaps).push(k); });
  gaps.sort((a,b)=>GAP_PRIORITY.indexOf(a)-GAP_PRIORITY.indexOf(b));
  const total=Object.values(byTopic).reduce((s,bt)=>s+bt.r+bt.w,0);
  const right=Object.values(byTopic).reduce((s,bt)=>s+bt.r,0);
  const clean=Object.values(byTopic).reduce((s,bt)=>s+bt.r-(bt.g||0),0);
  return {gaps,solid,pct:total?Math.round(100*right/total):0,cleanPct:total?Math.round(100*Math.max(0,clean)/total):0};
}
function startDrill(topic){
  let pool;
  if (topic==="__missed"){ const ids=[...new Set(S.missed)]; pool=QUESTIONS.filter(q=>ids.includes(q.id)&&q.type!=="written"); if(!pool.length){ alert("No missed questions yet — go earn some."); return; } }
  else pool = QUESTIONS.filter(q=>q.topic===topic&&q.type!=="written"); // v3.0: written items live in diagnostics, not short drills
  // v2.13: adaptive selection — randomize, then surface by NEED so a session targets
  // what you're weakest on. Tier 3 = you've missed it OR only ever guessed it right (v3.0 shaky),
  // tier 2 = never seen, tier 1 = seen and right. Shuffle first so pick within a tier is random.
  const seen = id => (S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
  // v3.2: confident-wrong (a broken rule = misconception) outranks guessed-wrong (just unknown)
  const need = q => { const s=S.qstats[q.id]; if(s&&(s.w-(s.gw||0))>0) return 4; if(s&&s.w>0) return 3; if(s&&(s.gr||0)>0&&s.r<=(s.gr||0)) return 3; if(seen(q.id)===0) return 2; return 1; };
  pool = shuffle(pool).sort((a,b)=>need(b)-need(a));
  // v2.4: first pass through formal charge runs the scaffold sequence IN ORDER
  // (derive LP count → then compute FC). After first exposure, adaptive shuffle resumes.
  if (topic==="formal"){
    // v2.8: scaffold order survives interruption — until EVERY scaffold has been seen
    // once, unseen scaffolds lead the queue in sequence (audit: interrupted first pass
    // used to fall back to shuffle and could jump to f6 before f0b).
    const ORD=["f0","f0b","f1","f2"];
    if (ORD.some(id=>seen(id)===0)){
      const lead = ORD.filter(id=>seen(id)===0).map(id=>pool.find(q=>q.id===id)).filter(Boolean);
      pool = lead.concat(pool.filter(q=>!lead.includes(q)));
    }
  }
  S.drill = {queue:pool.slice(0,SESSION_MAX), i:0, right:0, wrong:0, topic, answered:false};
  go("drill");
}
