{id:"x2-h11",topic:"hybrid",type:"mc",diff:2,prompt:"Why can't you rotate around a C=C double bond?",choices:["Rotating would break the sideways π overlap","The atoms are too heavy","The sigma bond is too strong","You can rotate it freely"],answer:0,why:"<b>π overlap would break.</b> The p orbitals must stay parallel to overlap; twisting destroys that. This locked rotation is what makes cis/trans isomers possible — single bonds spin freely, double bonds don't."},
{id:"x2-h12",topic:"hybrid",type:"text",diff:2,prompt:"Hybridization of the carbon in CH₃⁺ (a carbocation, 3 bonds, no lone pair)?",answer:"sp2",accept:["sp2","sp²"],why:"<b>sp²</b> — only 3 domains (no lone pair to add a fourth). Trigonal planar with an EMPTY p orbital sticking up perpendicular. That empty p orbital is where nucleophiles attack."},
{id:"x2-h13",topic:"hybrid",type:"mc",diff:2,prompt:"SO₂ has a bent shape. What's the bond angle?",choices:["Slightly less than 120°","Exactly 120°","109.5°","180°"],answer:0,why:"<b>Just under 120°.</b> Sulfur has 3 domains (2 bonds + 1 LP) → sp², base angle 120° — then the lone pair squeezes it slightly. Ciesla's warning: students reflexively answer 109.5° here by pattern-matching to water. Get the geometry first, THEN the angle."},
{id:"x2-h14",topic:"hybrid",type:"mc",diff:3,prompt:"Which has the SMALLER bond angle: H₂O or NH₃?",choices:["H₂O (~104.5°) — two lone pairs squeeze harder than one","NH₃ (~107°)","They're identical","Neither has lone pairs"],answer:0,why:"<b>Water.</b> Both are sp³ (base 109.5°), but lone pairs are fatter than bonds and compress the remaining angles. Two lone pairs (H₂O) squeeze more than one (NH₃): 104.5° &lt; 107° &lt; 109.5°."},
{id:"x2-h15",topic:"hybrid",type:"text",diff:3,prompt:"In CH₃–C≡N, what is the hybridization of the NITROGEN?",answer:"sp",accept:["sp"],why:"<b>sp</b> — the triple bond is 1 domain and the lone pair is another = 2 domains. Easy to miss the lone pair on a terminal nitrogen; it still counts. Linear geometry through the C≡N."},
{id:"x2-h16",topic:"hybrid",type:"mc",diff:3,prompt:"An sp-hybridized carbon holds its electrons more tightly than sp³. Why?",choices:["sp has 50% s-character, and s orbitals sit closer to the nucleus","sp has more electrons","sp is bigger","It doesn't — sp³ holds tighter"],answer:0,why:"<b>s-character.</b> sp = 50% s, sp² = 33%, sp³ = 25%. More s-character means electrons ride closer to the nucleus, held tighter. This is the 'O' in ARIO and it's why terminal alkynes (pKa ~25) are far more acidic than alkanes (~50)."},
{id:"x2-h17",topic:"hybrid",type:"num",diff:3,prompt:"What PERCENTAGE s-character does an sp² orbital have? (enter a number)",answer:33,tolerance:1,why:"<b>~33%</b> — one s mixed with two p's, so s is 1/3 of the mix. sp = 50%, sp² = 33%, sp³ = 25%. More s-character → shorter, stronger bonds and more stable anions."},
{id:"x2-h18",topic:"hybrid",type:"mc",diff:3,prompt:"Electron geometry vs molecular shape — what's the difference?",choices:["Electron geometry counts lone pairs as positions; molecular shape names only where the ATOMS are","They're the same thing","Shape counts lone pairs, geometry doesn't","Neither counts lone pairs"],answer:0,why:"<b>Lone pairs are invisible in the SHAPE name.</b> Water: electron geometry tetrahedral (4 domains), molecular shape bent (2 atoms attached). Exam questions ask for one or the other specifically — read which one they want."},

/* --- intermolecular forces --- */
{id:"x2-i01",topic:"imf",type:"mc",diff:0,prompt:"Intermolecular forces act:",choices:["BETWEEN separate molecules","Inside a molecule, between bonded atoms","Only in ionic compounds","Only in gases"],answer:0,why:"<b>Between molecules</b> — 'inter' = between. Intramolecular forces are the covalent bonds inside. Boiling separates molecules from each other, so boiling point tracks INTERmolecular strength."},
{id:"x2-i02",topic:"imf",type:"mc",diff:0,prompt:"Which molecules have London dispersion forces?",choices:["All of them","Only nonpolar ones","Only polar ones","Only ones with hydrogen"],answer:0,why:"<b>Every molecule.</b> Dispersion comes from momentary electron-cloud fluctuations, which everything has. It's the floor, not a special case — for nonpolar molecules it's just the ONLY force present."},
{id:"x2-i03",topic:"imf",type:"mc",diff:1,prompt:"Rank IMF strength, strongest first:",choices:["Hydrogen bonding > dipole–dipole > London dispersion","London > dipole–dipole > hydrogen bonding","Dipole–dipole > hydrogen bonding > London","All equal"],answer:0,why:"<b>H-bonding > dipole–dipole > dispersion.</b> Worth a caveat: dispersion scales with size, so a very large nonpolar molecule can out-boil a small polar one. The ranking is per-interaction, not per-molecule."},
{id:"x2-i04",topic:"imf",type:"mc",diff:1,prompt:"Hydrogen bonding requires an H bonded directly to:",choices:["N, O, or F","Any atom","Carbon","A metal"],answer:0,why:"<b>N, O, or F only.</b> Both halves matter: a δ+ H on N/O/F, plus a lone pair on another N/O/F to accept it. C–H hydrogens never qualify — carbon isn't electronegative enough to polarize them."},
{id:"x2-i05",topic:"imf",type:"mc",diff:1,prompt:"Can two molecules of CH₃OCH₃ (dimethyl ether) hydrogen-bond TO EACH OTHER?",choices:["No — it has lone pairs to accept, but no H on O to donate","Yes — it has oxygen","Yes — it has hydrogens","Only when cold"],answer:0,why:"<b>No.</b> All its H's are on carbon, so it has no donor. It can ACCEPT an H-bond from water (its O has lone pairs), but ether-to-ether H-bonding is impossible. That's why dimethyl ether boils at −24°C while ethanol — same formula — boils at +78°C."},
{id:"x2-i06",topic:"imf",type:"mc",diff:2,prompt:"Which boils higher: CH₃CH₂OH (ethanol) or CH₃CH₂CH₃ (propane)?",choices:["Ethanol — it hydrogen-bonds","Propane — it's heavier","Same","Neither boils"],answer:0,why:"<b>Ethanol</b> (78°C vs −42°C), despite similar size. The OH group donates AND accepts hydrogen bonds; propane has only dispersion. An OH group is worth a huge boiling-point jump."},
{id:"x2-i07",topic:"imf",type:"mc",diff:2,prompt:"Which boils higher: pentane (C₅H₁₂) or methane (CH₄)? Both are nonpolar.",choices:["Pentane — bigger electron cloud, stronger dispersion","Methane","Same — both nonpolar","Neither"],answer:0,why:"<b>Pentane</b> (36°C vs −162°C). Both have dispersion ONLY, but dispersion scales with surface area and electron count. Bigger nonpolar molecule = stronger dispersion = higher boiling point."},
{id:"x2-i08",topic:"imf",type:"mc",diff:2,prompt:"Which dissolves better in water: NaCl or hexane (C₆H₁₄)?",choices:["NaCl — 'like dissolves like', and water is polar","Hexane","Both equally","Neither"],answer:0,why:"<b>NaCl.</b> Water is polar and stabilizes ions well. Hexane is nonpolar and can't compete with water's hydrogen-bond network, so it separates into a layer. Like dissolves like."},
{id:"x2-i09",topic:"imf",type:"mc",diff:2,prompt:"Branched isomers boil LOWER than straight-chain ones. Why?",choices:["Branching makes the molecule more spherical, reducing contact surface for dispersion","Branching adds polarity","Branching removes hydrogens","They actually boil higher"],answer:0,why:"<b>Less surface contact.</b> Dispersion needs molecules to lie against each other; a compact branched blob touches less than an extended chain. Pentane boils at 36°C, its fully branched isomer neopentane at 9.5°C — same formula."},
{id:"x2-i10",topic:"imf",type:"mc",diff:3,prompt:"An exam asks why molecule Y boils higher than X. Which answer LOSES points?",choices:["'Because Y has stronger bonds that take more energy to break'","'Because Y hydrogen-bonds and X only has dispersion'","'Because Y's intermolecular forces are stronger'","'Because Y needs more energy to separate its molecules'"],answer:0,why:"<b>'Breaking bonds' is the losing phrase.</b> Boiling does NOT break covalent bonds — the molecules stay completely intact, they just separate from each other. Say 'overcoming intermolecular forces', never 'breaking bonds'. Ciesla flagged this exact wording."},
{id:"x2-i11",topic:"imf",type:"mc",diff:3,prompt:"HF has stronger hydrogen bonds than H₂O, yet water boils higher (100°C vs 20°C). Why?",choices:["Water can form more H-bonds per molecule — 2 donors and 2 acceptors","HF doesn't really H-bond","Water is heavier","The data is wrong"],answer:0,why:"<b>Count, not just strength.</b> Water has 2 O–H donors and 2 lone pairs → up to 4 H-bonds each, building a 3D network. HF has 1 donor and 3 lone pairs, so it's limited to chains. Total network beats per-bond strength."},
{id:"x2-i12",topic:"imf",type:"mc",diff:3,prompt:"Two molecules of identical formula AND comparable shape (think cis- vs trans-1,2-dichloroethene — her example); one is polar, one isn't. Which boils higher, and what's the full-credit reason?",choices:["The polar one — it has dipole–dipole forces on top of dispersion, so more energy is needed to overcome them","The nonpolar one — fewer forces to fight","Same — identical formulas mean identical boiling points","Can't be determined"],answer:0,why:"<b>Polar boils higher.</b> Full-credit structure: name the specific IMF difference (dipole–dipole plus dispersion vs dispersion alone) → link it to energy required → state that molecules separate INTACT. Naming the force is what earns the marks."},
/* ===== v3.9 EXPANSION — CH 2 (bond-line · resonance) + CH 3 (pKa · ARIO) ===== */
/* --- bond-line drawings & functional groups --- */
{id:"x2-b01",topic:"bondline",type:"mc",diff:0,prompt:"In a bond-line (skeletal) drawing, each corner or line END represents:",choices:["A carbon atom","A hydrogen atom","A lone pair","A bond"],answer:0,why:"<b>Carbon.</b> Vertices and endpoints are carbons, drawn invisibly to keep structures fast to sketch. The zigzag exists so you can count carbons at a glance."},
{id:"x2-b02",topic:"bondline",type:"mc",diff:0,prompt:"In bond-line drawings, hydrogens on carbon are:",choices:["Not drawn — you infer them from carbon's 4 bonds","Always drawn","Drawn only on the ends","Ignored entirely, they don't exist"],answer:0,why:"<b>Implied, not absent.</b> Every carbon has 4 bonds; whatever isn't drawn is hydrogen. A corner with 2 drawn bonds silently carries 2 H's. They're still there — just not written."},
{id:"x2-b03",topic:"bondline",type:"num",diff:1,prompt:"A bond-line zigzag has 5 vertices/endpoints total. How many carbons?",answer:5,why:"<b>5</b> — one per vertex or endpoint. Counting carbons in a skeletal drawing is just counting corners, including both ends of the chain."},
{id:"x2-b04",topic:"bondline",type:"num",diff:1,prompt:"In a bond-line drawing, a carbon at a corner shows 2 drawn bonds. How many hydrogens does it carry?",answer:2,why:"<b>2.</b> Carbon needs 4 total; 2 are drawn, so 2 are implied hydrogens. This subtraction is the whole skill: 4 minus what's drawn."},
{id:"x2-b05",topic:"bondline",type:"num",diff:1,prompt:"A carbon at the END of a chain is joined to the rest by ONE single bond. How many hydrogens?",answer:3,why:"<b>3</b> — it's a CH₃ group. 4 − 1 = 3 implied. Careful though: this holds for a SINGLE bond ending. If the chain ends in a double bond it's =CH₂ (2 H), and a terminal alkyne is ≡CH (1 H) — always subtract the full bond order."},
{id:"x2-b06",topic:"bondline",type:"mc",diff:1,prompt:"Which atoms ARE always drawn explicitly in bond-line structures?",choices:["Heteroatoms (O, N, S, halogens) and any H attached to them","Only carbon","Nothing — everything is implied","Only hydrogen"],answer:0,why:"<b>Heteroatoms and their hydrogens.</b> You write O, N, Cl, and you write the H in an O–H or N–H. Only carbon and its hydrogens get hidden — because only those are predictable."},
{id:"x2-b07",topic:"bondline",type:"mc",diff:2,prompt:"An –OH group attached to a carbon chain is a(n):",choices:["Alcohol","Ether","Aldehyde","Carboxylic acid"],answer:0,why:"<b>Alcohol.</b> C–O–C is an ether, –CHO an aldehyde, –COOH a carboxylic acid. Functional group recognition needs to become instant — it's how you'll predict reactivity all year."},
{id:"x2-b08",topic:"bondline",type:"mc",diff:2,prompt:"A carbon double-bonded to O and also bonded to OH is a(n):",choices:["Carboxylic acid","Ketone","Aldehyde","Ester"],answer:0,why:"<b>Carboxylic acid</b> (–COOH). Ketone is C=O flanked by two carbons; aldehyde is C=O with at least one H; ester is C=O with an O–R. The atoms attached to the carbonyl carbon determine which is which."},
{id:"x2-b09",topic:"bondline",type:"mc",diff:2,prompt:"What distinguishes an AMIDE from an AMINE?",choices:["An amide's nitrogen is attached to a C=O; an amine's is not","Amides have no nitrogen","Amines have oxygen","Nothing — same group"],answer:0,why:"<b>The adjacent carbonyl.</b> Amine = N on ordinary carbons (basic, nucleophilic). Amide = N next to C=O (barely basic, because the lone pair is delocalized into the carbonyl). One neighboring atom, completely different chemistry."},
{id:"x2-b10",topic:"bondline",type:"num",diff:2,prompt:"Cyclohexane is drawn as a plain hexagon. How many hydrogens does it have in total?",answer:12,why:"<b>12</b>. Six corners = 6 carbons, each with 2 drawn bonds to neighbors → 2 H each → 12. Formula C₆H₁₂."},
{id:"x2-b11",topic:"bondline",type:"mc",diff:3,prompt:"A carbon in a bond-line drawing is connected to TWO neighbors — one by a double bond, one by a single bond. How many hydrogens does it carry?",choices:["1","2","3","0"],answer:0,why:"<b>1.</b> Count bond ORDER, not neighbors: the double bond is worth 2, the single is worth 1, so 3 of carbon's 4 are used → 1 H. Counting 'two neighbors, so 2 bonds' is the trap — it would wrongly give you 2 H."},
{id:"x2-b12",topic:"bondline",type:"num",diff:3,prompt:"Benzene is a hexagon with three alternating double bonds. How many hydrogens total?",answer:6,why:"<b>6</b> — one per carbon. Take any carbon: 2 σ bonds to its ring neighbours, and it's part of exactly one double bond, adding 1 more bond's worth → 3 of its 4 used → 1 H. Six carbons, six hydrogens: C₆H₆."},
{id:"x2-b13",topic:"bondline",type:"mc",diff:3,prompt:"Why do organic chemists use bond-line drawings instead of writing every atom?",choices:["Speed and clarity — the skeleton and functional groups are visible instantly","They're required by law","They contain more information","To hide the hydrogens"],answer:0,why:"<b>Speed and pattern recognition.</b> You'll draw thousands of structures; skeletal form makes the reactive parts (the heteroatoms and π bonds you actually write) jump out from the inert carbon frame. Ciesla will expect fluency here fast."},

/* --- resonance (was badly under-covered: 5 items) --- */
{id:"x2-r01",topic:"resonance",type:"mc",diff:1,prompt:"Resonance structures differ from each other by:",choices:["The position of ELECTRONS only — never atoms","The position of atoms","Temperature","Their molecular formula"],answer:0,why:"<b>Electrons move, atoms stay put.</b> If you moved an atom you drew a different molecule (an isomer), not a resonance structure. This is the single hardest rule to hold onto and the most commonly broken."},
{id:"x2-r02",topic:"resonance",type:"mc",diff:1,prompt:"The real molecule is best described as:",choices:["A single hybrid — a weighted average of all the structures","Flipping rapidly between the structures","Whichever structure you drew first","One structure at a time, chosen randomly"],answer:0,why:"<b>One unchanging hybrid.</b> The molecule is NOT oscillating. The multiple drawings are a limitation of our notation — a single line can't show a bond that's really 1.5. Classic analogy: a mule isn't a horse some days and a donkey others."},
{id:"x2-r03",topic:"resonance",type:"mc",diff:1,prompt:"Curved arrows in resonance show:",choices:["Movement of electron pairs","Movement of atoms","Movement of the whole molecule","Heat flow"],answer:0,why:"<b>Electron pairs.</b> The tail sits on the electron source (a lone pair or a π bond), the head points where they land. Every arrow you draw all year means exactly this."},
{id:"x2-r04",topic:"resonance",type:"mc",diff:2,prompt:"Which electrons can move in resonance?",choices:["Lone pairs and π (pi) electrons","σ (sigma) bond electrons","Core electrons","Any electrons at all"],answer:0,why:"<b>Lone pairs and π electrons only.</b> Sigma bonds are the molecular skeleton — move those and the molecule falls apart. If you find yourself moving a single bond, stop: that's an atom-moving error in disguise."},
{id:"x2-r05",topic:"resonance",type:"mc",diff:2,prompt:"For resonance to happen, the participating orbitals must be:",choices:["Parallel/aligned so p orbitals can overlap","Perpendicular","Far apart","Filled"],answer:0,why:"<b>Aligned p orbitals.</b> Delocalization requires overlap, and overlap requires parallel orbitals — which is why resonance-stabilized systems are flat. Twist the system and the resonance shuts off."},
{id:"x2-r06",topic:"resonance",type:"mc",diff:2,prompt:"Which resonance structure contributes MOST to the hybrid?",choices:["The one with full octets and the least charge separation","The one with the most formal charges","The one drawn first","The one with the fewest atoms"],answer:0,why:"Ranking order: <b>full octets first</b>, then minimal charge separation, then negative charge on the more electronegative atom. Equivalent structures (like acetate's two) contribute equally."},
{id:"x2-r07",topic:"resonance",type:"mc",diff:2,prompt:"Between two structures that both have full octets, which is better?",choices:["The one where the negative charge sits on the MORE electronegative atom","The one with charge on carbon","The one with more charges","They're always equal"],answer:0,why:"<b>Negative charge belongs on the electronegative atom.</b> O holds a − better than C or N does. Same logic in reverse for positive charge — it prefers the less electronegative atom."},
{id:"x2-r08",topic:"resonance",type:"mc",diff:2,prompt:"Why is the acetate ion (CH₃COO⁻) more stable than an alkoxide (CH₃CH₂O⁻)?",choices:["Acetate's negative charge is delocalized over two oxygens by resonance","Acetate is bigger","Alkoxide has no oxygen","They're equally stable"],answer:0,why:"<b>Spread charge is stable charge.</b> Acetate has two equivalent resonance structures sharing the − across both oxygens; the alkoxide's charge is stuck on one atom. That difference is worth ~11 pKa units (acetic acid ~5 vs ethanol ~16)."},
{id:"x2-r09",topic:"resonance",type:"num",diff:2,prompt:"How many EQUIVALENT resonance structures does the acetate ion CH₃COO⁻ have?",answer:2,why:"<b>2</b> — the double bond and the negative charge swap between the two oxygens. Because they're identical in every way, they contribute equally, making both C–O bonds exactly 1.5 in the real molecule."},
{id:"x2-r10",topic:"resonance",type:"mc",diff:3,prompt:"You draw a resonance structure and carbon ends up with 5 bonds. What happened?",choices:["An illegal structure — second-row atoms can never exceed an octet","That's fine for carbon","You need to add a lone pair","Carbon can hold 10 electrons"],answer:0,why:"<b>Never legal.</b> C, N, O and F max out at 8 electrons — no expanded octets in the second row. Five bonds on carbon means you pushed electrons IN without pushing any OUT. Every arrow onto a full atom needs a companion arrow off it."},
{id:"x2-r11",topic:"resonance",type:"mc",diff:3,prompt:"Which is NOT a valid resonance structure of the other?",choices:["Two structures where an H has moved from one atom to another","Two structures where a lone pair became a π bond","Two structures where a π bond became a lone pair","Two structures where a π bond shifted along a chain"],answer:0,why:"<b>Moving hydrogen breaks the rule.</b> An H is an atom — relocate it and you've drawn a tautomer or an isomer, which is a genuinely different compound. Only electrons may move."},
{id:"x2-r12",topic:"resonance",type:"num",diff:3,prompt:"In the carbonate ion CO₃²⁻, how many equivalent resonance structures are there?",answer:3,why:"<b>3</b> — the C=O can be to any of the three oxygens. The real ion has three identical C–O bonds of order 1.33, with the 2− charge spread evenly. Symmetry like this is a strong stability signal."},
{id:"x2-r13",topic:"resonance",type:"mc",diff:3,prompt:"An amide's nitrogen is much less basic than an amine's. Resonance explains this because:",choices:["The N lone pair is delocalized into the C=O, so it isn't available to grab a proton","Amides have no lone pair","Nitrogen is more electronegative in amides","Amides are ionic"],answer:0,why:"<b>A delocalized lone pair is a busy lone pair.</b> It's donated into the adjacent carbonyl, so it can't act as a base. This is why proteins (chains of amides) have stable, flat, non-basic backbones — and why that C–N bond can't rotate freely."},
{id:"x2-r14",topic:"resonance",type:"mc",diff:3,prompt:"Ciesla said Chapter 2 resonance depends on a Chapter 1 skill. Which one?",choices:["Reliable formal charge and lone-pair placement","Balancing equations","Gas laws","Naming compounds"],answer:0,why:"<b>Formal charge + lone pairs.</b> Every resonance structure you draw has to have its charges reassigned, and if you can't place lone pairs correctly you can't track where charge went. She named this as the prerequisite — it's why formal charge is worth over-drilling now."},

/* --- acid/base: pKa --- */
{id:"x2-ab01",topic:"acidbase1",type:"mc",diff:0,prompt:"A LOWER pKa means:",choices:["A stronger acid","A weaker acid","A stronger base","Nothing about strength"],answer:0,why:"<b>Lower pKa = stronger acid.</b> It's a logarithmic scale running backwards from intuition. HCl at −7 is enormously stronger than water at 15.7 — and each unit is a factor of 10."},
{id:"x2-ab02",topic:"acidbase1",type:"mc",diff:0,prompt:"A Brønsted acid is a:",choices:["Proton (H⁺) donor","Proton acceptor","Electron donor","Electron acceptor"],answer:0,why:"<b>Proton donor</b>; the base is the acceptor. (Lewis definitions flip to electron pairs — same reactions, different lens. Ochem uses both.)"},
{id:"x2-ab03",topic:"acidbase1",type:"text",diff:1,prompt:"What is the conjugate base of HCl? (type a formula, e.g. NH2-)",answer:"cl-",accept:["cl-","cl−","chloride"],why:"<b>Cl⁻.</b> Remove one H⁺ and you have the conjugate base. Conjugate pairs differ by exactly one proton, never more."},
{id:"x2-ab04",topic:"acidbase1",type:"text",diff:1,prompt:"What is the conjugate ACID of NH₃? (type the formula WITH its charge, like: xy2+)",answer:"nh4+",accept:["nh4+","ammonium"],why:"<b>NH₄⁺.</b> Conjugate acid = add a proton. The charge goes UP by one when you add H⁺ — neutral NH₃ becomes +1. <b>NH₄ without the + is wrong</b>: charge bookkeeping IS the answer. (audit r5: charge-less 'nh4' no longer accepted)"},
{id:"x2-ab05",topic:"acidbase1",type:"mc",diff:1,prompt:"Which is the strongest acid?",choices:["HCl (pKa −7)","Acetic acid (pKa 5)","Water (pKa 15.7)","Ethanol (pKa 16)"],answer:0,why:"<b>HCl</b>, by a colossal margin — pKa −7 vs 5 is twelve orders of magnitude. Lowest pKa wins, and negative pKa values mean very strong acids."},
{id:"x2-ab06",topic:"acidbase1",type:"num",diff:2,prompt:"Roughly what is the pKa of a carboxylic acid (RCOOH)?",answer:5,tolerance:1,why:"<b>~5.</b> A number worth having cold. Carboxylic acids are the most acidic of the common neutral functional groups you'll meet this semester, thanks to resonance stabilization of the carboxylate. (Sulfonic acids are stronger still, but they mostly show up as catalysts rather than as the compounds you're ranking.)"},
{id:"x2-ab07",topic:"acidbase1",type:"num",diff:2,prompt:"Roughly what is the pKa of water?",answer:15.7,tolerance:0.5,why:"<b>15.7.</b> The reference point in the middle of the ladder. Alcohols sit right beside it (~16), which is why hydroxide and alkoxides are comparably strong bases."},
{id:"x2-ab08",topic:"acidbase1",type:"mc",diff:2,prompt:"An acid-base equilibrium favors:",choices:["The side with the WEAKER acid (higher pKa)","The side with the stronger acid","Neither — always 50/50","The left side always"],answer:0,why:"<b>Weaker acid wins.</b> Reactions run downhill toward stability, and the weaker acid is the more stable species. Compare the pKa on each side and the bigger number tells you where the equilibrium sits."},
{id:"x2-ab09",topic:"acidbase1",type:"mc",diff:2,prompt:"The stronger the acid, its conjugate base is:",choices:["Weaker (more stable)","Stronger","Unchanged","Also strong"],answer:0,why:"<b>Inverse relationship.</b> A strong acid gives up its proton readily precisely because the resulting anion is stable — and a stable anion is a weak base. Cl⁻ (from HCl) is a terrible base; NH₂⁻ (from NH₃, pKa 38) is ferocious."},
{id:"x2-ab10",topic:"acidbase1",type:"mc",diff:3,prompt:"Will hydroxide (⁻OH) deprotonate a terminal alkyne (pKa ~25)?",choices:["No — the product side would hold the STRONGER acid (water, 15.7), so equilibrium favors the reactants","Yes, easily","Yes, but slowly","Only when heated"],answer:0,why:"<b>No.</b> Write the reaction out: alkyne (pKa 25) + ⁻OH → acetylide + H₂O (pKa 15.7). Water is the <b>stronger</b> acid (lower pKa), and equilibrium always favors the side with the WEAKER acid — that's the reactant side here, by about 9 pKa units. To deprotonate the alkyne you need a base whose conjugate acid has pKa above 25: NaNH₂ works, because NH₃ is 38."},
{id:"x2-ab11",topic:"acidbase1",type:"num",diff:3,prompt:"Roughly what is the pKa of a terminal alkyne (HC≡C–R)?",answer:25,tolerance:2,why:"<b>~25.</b> Far more acidic than an alkane (~50) purely because of orbital s-character: the acetylide's lone pair sits in an sp orbital, close to the nucleus. That's the 'O' in ARIO."},
{id:"x2-ab12",topic:"acidbase1",type:"mc",diff:3,prompt:"Ethanol has pKa ~16 and acetic acid ~5. Both have an O–H. Why an 11-unit gap?",choices:["Acetate's charge is delocalized over two oxygens by resonance; ethoxide's isn't","Acetic acid has more hydrogens","Ethanol has no oxygen","Acetic acid is bigger"],answer:0,why:"<b>Resonance in the conjugate base.</b> Stability of the ANION is what sets acidity — always look at what's left after the proton leaves. 11 pKa units means acetic acid is ~100 billion times more acidic."},

/* --- acid/base: ARIO ranking --- */
{id:"x2-ac01",topic:"acidbase2",type:"mc",diff:1,prompt:"ARIO ranks conjugate-base stability. What do the letters stand for, in priority order?",choices:["Atom, Resonance, Induction, Orbital","Acid, Reaction, Ion, Oxygen","Atom, Radius, Ionic, Orbital","Anion, Resonance, Ionization, Octet"],answer:0,why:"<b>A</b>tom > <b>R</b>esonance > <b>I</b>nduction > <b>O</b>rbital — check in that order and stop at the first factor that distinguishes your species. <i>This ordering holds 'in general' (Klein's words), not absolutely: his named exception is an sp carbanion (HC≡C⁻) being MORE stable than an sp³ nitrogen anion — Orbital beating Atom. Learn the rule AND that exception.</i>"},
{id:"x2-ac02",topic:"acidbase2",type:"mc",diff:1,prompt:"Under 'A' (Atom), what do you compare when the charged atoms are in the same ROW?",choices:["Electronegativity — more EN holds the − charge better","Size","Mass","Number of bonds"],answer:0,why:"<b>Electronegativity across a row.</b> F⁻ > OH⁻ > NH₂⁻ > CH₃⁻ in stability, so HF is the strongest of those acids. Down a COLUMN you switch to size instead."},
{id:"x2-ac03",topic:"acidbase2",type:"mc",diff:2,prompt:"Under 'A' (Atom), what do you compare going DOWN a column?",choices:["Size — bigger atoms spread charge over more volume","Electronegativity","Mass number","Color"],answer:0,why:"<b>Size wins down a column</b>, and it overrides electronegativity. F is more electronegative than I, yet HI is the far stronger acid because I⁻ is huge and dilutes the charge beautifully."},
{id:"x2-ac04",topic:"acidbase2",type:"mc",diff:2,prompt:"HBr is a stronger acid than HF, even though F is much more electronegative. Why?",choices:["Br⁻ is far larger, spreading the negative charge over more volume","F doesn't hold charge","HBr has resonance","HF is a gas"],answer:0,why:"<b>Size beats electronegativity down a column.</b> HF pKa 3.2 vs HBr pKa −9 — twelve orders of magnitude apart. Two sub-rules live inside 'A' and you have to know which axis you're moving along."},
{id:"x2-ac05",topic:"acidbase2",type:"mc",diff:2,prompt:"Rank acidity: HF vs H₂O vs NH₃",choices:["HF > H₂O > NH₃","NH₃ > H₂O > HF","H₂O > HF > NH₃","All equal"],answer:0,why:"<b>Same row → electronegativity.</b> F > O > N, so F⁻ is the most stable conjugate base and HF is the strongest acid. pKa: 3.2 vs 15.7 vs 38."},
{id:"x2-ac06",topic:"acidbase2",type:"mc",diff:2,prompt:"Under 'I' (Induction), adding electronegative atoms NEAR the charge does what?",choices:["Stabilizes it — they pull electron density away through the σ bonds","Destabilizes it","Nothing","Only matters for cations"],answer:0,why:"<b>Stabilizes.</b> Nearby EN atoms siphon off some of the negative charge through the sigma framework. It's a through-bond pull, and it weakens fast with distance."},
{id:"x2-ac07",topic:"acidbase2",type:"mc",diff:2,prompt:"Trifluoroacetic acid (CF₃COOH, pKa 0.5) is far stronger than acetic acid (CH₃COOH, pKa 5). Which ARIO factor explains it?",choices:["Induction — three fluorines pull density away from the carboxylate","Resonance","Orbital","Atom"],answer:0,why:"<b>Induction.</b> Both have identical resonance; the only difference is the three electron-withdrawing F's stabilizing the anion. Worth ~4.5 pKa units, which is over 30,000× more acidic."},
{id:"x2-ac08",topic:"acidbase2",type:"mc",diff:3,prompt:"Two anions: one is resonance-stabilized on nitrogen, the other is localized on oxygen. Which ARIO factor decides, and which wins?",choices:["Atom beats Resonance — but you must check whether the atoms actually differ first","Resonance always beats Atom","They're equal","Orbital decides"],answer:0,why:"<b>A outranks R.</b> When the charge-bearing atoms differ, settle that first; only if the atoms are the same do you move on to resonance. The order isn't decorative — it's a strict priority chain, and skipping to R is a common error."},
{id:"x2-ac09",topic:"acidbase2",type:"mc",diff:3,prompt:"Under 'O' (Orbital), which carbanion is most stable?",choices:["sp (50% s-character) — electrons sit closest to the nucleus","sp³ (25% s)","sp² (33% s)","They're identical"],answer:0,why:"<b>sp is most stable.</b> More s-character = electron density closer to the positive nucleus = better stabilized. This is why terminal alkynes (pKa 25) crush alkanes (pKa 50) on acidity."},
{id:"x2-ac10",topic:"acidbase2",type:"mc",diff:3,prompt:"Induction gets weaker as the electronegative atom moves further from the charge. Roughly how fast?",choices:["Sharply — it's essentially gone after 3 or so bonds","Not at all","It gets stronger","It doubles per bond"],answer:0,why:"<b>Drops off fast.</b> Induction travels through σ bonds and dies within a few bonds. A Cl on the alpha carbon matters a lot; the same Cl four carbons away barely registers. Resonance, by contrast, reaches as far as the conjugated system does."},
{id:"x2-ac11",topic:"acidbase2",type:"mc",diff:3,prompt:"Phenol (pKa 10) is much more acidic than cyclohexanol (pKa 16). Which factor?",choices:["Resonance — phenoxide delocalizes the charge into the ring","Induction","Orbital","Atom"],answer:0,why:"<b>Resonance.</b> Both put a − on oxygen (same Atom), but phenoxide spreads it into the aromatic ring across several structures. Cyclohexanol's alkoxide is stuck. Same atom → move to R."},
{id:"x2-ac12",topic:"acidbase2",type:"mc",diff:3,prompt:"What's the single question to ask when ranking acidity?",choices:["Which conjugate base is more stable?","Which acid is bigger?","Which has more hydrogens?","Which is more polar?"],answer:0,why:"<b>Always look at the conjugate base.</b> Acidity is decided by what's left AFTER the proton leaves. Deprotonate both, compare the anions with ARIO, and the more stable anion came from the stronger acid. Never try to rank the acids directly."},

/* ===== v3.13 — LECTURE 3 (Ciesla, Tue 2026-08-25, Ch 2 part 1) =====
   Built from Gabe's transcript + the Klein Ch-2 deck + the official Functional Groups table
   he uploaded. Two blocks: FUNCTIONAL GROUPS (new topic — she flagged it hardest: "invest
   time in trying to memorize… it will really screw you up if you don't") and BOND-LINE
   DRAWING RULES (her explicit do/don't list, incl. the triple-bond-can't-zigzag rule).
   Difficulty on the v3.9 0-3 scale. ================================================= */

/* --- FUNCTIONAL GROUPS: the 12 on the official table --- */
{id:"fg01",topic:"fgroups",type:"text",diff:0,prompt:"A carbon–carbon DOUBLE bond (C=C) is which functional group? (one word)",answer:"alkene",accept:["alkene","alkenes"],why:"<b>Alkene.</b> Ciesla's example: expose an alkene to bromine and it adds across the double bond — <b>whether the alkene sits alone or inside a huge molecule.</b> That context-independence is the whole definition of a functional group."},
{id:"fg02",topic:"fgroups",type:"text",diff:0,prompt:"A carbon–carbon TRIPLE bond (C≡C) is which functional group?",answer:"alkyne",accept:["alkyne","alkynes"],why:"<b>Alkyne.</b> Those carbons are sp hybridized → linear → and (per lecture) an alkyne can never be drawn on a zigzag."},
{id:"fg03",topic:"fgroups",type:"text",diff:0,prompt:"R–OH is which functional group?",answer:"alcohol",accept:["alcohol","alcohols"],why:"<b>Alcohol.</b> Official table's fine print: oxygen bonded to one carbon and one hydrogen, and <b>that carbon may only be bonded to H or other carbons</b> — which is exactly what stops a carboxylic acid (–COOH) from counting as an alcohol, since there the carbon is a carbonyl. One refinement the table leaves implicit: the carbon should be sp³. An OH straight onto an aromatic ring is a <b>phenol</b>, which behaves differently (it's far more acidic)."},
{id:"fg04",topic:"fgroups",type:"text",diff:0,prompt:"R–O–R (oxygen bridging two carbons) is which functional group?",answer:"ether",accept:["ether","ethers"],why:"<b>Ether.</b> Table's fine print again: the carbons on either side may only be bonded to H or other carbons. The moment one of them is a C=O, it stops being an ether and becomes an <b>ester</b>."},
{id:"fg05",topic:"fgroups",type:"text",diff:0,prompt:"A halogen bonded to carbon (R–X, where X = F/Cl/Br/I) is which functional group?",answer:"halide",accept:["halide","halides","alkyl halide","alkylhalide","haloalkane"],why:"<b>Halide</b> (you'll also hear alkyl halide / haloalkane). Ciesla named alkyl halides as one of the groups this semester leans on heavily."},
{id:"fg06",topic:"fgroups",type:"text",diff:0,prompt:"C≡N is which functional group? (the one she added to the table herself)",answer:"nitrile",accept:["nitrile","nitriles"],why:"<b>Nitrile.</b> Verbatim from lecture: 'there is one that I'm gonna add in, which is a C triple bond N, which is called a nitrile. So just add that to your list.' It is <b>not</b> on the printed table — she added it, so it's fair game."},
{id:"fg07",topic:"fgroups",type:"mc",diff:1,prompt:"A benzene ring is which functional group — and what's the warning that comes with it?",choices:["Aromatic (aryl/arene) — and aromatic compounds are DISTINCT from alkenes","An alkene, since it has double bonds","A cycloalkane","An ether"],answer:0,why:"<b>Aromatic / aryl / arene.</b> The official table bolds the warning: <b>'Aromatic compounds and alkenes are distinct!'</b> A benzene ring is drawn with alternating double bonds but does NOT behave like an alkene — it's resonance-stabilized and won't just add bromine across a 'double bond'. Calling benzene an alkene is a marked-wrong answer, not a rounding error."},

/* --- THE C=O DECISION TREE (her stated top tip) --- */
{id:"fg08",topic:"fgroups",type:"mc",diff:1,prompt:"Her stated FIRST move when identifying functional groups in a molecule:",choices:["Find every C=O (carbonyl) first, then look at what each one is attached to","Count the carbons","Look for nitrogen first","Find the longest chain"],answer:0,why:"<b>Look for C=O first.</b> Verbatim: 'when identifying functional groups, look for the C double bond O first.' Once you've found a carbonyl, the atom attached to it names the group — that single habit resolves six of the twelve groups."},
{id:"fg09",topic:"fgroups",type:"text",diff:1,prompt:"A C=O with a CARBON on both sides is which functional group?",answer:"ketone",accept:["ketone","ketones"],why:"<b>Ketone</b> — carbonyl flanked by two carbons. Compare: swap one carbon for an H and it becomes an aldehyde."},
{id:"fg10",topic:"fgroups",type:"text",diff:1,prompt:"A C=O bearing a HYDROGEN on one side, and a hydrogen or a plain carbon on the other, is which functional group?",answer:"aldehyde",accept:["aldehyde","aldehydes"],why:"<b>Aldehyde.</b> The second half of the definition matters: an H on the carbonyl is not enough by itself — formic acid (H–COOH) and formamide (H–CO–NH₂) also have one, and they're a carboxylic acid and an amide. The other side must be H or plain carbon. The carbonyl carbon of an aldehyde is therefore always terminal (it can't be an interior chain carbon); a ketone's is always interior."},
{id:"fg11",topic:"fgroups",type:"text",diff:1,prompt:"A C=O with an –OH attached is which functional group?",answer:"carboxylic acid",accept:["carboxylic acid","carboxylicacid","carboxylic"],why:"<b>Carboxylic acid</b> (–COOH). Note it is NOT an alcohol despite the OH — the table's alcohol definition requires the attached carbon to hold only H/C, and here it's a carbonyl."},
{id:"fg12",topic:"fgroups",type:"text",diff:1,prompt:"A C=O with a NITROGEN directly attached is which functional group?",answer:"amide",accept:["amide","amides"],why:"<b>Amide.</b> The key word is <b>directly</b> — the N must be bonded straight to the carbonyl carbon. Nitrogen anywhere else in the molecule is an amine instead, and that mix-up is the error she named as most common."},
{id:"fg13",topic:"fgroups",type:"text",diff:2,prompt:"A C=O with a HALOGEN attached is which functional group?",answer:"acyl halide",accept:["acyl halide","acylhalide","acid halide","acidhalide"],why:"<b>Acyl halide</b> (a.k.a. acid halide). She listed it in the C=O decision tree. Heads-up: it does <b>not</b> appear on the 12-row printed table — learn the decision tree, but know the table is the graded reference."},
{id:"fg14",topic:"fgroups",type:"text",diff:2,prompt:"A C=O attached to an oxygen that carries ANOTHER C=O (C(=O)–O–C(=O)) is which functional group?",answer:"anhydride",accept:["anhydride","anhydrides","acid anhydride"],why:"<b>Anhydride</b> — two carbonyls sharing one oxygen. She was openly unsure whether it's assessed ('I don't think it asks you… actually'), and it is not on the printed table. Recognize it; don't lose sleep over it."},
{id:"fg15",topic:"fgroups",type:"text",diff:2,prompt:"A C=O attached to an oxygen, where that oxygen's OTHER neighbour is a plain carbon (not a second carbonyl) — C(=O)–O–C — is which functional group?",answer:"ester",accept:["ester","esters"],why:"<b>Ester.</b> The 'plain carbon' qualifier is doing real work: if that second carbon were itself a C=O you'd have an <b>anhydride</b> instead. Table's mnemonic: an ester is a carboxylic acid with the acidic H replaced by carbon — or an ether where one of the oxygen's carbons is a carbonyl."},

/* --- THE DISCRIMINATIONS (where marks are actually lost) --- */
{id:"fg16",topic:"fgroups",type:"mc",diff:2,prompt:"A molecule has a nitrogen bonded to three carbons. That nitrogen is NOT attached to any C=O. Which group?",choices:["Amine","Amide","Nitrile","Ammonium"],answer:0,why:"<b>Amine.</b> Her most-common-error warning, verbatim: 'people don't see whether something is connected to a C=O or it's not.' N alone → amine. N on a carbonyl → amide. Always check the neighbour before naming nitrogen."},
{id:"fg17",topic:"fgroups",type:"mc",diff:2,prompt:"What is the DEFINING structural difference between an ester and an amide?",choices:["The heteroatom bonded to the carbonyl: O for an ester, N for an amide","The number of carbons","Ester has a double bond, amide doesn't","Nothing — they're the same group"],answer:0,why:"<b>O vs N on the carbonyl.</b> Table's phrasing: 'amides look like esters, but the oxygen is replaced by nitrogen.' Same skeleton, one atom swapped, completely different reactivity — which is exactly why functional-group recognition has to be automatic."},
{id:"fg18",topic:"fgroups",type:"mc",diff:2,prompt:"How do you tell an ETHER from an ESTER?",choices:["An ester has a C=O on one of the oxygen's carbons; an ether's carbons carry only H/C","An ether has two oxygens","An ester has no oxygen","They're the same"],answer:0,why:"<b>Look for the carbonyl.</b> R–O–R with plain carbons = ether. If one of those carbons is doubled to an O, it's an ester. This is the C=O-first habit paying off again."},
{id:"fg19",topic:"fgroups",type:"mc",diff:2,prompt:"How do you tell an ALDEHYDE from a KETONE?",choices:["Aldehyde has at least one H on the carbonyl carbon; a ketone has carbons on both sides","Aldehyde has two oxygens","Ketone has an OH","Ketones are always cyclic"],answer:0,why:"<b>Count what's on the carbonyl carbon.</b> H present → aldehyde (necessarily at a chain end). Carbon on both sides → ketone (necessarily interior). Same C=O, different neighbours."},
{id:"fg20",topic:"fgroups",type:"mc",diff:3,prompt:"Why does knowing functional groups let you predict how a molecule reacts?",choices:["A functional group behaves in a broadly similar, predictable way across different molecules","Because every molecule has exactly one","Because they determine molecular weight","They don't — reactivity is random"],answer:0,why:"<b>Context-independence is the point.</b> Her example: ethylene and menthene both add Br₂ across the C=C, because an alkene is an alkene. So a big scary molecule is really just a small set of familiar groups stapled to an inert carbon frame — you predict the whole thing by recognizing the parts."},
{id:"fg21",topic:"fgroups",type:"mc",diff:3,prompt:"Which functional-group family is NOT being covered in this course?",choices:["Sulfur-containing groups (thiols, sulfides)","Carbonyl compounds","Amines","Alkyl halides"],answer:0,why:"<b>Sulfur groups are out.</b> Verbatim: 'we're not gonna be doing sulfur containing groups, so you don't have to learn sulfur.' The printed table has none either. Don't spend memorization budget there."},
{id:"fg22",topic:"fgroups",type:"mc",diff:3,prompt:"She groups the functional groups into broad categories. Which set matches what she gave?",choices:["C–C multiple bonds · carbon bonded to a more electronegative atom · C=O compounds · (plus nitrile, C≡N)","Acids · bases · salts","Ionic · covalent · metallic","Polar · nonpolar"],answer:0,why:"Her three headings plus one add-on: <b>(1)</b> C–C multiple bonds — alkene, alkyne; <b>(2)</b> carbon bonded to a more electronegative atom — alcohol, ether, halide, amine; <b>(3)</b> C=O compounds — aldehyde, ketone, acid, ester, amide (+ acyl halide, anhydride); <b>(4)</b> nitrile, which she added by hand. Categories make the table memorable instead of a flat list of twelve."},
{id:"fg23",topic:"fgroups",type:"mc",diff:3,prompt:"Which pair could a molecule contain SIMULTANEOUSLY?",choices:["An alkene and an alcohol — different sites, no conflict","An aldehyde and a ketone at the same carbonyl","An ether and an ester at the same oxygen","An amine and an amide at the same nitrogen"],answer:0,why:"<b>Different sites, both count.</b> Molecules routinely carry several functional groups at once — Klein opens the chapter with amoxicillin, which carries an amine, two amides (one of them a strained β-lactam ring), an aromatic ring, a carboxylic acid and a phenol, among others. (It also has a sulfide, which is outside this course.) But a single site can't be two things at once — one carbonyl has one identity, decided by its neighbours."},
{id:"fg24",topic:"fgroups",type:"mc",diff:1,prompt:"She said you need to know functional groups in BOTH directions. What does that mean?",choices:["See the name → draw the structure, AND see the structure → give the name","Know them in English and Japanese","Know them forwards and backwards alphabetically","Know their molecular weights"],answer:0,why:"Verbatim: 'you need to be able to see the name, and draw the structure, and you need to be able to see the structure, be able to name it.' Recognition alone is half the skill — and it's the half that fails under exam pressure. She recommends <b>flashcards</b> for exactly this."},

/* --- BOND-LINE: the drawing rules she gave explicitly --- */
{id:"bl01",topic:"bondline",type:"mc",diff:0,prompt:"In a bond-line structure, hydrogens attached to HETEROATOMS (O, N, S) are:",choices:["Always drawn explicitly","Never drawn","Optional","Drawn only on oxygen"],answer:0,why:"<b>Always drawn.</b> Klein's Rule 4: all heteroatoms must be drawn, and so must the H atoms attached to them. Only C–H hydrogens get hidden — because only those are predictable from the 4-bond rule."},
{id:"bl02",topic:"bondline",type:"num",diff:0,prompt:"A carbon in a bond-line structure carries no formal charge, no lone pair and no unpaired electron (the normal case all through this unit). How many bonds must it have?",answer:4,why:"<b>4</b> — and that's what lets you infer the invisible hydrogens. Keep two statements separate: Klein's Rule 5, the <b>cardinal rule</b>, is that carbon may never have MORE than four bonds — true always. 'Exactly four' is the inference for ordinary closed-shell carbon. (Radicals with 3 bonds and carbenes with 2 exist, but not in this chapter.)"},
{id:"bl03",topic:"bondline",type:"mc",diff:1,prompt:"In THIS course, are lone pairs on oxygen and nitrogen optional?",choices:["No — Ciesla requires them drawn, even though the textbook calls them optional","Yes, always optional","Only on nitrogen","Only in Chapter 2"],answer:0,why:"<b>Required here.</b> The Klein slide says 'lone pairs are optional'; her slide note and lecture override it: 'For us, we're gonna put lone pairs on our oxygen and nitrogens.' Her reason is forward-looking — <b>resonance and mechanisms are about moving electrons, so you need to see where they are.</b> Build the habit now and Ch 2 gets easier."},
{id:"bl04",topic:"bondline",type:"mc",diff:2,prompt:"Can a TRIPLE bond be drawn as part of a zigzag?",choices:["No — the sp carbons are linear (180°), so the triple bond and both attached carbons must be drawn straight","Yes, like any other bond","Only in rings","Only if it's terminal"],answer:0,why:"<b>Never.</b> Triple-bond carbons are sp → 180° → linear, and <b>the carbons attached on either side must be in that straight line too.</b> A zigzagged triple bond is marked wrong, and she called it out as a recurring point-loser."},
{id:"bl05",topic:"bondline",type:"mc",diff:2,prompt:"Her tactical advice for drawing a molecule that contains a triple bond:",choices:["Draw the triple bond FIRST, then zigzag outward from both ends","Draw the chain first, then squeeze the triple bond in","Start from the right-hand end","Draw it as a ring"],answer:0,why:"<b>Triple bond first.</b> Verbatim: 'my top tip is draw the triple bond first, because the attachments to your triple bond have to be linear.' Anchor the rigid linear piece, then everything else is a normal zigzag hanging off it. Sequencing the drawing prevents the geometry error instead of fixing it after."},
{id:"bl06",topic:"bondline",type:"mc",diff:2,prompt:"You're adding TWO substituents to a carbon sitting at a PEAK of the zigzag. Which way do they point?",choices:["Both up, drawn as a V","Both down","One up, one down","Horizontally"],answer:0,why:"<b>Both up, as a V from the peak.</b> Her peaks-and-valleys convention: two groups at a peak point up, two groups in a valley point down. It keeps the drawing readable and roughly honest about tetrahedral geometry."},
{id:"bl07",topic:"bondline",type:"mc",diff:2,prompt:"You're adding ONE substituent to a carbon at a peak. How should it be drawn?",choices:["Straight up, vertical","At a slant, like one arm of a V","Horizontally","It doesn't matter"],answer:0,why:"<b>Straight up.</b> One group → vertical (down if you're in a valley). She was explicit that a slant is not acceptable here: the slanted arm is reserved for the two-group case, so using it for one group misreads. Cosmetic-looking, but she grades it."},
{id:"bl08",topic:"bondline",type:"mc",diff:2,prompt:"Klein's Rule 2 on drawing a C=O: which is right?",choices:["Draw the double bond straight up so the bonds sit ~120° apart (sp², trigonal planar)","Draw it at any convenient angle","Draw it horizontally always","Draw it as two parallel zigzags"],answer:0,why:"<b>Bonds as far apart as possible, ~120°.</b> That carbon is sp² → trigonal planar, and the drawing should show it. Her words on the cramped version: 'It's not that it's not as good. It's just <b>wrong</b>.'"},
{id:"bl09",topic:"bondline",type:"mc",diff:1,prompt:"Klein's Rule 3: for SINGLE bonds, the direction you draw them is:",choices:["Irrelevant — rotation about single bonds makes those drawings the same molecule","Critical — each direction is a different compound","Only irrelevant in rings","Fixed by the textbook"],answer:0,why:"<b>Irrelevant.</b> σ bonds rotate freely, so a chain drawn bending up or down is the same compound. Contrast with double and triple bonds, where geometry is locked and the drawing angle genuinely matters."},
{id:"bl10",topic:"bondline",type:"mc",diff:3,prompt:"Her recommended intermediate step when converting a CONDENSED formula into a bond-line structure:",choices:["Draw the PARTIALLY condensed structure first, then count carbons off it","Convert to molecular formula first","Draw it in 3-D first","Go straight to bond-line — intermediates cause errors"],answer:0,why:"<b>Partially condensed as a bridge.</b> Her reasoning: once some bonds are drawn you can see the skeleton and count the continuous chain reliably — she counted 7 carbons off hers before drawing a single zigzag. Going straight from (CH₃)₂CHOH-style text to a drawing is where miscounts happen."},
{id:"bl11",topic:"bondline",type:"mc",diff:3,prompt:"Going from bond-line TO condensed, what's the most common error and her fix?",choices:["Miscounting carbons — fix by highlighting the longest chain and numbering every carbon","Forgetting oxygen — fix by drawing lone pairs","Using too many parentheses","Writing left to right"],answer:0,why:"<b>Carbon miscounts, both directions.</b> Verbatim: 'the most common error is people add too many carbons, or they add too few.' Her fix is mechanical — highlight the longest continuous chain, then <b>number</b> it so every carbon is accounted for. Numbering also survives interruption, which eyeballing doesn't."},
{id:"bl12",topic:"bondline",type:"mc",diff:3,prompt:"For a branched molecule, several condensed formulas can all be correct. What's the limit on how far you may condense?",choices:["You must not lose CONNECTIVITY — the reader has to know what's attached where","You must always fully condense","You may never use parentheses twice","Three levels maximum"],answer:0,why:"<b>Connectivity is the hard floor.</b> The class asked whether five separate CH₃ groups could be written (CH₃)₅ — no: 'we lose connectivity. You have zero idea where those CH₃s are.' Grouping identical substituents on the SAME carbon is fine; merging groups on different carbons destroys the structure."},
{id:"bl13",topic:"bondline",type:"mc",diff:2,prompt:"When counting hydrogens on a bond-line structure, which is her flagged blind spot?",choices:["Hydrogens on an alkyne carbon (≡C–H) — routinely missed","Hydrogens on CH₃ groups","Hydrogens on ring carbons","Hydrogens on double bonds"],answer:0,why:"<b>Alkyne hydrogens.</b> Verbatim: 'people routinely miss out hydrogen connected to an alkyne — I see that a lot.' A terminal alkyne carbon has one H (3 bonds to its partner + 1 to H = 4). Also check heteroatoms: their H's count toward the formula too."},
{id:"bl14",topic:"bondline",type:"num",diff:2,prompt:"How many hydrogens are on the terminal carbon of a TERMINAL alkyne (R–C≡C–H)?",answer:1,why:"<b>1.</b> The triple bond uses 3 of that carbon's 4 bonds, so exactly one H remains. Exactly the count she says students drop."},
{id:"bl15",topic:"bondline",type:"mc",diff:1,prompt:"Rank these representations from MOST to LEAST structural information:",choices:["Lewis > partially condensed > condensed > molecular formula","Molecular formula > condensed > Lewis","Condensed > Lewis > molecular formula","They all carry the same information"],answer:0,why:"Ranked by how EXPLICIT the detail is. Careful though: Lewis, partially condensed and condensed all encode the <b>same connectivity</b> — you can convert freely between them, you just see fewer bonds drawn (and lose the lone pairs). The one real information loss is at the end: molecular formula, in her words, 'doesn't tell you anything about the structure, it just tells you the number of atoms' — C₄H₁₀ can't distinguish butane from isobutane. Bond-line is the working compromise: fast to draw, connectivity fully intact."},
{id:"bl16",topic:"bondline",type:"mc",diff:2,prompt:"In a CONDENSED structure, which bonds are typically shown?",choices:["Double bonds are usually shown; single bonds are not","All bonds are shown","No bonds at all","Only bonds to heteroatoms"],answer:0,why:"<b>Doubles yes, singles no.</b> Verbatim: 'in the condensed structure, we don't show single bonds. But… it is usual to show double bonds.' Single bonds are inferable from the writing order; a C=C isn't, so it gets drawn. <b>Known exception:</b> carbonyls are often condensed with the double bond left implicit — –COOH, –CHO, CH₃COCH₃ all hide a C=O that you're expected to know is there."},
{id:"bl17",topic:"bondline",type:"mc",diff:3,prompt:"Two bond-line drawings show a 5-carbon chain with a CH₃ on carbon 3, drawn at different orientations on the page. They are:",choices:["The same molecule — just rotated","Constitutional isomers","Different compounds","Resonance structures"],answer:0,why:"<b>Same molecule.</b> Two separate reasons, worth keeping distinct: (1) rotating the whole drawing on the page changes nothing at all — it's the same structure viewed differently; (2) single bonds rotate freely, so even a genuinely re-bent chain is the same compound. Either way the test is <b>connectivity</b>: trace which atom is bonded to which, and never judge by how the drawing looks."},
{id:"bl18",topic:"bondline",type:"mc",diff:3,prompt:"Her study instruction for the drawing skills in this chapter:",choices:["Practice on PAPER even though homework is submitted digitally — understanding it ≠ being able to do it reliably","Only practice digitally, since that's how you're assessed","Read the chapter twice","Watch videos instead of drawing"],answer:0,why:"<b>Paper reps.</b> Verbatim: 'you're gonna be asked to do this digitally, but you have to practice this on paper… you all understand it, but it's whether you can do it reliably.' Recognition-versus-production again — the drawing has to become motor memory, and clicking a digital tool doesn't build that."},
{id:"bl19",topic:"bondline",type:"mc",diff:1,prompt:"Her instruction about mistakes made while practising:",choices:["Don't erase them — write the correction next to the mistake so you keep a record","Erase them immediately so your notes stay clean","Ignore them","Start the whole page again"],answer:0,why:"<b>Never erase.</b> Verbatim: 'if you make a mistake, don't erase it. Just write down what the correction is… typically what happens is we keep making the same mistake. So if we erase our mistakes, then we forget that we make that mistake.' An error log beats clean notes — the same principle behind this app's 🤷/🎲 flags and attempt history."},
{id:"bl20",topic:"bondline",type:"mc",diff:3,prompt:"You must draw a molecule whose main chain contains a triple bond between C3 and C4, with substituents further out. What's the correct build order?",choices:["Triple bond first (C2–C3≡C4–C5 all collinear), then zigzag out to C1 and C6/C7","Zigzag the whole chain, then thicken two lines into a triple bond","Draw substituents first","Draw it as a ring, then open it"],answer:0,why:"<b>Rigid piece first.</b> The triple bond forces C2, C3, C4 and C5 onto one straight line — four atoms, not two. Lay that down, then zigzag C1 off one end and C6/C7 off the other. Zigzagging first guarantees you'll have to redraw, and under exam time you won't."},
];

function accuracy(){ let r=0,w=0,g=0; Object.values(S.qstats).forEach(s=>{r+=s.r;w+=s.w;g+=(s.gr||0);}); const t=r+w; const clean=r-g;
  return {r,w,g,t,pct:t?Math.round(100*r/t):0, cleanPct:t?Math.round(100*Math.max(0,clean)/t):0}; }
/* v3.2: measured difficulty — miss rate + guess rate + time vs topic median from the
   event log, blended with the static prior until n is meaningful (weight n/(n+4)). */
function qDiffM(q){
  const ev=(S.attempts||[]).filter(a=>a.id===q.id); const n=ev.length; const prior=qDiff(q);
  if(!n) return prior;
  const miss=ev.filter(a=>!a.ok).length/n, guess=ev.filter(a=>a.g).length/n;
  const med=a=>{const d=a.filter(x=>x.d>0).map(x=>x.d).sort((x,y)=>x-y); return d.length?d[Math.floor(d.length/2)]:null;};
  const m1=med(ev), m2=med((S.attempts||[]).filter(a=>a.t===q.topic));
  let m=1+2*miss+guess+((m1&&m2&&m1>m2*1.5)?0.5:0);
  const w=n/(n+4);
  // v3.9: floor is 0, not 1 — the scale gained a trivial tier, and a diff:0 item you always
  // get right instantly should be allowed to measure as trivial rather than being pinned at 1.
  return Math.max(0,Math.min(3,Math.round((w*m+(1-w)*prior)*10)/10));
}
function logAttempt(q,ok,guessed,D,dk,ans){
  const secs=D&&D._shownAt?Math.min(600,Math.round((Date.now()-D._shownAt)/1000)):0;
  const ev={id:q.id,ts:Date.now(),ok:ok?1:0,g:guessed?1:0,d:secs,m:(D&&D.topic)||"?",t:q.topic};
  if(dk) ev.dk=1; // v3.5: "I don't know yet" — never learned ≠ guessed ≠ misconception
  // v3.11: record WHAT he actually answered, not just whether it was right. Without this the
  // history can say "✗ on l1g3" but never "you picked 109.5° like water" — and the wrong answer
  // he chose is usually the most diagnostic thing on the row.
  if(ans!==undefined&&ans!==null&&String(ans).length) ev.a=String(ans).slice(0,120);
  S.attempts.push(ev);
  if(S.attempts.length>5000) S.attempts=S.attempts.slice(-5000);
}

  /* v3.7 — Preliminaries (Chapter 0: the pre-gen-chem foundation) */
  p_atom:{primer:"An atom = protons (+, fixed per element — the atomic number IS the element), neutrons (no charge), and electrons (−, the only players in chemistry). Electrons live in shells; only the OUTERMOST shell (valence electrons) does bonding. Everything in this course is about what those outer electrons are doing.",klein:"any gen-chem review — 'atomic structure'",links:[]},
  p_ptable:{primer:"The periodic table is a cheat sheet, not a poster. COLUMN (group) number = valence electrons for main groups: group 1 → 1, group 4 (C) → 4, group 5 (N) → 5, group 6 (O) → 6, group 7 (halogens: F/Cl/Br/I) → 7. ROW (period) = number of shells. Left side = metals (give electrons away), right side = nonmetals (share or take). Organic chem lives almost entirely in C, H, N, O + halogens.",klein:"gen-chem — 'groups & periods'",links:[]},
  p_ions:{primer:"An ion is an atom/molecule whose electrons ≠ protons. LOSE an electron → positive CATION (Na⁺). GAIN one → negative ANION (Cl⁻). Charge is written top-right. Key convention you'll use constantly: a superscript + means one electron MISSING from the total count; a − means one EXTRA. That's why NH₄⁺ has 8 valence electrons to place, not 9.",klein:"gen-chem — 'ions'",links:[]},
  p_bondtypes:{primer:"Two ways atoms stick: IONIC — one atom fully takes electrons from the other, then the + and − attract (metal + nonmetal, like NaCl). COVALENT — atoms SHARE electron pairs (nonmetal + nonmetal). Organic chemistry is covalent chemistry: C, H, N, O sharing pairs. A single shared pair = single bond; two = double; three = triple. Unequal sharing = 'polar covalent' — the bridge topic to Chapter 1.",klein:"gen-chem — 'ionic vs covalent'",links:[]},
  p_formulas:{primer:"Reading formulas: subscripts count atoms (C₂H₆ = 2 C + 6 H). Parentheses multiply: (CH₃)₃N = 3 CH₃ groups on one N. Condensed formulas read left-to-right as connectivity: CH₃CH₂OH means C–C–O–H chain with H's filling carbon to 4 bonds. One formula can be MANY different molecules (isomers) — which is why structure, not formula, is what organic chemistry cares about.",klein:"gen-chem — 'formulas'",links:[]},
  /* v3.7 — Chapter 2 & 3 primers (banks already exist; now they teach too) */
  bondline:{primer:"Bond-line (skeletal) notation: every line-end and corner is a CARBON; hydrogens on carbon are NOT drawn — mentally add H until each C has 4 bonds. Heteroatoms (N, O, S, halogens) ARE drawn, WITH their H's (write O–H, N–H explicitly). <b>KLEIN'S 5 RULES:</b> (1) sp²/sp³ chains go in zigzag; (2) draw double bonds with the bonds as far apart as possible (~120°, because that carbon is trigonal planar) — a cramped C=O isn't 'less good', it's wrong; (3) for SINGLE bonds the drawing direction is irrelevant (free rotation, same molecule); (4) all heteroatoms and their H's must be drawn; (5) the cardinal rule — never more than 4 bonds to a carbon. <b>HER ADDITIONS:</b> lone pairs on O/N/S are REQUIRED in this course (the book calls them optional) because resonance and mechanisms are about moving electrons and you need to see where they are. A TRIPLE BOND CAN NEVER SIT ON A ZIGZAG — sp carbons are linear, and the two carbons attached on either side must be collinear with it too; her tactic is to <b>draw the triple bond first</b> and zigzag outward from both ends. Adding substituents: two groups at a PEAK point up as a V, two in a VALLEY point down; ONE group goes straight up (or straight down in a valley), never slanted. <b>CONVERTING:</b> condensed → bond-line, draw the partially condensed form as a bridge first; bond-line → condensed, highlight the longest continuous chain and NUMBER every carbon (miscounting carbons is the #1 error). You may group identical substituents on the same carbon, but never condense so far that connectivity is lost — (CH₃)₅ is illegal because nobody can tell where those methyls attach. Counting H's: the routinely-missed one is the hydrogen on a terminal alkyne carbon.",klein:"Klein 5e §2.1–2.4",links:[]},
  resonance:{primer:"Resonance = one molecule whose true electron distribution needs several drawings to describe. ONLY ELECTRONS MOVE — lone pairs and π bonds — never atoms, never σ bonds. Curved arrow = 2 electrons moving from tail (a lone pair or π bond) to head. The real molecule is the weighted AVERAGE (hybrid) of all structures — it does NOT flip between them. Ciesla's prereq warning: you must be able to place lone pairs and formal charges reliably first, because every resonance arrow bookkeeps them.",klein:"Klein 5e §2.7–2.12",links:[]},
  acidbase1:{primer:"Brønsted: acid donates H⁺, base accepts it (needs a lone pair). Every acid-base reaction is a competition: equilibrium favors the side with the WEAKER acid. pKa measures acid strength — LOWER pKa = stronger acid. Ballpark values worth knowing: HCl ≈ −7, H₃O⁺ ≈ −1.7, carboxylic acids ≈ 5, H₂O ≈ 15.7, alcohols ≈ 16, terminal alkynes ≈ 25, amines(N–H) ≈ 38, alkanes ≈ 50.",klein:"Klein 5e §3.1–3.3",links:[]},
  /* ===== v3.12 LEARN EXPANSION (Gabe: "alot of topics for my class is missing from this
     learn section… We need week 2 and the chapters, and their topics etc. as well as their
     book source, khan source, and ochemtutor source") — 7 new primers below. Some are
     LEARN-ONLY for now (no drill button appears until bank items exist for that key). ===== */
  fgroups:{primer:"The highest-stakes memorization of the semester — her words: 'it will really screw you up if you don't' know these, and you need them fast enough that you're not looking them up. A functional group is a fragment that behaves THE SAME WAY no matter what molecule it sits in (an alkene adds bromine whether it's ethylene or a steroid), so recognizing the parts lets you predict the whole. FOUR CATEGORIES: (1) C–C multiple bonds — alkene C=C, alkyne C≡C; (2) carbon bonded to a more electronegative atom — alcohol R–OH, ether R–O–R, halide R–X, amine R₃N; (3) C=O compounds; (4) nitrile C≡N (her hand-added extra). <b>THE C=O DECISION TREE — her stated top tip is to find every C=O FIRST, then read off what's attached to it:</b> carbon → ketone · hydrogen → aldehyde · OH → carboxylic acid · O–C → ester · N → amide · halogen → acyl halide · O–C(=O) → anhydride. <b>The error she named as most common:</b> not checking whether a nitrogen is DIRECTLY on the carbonyl — N on a C=O is an amide, N anywhere else is an amine. Two more traps: aromatic rings are NOT alkenes (the table bolds this), and an –OH on a carbonyl carbon is a carboxylic acid, not an alcohol. Sulfur groups are NOT in this course. Know each group both ways — name→structure and structure→name; she recommends flashcards.",klein:"Klein 5e §2.14 + the official 12-row Functional Groups table (Canvas → Ch 2 module)"},
  orbitals:{primer:"Where bonds actually come from. (1) ATOMIC ORBITALS: s is a sphere, p is a dumbbell with two colored LOBES (phases) and a NODE — a zero-electron plane — between them. More nodes = higher energy. (2) BOND FORMATION: two atoms approach and energy DROPS as orbitals overlap, bottoms out at the ideal bond length, then shoots up if you squeeze closer (nuclei repel). That potential-energy curve's minimum IS the bond — its depth is the bond strength. (3) VALENCE BOND THEORY: a σ (sigma) bond is head-on overlap along the axis between nuclei — every single bond is one σ. A π (pi) bond is SIDEWAYS overlap of parallel p orbitals, above and below the axis — it's what a double bond adds (1σ+1π; triple = 1σ+2π), it's weaker than σ, and it locks rotation. (4) s-CHARACTER: sp (50% s) holds electrons closest to the nucleus → shorter, stronger bonds than sp² (33%) than sp³ (25%). That one trend explains bond strength/length AND (in Ch 3) why alkyne C–H is acidic.",klein:"Klein 5e §1.6–1.10 (atomic orbitals, VB theory, σ/π, hybridization)"},
  isomers:{primer:"CONSTITUTIONAL ISOMERS: same molecular formula, DIFFERENT connectivity — who is bonded to whom. C₄H₁₀ is butane (straight chain) or isobutane (branched): same atoms, different skeleton, genuinely different compounds with different boiling points. The 3-step decision routine for any pair of structures: (1) same molecular formula? If no → not isomers at all. (2) Same connectivity? If no → constitutional isomers. (3) Same connectivity but different 3-D arrangement → stereoisomers (Ch 5, later). Trap to kill now: two drawings that LOOK different but have identical connectivity (a chain drawn bent vs straight) are the SAME compound, not isomers. Trace the skeleton atom by atom; never judge by shape on the page.",klein:"Klein 5e §1.2 (constitutional isomers; more in Ch 4)"},
  arrows:{primer:"THE skill of Ch 2 — and of the whole course. A curved arrow shows ELECTRON-PAIR movement, never atoms: the TAIL sits on the electron source (a lone pair or a π bond — never a σ bond, never an atom name), the HEAD points where the pair lands. Rules that never break: (1) only lone pairs and π electrons move; (2) second-row atoms (C,N,O) can NEVER exceed an octet — if an arrow pushes electrons INTO a full atom, a second arrow must push electrons OFF it; (3) each arrow moves exactly 2 electrons. For resonance: draw the arrow(s) on structure A and they generate structure B — then reassign formal charges (this is why FC has to be automatic first; Ciesla said exactly this). Practice reading arrows aloud: 'this lone pair becomes a π bond; that π bond becomes a lone pair on oxygen.'",klein:"Klein 5e §2.10–2.13 (curved arrows, drawing resonance)"},
  lewisab:{primer:"Second definition of acid/base, bigger than the first. BRØNSTED: acid donates H⁺, base accepts it. LEWIS: acid accepts an ELECTRON PAIR, base donates one. Every Brønsted base is a Lewis base (the lone pair that grabs H⁺ is the donated pair), but Lewis is wider: BF₃ has no H at all, yet its empty p orbital hungrily accepts a lone pair → textbook Lewis acid. Translation table for ochem: Lewis base = NUCLEOPHILE (electron-rich, attacks δ+), Lewis acid = ELECTROPHILE (electron-poor, gets attacked). Those two words run every mechanism from Ch 6 on — this section is where they're born.",klein:"Klein 5e §3.8–3.9 (Lewis acids & bases)"},
  alkanes:{primer:"Naming, so you can talk about molecules. The IUPAC recipe: (1) find the LONGEST continuous carbon chain — that's the parent (meth-1, eth-2, prop-3, but-4, pent-5, hex-6, hept-7, oct-8); (2) number the chain from the end giving substituents the LOWEST locants; (3) name substituents as -yl groups (methyl, ethyl, isopropyl, tert-butyl); (4) alphabetize them (ignore di-/tri- prefixes when alphabetizing); (5) assemble: locants-prefix-parent. 2-methylbutane, 2,3-dimethylhexane. The classifications that matter later: 1°/2°/3°/4° carbon = how many OTHER carbons it touches — this vocabulary powers carbocation stability, radical stability, and substitution all semester.",klein:"Klein 5e §4.1–4.3 (nomenclature)"},
  conform:{primer:"Same molecule, rotating. Single (σ) bonds spin freely, so one molecule flickers through infinite CONFORMATIONS — same connectivity, NOT isomers you can bottle. The NEWMAN PROJECTION looks straight down one C–C bond: front carbon = a dot with 3 bonds, back carbon = a circle with 3 bonds. STAGGERED (front bonds bisect back bonds, 60° apart) = lowest energy; ECLIPSED (bonds aligned) = highest. For butane's C2–C3 bond, staggered splits again: ANTI (the two methyls 180° apart — global minimum) beats GAUCHE (methyls 60° apart — small steric penalty). Energy costs worth memorizing: each H/H eclipse ≈ 4 kJ/mol; gauche CH₃/CH₃ ≈ 3.8 kJ/mol.",klein:"Klein 5e §4.7–4.10 (conformations, Newman projections)"},
  chair:{primer:"Cyclohexane isn't flat — it puckers into the CHAIR, which puts every angle at ~111° and every bond staggered: essentially strain-free. Each carbon carries one AXIAL H (points straight up or down, alternating around the ring) and one EQUATORIAL H (points outward around the ring's waist). RING FLIP: the chair inverts through a boat, and every axial becomes equatorial and vice versa (up/down character is what's preserved). The exam question that never dies: a substituent is HAPPIER EQUATORIAL — axial groups suffer 1,3-diaxial crowding with the two axial H's on their side. Bigger group → bigger preference (tert-butyl essentially locks the ring). Drawing clean chairs takes physical practice — do 20 of them on paper before this chapter starts.",klein:"Klein 5e §4.11–4.14 (cyclohexane, chair conformations, ring flips)"},
  acidbase2:{primer:"No pKa table? Compare the CONJUGATE BASES — whichever is more stabilized came from the stronger acid. Check in order, A-R-I-O: Atom (which atom holds the − charge: more electronegative or larger = more stable), Resonance (delocalized charge = more stable), Induction (nearby electronegative atoms pull charge away = more stable), Orbital (charge in an sp orbital = more stable than sp³). Atom beats Resonance beats Induction beats Orbital when they conflict.",klein:"Klein 5e §3.4",links:[]},

  valence: { primer:"Valence electrons are the outer-shell electrons an atom brings to bonding — and for the main-group atoms you'll use, the count equals the group number: H 1, C 4, N 5, O 6, halogens 7. This one number drives everything downstream (how many bonds an atom wants, its formal charge, the whole Lewis structure). Memorize C/N/O/H cold — you'll use them every single problem.",
    klein:"Klein 5e §1.2–1.3 (atomic structure, electron configuration)",
    links:[{l:"Khan Academy — chemical bonds (valence, Lewis)",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds"},{l:"The Organic Chemistry Tutor — intro video",u:OCT_ALLINONE}] },
  lewis: { primer:"A Lewis structure is a bookkeeping map of every valence electron in a molecule. The 6-step method: (1) count total valence electrons (add 1 per negative charge, subtract 1 per positive), (2) pick the central atom (least electronegative, never H), (3) connect with single bonds, (4) fill lone pairs to give outer atoms octets, (5) put leftovers on the center, (6) if the center is short, convert a neighbor's lone pair into a double/triple bond. The whole game is: every electron accounted for, everyone gets an octet (except H, which stops at 2).",
    klein:"Klein 5e §1.3–1.4 (Lewis structures, formal bonds)",
    links:[{l:"Khan Academy — chemical bonds & Lewis structures",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds"},{l:"The Organic Chemistry Tutor — how to draw Lewis structures",u:"https://www.youtube.com/watch?v=6unef5Hz6SU"}] },
  formal: { primer:"Formal charge = (the atom's group number) − (its lone-pair electrons) − (its number of bonds). It answers 'does this atom own more or fewer electrons than a neutral version of itself?' Key mental model, the one thing to lock in: the atom's group-number valence NEVER changes for the charge — the ion's extra/missing electron shows up in the STRUCTURE (a lone pair added or removed), never by bumping the valence number. O is always 6, N always 5.",
    klein:"Klein 5e §1.4 (formal charges)",
    links:[{l:"Khan Academy — formal charge & dot structures",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds/copy-of-dot-structures/v/formal-charge-and-dot-structures"},{l:"The Organic Chemistry Tutor — formal charge",u:"https://www.youtube.com/watch?v=C2l-76VP8s0"}] },
  polarity: { primer:"Two different questions, don't conflate them. (1) Is a BOND polar? — yes if the two atoms differ in electronegativity (EN order to know: F > O > N ≈ Cl > C ≈ H). (2) Is the MOLECULE polar? — depends on GEOMETRY: if the bond dipoles cancel by symmetry (like linear CO₂) the molecule is nonpolar even with polar bonds; if they don't cancel (bent H₂O) it's polar. Geometry decides #2. This is the single most-tested distinction in the topic.",
    klein:"Klein 5e §1.5–1.11 (electronegativity, bond & molecular polarity)",
    links:[{l:"Khan Academy — chemical bonds (electronegativity, polarity)",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds"},{l:"The Organic Chemistry Tutor — polar or nonpolar",u:OCT_ALLINONE}] },
  hybrid: { primer:"Count ELECTRON DOMAINS on an atom = (number of atoms bonded to it) + (number of lone pairs). A double or triple bond counts as ONE domain. Then: 2 domains → sp, linear, 180°; 3 → sp², trigonal planar, 120°; 4 → sp³, tetrahedral, 109.5°. VSEPR shape names only the ATOMS (so sp³ N with a lone pair = 'trigonal pyramidal', not tetrahedral). The lone pair counts for hybridization but is invisible in the shape name — that's the classic trap.",
    klein:"Klein 5e §1.9–1.10 (VSEPR geometry, orbital hybridization)",
    links:[{l:"Khan Academy — chemical bonds (hybridization, VSEPR)",u:"https://www.khanacademy.org/science/chemistry/chemical-bonds"},{l:"The Organic Chemistry Tutor — hybridization & geometry",u:OCT_ALLINONE}] },
  imf: { primer:"Intermolecular forces are the attractions BETWEEN molecules (not the bonds inside them) — they set boiling point, solubility, etc. Three, weakest to strongest: London dispersion (in everything; scales with size/surface area) < dipole-dipole (polar molecules) < hydrogen bonding (only when H is bonded to N, O, or F, AND there's an N/O/F lone pair to accept). To rank boiling points: identify the strongest force each molecule can do. H-bonding usually wins; among nonpolar molecules, bigger = stronger dispersion = higher bp.",
    klein:"Klein 5e §1.12–1.13 (intermolecular forces, physical properties)",
    links:[{l:"Khan Academy — states of matter & intermolecular forces",u:"https://www.khanacademy.org/science/chemistry/states-of-matter-and-intermolecular-forces"},{l:"The Organic Chemistry Tutor — intermolecular forces",u:"https://www.youtube.com/watch?v=QdwzMPwPA3I"}] },
};

/* ---- v2.5: FORMAL-CHARGE MASTERY CHECK (the external audit's transfer gate) ----
   Six species, cold, inputs labeled: bonds → lone pairs → FC for the key atom.
   A run is CLEAN only if all 18 inputs are right first try. Two clean runs on
   two different days = mastered. Draw each one on paper BEFORE answering. */
/* ================= v3.16 — MASTERY CHECK FOR EVERY TOPIC =================
   Gabe: "app should give me a chance to mastery check each topic. not just the one for
   the day." Formal charge already had a bespoke gate (MASTERY_FC — labelled bonds/LP/FC
   inputs, kept exactly as-is because the external audit specified that format). Every
   OTHER topic now gets the same BAR, built from the bank:
     · 6 cold questions sampled across difficulty tiers — trivial (tier 0) items excluded,
       because mastery shouldn't be provable on recall alone
     · CLEAN = every one right FIRST TRY, with nothing flagged 🎲 guessed or 🤷 unlearned
     · 2 clean runs on DIFFERENT days = mastered
   It runs through the normal drill engine (S.drill.masteryTopic), so it inherits pause,
   look-back, every question type and the event log for free. Standing rule, unchanged:
   drill percentages never count as mastery — only a clean run does. */
const MASTERY_N = 6;
function masteryDaysFor(topic){
  if(topic==="formal"){ return [...new Set([...(S.fcMastery||[]), ...((S.masteryDays||{}).formal||[])])]; }
  return [...new Set(((S.masteryDays||{})[topic])||[])];
}
function masteryPoolFor(topic){
  return QUESTIONS.filter(q=>q.topic===topic && q.type!=="written" && qDiff(q)>=1);
}
function masteryEligible(topic){ return masteryPoolFor(topic).length>=MASTERY_N; }
function bankMasteryDay(topic){
  const t=todayStr();
  S.masteryDays=S.masteryDays||{};
  const arr=S.masteryDays[topic]||(S.masteryDays[topic]=[]);
  if(!arr.includes(t)) arr.push(t);
  if(topic==="formal" && !S.fcMastery.includes(t)) S.fcMastery.push(t); // keep the legacy key honest
  save();
  return masteryDaysFor(topic).length;
}
function startTopicMastery(topic){
  const pool=masteryPoolFor(topic);
  if(pool.length<MASTERY_N){ alert("Not enough non-trivial questions in "+((TOPICS[topic]||{}).name||topic)+" yet for a mastery check."); return; }
  const queue=spreadByDifficulty(shuffle(pool), MASTERY_N).slice(0,MASTERY_N);
  S.drill={queue, i:0, right:0, wrong:0, topic, answered:false, cold:true, guessedRight:0,
           masteryTopic:topic, scopeName:"Mastery check · "+((TOPICS[topic]||{}).name||topic), log:[]};
  go("drill");
}
const MASTERY_FC = [
  {name:"OH⁻ (hydroxide)",      atom:"O", bonds:1, lp:3, fc:-1},
  {name:"H₃O⁺ (hydronium)",     atom:"O", bonds:3, lp:1, fc:1},
  {name:"NH₄⁺ (ammonium)",      atom:"N", bonds:4, lp:0, fc:1},
  {name:"CH₃O⁻ (methoxide)",    atom:"O", bonds:1, lp:3, fc:-1},
  {name:"R₃C⁺ (a carbocation)", atom:"C", bonds:3, lp:0, fc:1},
  {name:"R₃C⁻ (a carbanion)",   atom:"C", bonds:3, lp:1, fc:-1},
];
function startMastery(){
  S.mastery = {queue: shuffle(MASTERY_FC), i:0, clean:true};
  go("mastery");
}
VIEWS.mastery = (v) => {
  const M = S.mastery;

  const mastered = new Set(S.fcMastery).size>=2;

    if(S.pausedMastery){ S.pausedMastery=null; safeStore.set("pausedMastery",null); } // v3.14: finished = nothing to resume

    }

    row.appendChild(el("button",{class:"btn ghost",onclick:()=>{S.mastery=null; go("home");}},"Home"));

  }
  const sp = M.queue[M.i];
