  c.innerHTML='<span class="tag violet">Mastery check · '+(M.i+1)+'/6'+(mastered?' · 🏅':'')+'</span>'+
    '<h2>'+sp.name+' — the '+sp.atom+'</h2>'+
    '<p class="muted">Draw it on paper first. Then label the inputs — no formula until the last box.</p>';
  const mkRow=(label,id)=>'<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="min-width:210px;font-weight:700">'+label+'</span><input id="'+id+'" type="number" inputmode="numeric" style="width:90px;padding:8px;border:2px solid var(--ink);border-radius:8px;font-family:var(--mono);font-size:1rem"></div>';
  c.innerHTML += mkRow("Bonds on the "+sp.atom+":","m_b") + mkRow("Lone PAIRS on the "+sp.atom+":","m_l") + mkRow("Formal charge:","m_f");
  const fb=el("div");
  const btn=el("button",{class:"btn teal",onclick:()=>{
    const b=parseInt($("#m_b").value,10), l=parseInt($("#m_l").value,10), f=parseInt($("#m_f").value,10);
    if ([b,l,f].some(x=>Number.isNaN(x))){ fb.innerHTML='<p class="muted">Fill all three boxes.</p>'; return; }
    const ok = b===sp.bonds && l===sp.lp && f===sp.fc;
    if (!ok) M.clean=false;
    snapshotMastery(M.i); // v3.14: the verdict is banked before he can navigate away
    fb.innerHTML = ok
      ? '<p style="color:var(--ok);font-weight:700">✓ All three inputs right.</p>'
      : '<p style="color:var(--coral);font-weight:700">✗ Correct: '+sp.bonds+' bond(s), '+sp.lp+' LP, FC '+(sp.fc>0?"+":"")+sp.fc+'.</p><p class="muted">FC = '+VALENCE[sp.atom]+' − '+(2*sp.lp)+' (LP e⁻) − '+sp.bonds+' (bonds) = '+(sp.fc>0?"+":"")+sp.fc+'</p>';
    btn.replaceWith(el("button",{class:"btn gold",onclick:()=>{M.i++; snapshotMastery(M.i); render();}},"Next →"));
  }},"Check all three");
  c.appendChild(btn); c.appendChild(fb);
  v.appendChild(c);
  v.appendChild(el("div",{class:"card cream"},'<p class="muted">Status: '+new Set(S.fcMastery).size+'/2 clean days'+(S.fcMastery.length?' ('+[...new Set(S.fcMastery)].join(", ")+')':'')+'. A single miss anywhere makes the run not-clean — that\'s the point.</p>'));
  // v3.14: pause. Snapshots at the CURRENT question, so resuming re-serves it unanswered.
  const pauseRow=el("div",{class:"center",style:"margin-top:4px"});
  pauseRow.appendChild(el("button",{class:"btn ghost small",onclick:()=>{ snapshotMastery(M.i); S.mastery=null; go("home"); }},"⏸ pause — saved, resume from Home"));
  v.appendChild(pauseRow);
};

/* ---- DRILL ---- */
function startDiagnostic(){
  // v2.8: PREREQUISITE-ONLY readiness check (the prof's review list). Course-taught
  // topics (resonance, acid-base, bond-line) are excluded — a miss there would read
  // as "not ready" for material he isn't expected to know yet (round-2 audit, P1-A).
  const PREREQ=["valence","lewis","formal","polarity","hybrid","imf"];
  const pool=[];
  PREREQ.forEach(k=>{
    const qs=QUESTIONS.filter(q=>q.topic===k&&q.type!=="written");
    if(!qs.length)return;
    const seen=id=>(S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
    pool.push(shuffle(qs).sort((a,b)=>seen(a.id)-seen(b.id))[0]);
  });
  S.drill={queue:shuffle(pool),i:0,right:0,wrong:0,topic:"__diag",answered:false,byTopic:{}};
  go("drill");
}
// v2.12: the Evaluator — the gap-finding engine. One question per prereq topic, cold,
// tracked per-topic; ends with a color-coded gap map + a priority-ordered study list.
// Result is stashed to S.lastEval so the Report export (→ Learning Profile) carries it.
const GAP_PRIORITY=["valence","lewis","formal","polarity","hybrid","imf"]; // foundational first
function startEvaluator(){
  const PREREQ=["valence","lewis","formal","polarity","hybrid","imf"];
  const pool=[];
  PREREQ.forEach(k=>{ const qs=QUESTIONS.filter(q=>q.topic===k&&q.type!=="written"); if(!qs.length)return;
    const seen=id=>(S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
    pool.push(shuffle(qs).sort((a,b)=>seen(a.id)-seen(b.id))[0]); });
  S.drill={queue:shuffle(pool),i:0,right:0,wrong:0,topic:"__eval",answered:false,byTopic:{}};
  go("drill");
}
// compute gap report from a byTopic tally; returns {gaps:[topic], solid:[topic], pct}
function gapReport(byTopic){
  const gaps=[], solid=[];
  // v3.2 honest scoring: a topic is only "solid" if CLEAN rights (right minus guessed-right) beat wrongs
  Object.entries(byTopic).forEach(([k,bt])=>{ ((bt.r-(bt.g||0))>bt.w?solid:gaps).push(k); });
  gaps.sort((a,b)=>GAP_PRIORITY.indexOf(a)-GAP_PRIORITY.indexOf(b));
  const total=Object.values(byTopic).reduce((s,bt)=>s+bt.r+bt.w,0);
  const right=Object.values(byTopic).reduce((s,bt)=>s+bt.r,0);
  const clean=Object.values(byTopic).reduce((s,bt)=>s+bt.r-(bt.g||0),0);
  return {gaps,solid,pct:total?Math.round(100*right/total):0,cleanPct:total?Math.round(100*Math.max(0,clean)/total):0};
}
function startDrill(topic){
  let pool;
  if (topic==="__missed"){ const ids=[...new Set(S.missed)]; pool=QUESTIONS.filter(q=>ids.includes(q.id)&&q.type!=="written"); if(!pool.length){ alert("No missed questions yet — go earn some."); return; } }
  else pool = QUESTIONS.filter(q=>q.topic===topic&&q.type!=="written"); // v3.0: written items live in diagnostics, not short drills
  // v2.13: adaptive selection — randomize, then surface by NEED so a session targets
  // what you're weakest on. Tier 3 = you've missed it OR only ever guessed it right (v3.0 shaky),
  // tier 2 = never seen, tier 1 = seen and right. Shuffle first so pick within a tier is random.
  const seen = id => (S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
  // v3.2: confident-wrong (a broken rule = misconception) outranks guessed-wrong (just unknown)
  const need = q => { const s=S.qstats[q.id]; if(s&&(s.w-(s.gw||0)-(s.dk||0))>0) return 4; if(s&&s.w>0) return 3; if(s&&(s.gr||0)>0&&s.r<=(s.gr||0)) return 3; if(seen(q.id)===0) return 2; return 1; }; // v3.5: dk ≠ misconception

     Was: sort by need alone → the same few missed items led EVERY session ("I get the same
     questions very often"). Now the sort key is need − recency, so a question served in the
     last few hours drops behind equally-needy ones and the rotation actually advances.
     Then the top slice is re-picked to span difficulty tiers rather than clustering. */
  pool = excludeRecentRounds(pool, SESSION_MAX); // v3.12.1 (audit r5 F2): last 2 rounds' questions sit out when the pool can afford it
  pool = shuffle(pool).sort((a,b)=>(need(b)-recencyPenalty(b.id))-(need(a)-recencyPenalty(a.id)));
  pool = spreadByDifficulty(pool, SESSION_MAX);

  // (derive LP count → then compute FC). After first exposure, adaptive shuffle resumes.
  if (topic==="formal"){
    // v2.8: scaffold order survives interruption — until EVERY scaffold has been seen
    // once, unseen scaffolds lead the queue in sequence (audit: interrupted first pass
    // used to fall back to shuffle and could jump to f6 before f0b).
    const ORD=["f0","f0b","f1","f2"];
    if (ORD.some(id=>seen(id)===0)){
      const lead = ORD.filter(id=>seen(id)===0).map(id=>pool.find(q=>q.id===id)).filter(Boolean);
      pool = lead.concat(pool.filter(q=>!lead.includes(q)));
    }
  }
  S.drill = {queue:pool.slice(0,SESSION_MAX), i:0, right:0, wrong:0, topic, answered:false, log:[]}; // v3.15: log = per-answer record so you can look back
  go("drill");
}

function topicCleanPct(k){
  let r=0,w=0,g=0;
  QUESTIONS.forEach(q=>{ if(q.topic===k){ const s=S.qstats[q.id]; if(s){ r+=(s.r||0); w+=(s.w||0); g+=(s.gr||0); } } });

function scopeForCheckpoint(cp){
  if(cp.topics&&cp.topics.length) return cp.topics.slice();
  // null scope = cumulative: everything the course has introduced on or before that date
  const out=[];
  SEMESTER.forEach(w=>{ if(w.start && w.start<=cp.date) out.push(...(w.topics||[])); });
  return [...new Set(out)];

function readinessFor(cp){
  const scope=scopeForCheckpoint(cp);
  const testable=scope.filter(k=>QUESTIONS.some(q=>q.topic===k&&q.type!=="written"));
  const untestable=scope.filter(k=>!testable.includes(k));
  const pcts=testable.map(topicCleanPct).filter(x=>x!==null);
  const avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):null;
  const untouched=testable.filter(k=>topicCleanPct(k)===null);
  const mastered=testable.filter(k=>masteryDaysFor(k).length>=2);
  const weakest=testable.filter(k=>topicCleanPct(k)!==null).sort((a,b)=>topicCleanPct(a)-topicCleanPct(b)).slice(0,3);

  const ready=cleanOK&&diagOK&&!untouched.length;
  const d=daysTo(cp.date);
  return {scope,testable,untestable,untouched,avg,mastered,weakest,lastScoped,diagOK,cleanOK,ready,days:d};
}

function labPointer(ev,svg){
  const L=S.lab; if(!L)return;
  const r=svg.getBoundingClientRect();
  const x=(ev.clientX-r.left)*(860/r.width>1?1:1), y=(ev.clientY-r.top);
  const px=ev.clientX-r.left, py=ev.clientY-r.top;
  const hit=L.atoms.find(a=>Math.hypot(a.x-px,a.y-py)<26);
  if (L.tool==="atom"){
    if (hit) return;
    const total=L.mol.atoms[L.selElement]||0, placed=L.atoms.filter(a=>a.el===L.selElement).length;
    if (placed>=total){ return; }
    L.atoms.push({id:L.nextId++, el:L.selElement, x:px, y:py, lp:0});
    // auto-advance selection to an element with remaining count
    const remEl=Object.entries(L.mol.atoms).find(([e,n])=>L.atoms.filter(a=>a.el===e).length<n);
    if (L.atoms.filter(a=>a.el===L.selElement).length>=total && remEl) L.selElement=remEl[0];
    render();
  } else if (L.tool==="bond"){
    if (!hit){ L.selAtom=null; drawLab(svg); return; }
    if (L.selAtom==null){ L.selAtom=hit.id; drawLab(svg); return; }
    if (L.selAtom===hit.id){ L.selAtom=null; drawLab(svg); return; }
    const a=Math.min(L.selAtom,hit.id), b=Math.max(L.selAtom,hit.id);
    const ex=L.bonds.find(bd=>bd.a===a&&bd.b===b);
    if (ex){ ex.order++; if(ex.order>3) L.bonds.splice(L.bonds.indexOf(ex),1); }
    else L.bonds.push({a,b,order:1});
    L.selAtom=null; render();
  } else if (L.tool==="lp"){
    if (!hit) return;
    hit.lp=(hit.lp+1)%5;
    render();
  } else if (L.tool==="erase"){
    if (!hit) return;
    L.bonds=L.bonds.filter(b=>b.a!==hit.id&&b.b!==hit.id);
    L.atoms.splice(L.atoms.indexOf(hit),1);
    render();
  }
}
function drawLab(svg){
  const L=S.lab; if(!L)return;
  svg.innerHTML="";
  const NS="http://www.w3.org/2000/svg";
  const mk=(t,at)=>{const e=document.createElementNS(NS,t);Object.entries(at).forEach(([k,v])=>e.setAttribute(k,v));svg.appendChild(e);return e;};
  if (!L.atoms.length){
    mk("text",{x:"50%",y:"48%","text-anchor":"middle","font-size":"15","fill":"#999","font-family":"sans-serif"}).textContent="Tap to place your first "+L.selElement+" atom";
    mk("text",{x:"50%",y:"58%","text-anchor":"middle","font-size":"12","fill":"#bbb","font-family":"sans-serif"}).textContent="(central atom in the middle is a good habit)";
  }
  // bonds
  L.bonds.forEach(b=>{
    const A=L.atoms.find(a=>a.id===b.a), B=L.atoms.find(a=>a.id===b.b); if(!A||!B)return;
    const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
    const ox=-dy/len*4.5, oy=dx/len*4.5;
    const offs = b.order===1?[0]:b.order===2?[-1,1]:[-1.6,0,1.6];
    offs.forEach(o=>mk("line",{x1:A.x+ox*o,y1:A.y+oy*o,x2:B.x+ox*o,y2:B.y+oy*o,stroke:"#20241F","stroke-width":"3","stroke-linecap":"round"}));
  });
  // atoms
  L.atoms.forEach(a=>{
    const sel=L.selAtom===a.id;
    mk("circle",{cx:a.x,cy:a.y,r:"21",fill:"#fff",stroke:sel?"#E4572E":"#20241F","stroke-width":sel?"4":"2.5"});
    const t=mk("text",{x:a.x,y:a.y+6,"text-anchor":"middle","font-size":"19","font-weight":"800","font-family":"monospace",fill:ATOM_COLORS[a.el]||"#20241F"});
    t.textContent=a.el;
    // lone pairs at N,E,S,W
    const slots=[[0,-31],[31,0],[0,31],[-31,0]];
    for(let i=0;i<a.lp;i++){
      const [sx,sy]=slots[i%4];
      const horiz = sy===0;
      mk("circle",{cx:a.x+sx+(horiz?0:-4),cy:a.y+sy+(horiz?-4:0),r:"3",fill:"#0E7C6B"});
      mk("circle",{cx:a.x+sx+(horiz?0:4),cy:a.y+sy+(horiz?4:0),r:"3",fill:"#0E7C6B"});
    }
    const fc=atomFormalCharge(L,a);
    if(fc!==0&&(atomBondOrder(L,a)>0||a.lp>0)){
      const q=mk("text",{x:a.x+22,y:a.y-19,"text-anchor":"middle","font-size":"13","font-weight":"900","font-family":"monospace",fill:"#C94C32"});
      q.textContent=fc>0?"+"+fc:"−"+Math.abs(fc);
    }
  });
}
function atomBondOrder(L,a){
  return L.bonds.filter(b=>b.a===a.id||b.b===a.id).reduce((s,b)=>s+b.order,0);
}
function atomFormalCharge(L,a){ return (VALENCE[a.el]||0)-2*a.lp-atomBondOrder(L,a); }
/* v3.18: graph-isomorphism checker. Page position and atom-placement order are irrelevant;
   element, bond order, lone pairs, computed FC, and every neighbour relationship are not. */
function targetGraphMatches(m,L){
  if(!m.target)return true;
  const T=m.target, tn=T.nodes, un=L.atoms;
  if(tn.length!==un.length)return false;
  const tm=Array.from({length:tn.length},()=>Array(tn.length).fill(0));
  (T.bonds||[]).forEach(([a,b,o])=>{tm[a][b]=tm[b][a]=o;});
  const ui=new Map(un.map((a,i)=>[a.id,i]));
  const um=Array.from({length:un.length},()=>Array(un.length).fill(0));
  L.bonds.forEach(b=>{const a=ui.get(b.a),c=ui.get(b.b);if(a!==undefined&&c!==undefined)um[a][c]=um[c][a]=b.order;});
  const sig=(nodes,mat,i,isUser)=>{
    const n=nodes[i], fc=isUser?atomFormalCharge(L,n):(n.fc||0);
    const neigh=mat[i].map((o,j)=>o?nodes[j].el+":"+o:null).filter(Boolean).sort().join(",");
    return [n.el,n.lp||0,fc,mat[i].reduce((s,o)=>s+o,0),neigh].join("|");
  };
  const ts=tn.map((_,i)=>sig(tn,tm,i,false)), us=un.map((_,i)=>sig(un,um,i,true));
  const cand=tn.map((_,i)=>un.map((__,j)=>j).filter(j=>ts[i]===us[j]));
  if(cand.some(c=>!c.length))return false;
  const order=tn.map((_,i)=>i).sort((a,b)=>cand[a].length-cand[b].length);
  const map=Array(tn.length).fill(-1), used=new Set();
  const seek=k=>{
    if(k===order.length)return true;
    const ti=order[k];
    for(const uj of cand[ti]){
      if(used.has(uj))continue;
      let ok=true;
      for(let x=0;x<map.length;x++) if(map[x]>=0&&tm[ti][x]!==um[uj][map[x]]){ok=false;break;}
      if(!ok)continue;
      map[ti]=uj;used.add(uj);
      if(seek(k+1))return true;
      used.delete(uj);map[ti]=-1;
    }
    return false;
  };
  return seek(0);
}
function structureAuditFails(m,L){
  if(targetGraphMatches(m,L))return [];
  const expected=(m.target?.nodes||[]).map(n=>n.el+" "+chargeLabel(n.fc||0)+", "+(n.lp||0)+" LP").sort();
  const actual=L.atoms.map(a=>a.el+" "+chargeLabel(atomFormalCharge(L,a))+", "+a.lp+" LP").sort();
  const details=expected.join("|")===actual.join("|")
    ? "Your atom details are individually plausible, but at least one atom is connected to the wrong neighbour or with the wrong bond order."
    : "At least one atom has the wrong lone-pair count or computed formal charge.";
  return ["Exact-structure check: "+details+" Match the target's full connectivity, bond orders, lone pairs, and atom-specific charges—not just its formula."];
}
function runAudit(wrap){
  const L=S.lab, m=L.mol;
  const fails=[];
  // formula
  Object.entries(m.atoms).forEach(([e,n])=>{
    const placed=L.atoms.filter(a=>a.el===e).length;
    if (placed!==n) fails.push("Formula: need "+n+"× "+e+", you placed "+placed+".");
  });
  // connectivity
  if (L.atoms.length>1){
    const adj={}; L.atoms.forEach(a=>adj[a.id]=[]);
    L.bonds.forEach(b=>{ if(adj[b.a]&&adj[b.b]){adj[b.a].push(b.b);adj[b.b].push(b.a);} });
    const seen=new Set([L.atoms[0].id]); const q=[L.atoms[0].id];
    while(q.length){ const c=q.pop(); (adj[c]||[]).forEach(n=>{if(!seen.has(n)){seen.add(n);q.push(n);}}); }
    if (seen.size!==L.atoms.length) fails.push("Not all atoms are connected into one molecule.");
  } else if (L.atoms.length===0) fails.push("Canvas is empty.");
  // per-atom rules
  L.atoms.forEach(a=>{
    const orders=L.bonds.filter(b=>b.a===a.id||b.b===a.id).reduce((s,b)=>s+b.order,0);
    if (a.el==="H"){
      if (orders!==1||a.lp!==0) fails.push("H needs exactly 1 bond and 0 lone pairs (has "+orders+" bond(s), "+a.lp+" LP). H stops at 2 — it's the exception.");
    } else {
      const count=2*orders+2*a.lp;
      const allowed=(m.electronCounts&&m.electronCounts[a.el])||[8];
      if(!allowed.includes(count)) fails.push(a.el+" audit: "+orders+" bond(s) ×2 + "+a.lp+" LP ×2 = "+count+" electron(s); this target requires "+allowed.join(" or ")+" around "+a.el+".");
    }
  });
  // budget
  const used=2*L.bonds.reduce((s,b)=>s+b.order,0)+2*L.atoms.reduce((s,a)=>s+a.lp,0);
  if (used!==m.ve) fails.push("Budget: you spent "+used+" of "+m.ve+" electrons. Must land exactly.");
  // v3.18 exact molecular-graph audit: catches legal-octet-but-wrong connectivity and role swaps.
  fails.push(...structureAuditFails(m,L));
  const box=L.auditBox; box.innerHTML="";
  if (!fails.length){
    confetti();
    if (!S.molDone.includes(m.key)) S.molDone.push(m.key);
    // lewis day auto-credit
    const t=todayStr(); const plan=TRACK.find(x=>x.day===t);
    if (plan && plan.topic==="lewis" && !S.doneDays.includes(t) && S.molDone.length>=2) S.doneDays.push(t);
    save();
    const c=el("div",{class:"card teal"},'<h2>✓ '+m.formula+' — exact drawing match</h2><p>Final audit passed: formula ✓ · connected ✓ · H rule ✓ · electron counts ✓ · budget ✓ · bond orders ✓ · lone pairs ✓ · atom-specific formal charges ✓ · target graph ✓</p>');
    c.appendChild(el("button",{class:"btn gold",style:"margin-top:8px",onclick:leaveLab},L.returnTo==="drill"?"Back to question →":"Next molecule →"));
    box.appendChild(c);
  } else {
    L.fails++;
    const c=el("div",{class:"card cream"},'<h3>Audit found problems</h3><ul class="audit">'+fails.map(f=>'<li class="fail">'+f+'</li>').join("")+'</ul>'+(L.fails>=2?'<div class="why"><b>Hint:</b> '+m.hint+'</div>':""));
    box.appendChild(c);
  }
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function attemptRows(){
  // join attempts ↔ wrLog. attempts store ts as epoch ms, wrLog as ISO string, both written
  // in the same finish() call — so match on (question id, timestamps within 5s).
  const notes=(S.wrLog||[]).map(w=>({id:w.id,t:Date.parse(w.ts)||0,text:w.text,kind:w.kind}));
  return (S.attempts||[]).map(a=>{
    const n=notes.find(x=>x.id===a.id&&Math.abs(x.t-a.ts)<5000);
    return {...a, note:n?n.text:null, noteKind:n?n.kind:null};
  }).sort((x,y)=>y.ts-x.ts);

function fmtWhen(ts){
  const d=new Date(ts), now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  const y=new Date(now.getTime()-86400000).toDateString()===d.toDateString();
  const hm=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  return sameDay?("Today "+hm):y?("Yesterday "+hm):(d.toLocaleDateString([], {month:"short",day:"numeric"})+" "+hm);
}

  topicsSeen.forEach(t=>tRow.appendChild(el("button",{class:"btn small"+(F.topic===t?"":" ghost"),onclick:()=>{F.topic=t;F.limit=60;render();}},(TOPICS[t].ico||"")+" "+TOPICS[t].name)));
  fc.appendChild(tRow);
  v.appendChild(fc);

  if(!rows.length){ v.appendChild(el("div",{class:"card cream"},'<p class="muted">Nothing matches that filter.</p>')); return; }
  v.appendChild(el("p",{class:"muted",style:"margin:2px 0 8px;font-size:.82rem"},"Showing "+Math.min(F.limit,rows.length)+" of "+rows.length+" · newest first"));

  rows.slice(0,F.limit).forEach(a=>{
    const q=QUESTIONS.find(x=>x.id===a.id);
    const c=el("div",{class:"card cream",style:"cursor:pointer"});
    c.innerHTML='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">'+
      '<b style="color:'+(a.ok?"#2a9d8f":"#e76f51")+'">'+(a.ok?"✓":"✗")+'</b>'+
      '<span class="tag gold" style="font-size:.7rem">'+(TOPICS[a.t]?(TOPICS[a.t].ico+" "+TOPICS[a.t].name):a.t)+'</span>'+
      '<span class="muted" style="font-size:.8rem">'+fmtWhen(a.ts)+'</span>'+attFlags(a)+'</div>'+
      '<div style="font-size:.9rem;line-height:1.4">'+(q?esc(q.prompt.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()).slice(0,120):'<span class="muted">['+a.id+'] no longer in the bank</span>')+'</div>'+
      (a.a?'<p class="muted" style="margin:4px 0 0;font-size:.82rem">You answered: <b class="mono">'+esc(a.a).slice(0,90)+'</b></p>':'')+
      (a.note?'<p class="muted" style="margin:4px 0 0;font-size:.82rem">✍️ "'+esc(a.note).slice(0,110)+'"</p>':'');
    c.addEventListener("click",()=>{F.qid=a.id;render();});
    v.appendChild(c);
  });
  if(rows.length>F.limit) v.appendChild(el("div",{class:"center"},"")).appendChild(el("button",{class:"btn ghost",onclick:()=>{F.limit+=60;render();}},"Show 60 more"));
};

VIEWS.report = (v) => {
  const a=accuracy();
  const perTopic = Object.entries(TOPICS).map(([k,t])=>{
    const qs=QUESTIONS.filter(q=>q.topic===k); let r=0,w=0;
    qs.forEach(q=>{const s=S.qstats[q.id]; if(s){r+=s.r;w+=s.w;}});
    return (r+w)?("  "+t.name+": "+r+"✓ "+w+"✗ ("+Math.round(100*r/(r+w))+"%)"):null;
  }).filter(Boolean).join("\n");
  const missedIds=[...new Set(S.missed)];
  const missedTxt=missedIds.slice(-12).map(id=>{const q=QUESTIONS.find(x=>x.id===id);return "  ["+id+"] "+q.prompt.replace(/<[^>]+>/g,"").slice(0,70);}).join("\n");
  const txt =
"CHEM 231 BOOTCAMP REPORT — "+todayStr()+"\n"+
"(paste this to Claude in the CHEM 231 session)\n\n"+
"Track: "+S.doneDays.length+"/"+TRACK.length+" days marked done ("+S.doneDays.join(", ")+")\n"+
"Visits: "+S.visits.join(", ")+"\n"+
"Questions: "+a.r+" right / "+a.w+" wrong ("+a.pct+"% overall)\n"+
(perTopic?("By topic:\n"+perTopic+"\n"):"")+
"Molecules built: "+(S.molDone.join(", ")||"none")+"\n"+
"FC mastery: "+new Set(S.fcMastery).size+"/2 clean days"+(S.fcMastery.length?" ("+[...new Set(S.fcMastery)].join(", ")+")":"")+(new Set(S.fcMastery).size>=2?" — MASTERED":"")+"\n"+
(S.lastEval?("Evaluator ("+S.lastEval.date+", "+S.lastEval.kind+"): "+S.lastEval.pct+"% · gaps to study first: "+(S.lastEval.gaps.length?S.lastEval.gaps.map(k=>TOPICS[k]?.name||k).join(" > "):"none")+"\n"):"")+
(missedIds.length?("Recent misses:\n"+missedTxt+"\n"):"")+
// v3.0.1: include the v3.0 measurement layer in the export (guessed flags, diagnostics, written answers + rationales)
(function(){ const g=Object.entries(S.qstats).filter(([id,s])=>(s.gr||0)+(s.gw||0)>0); if(!g.length) return "";
  return "Guessed-flagged: "+g.map(([id,s])=>"["+id+"] "+(s.gr||0)+" right-but-guessed / "+(s.gw||0)+" wrong-guessed").join(" · ")+"\n"; })()+
(function(){ const k=Object.entries(S.qstats).filter(([id,s])=>(s.dk||0)>0); if(!k.length) return "";
  return "Don't-know (unlearned) flagged: "+k.map(([id,s])=>"["+id+"] ×"+s.dk).join(" · ")+" — these need LEARN-first, not re-drilling\n"; })()+
(function(){ const A=S.attempts||[]; if(!A.length) return "";
  const secs=A.filter(a=>a.d>0).map(a=>a.d).sort((a,b)=>a-b); const med=secs.length?secs[Math.floor(secs.length/2)]:0;
  const clean=A.filter(a=>a.ok&&!a.g).length;
  return "Event log (v3.2): "+A.length+" attempts · "+clean+" clean-right · median "+med+"s/answer · since "+new Date(A[0].ts).toLocaleDateString()+"\n"; })()+
(S.diags.length?("Diagnostics: "+S.diags.slice(-6).map(d=>(d.type==="cum"?"CUM ":"SCOPE ")+d.pct+"% ("+d.date+(d.scope?", "+d.scope:"")+")").join(" · ")+"\n"):"")+
((S.wrLog||[]).length?("Written answers & rationales (last 8, for Claude's process-grading):\n"+S.wrLog.slice(-8).map(w=>"  ["+w.id+"] "+(w.ok?"self-✓":"self-✗")+(w.guessed?" (guessed)":"")+" — \""+String(w.text).slice(0,160)+"\"").join("\n")+"\n"):"")+
"Storage: "+(safeStore.persistent?"persistent":"SESSION-ONLY (progress not saved!)")+"\n";
  // v3.11: attempt-history entry point, above the export — it's the thing he'll open most.
  const hist=el("div",{class:"card"});
  const nA=(S.attempts||[]).length, nN=(S.wrLog||[]).length;
  hist.innerHTML='<span class="tag violet">📜 History</span><h2>Attempt history</h2>'+
    '<p class="muted" style="margin-bottom:10px">Every answer you\'ve given, newest first — what you picked, your 🎲 guessed / 🤷 unlearned flags, how long it took, and any reasoning you typed. Tap a question to see its whole trail and whether you\'re actually improving on it.'+
    (nA?' <b>'+nA+'</b> attempts · <b>'+nN+'</b> with your reasoning saved.':'')+'</p>';
  hist.appendChild(el("button",{class:"btn violet",onclick:()=>{S.attView={topic:"all",outcome:"all",limit:60,qid:null};go("attempts");}},"Open attempt history →"));
  v.appendChild(hist);

  const c=el("div",{class:"card"});
  c.innerHTML='<span class="tag coral">Close the loop</span><h2>Report to Claude</h2><p class="muted" style="margin-bottom:10px">This feeds your Learning Profile — adherence, error patterns, what stuck. Copy it, paste it into the chat, and the ledger gets updated with real data instead of vibes.</p>';
  const ta=el("textarea",{class:"report",readonly:"readonly"}); ta.value=txt; c.appendChild(ta);
  const b=el("button",{class:"btn coral",style:"margin-top:10px",onclick:()=>{ ta.select(); try{ navigator.clipboard.writeText(txt); b.textContent="✓ Copied";}catch(e){ document.execCommand("copy"); b.textContent="✓ Copied"; } setTimeout(()=>b.textContent="Copy report",1600); }},"Copy report");
  c.appendChild(b);
  v.appendChild(c);
  v.appendChild(el("div",{class:"card cream"},'<h3>When the syllabus lands</h3><p class="muted">Bring the course files to Claude — this app is built to grow: the TRACK swaps to real weeks, per-chapter question banks append to the same schema, and the Lab gains whatever molecules your problem sets use. v2.0 → v3.0 in one session.</p>'));
};

render(); cloudPull(); canvasPull(); // v3.5
