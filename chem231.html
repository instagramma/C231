{id:"l1s1",topic:"hybrid",type:"mc",diff:2,prompt:"Pi (π) bonds are formed by:",choices:["Side-on overlap of two UNhybridized p orbitals","Head-on overlap of hybridized orbitals","Side-on overlap of hybridized orbitals","Overlap of two s orbitals"],answer:0,why:"σ bonds = head-on overlap of <b>hybridized</b> orbitals; π bonds = side-on overlap of <b>unhybridized p</b> orbitals (they must be in the same plane; there's a node at the nucleus plane). Lecture 8/20: she called this a classic glitch."},
{id:"l1s2",topic:"hybrid",type:"mc",diff:1,prompt:"Hydrogen forms its sigma bonds using:",choices:["Its 1s orbital — H is never hybridized","An sp orbital","An sp³ orbital","An unhybridized p orbital"],answer:0,why:"<b>Hydrogen is the exception</b>: it always bonds with its 1s orbital, never hybridized. Every other σ bond in Ch 1 uses hybridized orbitals."},
{id:"l1s5",topic:"hybrid",type:"mc",diff:2,prompt:"A LOCALIZED lone pair sits in:",choices:["A hybridized orbital matching the hybridization of its atom","An unhybridized p orbital, always","An sp³ orbital, always","The 1s orbital"],answer:0,why:"Her exact rule (8/20): <b>localized lone pairs live in hybridized orbitals</b> — and WHICH one is set by the hybridization of the atom they sit on. sp³ N → lone pair in sp³ orbital; sp² N → sp². In Ch 1, every lone pair you'll be asked about is localized. (Delocalized pairs arrive in Ch 2.)"},
{id:"l1s3",topic:"hybrid",type:"text",diff:2,prompt:"A nitrogen is sp² hybridized and carries a localized lone pair. Which orbital is the lone pair in? (type like sp2)",answer:"sp2",why:"Lone pair orbital = the atom's hybridization → <b>sp²</b>. She said: 'you need to be able to tell me which orbital the lone pair is in.'"},
{id:"l1s4",topic:"hybrid",type:"text",diff:2,prompt:"An sp³ nitrogen (3 bonds + 1 lone pair) holds its lone pair in which orbital? (type like sp3)",answer:"sp3",why:"Same rule: localized lone pair lives in a hybridized orbital matching its atom → <b>sp³</b>."},
{id:"l1g1",topic:"hybrid",type:"num",diff:1,prompt:"Bond angle (degrees) for a trigonal planar electron geometry?",answer:120,why:"Tetrahedral 109.5° · trigonal planar <b>120°</b> · linear 180°."},
{id:"l1g2",topic:"hybrid",type:"mc",diff:2,prompt:"NH₃'s H–N–H bond angle is:",choices:["≈107° — the lone pair takes more volume and compresses the bonds below 109.5°","Exactly 109.5° — 4 electron domains","120° — three atoms attached","90° — p orbitals"],answer:0,why:"Lone pairs occupy MORE volume than bonding pairs → repulsion pushes the N–H bonds together → <b>less than 109.5°</b> (~107°; water ~105° with two lone pairs). She requires: know it's <b>less than 109.5</b>, not the exact numbers."},
{id:"l1g3",topic:"hybrid",type:"mc",diff:3,prompt:"SO₂: what is the O–S–O bond angle?",choices:["Slightly LESS than 120° — steric number 3 (sp², trigonal planar) with a lone pair compressing","109.5° — like water","Exactly 120°","180° — linear like CO₂"],answer:0,why:"Her named trap: students answer 109.5 by pattern-matching to H₂O. Work it: S has 2 bonded atoms + 1 lone pair → steric number <b>3</b> → sp², trigonal planar electron geometry, bent shape → base angle 120°, compressed slightly below by the lone pair. <b>To get a bond angle you MUST go through the geometry.</b>"},
{id:"l1p1",topic:"polarity",type:"mc",diff:3,prompt:"ΔEN for C–Br is 0.3 (below the 0.5 'pure covalent' cutoff). The C–Br bond is:",choices:["Polar — carbon bonded to ANY halogen is always polar, regardless of ΔEN","Pure covalent — ΔEN < 0.5","Ionic — Br is much bigger","Nonpolar — the electrons are shared equally"],answer:0,why:"Her TOP TIP, verbatim: <b>'carbon bonded to a halogen is ALWAYS a polar bond, regardless of the ΔEN.'</b> ΔEN alone oversimplifies — real polarity is charge distribution over DISTANCE, and Br is a big atom. Named trap: assessments hand you EN values hoping you'll calculate and answer 'pure covalent.'"},
{id:"l1p2",topic:"polarity",type:"num",diff:1,prompt:"Below what ΔEN (course values) is a bond considered 'pure covalent'? (e.g. 0.4)",answer:0.5,why:"Course cutoffs: ΔEN &lt; <b>0.5</b> pure covalent · 0.5–1.7 polar covalent · &gt; 1.7 ionic. (Use OUR values — homework is based on them.) But remember the C–halogen override."},
{id:"l1p4",topic:"polarity",type:"mc",diff:2,prompt:"CCl₄ (carbon tetrachloride) has four polar C–Cl bonds. The MOLECULE is:",choices:["Nonpolar — four identical bond dipoles on a tetrahedron cancel (sum to zero)","Polar — it contains polar bonds","Ionic","Nonpolar — C–Cl bonds aren't polar"],answer:0,why:"Bond polarity ≠ molecular polarity. Four identical vectors on a tetrahedron <b>sum to zero</b> → no net dipole → nonpolar molecule, despite four polar bonds. The four cancel cases: tetrahedral-identical (CCl₄), trigonal-planar-identical (BF₃), linear (CO₂), and trans-disubstituted alkenes."},
{id:"l1p5",topic:"polarity",type:"mc",diff:2,prompt:"Swap one Cl of CCl₄ for Br → CCl₃Br. Now the molecule is:",choices:["Polar — the C–Br dipole is smaller than C–Cl, so the vectors no longer cancel","Still nonpolar — it's still tetrahedral","Nonpolar — Br isn't electronegative enough","Ionic"],answer:0,why:"Cancellation requires <b>identical</b> atoms at every position. C–Br has a smaller bond dipole than C–Cl (Cl is more electronegative), so the vector sum ≠ 0 → polar."},
{id:"l1p6",topic:"polarity",type:"mc",diff:2,prompt:"BF₃ (trigonal planar, three polar B–F bonds) is:",choices:["Nonpolar — three identical dipoles at 120° sum to zero","Polar — F is the most electronegative element","Polar — boron is electron-poor","Ionic"],answer:0,why:"Trigonal planar with the <b>same atom at every position</b> → vectors cancel → nonpolar. Her classic example (hard to build with carbon, easy with boron)."},
{id:"l1p7",topic:"polarity",type:"mc",diff:3,prompt:"1,2-dichloroethene, two isomers:<svg viewBox='0 0 330 115' width='300' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='55' y1='53' x2='105' y2='53'/><line x1='55' y1='59' x2='105' y2='59'/><line x1='55' y1='56' x2='30' y2='31'/><line x1='55' y1='56' x2='30' y2='83'/><line x1='105' y1='56' x2='130' y2='31'/><line x1='105' y1='56' x2='130' y2='83'/><line x1='215' y1='53' x2='265' y2='53'/><line x1='215' y1='59' x2='265' y2='59'/><line x1='215' y1='56' x2='190' y2='31'/><line x1='215' y1='56' x2='190' y2='83'/><line x1='265' y1='56' x2='290' y2='31'/><line x1='265' y1='56' x2='290' y2='83'/></g><g font-size='13' fill='currentColor'><text x='12' y='28'>Cl</text><text x='22' y='95'>H</text><text x='133' y='28'>H</text><text x='128' y='95'>Cl</text><text x='68' y='108'>A</text><text x='172' y='28'>Cl</text><text x='182' y='95'>H</text><text x='293' y='28'>Cl</text><text x='288' y='95'>H</text><text x='228' y='108'>B</text></g></svg>Which isomer is NONPOLAR?",choices:["A (trans) — the two C–Cl dipoles point opposite ways and cancel","B (cis) — both Cl on the same side","Both are nonpolar","Neither — C–Cl bonds are polar so both molecules are polar"],answer:0,why:"<b>A is trans</b> (Cl on opposite sides): equal C–Cl vectors in opposite directions sum to zero → nonpolar. <b>B is cis</b>: both dipoles point the same general way → net dipole → polar. Containing polar bonds is necessary but NOT sufficient for a polar molecule."},
{id:"l1i1",topic:"imf",type:"mc",diff:2,prompt:"When water boils, what breaks?",choices:["Intermolecular forces only — every H₂O molecule stays intact","The O–H covalent bonds","Both the H-bonds and the O–H bonds","The hydrogen turns to gas first"],answer:0,why:"Her top emphasis: <b>phase changes break INTERMOLECULAR FORCES, never bonds.</b> Liquid→gas hexanol is still hexanol — nothing happened to the structure. Writing 'the bonds are harder to break' on an exam explanation = wrong."},
{id:"l1i2",topic:"imf",type:"mc",diff:3,prompt:"cis- and trans-1,2-dichloroethene (same molecular formula — stereoisomers). Which boils higher, and why?",choices:["cis — it's polar, so it has dipole–dipole ON TOP of dispersion; trans's dipoles cancel","trans — it's more symmetric so it packs better","They boil at the same temperature — same mass","cis — it has hydrogen bonding"],answer:0,why:"Same formula → mass is irrelevant. Neither has H-bonding (no H on N/O). trans: dipoles cancel → nonpolar → dispersion only. cis: net dipole → <b>dipole–dipole + dispersion</b> → stronger IMFs → higher boiling point. This was her closing worked example."},
{id:"l1i3",topic:"imf",type:"mc",diff:2,prompt:"'Hydrogen bonding' is:",choices:["An intermolecular ATTRACTION between an H (δ+) on N/O and a lone pair on another N/O — not a covalent bond","A covalent bond between hydrogen atoms","Any bond containing hydrogen","A bond between H and any electronegative atom, including C"],answer:0,why:"'And by the way, it's not a bond.' Requires H <b>directly bonded</b> to N or O (F in organic molecules is bonded to C, so no H-bonding through it). Strength order: H-bonding &gt; dipole–dipole &gt; dispersion (which everything has)."},
{id:"l1b1",topic:"bondline",type:"num",diff:1,prompt:"Bond-line structure (each line-end/vertex = a carbon; H's on carbon are NOT drawn):<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>How many implicit hydrogens are on <b>C4</b>?",answer:3,why:"C4 shows ONE bond (to C3). Carbon wants 4 → <b>3 hidden H's</b> (a CH₃). Reading rule: carbon's H's are never drawn; you supply them by counting to four."},
{id:"l1b2",topic:"bondline",type:"num",diff:2,prompt:"Same structure:<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>How many implicit hydrogens are on <b>C2</b>?",answer:1,why:"C2 has a DOUBLE bond to C1 (counts as 2) + a single bond to C3 = 3 bonds shown → <b>1 hidden H</b>. Her homework for next class is exactly this skill."},

/* v3.3 written items — lecture 1 */
{id:"WR-CH1-007",topic:"hybrid",type:"written",diff:3,prompt:"<b>Lone-pair orbitals:</b> a molecule has two nitrogens — N1 has three single bonds + 1 lone pair; N2 has a double bond, a single bond + 1 lone pair. For EACH nitrogen: give its hybridization AND name the orbital holding its lone pair. Then state the general rule.",
 model:"<b>N1:</b> 4 electron domains (3 bonds + 1 LP) → <b>sp³</b>; its lone pair is in an <b>sp³ orbital</b>. <b>N2:</b> 3 domains (double bond counts as ONE domain, + single bond + LP) → <b>sp²</b>; lone pair in an <b>sp² orbital</b>. <b>Rule:</b> a localized lone pair lives in a hybridized orbital, and WHICH one is set by the hybridization of the atom it sits on.",
 rubric:["Both hybridizations derived from domain count (double bond = one domain)","Lone-pair orbital = atom's hybridization, stated as the rule","sp³/sp² assigned to the right nitrogens"]},
{id:"WR-CH1-008",topic:"polarity",type:"written",diff:2,prompt:"<b>The C–Br trap:</b> ΔEN(C–Br) = 0.3, below the 0.5 cutoff — 'pure covalent' by the numbers. Is the C–Br bond polar? Explain what the ΔEN method misses.",
 model:"<b>Polar.</b> Course rule: carbon bonded to ANY halogen is always polar, regardless of ΔEN. The cutoff method oversimplifies: bond polarity is really <b>charge distribution over distance</b> — bromine is a much larger atom than carbon, so even a small EN difference produces a real dipole. (Related: C–Li at ΔEN 1.5 is drawn BOTH as ionic and polar covalent — it's a spectrum.)",
 rubric:["Answers polar despite the cutoff","States the C–halogen-always-polar rule","Mentions size / charge-over-distance as what ΔEN misses"]},
/* ===== v3.10 SO₂ SCAFFOLD (2026-08-25, from his report: he drew SO₂ LINEAR on WR-CH1-009
   and picked "109.5, like water" on l1g3 — same root cause, the lone pair on S is missing
   from his model. These build it one step at a time, the same way f0→f2 scaffold FC. ===== */
{id:"x3-so1",topic:"lewis",type:"num",diff:1,prompt:"SO₂ — total valence electrons? (S and O are both group 6)",answer:18,why:"<b>18</b> = 6 (S) + 6 + 6. Nothing to adjust — SO₂ is neutral, so no charge correction to the total."},
{id:"x3-so2",topic:"lewis",type:"num",diff:2,prompt:"Sulfur brings 6 valence electrons to SO₂. In the O=S=O structure it uses 4 of them to make its two double bonds. How many of sulfur's own electrons are LEFT OVER?",answer:2,why:"<b>2.</b> 6 − 4 = 2. Those two leftover electrons don't disappear — they sit on sulfur as a lone pair. <b>This is the step that decides the shape of the whole molecule</b>, and it's the one that gets skipped."},
{id:"x3-so3",topic:"hybrid",type:"num",diff:2,prompt:"Those 2 leftover electrons on sulfur in SO₂ make how many LONE PAIRS?",answer:1,why:"<b>1</b> — two electrons is one pair. So sulfur ends up with 2 bonded atoms + 1 lone pair."},
{id:"x3-so4",topic:"hybrid",type:"num",diff:2,prompt:"SO₂: sulfur has 2 bonded atoms and 1 lone pair. What is its steric number (electron domains)?",answer:3,why:"<b>3</b> — each double bond counts as ONE domain, and the lone pair counts as one. 2 + 1 = 3 → sp² → trigonal planar electron geometry → <b>bent</b> molecular shape, angle just under 120°."},
{id:"x3-so5",topic:"hybrid",type:"mc",diff:3,prompt:"CO₂ is linear but SO₂ is BENT. Both are O=X=O with two double bonds. What is the actual difference?",choices:["Sulfur has a lone pair (6 valence e⁻ − 4 bonding = 2 left); carbon has none (4 − 4 = 0)","Sulfur is heavier","CO₂'s bonds are stronger","SO₂ has more oxygens"],answer:0,why:"<b>Two electrons, and that's the whole story.</b> Carbon (group 4) spends all 4 of its valence electrons on the two double bonds → 2 domains → <b>linear</b>. Sulfur (group 6) spends 4 and has <b>2 left over</b> → a lone pair → 3 domains → <b>bent</b>. Same skeleton, different group number, different shape. If you ever draw SO₂ linear, this is the step you skipped."},
{id:"x3-so6",topic:"hybrid",type:"mc",diff:3,prompt:"You've established SO₂ is bent. What is the O–S–O angle?",choices:["Just under 120°","104.5° — same as water","109.5°","180°"],answer:0,why:"<b>Just under 120°.</b> Bent is not one angle — it's a shape that several different steric numbers can produce. SO₂ is bent from <b>SN 3</b> (base 120°); water is bent from <b>SN 4</b> (base 109.5°). Both bent, ~15° apart. Reaching for water's number whenever you see 'bent' is the exact trap Ciesla called out — <b>the steric number sets the angle, not the shape word.</b>"},
{id:"WR-CH1-009",topic:"lewis",type:"written",diff:3,prompt:"<b>SO₂ from scratch:</b> draw a Lewis structure for SO₂ (S and O are both group 6). Then give the electron geometry and the O–S–O bond angle, justified. (Two different valid structures exist — name both if you can.)",
 model:"<b>Structure 1 (minimized FC, expanded octet):</b> O=S=O with one lone pair on S — S holds 10 electrons, allowed because sulfur is period 3. <b>Structure 2:</b> O=S–O⁻ with S⁺ (octet kept, charges +1/−1). BOTH are valid and give the same answer: S has 2 bonded atoms + 1 lone pair → steric number <b>3</b> → sp², <b>trigonal planar electron geometry</b>, bent molecular shape → bond angle just <b>under 120°</b> (lone pair compression). NOT 109.5 — that's the H₂O pattern-match trap.",
 rubric:["Valid Lewis structure including the lone pair on S","Steric number 3 → trigonal planar (not tetrahedral)","Angle <120° with lone-pair justification — and not 109.5"]},
{id:"WR-CH1-010",topic:"imf",type:"written",diff:2,prompt:"<b>Exam-wording drill.</b> Setup: molecules X and Y have the SAME molecular formula. Y is polar, X is not. Y boils higher. An exam asks you to explain why.<br><br>Write your answer in two labelled parts:<br><b>Part 1 —</b> write the tempting answer that would LOSE marks, and say in one line why it's wrong.<br><b>Part 2 —</b> write the answer you'd actually hand in for full credit.<br><br>(The point is to practise spotting the losing phrasing so you don't write it under pressure.)",
 model:"<b>(1) Loses points:</b> 'Y's bonds are harder to break.' — wrong because phase changes never break covalent bonds. <b>(2) Full credit:</b> 'Y has a net dipole, so it has dipole–dipole forces in addition to dispersion; X's bond dipoles cancel, leaving dispersion only. Stronger INTERMOLECULAR forces require more energy to separate the molecules, so Y has the higher boiling point. The molecules themselves are unchanged.'",
 rubric:["Identifies 'breaking bonds' as the losing phrase","Full-credit version names the specific IMF difference","Links IMF strength → energy → boiling point, molecules intact"]},
{id:"WR-CH1-011",topic:"bondline",type:"written",diff:2,prompt:"<b>Add every hydrogen:</b> for the bond-line structure below, list the number of hydrogens on EACH carbon, then give the molecular formula.<svg viewBox='0 0 150 85' width='150' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='15' y1='60' x2='45' y2='30'/><line x1='19' y1='64' x2='49' y2='34'/><line x1='45' y1='30' x2='75' y2='60'/><line x1='75' y1='60' x2='105' y2='30'/></g><g font-size='11' fill='currentColor'><text x='4' y='76'>C1</text><text x='41' y='21'>C2</text><text x='70' y='76'>C3</text><text x='102' y='21'>C4</text></g></svg>",
 model:"Count each carbon to 4 bonds: <b>C1</b>: double bond (2) → <b>2 H</b>. <b>C2</b>: double (2) + single to C3 (1) = 3 → <b>1 H</b>. <b>C3</b>: two singles → <b>2 H</b>. <b>C4</b>: one single → <b>3 H</b>. Total: <b>C₄H₈</b> (1-butene). Rule: H's on carbon are implicit; H's on N/O/S are always drawn.",
 rubric:["Every carbon brought to exactly 4 bonds","Correct per-carbon counts (2,1,2,3)","Correct formula C₄H₈"]},
/* ---- v3.3 TUTORIAL-STANDARD SET — modeled on Ciesla's Ch-1 tutorial + official quiz scope ---- */
{id:"T-CH1-01",topic:"isomers",type:"mc",diff:1,prompt:"Two compounds are <b>constitutional isomers</b>. Which MUST be true?",choices:["Same molecular formula, different connectivity of atoms","Same connectivity, different 3-D arrangement","Same properties, different formulas","They are the same compound drawn differently"],answer:0,why:"Constitutional isomers share a molecular formula but connect their atoms differently — and structure (connectivity), not formula, determines properties. (Same connectivity/different 3-D = stereoisomers.)"},
{id:"T-CH1-02",topic:"lewis",type:"mc",diff:1,prompt:"Which bonding pattern is <b>WRONG</b> for a neutral atom in an organic molecule?",choices:["C — 4 bonds","N — 3 bonds + 1 lone pair","O — 2 bonds + 2 lone pairs","F — 2 bonds + 2 lone pairs"],answer:3,why:"Neutral halogens form 1 bond + 3 lone pairs. Memorize the neutral patterns: C=4 bonds · N=3+1LP · O=2+2LP · H=1 · halogen=1+3LP. Any deviation means a formal charge."},
{id:"T-CH1-03",topic:"hybrid",type:"mc",diff:2,prompt:"Rank C–H bond strength: ethyne (HC≡CH), ethene (H₂C=CH₂), ethane (H₃C–CH₃).",choices:["ethyne > ethene > ethane","ethane > ethene > ethyne","ethene > ethyne > ethane","all equal — they're all C–H bonds"],answer:0,why:"More s-character = shorter, stronger bond. sp (50% s, ethyne) > sp² (33%, ethene) > sp³ (25%, ethane). s orbitals hold electrons closer to the nucleus."},
{id:"T-CH1-04",topic:"hybrid",type:"mc",diff:1,prompt:"A C=C double bond consists of:",choices:["1 σ bond + 1 π bond","2 σ bonds","2 π bonds","1 σ + 2 π"],answer:0,why:"Every bond's FIRST connection is a σ (head-on overlap of hybridized orbitals). The second is a π — side-on overlap of unhybridized p orbitals. π is the weaker of the two."},
{id:"T-CH1-05",topic:"hybrid",type:"mc",diff:2,prompt:"A p orbital has:",choices:["two lobes of opposite phase separated by a node","one spherical lobe, no nodes","two lobes of the same phase","a node only at infinite distance"],answer:0,why:"p orbitals are dumbbells: two lobes of opposite phase (+/−) with a node (zero electron density) at the nucleus. Bonding requires CONSTRUCTIVE overlap — same-phase lobes meeting."},
{id:"T-CH1-06",topic:"polarity",type:"mc",diff:1,prompt:"On an electrostatic potential map of water, the <b>red</b> region sits on:",choices:["the oxygen (high electron density, δ−)","the hydrogens (δ+)","the O–H bond midpoints","nowhere — water is nonpolar"],answer:0,why:"EPM color code: red = electron-rich (δ−), blue = electron-poor (δ+). O is the most electronegative atom in water, so red concentrates there; the H end reads blue."},
{id:"T-CH1-07",topic:"imf",type:"mc",diff:2,prompt:"Pentane and neopentane (2,2-dimethylpropane) are both C₅H₁₂. Which boils higher, and why?",choices:["Pentane — linear shape gives more surface contact for London forces","Neopentane — branching adds strain","They boil identically — same formula, same mass","Neopentane — spheres pack tighter"],answer:0,why:"Same mass → same-strength question comes down to CONTACT AREA. Linear pentane molecules touch along their whole length (more LDF); branched neopentane is ball-shaped with less contact. Branching LOWERS boiling point."},
{id:"T-CH1-08",topic:"imf",type:"mc",diff:1,prompt:'"Like dissolves like": which pair actually mixes?',choices:["CH₃OH and H₂O — both hydrogen-bond","hexane and H₂O — both contain H","NaCl and hexane — opposites attract","CO₂ and H₂O — both contain oxygen"],answer:0,why:"Polar/H-bonding dissolves polar/H-bonding; nonpolar dissolves nonpolar. Methanol H-bonds with water. Hexane (nonpolar, LDF-only) can't pay the energy cost of breaking water's H-bond network."},
{id:"T-CH1-09",topic:"imf",type:"mc",diff:2,prompt:"Why does oil NOT dissolve in water?",choices:["Mixing would break water's H-bonds but oil offers only weak LDF in return","Oil is denser than water","Oil molecules repel water electrostatically","Oil's covalent bonds can't break in water"],answer:0,why:"Solubility is an energy trade. Water gives up strong H-bonding interactions to make room; nonpolar oil can only repay with weak dispersion forces. Bad trade → no mixing. (No covalent bonds break in dissolving.)"},
{id:"T-CH1-10",topic:"valence",type:"mc",diff:2,prompt:"On the potential-energy curve for H + H approaching, the bond length corresponds to:",choices:["the minimum of the curve — attraction and repulsion balanced","the point where PE = 0","the closest possible approach","where attraction is strongest"],answer:0,why:"Bonds form because energy is RELEASED as atoms approach (attraction between each nucleus and both electrons). Too close, nucleus–nucleus repulsion spikes. The PE minimum = most stable separation = bond length."},
{id:"WR-CH1-101",topic:"lewis",type:"written",diff:3,prompt:"<b>Tutorial standard:</b> C₃H₉N has FOUR constitutional isomers. Describe (or draw in your notebook) all four — name the connectivity of each.<br><span class='muted'>Hint: move the N through the chain: end, middle, in-chain, fully branched.</span>",
 model:"1) <b>CH₃CH₂CH₂–NH₂</b> (propan-1-amine: N on the end). 2) <b>(CH₃)₂CH–NH₂</b> (propan-2-amine: N on the middle carbon). 3) <b>CH₃–NH–CH₂CH₃</b> (N-methylethanamine: N inside the chain). 4) <b>(CH₃)₃N</b> (trimethylamine: N bonded to three CH₃). All are C₃H₉N; each N keeps 3 bonds + 1 lone pair.",
 rubric:["All four connectivities found","Same formula C₃H₉N verified for each","N has 3 bonds + 1 lone pair in every isomer"]},
{id:"WR-CH1-102",topic:"polarity",type:"written",diff:2,prompt:"<b>Tutorial standard:</b> label δ+ and δ− in each bond and justify: (a) Cl–P (b) C–Br (c) H–N.",
 model:"(a) Cl is more electronegative than P → <b>Cl δ−, P δ+</b>. (b) <b>Br δ−, C δ+</b> — and remember: C bonded to ANY halogen counts as a polar bond even when ΔEN looks small (C–Br ΔEN ≈ 0.3). (c) N is more electronegative than H → <b>N δ−, H δ+</b> (this polarity is what enables hydrogen bonding).",
 rubric:["δ− on the more electronegative atom in all three","C–halogen treated as polar despite small ΔEN","Reasoning references electronegativity, not memorization"]},
{id:"WR-CH1-103",topic:"polarity",type:"written",diff:3,prompt:"<b>Tutorial standard:</b> CHCl₃ has a LARGER molecular dipole moment than CFCl₃. Use the 3-D (tetrahedral) structures and bond dipoles to explain why.",
 model:"Both are tetrahedral. In <b>CHCl₃</b>, the three C–Cl dipoles sum to a net vector and the C–H bond adds almost no opposing dipole → large net dipole. In <b>CFCl₃</b>, the C–F bond is strongly polar in the OPPOSITE direction of the three C–Cl sum — F pulls against the chlorines, partially canceling → smaller net dipole. Molecular polarity is a VECTOR SUM: an opposing strong dipole shrinks the total.",
 rubric:["Treats bond dipoles as vectors in 3-D","C–F opposes the C–Cl resultant in CFCl₃","Concludes partial cancellation → smaller net dipole"]},
{id:"WR-CH1-104",topic:"hybrid",type:"written",diff:3,prompt:"<b>Tutorial standard (real molecule):</b> in tert-butyl isonitrile, (CH₃)₃C–N⁺≡C⁻ — (a) hybridization of the central C of the tert-butyl group, the N, and the terminal C; (b) which orbital holds the terminal carbon's lone pair; (c) predict the C–N–C angle.",
 model:"(a) tert-butyl C: 4 σ bonds → <b>sp³</b>. N: 2 σ domains (C–N σ + N≡C σ), no lone pair on N⁺ → <b>sp</b>. Terminal C: 1 σ + 1 lone pair = 2 domains → <b>sp</b>. (b) A LOCALIZED lone pair lives in a HYBRID orbital matching its atom's hybridization → the terminal C's lone pair is in an <b>sp orbital</b>. (c) N is sp with no lone pairs → C–N–C = <b>180° (linear)</b>.",
 rubric:["Hybridizations from domain counts (sp³ / sp / sp)","Lone pair placed in the atom's hybrid orbital (sp)","180° from sp nitrogen"]},
{id:"WR-CH1-105",topic:"hybrid",type:"written",diff:3,prompt:"<b>Tutorial standard (real molecule):</b> in the isonitrile dihalide (CH₃)₃C–N=CCl₂ the N carries a lone pair — (a) hybridization of N; (b) which orbital holds N's lone pair; (c) predict the C–N=C angle.",
 model:"(a) N has 3 domains: σ to C(CH₃)₃, σ+π to CCl₂ (the double bond counts once), and 1 lone pair → <b>sp²</b>. (b) The localized lone pair sits in an <b>sp² orbital</b> (lone pairs live in hybrid orbitals matching the atom's hybridization). (c) sp² base angle 120°, compressed slightly by the bulky lone pair → <b>a bit less than 120°</b>.",
 rubric:["3 domains → sp² (double bond = one domain)","Lone pair in sp² hybrid orbital","<120° with lone-pair compression reasoning"]},

/* ===== v3.4 CONSTITUTIONAL ISOMER SET (complements T-CH1-01 definition + WR-CH1-101 C₃H₉N) ===== */
{id:"iso2",topic:"isomers",type:"mc",diff:1,prompt:"Both structures below are C₄H₁₀:<svg viewBox='0 0 260 90' width='240' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='12' y1='60' x2='38' y2='32'/><line x1='38' y1='32' x2='64' y2='60'/><line x1='64' y1='60' x2='90' y2='32'/><line x1='150' y1='62' x2='176' y2='34'/><line x1='176' y1='34' x2='202' y2='62'/><line x1='176' y1='34' x2='176' y2='8'/></g><g font-size='12' fill='currentColor'><text x='44' y='82'>A</text><text x='170' y='82'>B</text></g></svg>They are:",choices:["Constitutional isomers — same formula, different connectivity (butane vs isobutane)","The same molecule drawn differently","Stereoisomers","Not isomers — different formulas"],answer:0,why:"A = butane (4-carbon chain). B = isobutane/2-methylpropane (3-carbon chain + branch). Same C₄H₁₀, <b>different connectivity</b> → constitutional isomers. Different compounds, different boiling points."},
{id:"iso8",topic:"isomers",type:"mc",diff:2,prompt:"Both structures below are C₅H₁₂:<svg viewBox='0 0 280 95' width='250' style='display:block;margin:8px 0'><g stroke='currentColor' fill='none' stroke-width='2'><line x1='10' y1='60' x2='34' y2='34'/><line x1='34' y1='34' x2='58' y2='60'/><line x1='58' y1='60' x2='82' y2='34'/><line x1='82' y1='34' x2='106' y2='60'/><line x1='150' y1='30' x2='176' y2='56'/><line x1='176' y1='56' x2='202' y2='30'/><line x1='202' y1='30' x2='228' y2='56'/><line x1='228' y1='56' x2='228' y2='84'/></g><g font-size='12' fill='currentColor'><text x='52' y='84'>A</text><text x='185' y='84'>B</text></g></svg>They are:",choices:["The SAME molecule — both are an unbranched 5-carbon chain (pentane), just drawn with different kinks","Constitutional isomers","Stereoisomers","Different compounds entirely"],answer:0,why:"<b>Trap.</b> Trace the connectivity: both are C–C–C–C–C with no branches — the drawing's kinks mean nothing. Same connectivity = <b>same compound</b> (pentane). Before calling two drawings isomers, CHECK the connectivity, not the shape on paper."},
{id:"iso3",topic:"isomers",type:"mc",diff:2,prompt:"cis- and trans-1,2-dichloroethene are:",choices:["STEREOisomers — same connectivity, different 3-D arrangement (NOT constitutional)","Constitutional isomers — the Cl's are in different places","The same compound","Not isomers — different formulas"],answer:0,why:"Every atom is bonded to the same partners in both — only the 3-D arrangement across the rigid C=C differs → <b>stereoisomers</b>. (In lecture 8/20 she said 'constitutional' then corrected herself to 'stereoisomers' — this exact distinction.) Constitutional requires DIFFERENT connectivity."},
{id:"iso4",topic:"isomers",type:"num",diff:1,prompt:"How many constitutional isomers exist for C₄H₁₀?",answer:2,why:"<b>2</b>: butane (straight chain) and isobutane/2-methylpropane (branched). That's the whole set."},
{id:"iso5",topic:"isomers",type:"num",diff:2,prompt:"How many constitutional isomers exist for C₅H₁₂?",answer:3,why:"<b>3</b>: pentane (straight), 2-methylbutane (one branch), and 2,2-dimethylpropane / neopentane (two methyls on the middle carbon). Systematic method: longest chain first, then shorten by one and place branches, never duplicating a connectivity."},
{id:"iso6",topic:"isomers",type:"mc",diff:2,prompt:"Ethanol (CH₃CH₂–OH) and dimethyl ether (CH₃–O–CH₃) are both C₂H₆O. They are:",choices:["Constitutional isomers — and their boiling points differ by over 100 °C","The same compound","Stereoisomers","Resonance structures"],answer:0,why:"Same formula, different connectivity (O–H vs C–O–C) → constitutional isomers with different FUNCTIONAL GROUPS. Consequence: ethanol H-bonds (bp 78 °C); dimethyl ether can't (no O–H; bp −24 °C). Constitutional isomers can have wildly different properties — this pair is the classic exam example."},
{id:"iso7",topic:"isomers",type:"mc",diff:1,prompt:"Which pair is NOT a pair of isomers at all?",choices:["CH₄ and C₂H₆ — different molecular formulas","Butane and isobutane","Ethanol and dimethyl ether","cis- and trans-2-butene"],answer:0,why:"Isomer = same molecular formula, full stop. CH₄ vs C₂H₆ are just different compounds. (Butane/isobutane and ethanol/DME = constitutional; cis/trans-2-butene = stereo.)"},
{id:"WR-CH1-012",topic:"isomers",type:"written",diff:3,prompt:"<b>Classify with justification</b> — for each pair, write: constitutional isomers, stereoisomers, or same compound — plus ONE line of reasoning each.<br>(a) butane & 2-methylpropane &nbsp; (b) cis- & trans-2-butene &nbsp; (c) pentane drawn as a zigzag & pentane drawn with a U-bend",
 model:"<b>(a) Constitutional isomers</b> — same C₄H₁₀, different connectivity (straight chain vs branched). <b>(b) Stereoisomers</b> — same connectivity everywhere; only the 3-D arrangement across the rigid C=C differs. <b>(c) Same compound</b> — connectivity identical (unbranched C₅ chain); a drawing's bends are not chemistry. Decision routine: 1) same formula? if no → not isomers. 2) same connectivity? if no → constitutional. 3) same connectivity, different 3-D → stereo.",
 rubric:["All three classified correctly (constitutional / stereo / same)","Reasoning uses CONNECTIVITY, not drawing shape","States or implies the 3-step decision routine"]},

{id:"EXACT-ISO-20260825-01",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+sourceShot("exact-01-same-compound.png",2042,964,175,350,770,315,"Two drawings of a chlorinated five-carbon structure"),choices:ISOMER_CHOICES,answer:0,why:"<b>Same compound.</b> Both drawings are CH₃–CH(CH₃)–CH(Cl)–CH₃ (C₅H₁₁Cl). Trace neighbors instead of the page shape: the same two middle carbons carry the methyl branch and Cl in both drawings. Only the orientation changed."},
{id:"EXACT-ISO-20260825-02",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+sourceShot("exact-02-constitutional-isomers.png",1968,602,105,85,900,245,"1-butanol and diethyl ether structures"),choices:ISOMER_CHOICES,answer:1,why:"<b>Constitutional isomers.</b> Both are C₄H₁₀O, but the left is 1-butanol (C–C–C–C–O–H) and the right is diethyl ether (C–C–O–C–C). Same formula, different O connectivity."},
{id:"EXACT-ISO-20260825-03",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+sourceShot("exact-03-unrelated-compounds.png",2000,638,115,105,850,220,"Propylene oxide and 1-propanol structures"),choices:ISOMER_CHOICES,answer:2,why:"<b>Unrelated compounds for this classification.</b> Propylene oxide is C₃H₆O; 1-propanol is C₃H₈O. Different molecular formulas means they cannot be isomers. Stop at formula before comparing connectivity."},
{id:"EXACT-ISO-20260825-04",topic:"isomers",type:"mc",diff:3,prompt:ISOMER_PROMPT+sourceShot("exact-04-same-compound.png",1882,666,140,115,930,355,"Two drawings of 3-methylpentane"),choices:ISOMER_CHOICES,answer:0,why:"<b>Same compound.</b> In both drawings the branching carbon is bonded to H, one CH₃ group, and two CH₂CH₃ groups: 3-methylpentane, C₆H₁₄. Choosing a different-looking chain through the same graph does not change connectivity."},
{id:"EXACT-ISO-20260825-05",topic:"isomers",type:"mc",diff:3,prompt:ISOMER_PROMPT+sourceShot("exact-05-constitutional-isomers.png",1850,712,30,110,900,305,"Two dibrominated four-carbon structures"),choices:ISOMER_CHOICES,answer:1,why:"<b>Constitutional isomers.</b> Both are C₄H₈Br₂. The left is BrCH₂–CHBr–CH₂–CH₃ (1,2-dibromobutane); the right is BrCH₂–C(Br)(CH₃)₂ (1,2-dibromo-2-methylpropane). Same atom count, different carbon skeleton/connectivity."},
{id:"EXACT-ISO-20260825-06",topic:"isomers",type:"mc",diff:3,prompt:ISOMER_PROMPT+sourceShot("exact-06-constitutional-isomers.png",1894,648,55,125,760,225,"Tetrahydrofuran and 2-butanone structures"),choices:ISOMER_CHOICES,answer:1,why:"<b>Constitutional isomers.</b> Tetrahydrofuran and 2-butanone are both C₄H₈O. In one, O is part of a five-membered cyclic ether; in the other, O is double-bonded in a ketone. Same formula, different connectivity."},

/* Similar transfer items: new molecules, same three-choice classification. */
{id:"SIM-ISO-20260825-01",topic:"isomers",type:"mc",diff:1,prompt:ISOMER_PROMPT+structurePair("CH₃–CH(CH₃)–CH₂–CH₃","CH₃–CH₂–CH(CH₃)–CH₃"),choices:ISOMER_CHOICES,answer:0,why:"<b>Same compound.</b> Read the second formula from right to left: both are 2-methylbutane, C₅H₁₂. Reversing the direction used to write a chain does not change which atoms are bonded."},
{id:"SIM-ISO-20260825-02",topic:"isomers",type:"mc",diff:1,prompt:ISOMER_PROMPT+structurePair("CH₃–CH₂–CH₂–OH","CH₃–CH(OH)–CH₃"),choices:ISOMER_CHOICES,answer:1,why:"<b>Constitutional isomers.</b> Both are C₃H₈O, but the OH is on an end carbon in 1-propanol and on the middle carbon in 2-propanol. Same formula, different connectivity."},
{id:"SIM-ISO-20260825-03",topic:"isomers",type:"mc",diff:1,prompt:ISOMER_PROMPT+structurePair("cyclobutane (four-carbon ring)","CH₃–CH₂–CH₂–CH₃"),choices:ISOMER_CHOICES,answer:2,why:"<b>Unrelated compounds for this classification.</b> Cyclobutane is C₄H₈; butane is C₄H₁₀. A ring removes two hydrogens, so the formulas differ and the pair cannot be isomers."},
{id:"SIM-ISO-20260825-04",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+structurePair("C(CH₃)₄","CH₃–C(CH₃)₂–CH₃"),choices:ISOMER_CHOICES,answer:0,why:"<b>Same compound.</b> Both notations show one central carbon bonded to four CH₃ groups: 2,2-dimethylpropane (neopentane), C₅H₁₂."},
{id:"SIM-ISO-20260825-05",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+structurePair("CH₃–CH₂–CH₂–CHO","CH₃–CO–CH₂–CH₃"),choices:ISOMER_CHOICES,answer:1,why:"<b>Constitutional isomers.</b> Butanal and 2-butanone are both C₄H₈O, but one has a terminal aldehyde carbonyl and the other has an internal ketone carbonyl."},
{id:"SIM-ISO-20260825-06",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+structurePair("tetrahydrofuran (C₄H₈O)","CH₃–CH₂–CH₂–CH₂–OH"),choices:ISOMER_CHOICES,answer:2,why:"<b>Unrelated compounds for this classification.</b> Tetrahydrofuran is C₄H₈O; 1-butanol is C₄H₁₀O. The formulas differ by H₂, so they are not isomers."},
{id:"SIM-ISO-20260825-07",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+structurePair("BrCH₂–CHBr–CH₂–CH₃","CH₃–CH₂–CHBr–CH₂Br"),choices:ISOMER_CHOICES,answer:0,why:"<b>Same compound.</b> Reading the second structure from right to left gives the first exactly: 1,2-dibromobutane. Same formula and same connectivity."},
{id:"SIM-ISO-20260825-08",topic:"isomers",type:"mc",diff:2,prompt:ISOMER_PROMPT+structurePair("CH₃–CH₂–CH₂–CH₂Br","CH₃–CHBr–CH₂–CH₃"),choices:ISOMER_CHOICES,answer:1,why:"<b>Constitutional isomers.</b> Both are C₄H₉Br, but Br is attached to C1 in 1-bromobutane and C2 in 2-bromobutane. Different atom-to-atom connectivity."},
{id:"SIM-ISO-20260825-09",topic:"isomers",type:"mc",diff:1,prompt:ISOMER_PROMPT+structurePair("BrCH₂–CHBr–CH₂–CH₃","ClCH₂–CHCl–CH₂–CH₃"),choices:ISOMER_CHOICES,answer:2,why:"<b>Unrelated compounds.</b> One formula is C₄H₈Br₂ and the other is C₄H₈Cl₂. Replacing Br with Cl changes the molecular formula, so they are not isomers."},
{id:"SIM-ISO-20260825-10",topic:"isomers",type:"mc",diff:3,prompt:ISOMER_PROMPT+structurePair("CH₃CH₂–CH(CH₃)–CH₂CH₃","CH₃–CH(CH₂CH₃)–CH₂CH₃"),choices:ISOMER_CHOICES,answer:0,why:"<b>Same compound.</b> In each notation the central CH is attached to one methyl group and two ethyl groups: 3-methylpentane, C₆H₁₄. The apparent main chain is a drawing choice, not new connectivity."},
{id:"SIM-ISO-20260825-11",topic:"isomers",type:"mc",diff:3,prompt:ISOMER_PROMPT+structurePair("CH₃CH₂CH₂COOH","CH₃COOCH₂CH₃"),choices:ISOMER_CHOICES,answer:1,why:"<b>Constitutional isomers.</b> Butanoic acid and ethyl acetate are both C₄H₈O₂. The first has a carboxylic-acid –C(=O)OH group; the second has an ester –C(=O)O– linkage."},
{id:"SIM-ISO-20260825-12",topic:"isomers",type:"mc",diff:1,prompt:ISOMER_PROMPT+structurePair("cyclopropane (C₃H₆)","CH₃–CO–CH₃ (C₃H₆O)"),choices:ISOMER_CHOICES,answer:2,why:"<b>Unrelated compounds.</b> Propanone contains oxygen and cyclopropane does not: C₃H₆O versus C₃H₆. Different formulas means not isomers."},

/* ===== v3.18 EXACT LEWIS / FORMAL-CHARGE IMAGE BATCH (Gabe upload, 2026-08-25) =====
   Exact drawing prompts 01-03 are first-class checked targets in Lewis Lab. The eight
   auto-graded items below preserve the original structure pixels, and every one also links
   to the corresponding drawing target for reconstruction practice. */
{id:"EXACT-FC-20260825-01",topic:"formal",type:"num",diff:2,drawMol:"AlH4-",prompt:"Identify the missing formal charge on Al in the structure below. Enter −1, 0, or +1."+fcShot("exact-04-alh4-charge.png",1914,1084,135,0,650,310,"Al bonded to four hydrogen atoms"),answer:-1,why:"<b>Al is −1.</b> Aluminum has 3 valence electrons, 0 nonbonding electrons, and 4 bond orders: FC = 3 − 0 − 4 = <b>−1</b>. The whole species is AlH₄⁻."},
{id:"EXACT-FC-20260825-02",topic:"formal",type:"num",diff:1,drawMol:"H3O+",prompt:"Identify the missing formal charge on O in the structure below. Enter −1, 0, or +1."+fcShot("exact-05-h3o-charge.png",1926,994,160,40,520,300,"Oxygen bonded to three hydrogens with one lone pair"),answer:1,why:"<b>O is +1.</b> FC = 6 − 2 nonbonding electrons − 3 bond orders = <b>+1</b>. This is hydronium, H₃O⁺."},
{id:"EXACT-FC-20260825-03",topic:"formal",type:"multi",diff:2,drawMol:"CH3O+",prompt:"Identify the missing formal charges in protonated formaldehyde."+fcShot("exact-06-protonated-formaldehyde.png",1064,500,120,35,520,290,"Protonated formaldehyde with a carbon-oxygen double bond and an oxygen-hydrogen bond"),fields:[{label:"Charge on O",answer:1},{label:"Charge on C",answer:0}],why:"The oxygen has 3 bond orders and 1 lone pair: FC = 6 − 2 − 3 = <b>+1</b>. Carbon has 4 bond orders and no lone pairs: FC = 4 − 0 − 4 = <b>0</b>."},
{id:"EXACT-FC-20260825-04",topic:"formal",type:"num",diff:1,drawMol:"CH3-",prompt:"Identify the missing formal charge on carbon in the structure below. Enter −1, 0, or +1."+fcShot("exact-07-methyl-anion.png",1024,422,65,40,500,270,"Carbon bonded to three hydrogens with one lone pair"),answer:-1,why:"A 3-bond carbon <i>with</i> one lone pair has FC = 4 − 2 − 3 = <b>−1</b>. This is CH₃⁻, the methyl anion."},
{id:"EXACT-FC-20260825-05",topic:"formal",type:"num",diff:1,drawMol:"CH3+",prompt:"Identify the missing formal charge on carbon in the structure below. Enter −1, 0, or +1."+fcShot("exact-08-methyl-cation.png",986,388,35,35,500,240,"Carbon bonded to three hydrogens with no lone pair"),answer:1,why:"A 3-bond carbon with <i>no</i> lone pair has FC = 4 − 0 − 3 = <b>+1</b>. This is CH₃⁺, the methyl cation. It has only six electrons around carbon."},
{id:"EXACT-FC-20260825-06",topic:"formal",type:"multi",diff:3,drawMol:"AlCl5",prompt:"Use the labels in the exact structure to identify the formal charges."+fcShot("exact-09-alcl5-labeled.png",1070,974,65,40,650,620,"An aluminum-chlorine structure with labeled aluminum a, bridging chlorine b, and terminal chlorine c"),fields:[{label:"Charge on boxed atom a (Al)",answer:-1},{label:"Charge on boxed atom b (bridging Cl)",answer:1},{label:"Charge on boxed atom c (terminal Cl)",answer:0}],why:"<b>a = −1, b = +1, c = 0.</b> Al has four bonds: 3 − 4 = −1. The bridging Cl has two bonds and two lone pairs: 7 − 4 − 2 = +1. The terminal Cl has one bond and three lone pairs: 7 − 6 − 1 = 0."},
{id:"EXACT-FC-20260825-07",topic:"formal",type:"multi",diff:3,drawMol:"glycine-zwitterion",prompt:"Use the labels in the exact glycine structure to identify the formal charges."+fcShot("exact-10-glycine-zwitterion.png",1308,826,70,25,1000,600,"Glycine zwitterion with labeled nitrogen, carbonyl oxygen, carbonyl carbon, and single-bond oxygen"),fields:[{label:"Charge on atom a (N)",answer:1},{label:"Charge on atom b (C=O oxygen)",answer:0},{label:"Charge on atom c (carbonyl C)",answer:0},{label:"Charge on atom d (single-bond O)",answer:-1}],why:"<b>a = +1, b = 0, c = 0, d = −1.</b> Four-bond N is +1. Double-bond O with two lone pairs is neutral. Four-bond-order carbon is neutral. Single-bond O with three lone pairs is −1. The + and − charges cancel in the zwitterion."},
{id:"EXACT-FC-20260825-08",topic:"formal",type:"mc",diff:2,drawMol:"NH2-",prompt:"Identify the correct Lewis structure for NH₂⁻."+fcShot("exact-11-nh2-minus-structure.png",1900,758,45,25,900,75,"Identify the correct Lewis structure for the amide ion NH2 minus"),choices:[fcShot("exact-11-nh2-minus-structure.png",1900,758,140,180,250,125,"Option with one lone pair on nitrogen"),fcShot("exact-11-nh2-minus-structure.png",1900,758,140,315,250,130,"Option with two lone pairs on nitrogen"),fcShot("exact-11-nh2-minus-structure.png",1900,758,140,452,250,105,"Option with no lone pairs on nitrogen"),fcShot("exact-11-nh2-minus-structure.png",1900,758,140,560,250,130,"Option with three lone pairs on nitrogen")],choiceLabels:["one lone pair on N","two lone pairs on N","no lone pairs on N","three lone pairs on N"],answer:1,why:"The correct structure has <b>two N–H single bonds, two lone pairs on N, and −1 on N</b>. FC = 5 − 4 − 2 = −1, and N has a full octet."},

/* Transfer set: compare the same atom with different lone-pair/bond environments. */
{id:"SIM-FC-20260825-01",topic:"formal",type:"multi",diff:1,prompt:"Contrast oxygen in hydronium and water.",fields:[{label:"O in H₃O⁺: 3 bonds, 1 lone pair",answer:1},{label:"O in H₂O: 2 bonds, 2 lone pairs",answer:0}],why:"Hydronium O: 6 − 2 − 3 = <b>+1</b>. Water O: 6 − 4 − 2 = <b>0</b>. Adding a bond while losing a lone pair moves oxygen one unit positive."},
{id:"SIM-FC-20260825-02",topic:"formal",type:"multi",diff:2,prompt:"In one acetate resonance contributor, CH₃–C(=O)–O⁻, assign the two oxygens.",fields:[{label:"Double-bonded O (2 lone pairs)",answer:0},{label:"Single-bonded O (3 lone pairs)",answer:-1}],why:"The C=O oxygen is neutral: 6 − 4 − 2 = 0. The single-bond oxygen is −1: 6 − 6 − 1 = −1. Same element, different roles—connectivity and lone pairs decide."},
{id:"SIM-FC-20260825-03",topic:"formal",type:"multi",diff:2,prompt:"Contrast nitrogen in ammonium and the amide ion.",fields:[{label:"N in NH₄⁺: 4 bonds, 0 lone pairs",answer:1},{label:"N in NH₂⁻: 2 bonds, 2 lone pairs",answer:-1}],why:"NH₄⁺ nitrogen: 5 − 0 − 4 = <b>+1</b>. NH₂⁻ nitrogen: 5 − 4 − 2 = <b>−1</b>."},
{id:"SIM-FC-20260825-04",topic:"formal",type:"multi",diff:2,prompt:"Both carbons below have three bonds. Use the lone-pair information to distinguish their charges.",fields:[{label:"CH₃⁺ carbon: 0 lone pairs",answer:1},{label:"CH₃⁻ carbon: 1 lone pair",answer:-1}],why:"Three bonds alone do not determine carbon's sign. With 0 lone pairs: 4 − 0 − 3 = <b>+1</b>. With 1 lone pair: 4 − 2 − 3 = <b>−1</b>."},

/* ===== v3.19 EXACT MIXED-RESPONSE BATCH (Gabe upload, 2026-08-25) =====

{id:"EXACT-MIX-20260825-01",topic:"formal",type:"multi",diff:3,prompt:"Use the atom labels in acetylcholine to identify every formal charge."+bondShot("exact-01-acetylcholine-formal-charges.png",1618,1164,135,420,735,330,"Acetylcholine structure with atoms a through g labeled"),fields:[{label:"Charge on atom a (carbonyl O)",answer:0},{label:"Charge on atom b",answer:0},{label:"Charge on atom c",answer:0},{label:"Charge on atom d (ester O)",answer:0},{label:"Charge on atom e",answer:0},{label:"Charge on atom f",answer:0},{label:"Charge on atom g (quaternary N)",answer:1}],why:"<b>a–f are neutral; g is +1.</b> The carbonyl O has two lone pairs and two bond orders; the ester O has two lone pairs and two single bonds; every labelled carbon has four bond orders. Nitrogen has four single bonds and no lone pair: FC = 5 − 0 − 4 = +1."},
{id:"EXACT-MIX-20260825-02",topic:"formal",type:"mc",diff:2,prompt:"Select the Lewis structure that best represents potassium ethoxide, CH₃CH₂OK.",choices:[bondShot("exact-02-potassium-ethoxide-structure.png",1586,1144,142,343,215,126,"Option 1: neutral oxygen covalently bonded to potassium"),bondShot("exact-02-potassium-ethoxide-structure.png",1586,1144,142,473,225,126,"Option 2: covalent oxygen-potassium bond with lone pairs on potassium"),bondShot("exact-02-potassium-ethoxide-structure.png",1586,1144,142,604,265,122,"Option 3: separated ethoxide and potassium with electron dots on potassium"),bondShot("exact-02-potassium-ethoxide-structure.png",1586,1144,142,731,250,122,"Option 4: oxygen positive and potassium negative"),bondShot("exact-02-potassium-ethoxide-structure.png",1586,1144,142,858,252,120,"Option 5: ethoxide oxygen negative and potassium positive, separated ions"),bondShot("exact-02-potassium-ethoxide-structure.png",1586,1144,142,982,240,122,"Option 6: oxygen negative while bonded to potassium")],choiceLabels:["neutral O–K covalent structure","O–K covalent with lone pairs on K","separated ions but electron dots on K⁺","O⁺ and K⁻","CH₃CH₂O⁻ plus K⁺ as separated ions","O⁻–K⁺ covalent line"],answer:4,why:"Potassium ethoxide is ionic: <b>CH₃CH₂O⁻ K⁺</b>. Oxygen has one C–O bond and three lone pairs (FC −1); K has lost its valence electron (K⁺), and no covalent O–K bond is drawn."},
{id:"EXACT-MIX-20260825-03",topic:"polarity",type:"multiSelect",selectN:2,diff:3,prompt:"δ+ regions are attacked by anions such as HO⁻. Select the two labelled carbons most likely to be attacked."+bondShot("exact-03-electrophilic-carbons.png",1630,838,115,285,540,225,"Five-carbon chain labeled A through E with a carbonyl at B and chlorine attached at E"),choices:["A","B","C","D","E"],answer:[1,4],why:"<b>B and E.</b> The C=O bond polarizes carbonyl carbon B δ+ because O pulls electron density. The C–Cl bond polarizes carbon E δ+ because Cl pulls electron density. Hydroxide is attracted to those electrophilic carbons."},
{id:"EXACT-MIX-20260825-04",topic:"polarity",type:"mc",diff:3,prompt:"Identify the correct partial-charge distribution for epichlorohydrin.",choices:[bondShot("exact-04-epichlorohydrin-partial-charges.png",1618,1196,198,458,250,166,"O and Cl are δ−; the carbons directly bonded to O or Cl are δ+"),bondShot("exact-04-epichlorohydrin-partial-charges.png",1618,1196,198,630,250,166,"O and the attached carbons are δ−; Cl is δ+"),bondShot("exact-04-epichlorohydrin-partial-charges.png",1618,1196,198,802,250,166,"O is δ+; the ring carbons are δ−; terminal carbon is δ+ and Cl is δ−"),bondShot("exact-04-epichlorohydrin-partial-charges.png",1618,1196,198,976,250,166,"Only the terminal carbon is δ+ and Cl is δ−; the C–O bonds are not labeled")],choiceLabels:["O and Cl δ−; carbons bonded to them δ+","O and carbons δ−; Cl δ+","O δ+; ring carbons δ−; terminal carbon δ+; Cl δ−","only the terminal C–Cl bond labeled"],answer:0,why:"<b>O and Cl are δ−; the carbons directly bonded to them are δ+.</b> Oxygen is more electronegative than carbon across both C–O bonds, and chlorine is more electronegative across C–Cl."},
{id:"EXACT-MIX-20260825-05",topic:"orbitals",type:"blanks",diff:2,prompt:"Complete the exact σ/π rotation statement."+bondShot("exact-05-sigma-pi-rotation-blanks.png",1546,586,45,160,500,215,"Ethane sigma bond shown with a rotation arrow"),template:"Rotation of a single bond {{0}} cause a reduction in orbital overlap because the overlap {{1}} on the bond axis. Rotation of a π bond {{2}} cause a reduction because its orbital overlap {{3}} on the bond axis.",fields:[{label:"single-bond effect",kind:"select",choices:["does","does not"],answer:"does not"},{label:"sigma-overlap location",kind:"select",choices:["occurs","does not occur"],answer:"occurs"},{label:"pi-bond effect",kind:"select",choices:["does","does not"],answer:"does"},{label:"pi-overlap location",kind:"select",choices:["is","is not"],answer:"is not"}],why:"A σ bond overlaps <b>on the bond axis</b>, so rotating around that axis preserves overlap. A π bond overlaps side-by-side <b>off the axis</b>; rotation misaligns the p orbitals and reduces/destroys overlap."},
{id:"EXACT-MIX-20260825-06",topic:"hybrid",type:"blanks",diff:2,prompt:"Determine the hybridization of each carbon in CH₃–C(=O)–CH=CH₂, from left to right."+bondShot("exact-06-hybridization-carbonyl-alkene.png",1368,862,80,35,820,675,"Expanded structure of methyl vinyl ketone with four carbons"),template:"Carbon 1: {{0}} · carbonyl carbon 2: {{1}} · alkene carbon 3: {{2}} · terminal alkene carbon 4: {{3}}.",fields:[{label:"carbon 1",kind:"select",choices:["sp","sp²","sp³"],answer:"sp³"},{label:"carbon 2",kind:"select",choices:["sp","sp²","sp³"],answer:"sp²"},{label:"carbon 3",kind:"select",choices:["sp","sp²","sp³"],answer:"sp²"},{label:"carbon 4",kind:"select",choices:["sp","sp²","sp³"],answer:"sp²"}],why:"The CH₃ carbon has four σ domains → <b>sp³</b>. A carbonyl carbon and both alkene carbons each have three electron domains → <b>sp²</b>. A double bond counts as one domain."},
{id:"EXACT-MIX-20260825-07",topic:"orbitals",type:"blanks",diff:1,prompt:"Rank the indicated C–C bonds by identifying the extremes."+bondShot("exact-07-bond-length-order.png",1078,568,65,25,610,430,"Carbon chain with single bond a, double bond b, and triple bond c indicated"),template:"The shortest bond is {{0}}, and the longest bond is {{1}}.",fields:[{label:"shortest bond",kind:"select",choices:["a","b","c"],answer:"c"},{label:"longest bond",kind:"select",choices:["a","b","c"],answer:"a"}],why:"Bond length decreases as bond order increases: <b>C≡C (c) &lt; C=C (b) &lt; C–C (a)</b>. More shared electron density pulls the nuclei closer."},
{id:"EXACT-MIX-20260825-08",topic:"hybrid",type:"mc",diff:1,prompt:"Compare a three-bond carbocation with a three-bond carbanion. Assign the correct geometry to each ion."+bondShot("exact-08-carbocation-carbanion-geometry.png",1624,492,65,20,470,190,"Generic carbocation and carbanion structures"),choices:["The carbanion is trigonal planar and the carbocation is trigonal pyramidal.","The carbocation is trigonal planar and the carbanion is trigonal pyramidal."],answer:1,why:"A carbocation has three bonds and an empty p orbital: <b>sp², trigonal planar</b>. A simple carbanion has three bonds plus one lone pair: four domains, <b>sp³, trigonal pyramidal</b>."},
{id:"EXACT-MIX-20260825-09",topic:"hybrid",type:"blanks",diff:3,prompt:"Use VSEPR to compare ammonia with ammonium and predict the bond-angle change."+bondShot("exact-09-ammonia-ammonium-vsepr.png",1640,846,90,205,1260,380,"Reaction of ammonia with hydronium to form ammonium and water"),template:"In NH₃, N has {{0}} bonds and {{1}} lone pair(s), giving {{2}} geometry and an angle of about {{3}}. In NH₄⁺, N has {{4}} bonds and {{5}} lone pairs, giving {{6}} geometry and an angle of {{7}}. The bond angles therefore {{8}}.",fields:[{label:"NH3 bond count",kind:"num",answer:3},{label:"NH3 lone pairs",kind:"select",choices:["no","one","two"],answer:"one"},{label:"NH3 geometry",kind:"select",choices:["bent","trigonal planar","trigonal pyramidal","tetrahedral"],answer:"trigonal pyramidal"},{label:"NH3 angle",kind:"select",choices:["104.5°","107°","109.5°","120°"],answer:"107°"},{label:"NH4+ bond count",kind:"num",answer:4},{label:"NH4+ lone pairs",kind:"select",choices:["no","one","two"],answer:"no"},{label:"NH4+ geometry",kind:"select",choices:["bent","trigonal planar","trigonal pyramidal","tetrahedral"],answer:"tetrahedral"},{label:"NH4+ angle",kind:"select",choices:["104.5°","107°","109.5°","120°"],answer:"109.5°"},{label:"angle change",kind:"select",choices:["increase","decrease","stay the same"],answer:"increase"}],why:"NH₃ is AX₃E: trigonal pyramidal, about 107°. Protonation uses the lone pair to form a fourth N–H bond, producing AX₄ tetrahedral NH₄⁺ at 109.5°. Removing lone-pair compression makes the angle <b>increase</b>."},
{id:"EXACT-MIX-20260825-10",topic:"polarity",type:"mc",diff:2,prompt:"For CHCl₃, choose the direction of the net molecular dipole.",choices:[bondShot("exact-10-dipole-chcl3.png",1554,716,163,248,175,106,"Dipole arrow from hydrogen side toward the three chlorines"),bondShot("exact-10-dipole-chcl3.png",1554,716,163,368,175,106,"Dipole arrow toward hydrogen"),bondShot("exact-10-dipole-chcl3.png",1554,716,163,486,175,106,"Dipole arrow sideways"),"none"],choiceLabels:["toward the three-Cl side","toward H","sideways","no molecular dipole"],answer:0,why:"The three C–Cl bond dipoles outweigh the C–H contribution. Their vector sum points <b>away from H and toward the three-chlorine side</b>."},
{id:"EXACT-MIX-20260825-11",topic:"polarity",type:"mc",diff:2,prompt:"For CH₃OCH₃, choose the direction of the net molecular dipole.",choices:[bondShot("exact-11-dipole-dimethyl-ether.png",1514,562,132,153,170,92,"Dipole arrow toward oxygen"),bondShot("exact-11-dipole-dimethyl-ether.png",1514,562,132,250,170,92,"Dipole arrow away from oxygen"),bondShot("exact-11-dipole-dimethyl-ether.png",1514,562,132,350,170,92,"Dipole arrow sideways"),"none"],choiceLabels:["toward O","away from O","sideways","no molecular dipole"],answer:0,why:"The C–O bond dipoles point toward oxygen. Because the molecule is bent at O, they do not cancel; the net dipole points <b>toward O</b>."},
{id:"EXACT-MIX-20260825-12",topic:"polarity",type:"mc",diff:2,prompt:"For NH₃, choose the direction of the net molecular dipole.",choices:[bondShot("exact-12-dipole-ammonia.png",1532,574,142,143,145,103,"Dipole arrow toward nitrogen and its lone pair"),bondShot("exact-12-dipole-ammonia.png",1532,574,142,260,145,103,"Dipole arrow away from nitrogen"),bondShot("exact-12-dipole-ammonia.png",1532,574,142,370,145,103,"Dipole arrow sideways"),"none"],choiceLabels:["toward N/lone-pair side","toward the H atoms","sideways","no molecular dipole"],answer:0,why:"NH₃ is trigonal pyramidal. Each N–H dipole points toward N, so the components add along the molecular axis <b>toward N and the lone-pair side</b>."},
{id:"EXACT-MIX-20260825-13",topic:"polarity",type:"mc",diff:3,prompt:"For tetrahedral CCl₂Br₂, choose the direction of the net molecular dipole.",choices:[bondShot("exact-13-dipole-ccl2br2.png",1618,868,208,337,145,105,"Dipole arrow toward the chlorine side"),bondShot("exact-13-dipole-ccl2br2.png",1618,868,208,449,145,105,"Dipole arrow opposite the chlorine side"),bondShot("exact-13-dipole-ccl2br2.png",1618,868,208,559,145,105,"Dipole arrow toward bromines"),"none"],choiceLabels:["toward the two-Cl side","opposite the two-Cl side","toward the two-Br side","no molecular dipole"],answer:0,why:"C–Cl bonds are more polar than C–Br bonds because Cl is more electronegative. The tetrahedral vectors do not cancel; the net points <b>toward the two-Cl side</b>."},
{id:"EXACT-MIX-20260825-14",topic:"polarity",type:"mc",diff:2,prompt:"For cis-1,2-dichloroethene, choose the direction of the net molecular dipole.",choices:[bondShot("exact-14-dipole-cis-dichloroethene.png",1512,848,118,252,180,150,"Dipole arrow toward both chlorines"),bondShot("exact-14-dipole-cis-dichloroethene.png",1512,848,118,420,180,150,"Dipole arrow away from both chlorines"),bondShot("exact-14-dipole-cis-dichloroethene.png",1512,848,118,587,180,150,"Dipole arrow sideways"),"none"],choiceLabels:["toward the side bearing both Cl atoms","away from the Cl atoms","sideways","no molecular dipole"],answer:0,why:"In the <b>cis</b> isomer, both C–Cl dipoles have components in the same direction. Sideways components cancel, but the components toward the Cl side add."},
{id:"EXACT-MIX-20260825-15",topic:"polarity",type:"mc",diff:2,prompt:"For trans-1,2-dichloroethene, choose the direction of the net molecular dipole.",choices:["none",bondShot("exact-15-dipole-trans-dichloroethene.png",1524,844,152,315,180,145,"Vertical dipole arrow"),bondShot("exact-15-dipole-trans-dichloroethene.png",1524,844,152,475,180,145,"Opposite vertical dipole arrow"),bondShot("exact-15-dipole-trans-dichloroethene.png",1524,844,152,632,180,145,"Diagonal dipole arrow")],choiceLabels:["no molecular dipole","upward","downward","diagonal"],answer:0,why:"The trans molecule is symmetric: the two C–Cl bond dipoles are equal and opposite, so they <b>cancel</b>. Net molecular dipole = 0."},
{id:"EXACT-MIX-20260825-16",topic:"polarity",type:"mc",diff:2,prompt:"For 1,1-dichloroethene (CCl₂=CH₂), choose the direction of the net molecular dipole.",choices:[bondShot("exact-16-dipole-11-dichloroethene.png",1564,838,130,245,180,155,"Dipole arrow toward the two chlorines"),bondShot("exact-16-dipole-11-dichloroethene.png",1564,838,130,416,180,155,"Dipole arrow toward the two hydrogens"),bondShot("exact-16-dipole-11-dichloroethene.png",1564,838,130,580,180,155,"Diagonal dipole arrow"),"none"],choiceLabels:["toward the CCl₂ side","toward the CH₂ side","diagonal","no molecular dipole"],answer:0,why:"Both strong C–Cl dipoles are on one end of the alkene. Their net points <b>toward the CCl₂ end</b>; the molecule is not symmetric enough to cancel."},
{id:"EXACT-MIX-20260825-17",topic:"polarity",type:"mc",diff:1,prompt:"For tetrachloroethene (C₂Cl₄), choose the direction of the net molecular dipole.",choices:[bondShot("exact-17-dipole-tetrachloroethene.png",1474,802,115,242,180,140,"Vertical dipole arrow"),bondShot("exact-17-dipole-tetrachloroethene.png",1474,802,115,398,180,140,"Opposite vertical dipole arrow"),bondShot("exact-17-dipole-tetrachloroethene.png",1474,802,115,548,180,140,"Horizontal dipole arrow"),"none"],choiceLabels:["upward","downward","horizontal","no molecular dipole"],answer:3,why:"C₂Cl₄ is planar and symmetric. Every C–Cl dipole has an equal opposite partner, so all vectors <b>cancel</b>."},

{id:"SIM-MIX-20260825-01",topic:"formal",type:"multi",diff:2,prompt:"Choline is HO–CH₂–CH₂–N(CH₃)₃⁺. Assign the two heteroatoms.",fields:[{label:"Alcohol O (2 bonds, 2 lone pairs)",answer:0},{label:"Quaternary N (4 bonds, 0 lone pairs)",answer:1}],why:"The alcohol oxygen is neutral. Four-bond nitrogen has FC = 5 − 4 = <b>+1</b>, just as in acetylcholine."},
{id:"SIM-MIX-20260825-02",topic:"formal",type:"mc",diff:2,prompt:"Which notation best represents potassium methoxide?",choices:["CH₃–O–K with no charges","CH₃–O⁺ K⁻","CH₃O⁻  K⁺ as separated ions","CH₃⁺  O–K⁻"],answer:2,why:"An alkali-metal alkoxide is ionic: <b>CH₃O⁻ K⁺</b>. The negative formal charge is on O; K is the counterion."},
{id:"SIM-MIX-20260825-03",topic:"polarity",type:"multiSelect",selectN:2,diff:2,prompt:"In CH₃–C(=O)–CH₂Br, which labelled carbons are most electrophilic to an anion?",choices:["A: CH₃ carbon","B: carbonyl carbon","C: CH₂Br carbon"],answer:[1,2],why:"The carbonyl carbon B is δ+ from C=O polarization; carbon C is δ+ from C–Br polarization. The ordinary methyl carbon A lacks a strongly electron-withdrawing heteroatom bond."},
{id:"SIM-MIX-20260825-04",topic:"polarity",type:"mc",diff:2,prompt:"In propylene oxide, which partial-charge pattern is correct?",choices:["O δ−; both ring carbons δ+","O δ+; both ring carbons δ−","Every atom is neutral with no bond polarity","Only hydrogens carry partial charge"],answer:0,why:"Oxygen pulls electron density through both C–O bonds, so <b>O is δ− and both bonded carbons are δ+</b>."},
{id:"SIM-MIX-20260825-05",topic:"orbitals",type:"blanks",diff:2,prompt:"Complete the orbital-overlap contrast.",template:"Rotating about a C–C σ bond {{0}} substantially reduce overlap because σ overlap lies {{1}} the bond axis. Rotating the p orbitals of a C=C π bond {{2}} reduce overlap because π overlap lies {{3}} the axis.",fields:[{label:"sigma rotation",kind:"select",choices:["does","does not"],answer:"does not"},{label:"sigma location",kind:"select",choices:["on","off"],answer:"on"},{label:"pi rotation",kind:"select",choices:["does","does not"],answer:"does"},{label:"pi location",kind:"select",choices:["on","off"],answer:"off"}],why:"Axial σ overlap survives rotation; side-by-side π overlap requires parallel p orbitals and is lost when they rotate out of alignment."},
{id:"SIM-MIX-20260825-06",topic:"hybrid",type:"blanks",diff:2,prompt:"Assign each carbon in CH₃–C≡C–CHO from left to right.",template:"C1 {{0}} · C2 {{1}} · C3 {{2}} · aldehyde carbonyl C4 {{3}}.",fields:[{label:"C1",kind:"select",choices:["sp","sp²","sp³"],answer:"sp³"},{label:"C2",kind:"select",choices:["sp","sp²","sp³"],answer:"sp"},{label:"C3",kind:"select",choices:["sp","sp²","sp³"],answer:"sp"},{label:"C4",kind:"select",choices:["sp","sp²","sp³"],answer:"sp²"}],why:"Methyl C is sp³; both alkyne carbons have two domains and are sp; the carbonyl carbon has three domains and is sp²."},
{id:"SIM-MIX-20260825-07",topic:"orbitals",type:"blanks",diff:1,prompt:"Compare an ordinary C–C, C=C, and C≡C bond.",template:"The shortest is {{0}} and the longest is {{1}}.",fields:[{label:"shortest",kind:"select",choices:["C–C","C=C","C≡C"],answer:"C≡C"},{label:"longest",kind:"select",choices:["C–C","C=C","C≡C"],answer:"C–C"}],why:"Increasing bond order shortens the bond: triple &lt; double &lt; single."},
{id:"SIM-MIX-20260825-08",topic:"hybrid",type:"blanks",diff:2,prompt:"Compare the central carbon of R₃C⁺ and R₃C⁻.",template:"R₃C⁺ is {{0}} and {{1}}; R₃C⁻ is {{2}} and {{3}}.",fields:[{label:"carbocation hybridization",kind:"select",choices:["sp","sp²","sp³"],answer:"sp²"},{label:"carbocation geometry",kind:"select",choices:["linear","trigonal planar","trigonal pyramidal"],answer:"trigonal planar"},{label:"carbanion hybridization",kind:"select",choices:["sp","sp²","sp³"],answer:"sp³"},{label:"carbanion geometry",kind:"select",choices:["linear","trigonal planar","trigonal pyramidal"],answer:"trigonal pyramidal"}],why:"The carbocation's empty p orbital leaves three sp² σ bonds. The carbanion's lone pair is a fourth domain, giving sp³ electron geometry and a pyramidal molecular shape."},
{id:"SIM-MIX-20260825-09",topic:"hybrid",type:"blanks",diff:3,prompt:"Use VSEPR to compare H₂O with H₃O⁺.",template:"H₂O has {{0}} bonds and {{1}} lone pairs, giving {{2}} geometry near {{3}}. H₃O⁺ has {{4}} bonds and {{5}} lone pair, giving {{6}} geometry near {{7}}. The angle {{8}}.",fields:[{label:"H2O bonds",kind:"num",answer:2},{label:"H2O lone pairs",kind:"num",answer:2},{label:"H2O shape",kind:"select",choices:["bent","trigonal pyramidal","tetrahedral"],answer:"bent"},{label:"H2O angle",kind:"select",choices:["104.5°","107°","109.5°"],answer:"104.5°"},{label:"H3O+ bonds",kind:"num",answer:3},{label:"H3O+ lone pair",kind:"num",answer:1},{label:"H3O+ shape",kind:"select",choices:["bent","trigonal pyramidal","tetrahedral"],answer:"trigonal pyramidal"},{label:"H3O+ angle",kind:"select",choices:["104.5°","107°","109.5°"],answer:"107°"},{label:"angle change",kind:"select",choices:["increases","decreases","stays the same"],answer:"increases"}],why:"Two lone pairs compress water most strongly (~104.5°). Hydronium has one lone pair, so it is trigonal pyramidal with a larger angle near 107°."},
{id:"SIM-MIX-20260825-10",topic:"polarity",type:"multiSelect",selectN:2,diff:2,prompt:"Select the two molecules with a nonzero molecular dipole.",choices:["CO₂","H₂O","BF₃","CH₃Cl"],answer:[1,3],why:"H₂O is bent and CH₃Cl is unsymmetrical, so both are polar. Linear CO₂ and trigonal-planar BF₃ cancel their bond dipoles."},
{id:"SIM-MIX-20260825-11",topic:"polarity",type:"multiSelect",selectN:2,diff:3,prompt:"Select the two compounds whose bond dipoles cancel to zero.",choices:["trans-1,2-dichloroethene","cis-1,2-dichloroethene","CCl₄","CH₂Cl₂"],answer:[0,2],why:"Trans-1,2-dichloroethene cancels across the alkene; tetrahedral CCl₄ cancels by full symmetry. The cis alkene and CH₂Cl₂ do not."},
{id:"SIM-MIX-20260825-12",topic:"polarity",type:"mc",diff:1,prompt:"In formaldehyde, H₂C=O, the net molecular dipole points:",choices:["Toward oxygen","Toward the two hydrogens","Perpendicular to the molecular plane","There is no net dipole"],answer:0,why:"The strong C=O dipole dominates and points <b>toward oxygen</b>; the two C–H contributions do not cancel it."},

{id:"EXACT-DPI-20260825-01",topic:"polarity",type:"mc",diff:2,prompt:"Does diphenyl ether exhibit a molecular dipole moment?"+dpiShot("exact-01-diphenyl-ether-dipole-yes-no.png",1560,994,560,405,490,305,"Structure of diphenyl ether, two phenyl rings joined through oxygen"),choices:["no","yes"],answer:1,why:"<b>Yes.</b> Both C–O bond dipoles point toward oxygen. The C–O–C unit is bent, so those vectors do not point in exactly opposite directions and cannot cancel completely."},
{id:"EXACT-DPI-20260825-02",topic:"polarity",type:"mc",diff:3,prompt:"Indicate the direction of the net molecular dipole moment in diphenyl ether.",choices:[dpiShot("exact-02-diphenyl-ether-dipole-direction.png",936,946,74,85,300,200,"Horizontal dipole arrow pointing left"),dpiShot("exact-02-diphenyl-ether-dipole-direction.png",936,946,74,293,300,200,"Horizontal dipole arrow pointing right"),dpiShot("exact-02-diphenyl-ether-dipole-direction.png",936,946,74,499,300,200,"Vertical dipole arrow pointing away from oxygen"),dpiShot("exact-02-diphenyl-ether-dipole-direction.png",936,946,74,705,300,200,"Vertical dipole arrow pointing toward oxygen")],choiceLabels:["left","right","away from O","toward O along the C–O–C bisector"],answer:3,why:"The two C–O bond dipoles have equal sideways components that cancel. Their components along the C–O–C bisector add, so the net dipole points <b>toward oxygen</b>."},
{id:"EXACT-DPI-20260825-03",topic:"imf",type:"mc",diff:2,prompt:"For this pair of isomeric ethers, identify the higher-boiling compound and justify the choice."+dpiShot("exact-03-ether-branching-boiling-point.png",982,720,35,300,420,125,"A branched ether followed by a less-branched ether"),choices:["The first compound has the higher boiling point because it has a greater surface area.","The second compound has the higher boiling point because it is less branched.","The first compound has the higher boiling point because it is more branched.","The second compound has the higher boiling point because it has more hydrogen-bonding interactions."],answer:1,why:"The compounds are isomers, so their molecular weights and functional groups match. The <b>less-branched second ether</b> has greater contact surface area, stronger London dispersion, and the higher boiling point."},
{id:"EXACT-DPI-20260825-04",topic:"imf",type:"mc",diff:1,prompt:"Which member of this pair has the higher boiling point, and why?"+dpiShot("exact-04-cyclopentane-cyclohexane-boiling-point.png",952,340,35,55,230,95,"Cyclopentane and cyclohexane"),choices:["The first compound, because it is less branched.","The second compound, because it has a higher molecular weight.","The first compound, because it has greater London dispersion forces.","The second compound, because it has more hydrogen-bonding interactions."],answer:1,why:"<b>Cyclohexane</b> has one more CH₂ unit, more electrons, and a larger polarizable surface than cyclopentane. Its stronger London dispersion forces give the higher boiling point."},
{id:"EXACT-DPI-20260825-05",topic:"imf",type:"mc",diff:1,prompt:"For this ether/alcohol pair, identify the higher-boiling compound and justify the choice."+dpiShot("exact-05-ether-alcohol-boiling-point.png",966,452,45,135,430,105,"Diethyl ether and 1-butanol"),choices:["The second compound has the higher boiling point because it has more hydrogen-bonding interactions.","The first compound has the higher boiling point because it is more polar.","The second compound has the higher boiling point because it has a higher molecular weight.","The first compound has the higher boiling point because it is less branched."],answer:0,why:"Both have the same formula, but only the alcohol has an <b>O–H donor</b>. Its molecules hydrogen-bond to one another, so the second compound has the higher boiling point."},
{id:"EXACT-DPI-20260825-06",topic:"imf",type:"mc",diff:2,prompt:"For this pair of isomeric alcohols, identify the higher-boiling compound and justify the choice."+dpiShot("exact-06-butanol-tert-butanol-boiling-point.png",936,420,25,45,380,105,"1-butanol and tert-butanol"),choices:["The first compound has the higher boiling point because it has a higher molecular weight.","The second compound has the higher boiling point because it is more branched.","The first compound has the higher boiling point because it is less branched.","The second compound has the higher boiling point because it has a lower molecular weight."],answer:2,why:"Both are C₄H₁₀O alcohols and both hydrogen-bond. The <b>less-branched first alcohol</b> has more surface contact and stronger dispersion, so it boils higher."},
{id:"EXACT-DPI-20260825-07",topic:"imf",type:"mc",diff:2,prompt:"Which epichlorohydrin/phenol product (3 or 4) is expected to have the lower boiling point?"+dpiShot("exact-07-epichlorohydrin-products-boiling-point.png",1040,488,55,80,840,220,"Reaction scheme producing alcohol 3 and epoxide ether 4"),choices:["Compound 4, because it has a higher molecular weight.","Compound 3, because it has fewer hydrogen-bonding interactions.","Compound 3, because it is more branched.","Compound 4, because it has fewer hydrogen-bonding interactions."],answer:3,why:"Compound 3 contains an O–H group and can hydrogen-bond as both donor and acceptor. Compound 4 has ether/epoxide oxygens but no O–H donor, so it has <b>fewer hydrogen-bonding interactions and the lower boiling point</b>."},
{id:"EXACT-DPI-20260825-08",topic:"polarity",type:"blanks",diff:1,prompt:"Identify the partial charges in numbered HBr."+dpiShot("exact-08-hbr-partial-charges.png",968,312,25,92,115,68,"HBr with hydrogen numbered 1 and bromine numbered 2"),template:"Atom(s) with δ+: {{0}} · atom(s) with δ−: {{1}}.",fields:[{label:"delta-positive atom numbers",kind:"text",width:120,answer:"1"},{label:"delta-negative atom numbers",kind:"text",width:120,answer:"2"}],why:"Bromine is more electronegative, so electron density shifts toward Br: <b>H(1) is δ+ and Br(2) is δ−</b>."},
{id:"EXACT-DPI-20260825-09",topic:"polarity",type:"blanks",diff:1,prompt:"Identify the partial charges in numbered H₂O."+dpiShot("exact-09-water-partial-charges.png",984,344,25,98,125,70,"Water with hydrogens numbered 1 and 3 and oxygen numbered 2"),template:"Atom(s) with δ+: {{0}} · atom(s) with δ−: {{1}}.",fields:[{label:"delta-positive atom numbers",kind:"text",width:140,answer:"1,3",accept:["1,3","1, 3"]},{label:"delta-negative atom numbers",kind:"text",width:120,answer:"2"}],why:"Oxygen pulls electron density through both O–H bonds: <b>H atoms 1 and 3 are δ+; O atom 2 is δ−</b>."},
{id:"EXACT-DPI-20260825-10",topic:"polarity",type:"blanks",diff:2,prompt:"Identify the partial charges on the numbered atoms in methanol. Treat C–H as nonpolar for this exercise."+dpiShot("exact-10-methanol-partial-charges.png",1036,482,35,112,180,150,"Methanol with carbon 2, oxygen 5, and hydroxyl hydrogen 6 numbered"),template:"Atom(s) with δ+: {{0}} · atom(s) with δ−: {{1}}.",fields:[{label:"delta-positive atom numbers",kind:"text",width:140,answer:"2,6",accept:["2,6","2, 6"]},{label:"delta-negative atom numbers",kind:"text",width:120,answer:"5"}],why:"Across C–O, carbon 2 is δ+ and oxygen 5 is δ−. Across O–H, hydrogen 6 is δ+ and oxygen remains δ−. Thus <b>δ+: 2,6; δ−: 5</b>."},
{id:"EXACT-DPI-20260825-11",topic:"p_bondtypes",type:"blanks",diff:2,prompt:"Complete the ionic-character comparison."+dpiShot("exact-11-brcl-fcl-ionic-character-blanks.png",998,194,25,20,950,75,"Compare BrCl with FCl for ionic character"),template:"{{0}}, because the disparity in {{1}} between F and Cl is {{2}} than the disparity in {{3}} between Br and Cl.",fields:[{label:"compound with more ionic character",kind:"select",choices:["BrCl","FCl"],answer:"FCl"},{label:"first property",kind:"select",choices:["electronegativity","atomic mass","bond length"],answer:"electronegativity"},{label:"comparison",kind:"select",choices:["greater","smaller","equal"],answer:"greater"},{label:"second property",kind:"select",choices:["electronegativity","atomic mass","bond length"],answer:"electronegativity"}],why:"F is much more electronegative than Cl, whereas Br and Cl are closer. The larger electronegativity difference makes <b>FCl more polar and more ionic in character</b>."},
{id:"EXACT-DPI-20260825-12",topic:"lewis",type:"mc",diff:2,drawMol:"CH3CN",prompt:"Select the correct Lewis dot structure for CH₃CN.",choices:[dpiShot("exact-12-acetonitrile-lewis-structure.png",1028,552,82,145,110,86,"CH3 single bonded to carbon triple bonded to nitrogen with one nitrogen lone pair"),dpiShot("exact-12-acetonitrile-lewis-structure.png",1028,552,82,250,110,78,"CH3 carbon triple bonded to the next carbon, which is single bonded to nitrogen with three lone pairs"),dpiShot("exact-12-acetonitrile-lewis-structure.png",1028,552,82,345,110,78,"CH3 carbon double bonded to carbon, which is double bonded to nitrogen with two lone pairs"),dpiShot("exact-12-acetonitrile-lewis-structure.png",1028,552,82,438,110,78,"CH3 single bonded to carbon triple bonded to nitrogen, but with no nitrogen lone pair")],choiceLabels:["CH₃–C≡N with one lone pair on N","H₃C≡C–N with three lone pairs on N","H₃C=C=N with two lone pairs on N","CH₃–C≡N with no lone pair on N"],answer:0,why:"The correct structure is <b>CH₃–C≡N:</b>. The methyl carbon has four single bonds; the nitrile carbon has one single plus one triple bond; nitrogen has a triple bond and one lone pair. Every atom has its normal formal charge."},
