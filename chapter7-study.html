neighbor.","front":"gabe_c231_ch7_1104_mol-primary-bromide.png","back":"","more":"Count the carbon neighbors of the reacting carbon, not every carbon in the molecule. Br itself and attached H atoms do not count toward the carbon degree.","refs":["flowchart"],"tags":["substrate_classification"]},{"id":"flow-classify-secondary-bromide","section":"07 Mechanism decision practice","prompt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","answer":"\u003cb>2° (secondary).\u003c/b>","why":"The carbon directly bonded to Br has 2 carbon neighbors.","front":"gabe_c231_ch7_1104_mol-secondary-bromide.png","back":"","more":"Count the carbon neighbors of the reacting carbon, not every carbon in the molecule. Br itself and attached H atoms do not count toward the carbon degree.","refs":["flowchart"],"tags":["substrate_classification"]},{"id":"flow-classify-tertiary-bromide","section":"07 Mechanism decision practice","prompt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","answer":"\u003cb>3° (tertiary).\u003c/b>","why":"The carbon directly bonded to Br has 3 carbon neighbors.","front":"gabe_c231_ch7_1104_mol-tertiary-bromide.png","back":"","more":"Count the carbon neighbors of the reacting carbon, not every carbon in the molecule. Br itself and attached H atoms do not count toward the carbon degree.","refs":["flowchart"],"tags":["substrate_classification"]},{"id":"flow-one-meaning","section":"07 Mechanism decision practice","prompt":"What does the “1” mean in S\u003csub>N\u003c/sub>1 and E1?","answer":"\u003cb>One substrate molecule participates in the rate-determining ionization step.\u003c/b>","why":"It does not mean one total step. These mechanisms form a carbocation intermediate.","front":"gabe_c231_ch7_1104_sn1-e1-one-question.png","back":"","more":"","refs":["flowchart"],"tags":[]}],"written":[{"id":"ch7-write-sn2","topic":"sn2","title":"Draw the SN2 arrows","card":"path-04","task":"The drawing shows a primary bromide with CN⁻ in DMSO. Draw the two curved arrows for SN2 and the organic product. Include the leaving ion.","answer":"CN⁻ attacks through carbon at the carbon bearing Br; the C–Br pair goes to Br. Replace Br with –C≡N and show Br⁻. No carbocation is drawn.","checks":["Arrow starts at the cyanide carbon lone pair and ends at Cα.","Second arrow starts on C–Br and ends on Br.","New C–C≡N bond; Br⁻; same carbon skeleton."],"why":"An accessible primary carbon + good, weakly basic nucleophile in polar aprotic solvent supports concerted SN2.","model":"sn2-two-arrows","scope":"exam"},{"id":"ch7-write-e2","topic":"e2","title":"Explain where C=C comes from","card":"path-11","task":"For the pictured tertiary bromide with ethoxide, draw one E2 step with all three arrows and the organic alkene.","answer":"Ethoxide takes β-H. The β C–H pair makes Cα=Cβ while C–Br breaks to Br⁻. The tert-butyl substrate gives 2-methylpropene.","checks":["Base lone pair → β-H.","β C–H bond → Cα–Cβ bond.","C–Br bond → Br; product is neutral alkene."],"why":"The substrate is tertiary, so ordinary SN2 is blocked. Ethoxide is a strong base; E2 uses an available β-H.","model":"e2-three-arrows","scope":"exam"},{"id":"ch7-write-water","topic":"sn1e1","title":"Water attack is not the last step","card":"path-14","task":"For the pictured tertiary bromide in water, draw the SN1 substitution pathway all the way to the final organic product. Include every charge and proton transfer.","answer":"C–Br → Br gives the tertiary carbocation + Br⁻. A water lone pair attacks C⁺, giving R–OH₂⁺. Another water takes H⁺; that O–H bond pair stays on the alcohol oxygen. Final organic product: tert-butanol. H₃O⁺ and Br⁻ account for the other species.","checks":["C⁺ is an intermediate, not the endpoint.","The immediate water-attack product has O⁺ and two H atoms.","A deprotonation arrow pair gives neutral R–OH."],"why":"Water is neutral. When its O makes a third bond, it becomes positive and must lose H⁺ to yield the neutral alcohol.","scope":"exam"},{"id":"ch7-write-e1","topic":"sn1e1","title":"Finish E1 after the carbocation","card":"path-14","task":"Use the same pictured substrate under heated solvolysis conditions. Draw the E1 elimination pathway and explain the source of the new π electrons.","answer":"Ionization gives the tert-butyl carbocation. Water removes a β-H; the C–H bonding pair goes into the adjacent C–C bond. Final organic product: 2-methylpropene, with H₃O⁺ and Br⁻ also formed.","checks":["LG departs first; carbocation charge is shown.","Water O lone pair → β-H; C–H → adjacent C–C.","Final alkene is neutral; no extra carbon or missing carbon."],"why":"The carbocation has an empty p orbital. The adjacent C–H pair supplies the second bond as H⁺ is removed.","scope":"exam"},{"id":"ch7-write-rate","topic":"rates","title":"Write and use both rate laws","task":"For SN2, write the rate law and find the change when only the substrate concentration triples. For SN1, do the same. Explain why both give that factor despite different mechanisms.","answer":"SN2: k[S][Nu], so 3×. SN1: k[S], so 3×. Both are first order in substrate, but SN2 also depends on nucleophile concentration.","checks":["SN2 includes both concentrations.","SN1 includes substrate only.","Both factors are 3, with k and other conditions fixed."],"why":"The molecularity describes the rate-determining elementary step, not simply the number of chemicals written before the reaction arrow.","scope":"quiz"},{"id":"ch7-write-anti","topic":"stereo","title":"Explain the anti requirement","card":"e2-two-h","task":"Draw a Newman view down a chosen Cα–Cβ bond. Place LG on the front carbon at 12 o’clock and a β-H on the rear carbon anti to it. Then explain whether you rotated a single or double bond.","answer":"Rear β-H is at 6 o’clock. The dihedral angle is 180°. Rotation is about the Cα–Cβ SINGLE bond before elimination; the new C=C cannot freely rotate.","checks":["Front/rear carbons are identified.","H and LG are 180° apart.","Other substituents rotate together with their carbon."],"why":"Anti-periplanar geometry aligns the breaking C–H and C–LG bonds for simultaneous π-bond formation.","model":"newman-anti","scope":"quiz"},{"id":"ch7-write-reagent","topic":"reagents","title":"Explain the four reagent families","card":"base-bulk","task":"Without a table, classify I⁻, CH₃O⁻, t-BuO⁻ and H₂O. Give one reason for each. Then state what additional information you need to choose a mechanism.","answer":"I⁻: good nucleophile/weak base. CH₃O⁻: strong at both. t-BuO⁻: strong bulky base, hindered nucleophile. H₂O: weak at both. Also inspect substrate, LG, solvent, temperature and available β-H/geometry.","checks":["Base = takes H⁺; nucleophile = carbon attack in these problems.","Size is separate from strength.","A reagent family alone does not settle every mechanism."],"why":"Nucleophilicity is a rate of carbon attack; basicity is an equilibrium preference for H⁺. They are related but not identical.","scope":"quiz"},{"id":"ch7-write-energy","topic":"rates","title":"Draw the energy profiles","task":"Sketch SN2 and SN1 solvolysis by water. Label transition states and all intermediates. Explain why proton transfer adds a step in this SN1 example.","answer":"SN2 has one peak and no intermediate. Water SN1 has ionization → carbocation; attack → oxonium; proton transfer → neutral alcohol. A complete drawing has three elementary-step peaks and two intermediate valleys; exact peak heights are not specified.","checks":["Axes: G vs reaction coordinate.","SN2 has no carbocation valley.","Water SN1 includes both C⁺ and R–OH₂⁺ valleys."],"why":"Neutral water attack makes a three-bonded O⁺; deprotonation is a separate step needed for the neutral product.","scope":"quiz"},{"id":"ch7-write-shift","topic":"rearrange","title":"Track charge in a 1,2-shift","task":"Draw CH₃–CH⁺–C(CH₃)₃ in bond-line form. A neighboring methyl migrates from the quaternary carbon to the cationic carbon. Draw the arrow and new carbocation. Keep all six carbons.","answer":"The starting formula actually contains SIX carbons: a CH₃, a CH⁺, a quaternary C and three CH₃ groups. Move a C–CH₃ bond from the quaternary neighbor to CH⁺. The donor becomes C⁺. Product connectivity: CH₃–CH(CH₃)–C⁺(CH₃)₂.","checks":["C–C bond, not a lone methyl label, is the arrow tail.","Charge ends on the donor carbon.","Six carbons remain; secondary cation becomes tertiary."],"why":"The migrated bond fills the old cation’s octet. The donor loses the pair and becomes the new, more substituted cation.","scope":"exam"},{"id":"ch7-write-synthesis","topic":"synthesis","title":"Plan a Williamson ether synthesis","task":"Make methyl ethyl ether by SN2. Draw one good alkyl-halide/alkoxide pair and both curved arrows. This task deliberately asks you to construct the structures from the name.","answer":"One valid pair: CH₃Br + Na⁺ ⁻OCH₂CH₃. Ethoxide O attacks methyl carbon; C–Br pair goes to Br. Product CH₃–O–CH₂CH₃ + NaBr. Another valid route uses CH₃O⁻ + bromoethane.","checks":["Alkyl halide has an accessible sp³ carbon.","Alkoxide oxygen retains −1 before attack; Na⁺ is a counterion.","New O–C bond is correct; no acyl halide substituted for the requested alkyl halide."],"why":"An ether can be split on either side of O, but the electrophilic carbon must be compatible with SN2.","scope":"exam"},{"id":"ch7-write-bondbasics","topic":"bondbasics","title":"Explain what the carbon count means","task":"Draw an ordinary primary carbocation. Mark its direct carbon neighbor and count all electrons around the positive carbon. Explain whether stabilization by a neighboring carbon group requires an H shift.","answer":"An example is CH₃–CH₂⁺. The positive carbon has one carbon neighbor and two H bonds: three bonds × two electrons = six electrons around it. Nearby C–H bond electron clouds can help stabilize the empty orbital without moving H. A hydrogen shift is a separate change of atom connections.","checks":["The chosen positive carbon has three bonds and no nonbonding electrons.","Primary counts one direct carbon neighbor; the H atoms are excluded from that degree.","Six surrounding electrons; electron sharing and H migration are distinguished."],"why":"Counting carbon neighbors, counting all bonds and counting electrons are three different tasks.","scope":"quiz"},{"id":"ch7-write-sn2timeline","topic":"sn2timeline","title":"Explain the SN2 timeline","task":"In words, give both curved-arrow starting points and endpoints for I⁻ attacking a suitable primary R–Br. Explain whether the arrows describe one event or two, and whether a separate C⁺ intermediate is present. No product drawing is required.","answer":"I lone pair → the carbon bearing Br; C–Br bond → Br. Both bond changes occur in the same elementary step. No separate carbocation intermediate forms.","checks":["The incoming arrow starts at the I electron pair and ends at carbon.","The departing arrow starts at the C–Br bond and ends at Br.","The description says together, one step, with no separate C⁺."],"why":"Correct arrow placement and a correct explanation of timing must agree.","scope":"quiz"},{"id":"ch7-write-rolesolvent","topic":"rolesolvent","title":"Explain your reagent classification","task":"Explain why “CH₃OH is protic” does not tell you that it is a strong base or that it cannot be a nucleophile. Compare its reactivity with CH₃O⁻ and state what I⁻ shows about using negative charge alone.","answer":"Protic describes hydrogen-bond donation by a solvent. Neutral methanol has oxygen lone pairs and can act as a weak nucleophile/base. Methoxide is stronger at both in the usual course comparison. I⁻ is a good nucleophile but weak base, so negative charge does not guarantee strong basicity.","checks":["Solvent classification is separated from nucleophile/base roles.","Neutral methanol is allowed to act as a weak nucleophile.","The iodide counterexample rejects negative-equals-strong-base."],"why":"Classify the property the question asks for, rather than using one label for every chemical behavior.","scope":"quiz"}],"scope":{"quiz":"Chapter 7 Quiz A: Nov 10 lecture. Nov 6 announcement explicitly excludes predictive questions; no complete item blueprint supplied.","source":"https://smccd.instructure.com/courses/73887/discussion_topics/1375144","exam":"Exam 3 A3 Part A Nov 12; Part B Nov 17 (Nov 4 announcement). Official topic list is non-exhaustive.","lecture":"Nov 5 SN1/E1 transcript supplied Nov 9; automated summary is not an answer key."},"vocabulary":[{"term":"Nucleophile","means":"An electron-pair donor. In these substitution problems, it attacks carbon to make a bond.","example":"I⁻ donates a lone pair to an accessible carbon bearing Br."},{"term":"Electrophile","means":"An electron-pair acceptor: the atom being attacked.","example":"The carbon bonded to Br is electrophilic because Br pulls electron density away."},{"term":"Base","means":"A proton acceptor: it takes H⁺ using an electron pair.","example":"Ethoxide can remove a β-H during E2."},{"term":"Substrate","means":"The starting molecule whose bonds are being changed.","example":"In bromoethane + I⁻, bromoethane is the substrate."},{"term":"Solvent","means":"The liquid medium surrounding the reacting molecules. It can affect their reactivity.","example":"Water can be both the solvent and the attacking nucleophile in solvolysis."},{"term":"Protic solvent","means":"A solvent with an O–H or N–H bond that can donate a hydrogen bond.","example":"Water and ethanol are protic. Their O–H groups can hydrogen-bond around an anionic nucleophile."},{"term":"Aprotic solvent","means":"A solvent without the O–H/N–H hydrogen-bond donors used in this course’s test.","example":"Acetone and DMSO are polar aprotic. C–H bonds do not make a solvent protic. Aprotic alone does not mean polar: hexane is nonpolar and aprotic."},{"term":"Hydrogen bond","means":"An attraction involving H bonded to an electronegative atom, such as O or N, and an electron-rich partner. It is not the same as forming a new covalent O–H bond.","example":"Water’s O–H groups can surround an anionic nucleophile through hydrogen bonding, slowing its carbon attack."},{"term":"Leaving group","means":"The group that departs with the C–LG bonding electron pair in an ordinary heterolytic step.","example":"C–Br breaks to Br⁻. A weak base is generally a better leaving group."},{"term":"Carbocation","means":"A carbon carrying a positive charge. A typical alkyl carbocation has three bonds, six valence-shell electrons and an empty p orbital.","example":"After a suitable C–Br bond ionizes in SN1, carbon is positive and Br is negative. The cation is an intermediate."},{"term":"Concerted","means":"The electron moves belong to one elementary step.","example":"SN2 makes C–Nu while C–LG breaks; two arrows do not mean two steps."},{"term":"Stepwise","means":"Separate elementary steps with at least one intermediate between them.","example":"SN1: leaving group loss, then nucleophile attack. Water attack can require a later proton-transfer step."},{"term":"Regiochemistry","means":"Which position in the molecule reacts: where the new bond or double bond is located.","example":"OEt attached at C3 versus C5 changes the attachment position."},{"term":"Stereochemistry","means":"How connected atoms are arranged in 3D.","example":"With the same depicted backbone and attachment carbon, wedge versus dash can change configuration."},{"term":"Allylic","means":"Directly next to a C=C double bond, rather than on a double-bond carbon.","example":"An sp³ carbon bearing Br next to C=C is allylic; its carbocation can be resonance-stabilized."},{"term":"Vinylic","means":"Directly on a carbon of a C=C double bond.","example":"Br bonded to a double-bond carbon is vinylic. Do not apply ordinary allylic SN1 behavior to it."},{"term":"Benzylic","means":"On a side-chain carbon directly next to a benzene ring.","example":"Benzene–CH₂–Br is benzylic, and can form a resonance-stabilized benzylic carbocation."},{"term":"Aryl","means":"Directly part of an aromatic ring; an aryl halide has its halogen directly bonded to that ring carbon.","example":"Bromobenzene is aryl, not benzylic. Ordinary SN1/SN2 at that ring carbon is not expected."},{"term":"Alpha carbon (Cα)","means":"In these alkyl-halide mechanisms, the carbon directly bonded to the leaving group.","example":"Find Cα first, then count its direct carbon neighbors to classify the substrate."},{"term":"Beta carbon (Cβ)","means":"A carbon directly adjacent to Cα in these elimination problems.","example":"A β-H is bonded to Cβ. Its C–H electrons can form Cα=Cβ during elimination."},{"term":"Steric hindrance","means":"Crowding that makes it harder for a reagent to reach its target.","example":"Three carbon groups around a tertiary carbon block ordinary SN2 backside approach."},{"term":"Resonance","means":"Different valid electron drawings of one delocalized species. Atoms stay in the same places and keep the same connections.","example":"An allylic carbocation has positive-charge character at more than one carbon. The drawings are not separate isolated intermediates."},{"term":"Enantiomers","means":"Nonsuperimposable mirror-image molecules with the same atom connections.","example":"With only one stereocenter and no other chirality, its two opposite configurations form an enantiomeric pair."},{"term":"Diastereomers","means":"Stereoisomers that are not mirror images of each other.","example":"If one stereocenter stays fixed and only a second center changes, the products are diastereomers."},{"term":"Racemic mixture","means":"An equal mixture of the two members of an enantiomeric pair.","example":"SN1 can form both configurations. Exact 50:50 formation is a simplified model, not a guarantee for every real SN1 reaction."},{"term":"Anti-periplanar","means":"C–H and C–leaving-group bonds are 180° apart in dihedral angle, in one plane.","example":"For ordinary E2 on a cyclohexane chair, look for trans-diaxial β-H and leaving group."},{"term":"sp² versus sp³","means":"sp² commonly has three electron regions and a trigonal-planar arrangement; sp³ commonly has four and a tetrahedral arrangement.","example":"The SN1 carbocation carbon is sp²; a saturated substitution product carbon is usually sp³."},{"term":"Nucleophilicity versus basicity","means":"Nucleophilicity concerns how fast electron-pair donation occurs; basicity concerns the equilibrium preference for accepting H⁺.","example":"I⁻ can be a good nucleophile but a weak base. Size, charge, resonance and solvent can affect the two properties differently."}]};let SOURCE={"total":77,"captured":77,"missing":[],"coverage":"Visible parts only. Not an all-parts guarantee.","slots":[]};

function writeItem(q){current=q;run=null;revealed=false;helped=false;const c=DATA.recall.find(c=>c.id===q.card),d=state.drafts[q.id]||{};mount(`<section class="card"><p class="eyebrow">Build an answer · self-reviewed</p><h1>${esc(q.title)}</h1>${pic(c?.front,c?.prompt)}<p class="lead">${esc(q.task)}</p><p>Use paper, Goodnotes, the drawing space, or words. Commit an attempt before opening the model.</p><label><input type="checkbox" id="paper-attempt" ${d.paper?'checked':''}> I made my attempt on paper / Goodnotes (self-report)</label><label for="written">Your answer / explanation</label><textarea id="written" rows="4" placeholder="Write what happens and why…">${esc(d.text||'')}</textarea><canvas id="ink" width="900" height="360" aria-label="Drawing space. A text answer is also available above."></canvas><div class="toolbar"><button data-action="undo-ink">Undo stroke</button><button data-action="erase-ink">Clear drawing</button><label>Ink <select id="pen"><option value="#132d3c">Black</option><option value="#bf3c31">Red arrows</option></select></label></div><div id="model" role="status"></div><button class="primary" data-action="model">Compare my attempt with the model</button><button data-action="home">Save and leave</button></section>`);setupInk(q.id,d.ink)}
let inkHistory=[],inkDown=false;
function setupInk(id,data){const c=$('#ink');if(!c)return;const cx=c.getContext('2d');cx.lineWidth=3;cx.lineCap='round';inkHistory=[];if(data){const im=new Image;im.onload=()=>cx.drawImage(im,0,0);im.src=data}const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.addEventListener('pointerdown',e=>{inkHistory.push(c.toDataURL());inkDown=true;c.setPointerCapture(e.pointerId);cx.strokeStyle=$('#pen').value;cx.beginPath();cx.moveTo(...pos(e));cx.lineTo(...pos(e));cx.stroke()});c.addEventListener('pointermove',e=>{if(inkDown){cx.lineTo(...pos(e));cx.stroke()}});const stop=()=>{if(!inkDown)return;inkDown=false;draft()};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);$('#written').addEventListener('input',draft)}

function recall(id){const t=topicOf(id);const refs=t.questions.filter(q=>q.card).map(q=>DATA.recall.find(c=>c.id===q.card)).filter(Boolean);const items=refs.length?refs:DATA.recall.filter(c=>c.section.includes('Rate')).slice(0,5);mount(`<section class="card"><h1>Reference recall</h1><p>Say or write the answer, then reveal. These use the existing November 4 cards; they are not new unseen items.</p>${items.map(c=>`<article>${pic(c.front,c.prompt)}<h2>${c.prompt}</h2><details><summary>Reveal answer + why</summary><p>${c.answer}</p><p>${esc(c.why)}</p></details></article>`).join('')}<button data-action="home">My topics</button></section>`)}

e'erase-ink':{const c=$('#ink');inkHistory.push(c.toDataURL());c.getContext('2d').clearRect(0,0,c.width,c.height);draft();break}case'export':exportWork();break;case'spark':if(current)clue();else{$('#spark-panel').hidden=!$('#spark-panel').hidden;$('#spark-content').textContent='Start with one decision: does the reagent attack carbon, remove H, do both strongly, or do both weakly? Then check the reacting carbon. This is written chapter guidance, not a live AI conversation.'}break;case'close-spark':$('#spark-panel').hidden=true;break}});
