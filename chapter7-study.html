</style><header><a href="#" data-home>CHEM 231 · Chapter 7</a><span id="storage">Private practice · this browser</span></header><div id="qa" hidden>Testing mode · no learner results are saved</div><main id="work" tabindex="-1"></main><footer>Original practice + private source links. Software checks are not learner performance.</footer><button id="spark" data-action="spark" aria-label="Spark: explain this step">✦ Spark · help</button><aside id="spark-panel" hidden aria-label="Spark chapter guidance"><strong>One step at a time</strong><p id="spark-content"></p><button data-action="close-spark">Close</button></aside><script>const DATA={"version":1,"date":"2026-11-09","topics":[{"id":"bondbasics","name":"Carbocations: bonds & charge","lesson":"One single bond holds two electrons. A carbocation with three bonds has six electrons around it; a full octet is eight. Nearby carbon groups help stabilize that shortage. No H needs to move.","example":"Both C⁺ atoms below have three bonds. Primary has one carbon neighbor; tertiary has three. For these ordinary alkyl ions without resonance, the tertiary ion is usually lower in energy.","scope":"quiz","questions":[{"id":"ch7-cb-pair","skill":"Count electrons in one bond","prompt":"How many electrons are shared in one ordinary single bond?","choices":["1","2","4"],"answer":1,"why":"One single bond contains one shared electron pair: two electrons. This count concerns electrons around an atom, not the number assigned to it for a formal-charge calculation.","more":"","image":"","alt":"","card":null},{"id":"ch7-cb-six","skill":"Check the carbocation octet","prompt":"A carbon has three single bonds and no nonbonding electrons (no lone pair or unpaired dot). How many electrons are around it?","choices":["3","6","8"],"answer":1,"why":"Three bonds × two shared electrons per bond = six. A full octet would be eight, so this carbocation is electron-deficient.","more":"","image":"","alt":"","card":null},{"id":"ch7-cb-neighbors","skill":"Count carbon neighbors separately from total bonds","prompt":"In the drawing, how many CARBON atoms are directly bonded to the carbon bearing Br?","choices":["1","2","3","4"],"answer":0,"why":"There is one directly attached carbon neighbor. Br and H do not count toward primary/secondary/tertiary. The carbon can have four total bonds while still being primary.","more":"","image":"gabe_c231_ch7_1104_mol-primary-bromide.png","alt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","card":"flow-classify-primary-bromide"},{"id":"ch7-cb-sharing","skill":"Separate electron sharing from an H shift","prompt":"When neighboring carbon groups stabilize an ordinary carbocation by hyperconjugation, what happens?","choices":["Nearby bond electrons can spread toward the empty orbital; H stays bonded to its carbon","An H atom must detach and move to C⁺","A new carbon atom appears"],"answer":0,"why":"Electrons are distributed in clouds, rather than fixed dots. A neighboring C–H bond cloud can overlap with the empty p orbital at C⁺, lowering the energy. This sharing does not require that C–H bond to break or its H to move. A hydride shift is a separate rearrangement.","more":"","image":"","alt":"","card":null},{"id":"ch7-cb-stability","skill":"Compare ordinary carbocation energies","prompt":"Compare the two ordinary acyclic alkyl carbocations shown, without resonance. Which is usually lower in energy?","choices":["Primary","Tertiary","Both must be equally stable"],"answer":1,"why":"The tertiary ion has more neighboring carbon groups that can help stabilize the electron shortage through hyperconjugation and electron donation. Both cationic carbons still have three bonds and six surrounding electrons. More stable means lower in energy, not a completed octet.","more":"Resonance, ring constraints and other structural effects can change comparisons. Do not apply the carbon-count rule blindly to benzylic, allylic, vinylic or aryl cases.","image":"","alt":"","card":null,"diagrams":["primary-cation","tertiary-cation"]}],"more":"Electrons occupy clouds around bonds. A neighboring C–H bond cloud can overlap with the empty p orbital at C⁺. This is called hyperconjugation. It helps spread the electron shortage and lower the energy without breaking that C–H bond or moving its H. A hydride shift is a separate rearrangement. The formal positive charge is not deleted by this stabilization.","diagrams":["primary-cation","tertiary-cation"]},{"id":"sn2timeline","name":"SN2: what happens together?","lesson":"Both curved arrows belong to the same elementary step. The nucleophile–carbon bond forms as the carbon–leaving-group bond breaks. Drawing the correct arrows does not make a separate carbocation part of SN2.","example":"For I⁻ and a suitable primary alkyl bromide: I lone pair → carbon, and C–Br bond → Br. Draw both arrows on the reactant structure. There is one transition state, not a carbocation intermediate between the arrows.","scope":"quiz","questions":[{"id":"ch7-nt-arrows","skill":"Count steps without counting arrows","prompt":"Two full-headed curved arrows describe an ordinary SN2 event. How many elementary steps is that?","choices":["1","2","It equals the number of reactants"],"answer":0,"why":"An elementary step is one concerted event. Forming C–Nu and breaking C–LG occur together. Arrows track electron pairs; they are not separate clock ticks.","more":"","image":"","alt":"","card":null},{"id":"ch7-nt-together","skill":"Describe the same SN2 event in words","prompt":"Which description matches ordinary SN2 at a primary carbon?","choices":["I bonds to carbon as Br leaves","Br fully leaves, a primary C⁺ waits, then I attacks","A hydride shift must occur first"],"answer":0,"why":"The incoming and outgoing bond changes overlap in one step. The fully departed Br/C⁺ structure followed by a later attack describes a stepwise ionization pathway, not SN2.","more":"","image":"","alt":"","card":null},{"id":"ch7-nt-peak","skill":"Separate a transition state from an intermediate","prompt":"The ordinary SN2 reaction profile has one peak. Is a separate carbocation valley required?","choices":["Yes","No"],"answer":1,"why":"The peak is the transition state: incoming and outgoing bonds are partial. SN2 has no carbocation intermediate or intervening valley. A transition state is not a stable five-full-bond carbon.","more":"","image":"","alt":"","card":null},{"id":"ch7-nt-ccharge","skill":"Check carbon after substitution","prompt":"After the SN2 substitution, the reacting carbon has four single bonds and no nonbonding electrons. What is its formal charge?","choices":["−1","0","+1"],"answer":1,"why":"A normal carbon with four single bonds and no nonbonding electrons is neutral. In this SN2 product it does not retain a carbocation charge.","more":"","image":"","alt":"","card":null},{"id":"ch7-nt-charge","skill":"Conserve total charge through the one-step process","prompt":"I⁻ + neutral R–Br gives neutral R–I + Br⁻. What is the total charge on EACH side?","choices":["−1 on each side","0 on each side","−1 before and +1 after"],"answer":0,"why":"Before: −1 + 0 = −1. After: 0 + −1 = −1. I becomes neutral on making its bond; Br takes the departing bond pair and becomes Br⁻. No separate C⁺ is needed to conserve charge.","more":"","image":"","alt":"","card":null}]},{"id":"rolesolvent","name":"Solvent labels versus reagent jobs","lesson":"Protic/aprotic classifies the solvent. Nucleophilicity describes donating electrons to an electrophile; basicity describes accepting H⁺. O–H presence or negative charge alone does not tell you that a reagent is strong at both jobs.","example":"Methanol, CH₃OH, is a protic solvent and a weak nucleophile/base. Methoxide, CH₃O⁻, is a strong nucleophile/base. I⁻ is negatively charged too, but it is a good nucleophile and weak base.","scope":"quiz","questions":[{"id":"ch7-rv-alcohol","skill":"Keep neutral lone pairs available","prompt":"Can the oxygen in neutral CH₃OH donate a lone pair to a carbocation?","choices":["Yes; methanol can act as a weak nucleophile","No; an O–H bond prevents all nucleophilic attack","Only if the carbon already has five bonds"],"answer":0,"why":"Neutral alcohol oxygen still has lone pairs. Methanol can attack a carbocation even though it is much weaker than methoxide. Protic does not mean unable to act as a nucleophile.","more":"","image":"gabe_c231_ch7_1104_mol-methanol-c935efe.png","alt":"Is CH₃OH mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-methanol"},{"id":"ch7-rv-pair","skill":"Compare the same element with a different charge","prompt":"In the usual course comparison, which oxygen reagent is the stronger nucleophile: CH₃OH or CH₃O⁻?","choices":["CH₃OH","CH₃O⁻"],"answer":1,"why":"For this oxygen pair, methoxide’s negative charge makes its electron pair more available for attack. When it makes a normal second O bond to carbon, that oxygen becomes neutral. This comparison does not make every anion a strong base.","more":"","image":"gabe_c231_ch7_1104_mol-methoxide-7d7714b.png","alt":"Is MeO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-methoxide"},{"id":"ch7-rv-protic","skill":"Use the solvent term for the right property","prompt":"Ethanol has an O–H bond, so it is protic. Does that prove it is a strong base?","choices":["Yes","No"],"answer":1,"why":"Protic means it can donate a hydrogen bond as a solvent. Strong basicity is a separate property. Neutral ethanol is a weak base compared with ethoxide.","more":"","image":"gabe_c231_ch7_1104_mol-ethanol-d427418.png","alt":"Is this solvent (ethanol) protic or polar aprotic?","card":"solvent-ethanol"},{"id":"ch7-rv-iodide","skill":"Reject negative-equals-strong-base","prompt":"Does I⁻ being negatively charged mean it is a strong base?","choices":["Yes; every negative ion is strongly basic","No; I⁻ is a weak base"],"answer":1,"why":"I⁻ is a good nucleophile but a weak base. HI gives up H⁺ very readily; I⁻ has little tendency to take H⁺ back in the ordinary course comparison. Charge alone does not classify basicity.","more":"","image":"gabe_c231_ch7_1104_mol-iodide-25f9b83.png","alt":"Is I⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-iodide"},{"id":"ch7-rv-mixture","skill":"Distinguish reagent, counterion and solvent","prompt":"Sodium methoxide is dissolved in methanol. Which species is the strong nucleophile/base?","choices":["CH₃O⁻","Na⁺","Neutral CH₃OH"],"answer":0,"why":"CH₃O⁻ is the reactive strong nucleophile/base. Na⁺ is the counterion; neutral CH₃OH is the protic solvent and much weaker reagent. Then check substrate and conditions to decide which mechanism predominates.","more":"","image":"","alt":"","card":null}]},{"id":"regio","name":"Regio: which carbon?","lesson":"Regiochemistry asks WHERE a new bond or double bond appears. First compare the atom connections. A different attachment carbon can give a different constitutional isomer.","example":"In the allylic SN1 example, resonance puts positive-charge character at two different carbons. Ethanol can attach at either position. Those are two different connection patterns. The wedge/dash decision comes afterward.","scope":"quiz","questions":[{"id":"ch7-reg-where","skill":"Separate position from 3D","prompt":"The OEt group attaches at carbon 3 instead of carbon 5. Which feature changed?","choices":["Regiochemistry: attachment position","Only stereochemistry: 3D arrangement"],"answer":0,"why":"The new O–C bond connects to a different carbon. That changes where the group is attached, not merely which way the same bond points.","more":"","image":"","alt":"","card":null},{"id":"ch7-reg-connection","skill":"Compare connectivity first","prompt":"Two products have OEt attached to different, nonequivalent carbons. They are…","choices":["Constitutional isomers","Necessarily enantiomers","The same molecule in every case"],"answer":0,"why":"Different atom connections mean constitutional isomers. Enantiomers have the same connectivity and differ in 3D arrangement.","more":"","image":"","alt":"","card":null},{"id":"ch7-reg-resonance","skill":"Do not count resonance drawings as products","prompt":"An allylic carbocation has two resonance contributors. Before a nucleophile attacks, those drawings represent…","choices":["One delocalized intermediate","Two isolated final products","Two different carbon skeletons"],"answer":0,"why":"Resonance contributors describe one intermediate. The nucleophile can form new bonds at different electrophilic positions; those new connections create products.","more":"","image":"","alt":"","card":null},{"id":"ch7-reg-e2","skill":"Locate a new double bond","prompt":"E2 gives C1=C2 versus C2=C3 on the same numbered chain. What differs?","choices":["Regiochemistry","Only the viewing angle"],"answer":0,"why":"The double bond is in a different position. After locating it, check E/Z separately if that double bond can have stereoisomers.","more":"","image":"","alt":"","card":null},{"id":"ch7-reg-count","skill":"Keep the two counts separate","prompt":"A given reaction has two nonequivalent attachment positions, each giving exactly two mirror-image products. Total products in this model?","choices":["2","4","8"],"answer":1,"why":"Two positions × two configurations per position = four products: two enantiomeric pairs with different connectivity between the pairs. This is the supplied example, not a universal rule for every allylic substrate.","more":"","image":"","alt":"","card":null}]},{"id":"sn1stereo","name":"SN1 stereo: which 3D arrangement?","lesson":"After a leaving group leaves, the carbocation is planar. Attack from opposite faces can create different configurations. Count other stereocenters that remain unchanged before naming the product relationship.","example":"If one stereocenter stays fixed while the reacting center can form either configuration, the two products are diastereomers. They are not mirror images of the entire molecule.","scope":"quiz","questions":[{"id":"ch7-ss-planar","skill":"Recognize two accessible faces","prompt":"Why can an SN1 carbocation be attacked from two faces?","choices":["It is planar, with an empty p orbital","It already has a fixed tetrahedral configuration","There must be two nucleophile molecules attacking together"],"answer":0,"why":"The electron-deficient carbon is sp² and trigonal planar. Attack can occur from either face; the actual ratio need not be 50:50.","more":"","image":"","alt":"","card":null},{"id":"ch7-ss-final","skill":"Do not transfer the intermediate’s shape to the product","prompt":"A planar carbocation is attacked and its carbon ends with four different groups. The product carbon is…","choices":["A tetrahedral stereocenter","Still a planar carbocation","Automatically achiral"],"answer":0,"why":"The new bond fills the carbon octet and gives a tetrahedral sp³ center. An achiral intermediate does not guarantee an achiral product.","more":"","image":"","alt":"","card":null},{"id":"ch7-ss-pair","skill":"Count unchanged stereocenters","prompt":"One existing stereocenter remains fixed. SN1 creates either configuration at a second center. The two products are…","choices":["Diastereomers","Enantiomers","Always identical"],"answer":0,"why":"They differ at one center while the other stays the same. Enantiomers would require the mirror-image arrangement of the whole molecule, including the other center.","more":"","image":"","alt":"","card":null},{"id":"ch7-ss-one","skill":"Recognize an enantiomeric pair","prompt":"An achiral starting system forms one new stereocenter by attack on either face. There are no other stereocenters or chirality elements. The two configurations are…","choices":["Enantiomers","Diastereomers","Constitutional isomers"],"answer":0,"why":"The connections are the same and the only stereocenter is opposite in the two products. They are nonsuperimposable mirror images; ratios are a separate question.","more":"","image":"","alt":"","card":null},{"id":"ch7-ss-same","skill":"Separate a face change from a position change","prompt":"OEt remains on carbon 3, but its bond changes from a wedge to a dash with the rest of the depiction fixed. What changes?","choices":["Stereochemistry","Regiochemistry"],"answer":0,"why":"The same atoms remain connected. The spatial configuration changes. Check the entire molecule to decide whether the resulting pair is enantiomeric or diastereomeric.","more":"","image":"","alt":"","card":null}]},{"id":"sn1compare","name":"SN1 rates: check the leaving carbon","lesson":"For SN1 comparisons, find the carbon directly bonded to the leaving group. Check whether its carbocation can form: resonance, degree, and then leaving-group ability all matter.","example":"With water, compare ethyl iodide and isopropyl iodide. Both have I as the leaving group, so that does not break the tie. Isopropyl iodide can give a secondary carbocation; ethyl iodide would require an unstable ordinary primary one.","scope":"quiz","questions":[{"id":"ch7-sc-vinyl","skill":"Locate the leaving group exactly","prompt":"A halogen is bonded DIRECTLY to a carbon of C=C. That halide is…","choices":["Vinylic","Allylic","Benzylic"],"answer":0,"why":"Vinylic means on the double-bond carbon. Allylic means on a neighboring sp³ carbon. A double bond somewhere nearby is not enough.","more":"","image":"","alt":"","card":null},{"id":"ch7-sc-allyl","skill":"Distinguish next to from on","prompt":"A halogen is on an sp³ carbon directly NEXT TO C=C. That halide is…","choices":["Allylic","Vinylic","Aryl"],"answer":0,"why":"The leaving carbon is adjacent to the double bond. Ionization can give an allylic carbocation whose charge is resonance-delocalized.","more":"","image":"","alt":"","card":null},{"id":"ch7-sc-aryl","skill":"Separate aryl from benzylic","prompt":"A halogen is bonded directly to a benzene-ring carbon. Can you treat it as an ordinary benzylic halide for SN1?","choices":["No","Yes"],"answer":0,"why":"Directly on the ring is aryl, not benzylic. Ordinary SN1 at that sp² carbon would require a highly unstable aryl cation. Benzylic means the leaving group is on the adjacent side-chain carbon.","more":"","image":"","alt":"","card":null},{"id":"ch7-sc-degree","skill":"Hold the leaving group constant","prompt":"In a water SN1 comparison, which ordinary iodide is more reactive: ethyl iodide or isopropyl iodide?","choices":["Isopropyl iodide","Ethyl iodide"],"answer":0,"why":"Both have the same leaving group. The isopropyl substrate can form a more stable secondary carbocation, rather than an ordinary primary carbocation. Compare the carbocation that would form, not just the leaving group.","more":"","image":"","alt":"","card":null},{"id":"ch7-sc-lg","skill":"Use the leaving group after matching substrate","prompt":"For the same isopropyl skeleton under comparable ionizing conditions, which reacts faster?","choices":["Isopropyl iodide","Isopropyl bromide"],"answer":0,"why":"The possible carbocation is the same. I⁻ is the better leaving group, so C–I ionization is easier in this comparison. Do not apply this tie-break before checking whether the substrate can ionize.","more":"","image":"","alt":"","card":null}]},{"id":"reagents","name":"Nucleophile, base, or both?","lesson":"A nucleophile uses electrons to bond to carbon in these reactions. A base uses electrons to take H⁺. A reagent can do both. Strength, size and solvent are separate checks.","example":"CH₃O⁻ is small and negatively charged: it can reach carbon AND take H⁺. So it is strong at both. A substrate determines which job wins.","scope":"quiz","questions":[{"id":"ch7-r-iodide","skill":"Separate basicity from nucleophilicity","prompt":"Classify I⁻ for ordinary alkyl substitution/elimination.","choices":["Good nucleophile; weak base","Strong base and strong nucleophile","Strong bulky base; hindered nucleophile","Weak nucleophile and weak base"],"answer":0,"why":"I⁻ is large and polarizable, so it can donate electrons to carbon. HI is a very strong acid, so I⁻ is a very weak base: it has little tendency to take H⁺. Negative does not mean strongly basic.","more":"","image":"gabe_c231_ch7_1104_mol-iodide-25f9b83.png","alt":"Is I⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-iodide"},{"id":"ch7-r-methoxide","skill":"Recognize both jobs","prompt":"Classify CH₃O⁻ (methoxide).","choices":["Good nucleophile; weak base","Strong base and strong nucleophile","Strong bulky base; hindered nucleophile","Weak nucleophile and weak base"],"answer":1,"why":"Its negative oxygen can take H⁺, and the small methyl group leaves that oxygen accessible for carbon attack. Strong base AND strong nucleophile.","more":"","image":"gabe_c231_ch7_1104_mol-methoxide-7d7714b.png","alt":"Is MeO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-methoxide"},{"id":"ch7-r-bulky","skill":"Separate bulk from strength","prompt":"Classify t-BuO⁻ (tert-butoxide).","choices":["Good nucleophile; weak base","Strong base and strong nucleophile","Strong bulky base; hindered nucleophile","Weak nucleophile and weak base"],"answer":2,"why":"The oxygen is strongly basic, but three methyl groups crowd its approach to carbon. Removing an accessible H is easier than squeezing in for backside attack. It favors E2 when a suitable β-H is present.","more":"“Poor nucleophile” is relative, not an absolute ban. Methyl halides have no β-H and can undergo SN2 even with tert-butoxide.","image":"gabe_c231_ch7_1104_mol-tert-butoxide-aec164f.png","alt":"Is t-BuOK mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-tert-butoxide"},{"id":"ch7-r-water","skill":"Check the actual charge","prompt":"Classify neutral H₂O.","choices":["Good nucleophile; weak base","Strong base and strong nucleophile","Strong bulky base; hindered nucleophile","Weak nucleophile and weak base"],"answer":3,"why":"Water has lone pairs, but it is much less reactive than HO⁻. It is weak at both jobs. It can still attack a carbocation or remove H during SN1/E1.","more":"","image":"gabe_c231_ch7_1104_mol-water-3a73926.png","alt":"Is H₂O mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-water"},{"id":"ch7-r-cn","skill":"Identify a substitution-oriented reagent","prompt":"Classify CN⁻ in the course’s ordinary alkyl-halide comparison.","choices":["Good nucleophile; weak base","Strong base and strong nucleophile","Strong bulky base; hindered nucleophile","Weak nucleophile and weak base"],"answer":0,"why":"CN⁻ is a good carbon-attacking nucleophile. Its conjugate acid HCN is much more acidic than water/alcohols, so CN⁻ is a weaker base than HO⁻/RO⁻. Good nucleophile does not require strong basicity.","more":"","image":"gabe_c231_ch7_1104_mol-cyanide-07ee074.png","alt":"Is CN⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","card":"reagent-cyanide"}]},{"id":"substrate","name":"Find the reacting carbon","lesson":"Find the carbon directly bonded to the leaving group. Count only its directly attached carbon neighbors: 1 = primary, 2 = secondary, 3 = tertiary. Br, O and H do not count.","example":"In the pictured primary bromide, the carbon bonded to Br touches only one carbon. The length of the rest of the chain does not change that count.","scope":"quiz","questions":[{"id":"ch7-s-primary","skill":"Recognize a primary reacting carbon","prompt":"Classify the carbon directly bonded to Br in the drawing.","choices":["Primary (1°)","Secondary (2°)","Tertiary (3°)"],"answer":0,"why":"It has 1 directly attached carbon neighbor. Count from the reacting carbon; do not count Br or distant carbons.","more":"","image":"gabe_c231_ch7_1104_mol-primary-bromide.png","alt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","card":"flow-classify-primary-bromide"},{"id":"ch7-s-secondary","skill":"Recognize a secondary reacting carbon","prompt":"Classify the carbon directly bonded to Br in the drawing.","choices":["Primary (1°)","Secondary (2°)","Tertiary (3°)"],"answer":1,"why":"It has 2 directly attached carbon neighbors. Count from the reacting carbon; do not count Br or distant carbons.","more":"","image":"gabe_c231_ch7_1104_mol-secondary-bromide.png","alt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","card":"flow-classify-secondary-bromide"},{"id":"ch7-s-tertiary","skill":"Recognize a tertiary reacting carbon","prompt":"Classify the carbon directly bonded to Br in the drawing.","choices":["Primary (1°)","Secondary (2°)","Tertiary (3°)"],"answer":2,"why":"It has 3 directly attached carbon neighbors. Count from the reacting carbon; do not count Br or distant carbons.","more":"","image":"gabe_c231_ch7_1104_mol-tertiary-bromide.png","alt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","card":"flow-classify-tertiary-bromide"},{"id":"ch7-s-count","skill":"Exclude other atoms","prompt":"A carbon touches two carbons, one Br and one H. What degree is it?","choices":["Primary","Secondary","Tertiary","Quaternary"],"answer":1,"why":"Only the two carbon neighbors count. Four total bonds does not mean quaternary.","more":"","image":"","alt":"","card":null},{"id":"ch7-s-benzyl","skill":"Degree and resonance are different labels","prompt":"A positive carbon is directly beside a benzene ring. What extra description applies?","choices":["Benzylic","Vinylic","Aromatic carbon itself","No resonance is possible"],"answer":0,"why":"Benzylic means directly beside benzene. Its empty p orbital can overlap with the ring. It can also be primary, secondary or tertiary; those labels answer a different question.","more":"","image":"","alt":"","card":null}]},{"id":"leaving","name":"Leaving groups and charges","lesson":"A leaving group takes the C–LG bond’s electron pair. A stable, weak base usually leaves better. OH must usually be activated first.","example":"For C–Br breaking heterolytically, draw an arrow FROM the C–Br bond TO Br. Br becomes Br⁻; the carbon becomes C⁺ if no other bond forms at that moment.","scope":"quiz","questions":[{"id":"ch7-l-tail","skill":"Start at electrons","prompt":"For loss of Br⁻ in SN1, where does the curved arrow start?","choices":["At Br’s negative charge","At the C–Br bond","At the empty carbon orbital"],"answer":1,"why":"The shared bond contains the electrons being moved. Its electron pair goes to Br; the arrow starts on that bond.","more":"","image":"","alt":"","card":null},{"id":"ch7-l-charge","skill":"Conserve charge","prompt":"Neutral R–Br ionizes without simultaneous attack. What forms?","choices":["R⁺ and Br⁻","R⁻ and Br⁺","Two neutral radicals"],"answer":0,"why":"Br takes both bonding electrons. Carbon loses its share and is positive. Total charge remains zero.","more":"","image":"","alt":"","card":null},{"id":"ch7-l-oh","skill":"Recognize a poor leaving group","prompt":"Can unactivated HO⁻ normally leave easily from an alcohol?","choices":["Yes; every oxygen is a good leaving group","No; it is a strong base","Only because it has a negative charge"],"answer":1,"why":"HO⁻ is too basic to be an ordinary good leaving group. Protonation changes the leaving species to neutral water.","more":"","image":"gabe_c231_ch7_1104_mol-hydroxide.png","alt":"Is HO⁻ a good or poor leaving group in this table?","card":"lg-hydroxide"},{"id":"ch7-l-protonate","skill":"Activate OH","prompt":"After protonating R–OH, which species can leave?","choices":["H₂O","O²⁻","HO⁻","H⁻"],"answer":0,"why":"R–OH₂⁺ can lose neutral H₂O. We change the group before asking it to leave.","more":"","image":"","alt":"How does acid make an alcohol’s OH group easier to leave?","card":"lg-protonate"},{"id":"ch7-l-order","skill":"Compare leaving groups","prompt":"For comparable ordinary alkyl halides, which is the best leaving group?","choices":["F⁻","Cl⁻","Br⁻","I⁻"],"answer":3,"why":"I⁻ is a very weak base and can stabilize the departing charge. Usual order: I⁻ > Br⁻ > Cl⁻ ≫ F⁻.","more":"","image":"gabe_c231_ch7_1104_halides-unranked.png","alt":"Rank these halides from best to worst leaving group.","card":"lg-halide-order"}]},{"id":"solvents","name":"Protic vs polar aprotic","lesson":"For this course, look for O–H or N–H. Those solvents donate hydrogen bonds and are protic. Polar solvents without those bonds are polar aprotic.","example":"Ethanol has O–H: protic. Acetone has oxygen but no O–H: polar aprotic. “Contains H” is not the test.","scope":"quiz","questions":[{"id":"ch7-v-ethanol","skill":"Locate O–H","prompt":"Classify ethanol.","choices":["Protic","Polar aprotic"],"answer":0,"why":"The O–H bond can donate a hydrogen bond. C–H is not what makes it protic.","more":"","image":"gabe_c231_ch7_1104_mol-ethanol-d427418.png","alt":"Is this solvent (ethanol) protic or polar aprotic?","card":"solvent-ethanol"},{"id":"ch7-v-acetone","skill":"Oxygen alone is not enough","prompt":"Classify acetone.","choices":["Protic","Polar aprotic"],"answer":1,"why":"Its carbonyl makes it polar; it has no O–H or N–H bond to donate hydrogen bonds.","more":"","image":"gabe_c231_ch7_1104_mol-acetone-6910dd8.png","alt":"Is this solvent (acetone) protic or polar aprotic?","card":"solvent-acetone"},{"id":"ch7-v-dmso","skill":"Recognize a common solvent","prompt":"Classify DMSO.","choices":["Protic","Polar aprotic"],"answer":1,"why":"DMSO is polar and has no O–H or N–H hydrogen-bond donor.","more":"","image":"gabe_c231_ch7_1104_mol-dmso-b2ce7b8.png","alt":"Is this solvent (DMSO) protic or polar aprotic?","card":"solvent-dmso"},{"id":"ch7-v-solvation","skill":"Explain the rate effect","prompt":"Why can water slow an anionic nucleophile’s SN2 attack?","choices":["It hydrogen-bonds around the anion","It removes every lone pair","It makes the carbon tertiary"],"answer":0,"why":"Hydrogen-bond solvation surrounds the anion and makes it less available for carbon attack. It does not erase its electrons.","more":"","image":"","alt":"Why can a protic solvent slow an anionic nucleophile in S\u003csub>N\u003c/sub>2?","card":"solvent-protic-anion"},{"id":"ch7-v-ionization","skill":"Support ion formation","prompt":"Why can a polar protic solvent support SN1 ionization?","choices":["It stabilizes the resulting ions","It creates a β-H","It forces concerted attack"],"answer":0,"why":"It solvates the carbocation and departing anion, making charge separation easier. A suitable substrate and leaving group are still needed.","more":"","image":"","alt":"","card":null}]},{"id":"sn2","name":"SN2: one step, two arrows","lesson":"Carbon attack and leaving-group departure happen together. There is no free carbocation between them. Two arrows describe electron movement, not two separate steps.","example":"I⁻ attacks an accessible carbon while C–Br breaks: arrow from an I lone pair to carbon; arrow from C–Br to Br. Both belong to the same step.","scope":"quiz","questions":[{"id":"ch7-n-steps","skill":"Distinguish arrows from steps","prompt":"A normal SN2 mechanism has how many elementary steps?","choices":["One","Two because it has two arrows","Three"],"answer":0,"why":"Making C–Nu and breaking C–LG happen together through one transition state. No carbocation valley lies between them.","more":"","image":"","alt":"How many steps/intermediates do S\u003csub>N\u003c/sub>2 and E2 have?","card":"one-step"},{"id":"ch7-n-tail","skill":"Start the attack arrow","prompt":"The nucleophile’s attack arrow starts at…","choices":["Its lone pair","The positive carbon label","The leaving-group atom"],"answer":0,"why":"The nucleophile supplies the bonding electron pair. Arrow tails must start on the electrons being moved.","more":"","image":"","alt":"","card":null},{"id":"ch7-n-carbocation","skill":"Reject an invented intermediate","prompt":"Does ordinary SN2 form a free carbocation?","choices":["Yes","No"],"answer":1,"why":"SN2 is concerted. A structure showing fully departed Br before nucleophilic attack would describe an ionization step, not SN2.","more":"","image":"","alt":"","card":null},{"id":"ch7-n-backside","skill":"Approach opposite the leaving group","prompt":"Where does the SN2 nucleophile approach?","choices":["Opposite the leaving group","From the leaving-group side","Either side equally"],"answer":0,"why":"Backside approach aligns its electrons with the antibonding C–LG orbital. It produces inversion at the reacting stereocenter.","more":"","image":"","alt":"What is the nucleophile–carbon–leaving-group angle in an S\u003csub>N\u003c/sub>2 attack?","card":"sn2-backside"},{"id":"ch7-n-crowding","skill":"Explain substrate effects","prompt":"Why does an ordinary tertiary alkyl carbon resist SN2?","choices":["Backside approach is crowded","It has no carbon neighbors","Its Br cannot ever leave"],"answer":0,"why":"Three carbon groups obstruct the approaching nucleophile. That blocks ordinary SN2; it does not prohibit every other mechanism.","more":"","image":"gabe_c231_ch7_1104_substrates-unranked.png","alt":"What is the usual S\u003csub>N\u003c/sub>2 substrate-reactivity order?","card":"sn2-substrate"}]},{"id":"e2","name":"E2: remove H and form C=C","lesson":"The base takes a β-H while C–H electrons form the π bond and the leaving group departs. All three electron moves happen in one step.","example":"Draw three arrows: base lone pair → β-H; C–H bond → Cα–Cβ bond; C–LG bond → LG. The new π electrons come from C–H, not from nowhere.","scope":"quiz","questions":[{"id":"ch7-e-beta","skill":"Locate β-H","prompt":"Cα bears Br. Where is a β-H located?","choices":["On a carbon directly next to Cα","On Br","Only on Cα"],"answer":0,"why":"The β carbon is directly adjacent to the carbon bearing the leaving group. Its H can be removed to form Cα=Cβ.","more":"","image":"","alt":"","card":null},{"id":"ch7-e-pi","skill":"Track the new bond’s electrons","prompt":"In E2, which electrons make the new π bond?","choices":["The β C–H bond’s pair","A new electron pair appears","Br’s lone pair returns"],"answer":0,"why":"The C–H bond breaks as its electron pair forms the π bond between the α and β carbons.","more":"","image":"","alt":"","card":null},{"id":"ch7-e-anti","skill":"Check geometry","prompt":"The usual E2 reactive conformation places C–H and C–LG…","choices":["Anti-periplanar, 180° dihedral","Eclipsed on the same side","At any angle equally"],"answer":0,"why":"Their bonds point opposite ways in one plane when viewed down Cα–Cβ. This gives the orbital alignment needed for the concerted step.","more":"","image":"","alt":"What β-H/leaving-group alignment is normally required for E2?","card":"e2-anti"},{"id":"ch7-e-cation","skill":"Count intermediates","prompt":"How many carbocation intermediates does normal E2 have?","choices":["Zero","One","Two"],"answer":0,"why":"E2 has a transition state, not a separate carbocation intermediate. There is no carbocation available for an ordinary 1,2-shift.","more":"","image":"","alt":"","card":null},{"id":"ch7-e-methyl","skill":"Check a required ingredient","prompt":"Why can a methyl halide not undergo ordinary E2?","choices":["It has no β-carbon or β-H","Its leaving group never leaves","All strong bases must do SN1"],"answer":0,"why":"There is no adjacent carbon on which to remove β-H and make an alkene. Check prerequisites before applying a bulky-base shortcut.","more":"","image":"","alt":"","card":null}]},{"id":"sn1e1","name":"SN1/E1: finish the mechanism","lesson":"First the leaving group leaves, creating a carbocation. Then a nucleophile attacks carbon (SN1), or a base takes β-H (E1). A carbocation is not the final product.","example":"Water attack gives R–OH₂⁺. Another water removes one H⁺, yielding neutral R–OH and H₃O⁺. In E1, β C–H electrons instead form the C=C bond.","scope":"quiz","questions":[{"id":"ch7-u-first","skill":"Identify the shared first step","prompt":"What first step do SN1 and E1 share?","choices":["Loss of leaving group to make a carbocation","A strong base must attack carbon first","One concerted elimination"],"answer":0,"why":"Ionization occurs before attack/deprotonation. This distinguishes the stepwise pathways from SN2/E2.","more":"","image":"","alt":"","card":null},{"id":"ch7-u-ocharge","skill":"Track oxygen after water attack","prompt":"Water bonds to R⁺ using a lone pair. Immediately afterward, oxygen has three bonds. Its charge is…","choices":["+1","0","−1"],"answer":0,"why":"Three bonds and one lone pair give oxygen +1. The immediate product is R–OH₂⁺, an oxonium ion, before deprotonation.","more":"","image":"","alt":"","card":null},{"id":"ch7-u-final","skill":"Separate intermediate from product","prompt":"For SN1 solvolysis in water, which is the final organic substitution product?","choices":["R⁺","R–OH₂⁺","R–OH"],"answer":2,"why":"R⁺ and R–OH₂⁺ are intermediates. Another water removes H⁺ from the oxonium ion to give neutral alcohol.","more":"","image":"","alt":"","card":null},{"id":"ch7-u-proton","skill":"Account for the other H","prompt":"When R–OH₂⁺ becomes R–OH in water, where does the removed H go?","choices":["To another H₂O, forming H₃O⁺","It disappears","Onto carbon as H⁻"],"answer":0,"why":"This is proton transfer. The O–H bonding pair stays on the alcohol oxygen; another water accepts H⁺.","more":"","image":"","alt":"","card":null},{"id":"ch7-u-e1","skill":"Finish elimination","prompt":"After carbocation formation in E1, how does the alkene form?","choices":["A base takes β-H; C–H electrons make C=C","The positive charge is the final alkene","A ring resonance form is always the product"],"answer":0,"why":"Removing β-H uses the C–H electron pair to form the π bond to the cationic carbon. The organic alkene is neutral.","more":"","image":"","alt":"","card":null}]},{"id":"rates","name":"Rates and energy diagrams","lesson":"For SN2/E2, rate = k[substrate][reagent]. For SN1/E1, rate = k[substrate] for rate-limiting ionization. A transition-state peak is not an isolable intermediate.","example":"If SN2 substrate doubles and nucleophile triples, the rate becomes 2 × 3 = 6 times as large. Count concentration factors, not substances in the flask.","scope":"quiz","questions":[{"id":"ch7-k-sn2","skill":"Apply the bimolecular law","prompt":"SN2: [substrate] doubles, [nucleophile] triples, k unchanged. Rate becomes…","choices":["2×","3×","5×","6×"],"answer":3,"why":"Multiply the factors in k[S][Nu]: 2 × 3 = 6. Do not add them or square only the substrate.","more":"","image":"","alt":"","card":null},{"id":"ch7-k-sn1","skill":"Identify what affects the slow step","prompt":"SN1: only [nucleophile] doubles; [substrate] and medium stay fixed. Initial rate becomes…","choices":["Unchanged","2×","4×"],"answer":0,"why":"The rate-limiting ionization involves the substrate: rate = k[S]. The later nucleophile attack is not in that rate law.","more":"","image":"","alt":"","card":null},{"id":"ch7-k-dilute","skill":"Handle dilution","prompt":"For SN2, volume doubles with fixed reactant moles and unchanged k. Rate becomes…","choices":["One half","One quarter","Twice","Unchanged"],"answer":1,"why":"Both concentrations halve: (1/2) × (1/2) = 1/4. These assumptions exclude major medium changes.","more":"","image":"","alt":"","card":null},{"id":"ch7-k-valley","skill":"Identify an intermediate","prompt":"On a reaction-coordinate diagram, a carbocation intermediate is…","choices":["A local valley between two peaks","The top of a peak","Every point on the curve"],"answer":0,"why":"An intermediate has a finite lifetime and sits in a local minimum. Transition states are the peaks.","more":"","image":"","alt":"","card":null},{"id":"ch7-k-barrier","skill":"Measure from the right starting level","prompt":"An intermediate is at G = 20; the next TS is at G = 45 kJ/mol. That step’s forward barrier is…","choices":["20","25","45","65"],"answer":1,"why":"Subtract the energy of that step’s starting species: 45 − 20 = 25 kJ/mol. Do not automatically measure every barrier from the original reactants.","more":"","image":"","alt":"","card":null}]},{"id":"stereo","name":"Inversion, racemization and anti geometry","lesson":"SN2 inverts spatial configuration. A planar SN1 carbocation permits attack from either face. E2 requires anti geometry; cyclohexane chairs normally require trans-diaxial H/LG.","example":"A ring flip swaps axial ↔ equatorial but preserves up/down. You flip only if needed to place the leaving group axial, then check an opposite axial β-H.","scope":"quiz","questions":[{"id":"ch7-g-invert","skill":"Separate shape from labels","prompt":"Does SN2 inversion guarantee that an R label becomes S?","choices":["Yes, always","No; priorities must be reassigned"],"answer":1,"why":"The spatial configuration inverts, but the new group can change CIP priorities. Reassign R/S after substitution.","more":"","image":"","alt":"What happens to configuration at a reacting S\u003csub>N\u003c/sub>2 stereocenter?","card":"sn2-inversion"},{"id":"ch7-g-planar","skill":"Explain attack on two faces","prompt":"Why can SN1 form both configurations at the reacting carbon?","choices":["The carbocation is planar","It rotates an existing double bond freely","There are always two nucleophiles"],"answer":0,"why":"Either face of the planar carbocation can be attacked. A simplified achiral-environment model gives racemization; real ion pairs can bias the ratio.","more":"","image":"gabe_c231_ch7_1104_sn1-e1-one-question.png","alt":"What does the “1” mean in S\u003csub>N\u003c/sub>1 and E1?","card":"flow-one-meaning"},{"id":"ch7-g-axial","skill":"Check chair geometry","prompt":"For ordinary E2 on a cyclohexane chair, H and LG should be…","choices":["Both axial, one up and one down","Both equatorial","Both axial and both up"],"answer":0,"why":"Trans-diaxial alignment supplies the anti-periplanar arrangement. A neighboring carbon also needs an axial H.","more":"","image":"","alt":"In a cyclohexane chair, what positions must β-H and LG occupy for ordinary E2?","card":"ring-trans-diaxial"},{"id":"ch7-g-flip","skill":"Preserve configuration","prompt":"During a chair flip, an up equatorial substituent becomes…","choices":["Up axial","Down axial","Down equatorial"],"answer":0,"why":"A flip changes axial/equatorial, not up/down. Changing up to down would change configuration.","more":"","image":"","alt":"","card":null},{"id":"ch7-g-rotate","skill":"Rotate before elimination","prompt":"In an open-chain E2 problem, why rotate about Cα–Cβ before making the alkene?","choices":["To align β-H and LG anti","To invert one stereocenter","To rotate the final C=C freely"],"answer":0,"why":"A single bond can rotate to the reactive conformer. Keep each carbon’s three groups together. After C=C forms, free rotation is lost.","more":"","image":"","alt":"What β-H/leaving-group alignment is normally required for E2?","card":"e2-anti"}]},{"id":"alkenes","name":"Alkene foundations","lesson":"Count carbon groups attached to the two alkene carbons, excluding the other alkene carbon. For E/Z, rank each end separately by CIP priority. E means opposite; Z means same.","example":"CH₃–CH=CH–CH₃ has two attached carbon groups: disubstituted. Its high-priority groups are both CH₃; opposite means E. This condensed formula is intentional for the counting task.","scope":"quiz","questions":[{"id":"ch7-a-count","skill":"Count substitution","prompt":"For CH₃–CH=CH–CH₃, what degree of alkene substitution applies?","choices":["Mono","Di","Tri","Tetra"],"answer":1,"why":"Each alkene carbon bears one external carbon group: two total. Do not count the alkene carbons themselves.","more":"","image":"","alt":"","card":null},{"id":"ch7-a-ez","skill":"Apply the priority rule","prompt":"High-priority substituents on the two alkene carbons lie on opposite sides. Label?","choices":["E","Z","Always cis"],"answer":0,"why":"E means opposite sides for the higher-priority group at each end. Z means same side. E/Z is not assigned by group size alone.","more":"","image":"","alt":"","card":null},{"id":"ch7-a-identical","skill":"Check whether E/Z exists","prompt":"One alkene carbon bears two H atoms. Does this alkene have E/Z stereoisomers?","choices":["Yes","No"],"answer":1,"why":"Each alkene carbon needs two different substituents. Two identical H groups on one end prevent E/Z.","more":"","image":"","alt":"","card":null},{"id":"ch7-a-stability","skill":"Compare like alkenes","prompt":"For otherwise comparable simple alkenes, greater alkyl substitution usually gives…","choices":["Greater stability","Less stability","No possible difference"],"answer":0,"why":"Alkyl groups stabilize an alkene through electronic interactions. Conjugation and severe steric strain can change simple comparisons.","more":"","image":"","alt":"","card":null},{"id":"ch7-a-dbe","skill":"Calculate unsaturation","prompt":"For C₄H₇Br, what is the degree of unsaturation?","choices":["0","1","2","3"],"answer":1,"why":"DBE = (2C + 2 − H − X)/2 = (8 + 2 − 7 − 1)/2 = 1. Halogens count like H; oxygen is ignored.","more":"","image":"","alt":"","card":null}]},{"id":"rearrange","name":"Rearrangements and charge","lesson":"A neighboring C–H or C–C bond can migrate with its electron pair into a carbocation. The positive charge moves to the carbon that lost that bond. Carbon atoms do not disappear.","example":"If a hydride moves from carbon A to adjacent C⁺ B, draw from A–H to B. A becomes positive. Check whether that new carbocation is more stable.","scope":"exam","questions":[{"id":"ch7-m-source","skill":"Locate migrating electrons","prompt":"A hydride shifts from A to adjacent B⁺. Arrow starts at…","choices":["The A–H bond","The H label alone","The B⁺ symbol"],"answer":0,"why":"Hydride migration moves the C–H bonding pair. The arrow ends at the cationic carbon B.","more":"","image":"","alt":"","card":null},{"id":"ch7-m-charge","skill":"Put the charge on the donor","prompt":"After that shift, where is the positive charge?","choices":["A","B","On H as H⁻"],"answer":0,"why":"A lost its C–H bond’s electron pair. B gained a bond and its octet; A is now electron-deficient.","more":"","image":"","alt":"","card":null},{"id":"ch7-m-which","skill":"Require an intermediate","prompt":"Which mechanism can normally rearrange through a carbocation?","choices":["SN1 or E1","Ordinary SN2 or E2","Every substitution"],"answer":0,"why":"SN1/E1 form a carbocation. Concerted SN2/E2 have no discrete carbocation that can undergo a 1,2-shift.","more":"","image":"","alt":"","card":null},{"id":"ch7-m-stable","skill":"Compare carbocations","prompt":"Among comparable nonresonance carbocations, which is most stable?","choices":["Primary","Secondary","Tertiary"],"answer":2,"why":"Adjacent carbon groups stabilize the empty p orbital through hyperconjugation and electron donation. Check resonance separately.","more":"","image":"","alt":"","card":null},{"id":"ch7-m-resonance","skill":"Keep resonance separate from a new product","prompt":"Two drawings move only π electrons and the + charge around a benzylic system. They are…","choices":["Resonance contributors of one cation","Two final elimination products","A hydride shift"],"answer":0,"why":"Resonance changes electron placement, not atom connectivity. To finish E1, remove β-H and form the neutral alkene.","more":"","image":"","alt":"","card":null}]},{"id":"synthesis","name":"Synthesis and reaction choice","lesson":"For a substitution synthesis, separate the target into an alkyl electrophile and a nucleophile. Use an accessible sp³ carbon bearing a good leaving group. Preserve atom connectivity.","example":"For methyl ethyl ether, CH₃Br + ethoxide is a good SN2 plan: methyl is open to backside attack. Choosing a tertiary halide would block SN2.","scope":"exam","questions":[{"id":"ch7-y-active","skill":"Identify the reactive part","prompt":"In NaOEt, which part attacks carbon or removes H?","choices":["EtO⁻","Na⁺","The whole reagent becomes neutral oxygen"],"answer":0,"why":"Na⁺ is a counterion. The ethoxide oxygen retains the negative charge and lone pairs.","more":"","image":"","alt":"In NaOEt, does Na⁺ make the oxygen in EtO⁻ neutral?","card":"sodium-spectator"},{"id":"ch7-y-cut","skill":"Select an SN2 disconnection","prompt":"For an ether made by SN2, break the target bond between…","choices":["O and an accessible sp³ alkyl carbon","Two arbitrary carbons","A benzene ring’s internal double bond"],"answer":0,"why":"Replace O at the alkyl carbon with a leaving group. The other fragment supplies an alkoxide nucleophile.","more":"","image":"","alt":"","card":null},{"id":"ch7-y-target","skill":"Respect the alkyl-halide constraint","prompt":"To make an ester by alkyl-halide SN2 + carboxylate, the nucleophile attacks…","choices":["The sp³ carbon bearing the halide","The carbonyl carbon of an acid chloride","Any aromatic sp² carbon"],"answer":0,"why":"This route uses a carboxylate oxygen to attack an alkyl halide. Acyl substitution is a different route and does not satisfy an alkyl-halide instruction.","more":"","image":"","alt":"","card":null},{"id":"ch7-y-tertiary","skill":"Avoid a blocked plan","prompt":"Why is a tertiary alkyl halide a poor Williamson SN2 electrophile?","choices":["Crowding blocks backside attack","It has no bonds","Alkoxide is not a base"],"answer":0,"why":"A strong alkoxide with a tertiary halide commonly gives E2 instead. Put the leaving group on the less hindered alkyl fragment.","more":"","image":"","alt":"","card":null},{"id":"ch7-y-stereo","skill":"Plan backwards from inversion","prompt":"For an SN2 target with a stereocenter, the starting C–LG arrangement should be…","choices":["Opposite in spatial configuration at that center","Always the same R/S label","A planar carbocation"],"answer":0,"why":"SN2 inverts. Construct the precursor with the opposite spatial arrangement, then assign labels using each structure’s own priorities.","more":"","image":"","alt":"","card":null}]}],"diagrams":{"primary-cation":{"title":"Primary carbocation · 1 carbon neighbor","description":"Two different ions are being compared, not reaction steps. Here the positive carbon is bonded to one CH3 carbon group and two H atoms.","nodes":[{"id":"a","element":"C","charge":1,"implicitH":0,"x":145,"y":90,"label":"C⁺"},{"id":"b","element":"C","charge":0,"implicitH":3,"x":55,"y":90,"label":"CH₃","neighbor":true},{"id":"h1","element":"H","charge":0,"implicitH":0,"x":216,"y":33,"label":"H"},{"id":"h2","element":"H","charge":0,"implicitH":0,"x":216,"y":148,"label":"H"}],"bonds":[["a","b"],["a","h1"],["a","h2"]],"carbonNeighbors":1},"tertiary-cation":{"title":"Tertiary carbocation · 3 carbon neighbors","description":"This is a separate ion, not a rearrangement of the primary example. The positive carbon has three bonds to three CH3 carbon groups.","nodes":[{"id":"a","element":"C","charge":1,"implicitH":0,"x":145,"y":90,"label":"C⁺"},{"id":"b","element":"C","charge":0,"implicitH":3,"x":55,"y":90,"label":"CH₃","neighbor":true},{"id":"c","element":"C","charge":0,"implicitH":3,"x":216,"y":33,"label":"CH₃","neighbor":true},{"id":"d","element":"C","charge":0,"implicitH":3,"x":216,"y":148,"label":"CH₃","neighbor":true}],"bonds":[["a","b"],["a","c"],["a","d"]],"carbonNeighbors":3}},"reagents":[{"id":"reagent-hydride","section":"03 Reagents","prompt":"Is NaH mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base; poor nucleophile for ordinary alkyl substitution.\u003c/b>","why":"NaH is normally used to deprotonate an alcohol, making an alkoxide and H₂. It is not a general SN2 nucleophile, and “strong base” alone does not guarantee an E2 product.","front":"gabe_c231_ch7_1104_mol-hydride-a36bc63.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-tert-butoxide","section":"03 Reagents","prompt":"Is t-BuOK mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong, bulky base; usually favors E2.\u003c/b>","why":"The active species is t-BuO⁻. With a methyl halide, S\u003csub>N\u003c/sub>2 can occur because E2 has no β-H.","front":"gabe_c231_ch7_1104_mol-tert-butoxide-aec164f.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-dbn","section":"03 Reagents","prompt":"Is DBN mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong, hindered base; poor nucleophile.\u003c/b>","why":"The basic nitrogen can take H⁺, but the bicyclic structure makes carbon attack less favorable. With a suitable β-H and leaving group, E2 is favored.","front":"gabe_c231_ch7_1104_mol-dbn-84dd76d.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-dbu","section":"03 Reagents","prompt":"Is DBU mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong, hindered base; poor nucleophile.\u003c/b>","why":"DBU is a strong amidine base. Its structure disfavors ordinary alkyl substitution, so it is commonly chosen to remove H⁺ rather than attach to carbon.","front":"gabe_c231_ch7_1104_mol-dbu-c503e8a.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-hydroxide","section":"03 Reagents","prompt":"Is HO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base and strong nucleophile.\u003c/b>","why":"It can remove β-H (E2) or attack carbon (S\u003csub>N\u003c/sub>2); check the substrate.","front":"gabe_c231_ch7_1104_mol-hydroxide-52a8cb1.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-methoxide","section":"03 Reagents","prompt":"Is MeO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base and strong nucleophile.\u003c/b>","why":"It is relatively unhindered. Primary substrates often give S\u003csub>N\u003c/sub>2; secondary/tertiary substrates favor E2 under the table’s conditions.","front":"gabe_c231_ch7_1104_mol-methoxide-7d7714b.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-ethoxide","section":"03 Reagents","prompt":"Is EtO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base and strong nucleophile.\u003c/b>","why":"The negatively charged oxygen strongly accepts H⁺. It is also accessible enough for carbon attack: strong at both. A tertiary substrate blocks SN2 even with this nucleophile.","front":"gabe_c231_ch7_1104_mol-ethoxide-a90b98e.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-iodide","section":"03 Reagents","prompt":"Is I⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Usually favors substitution over E2; the substrate and solvent still matter.","front":"gabe_c231_ch7_1104_mol-iodide-25f9b83.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-bromide","section":"03 Reagents","prompt":"Is Br⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Br⁻ is polarizable and can donate electrons to an accessible carbon. HBr is a strong acid, so Br⁻ is a weak base. A negative charge alone does not predict E2.","front":"gabe_c231_ch7_1104_mol-bromide-1a65b4d.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-chloride","section":"03 Reagents","prompt":"Is Cl⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Cl⁻ can attack an accessible carbon, but HCl is a strong acid, so Cl⁻ is a weak base. Its nucleophilicity is strongly affected by solvent.","front":"gabe_c231_ch7_1104_mol-chloride-0d09c77.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-hydrosulfide","section":"03 Reagents","prompt":"Is HS⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; relatively weak base.\u003c/b>","why":"Sulfur is large and polarizable, helping carbon attack. H₂S is more acidic than water, so HS⁻ is less basic than HO⁻. That makes it substitution-oriented.","front":"gabe_c231_ch7_1104_mol-hydrosulfide-98eb525.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-thiolate","section":"03 Reagents","prompt":"Is RS⁻ (example: MeS⁻) mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; relatively weak base.\u003c/b>","why":"Sulfur’s diffuse electrons make it a good nucleophile. Thiols are more acidic than alcohols, so RS⁻ is less basic than RO⁻. Less basic does not mean bad at carbon attack.","front":"gabe_c231_ch7_1104_mol-thiolate-7b90e2f.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-hydrogen-sulfide","section":"03 Reagents","prompt":"Is H₂S mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good sulfur nucleophile; weak base in this chart.\u003c/b>","why":"Neutral H₂S still has sulfur lone pairs. Sulfur’s polarizability makes it more nucleophilic than the analogous oxygen compound in this course comparison; it remains weakly basic.","front":"gabe_c231_ch7_1104_mol-hydrogen-sulfide-9c1babf.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-methanethiol","section":"03 Reagents","prompt":"Is RSH (example: MeSH) mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good sulfur nucleophile; weak base in this chart.\u003c/b>","why":"Neutral sulfur still has lone pairs available for carbon attack. Sulfur’s polarizability makes thiols more nucleophilic than alcohols in the course comparison. It is not a strong base.","front":"gabe_c231_ch7_1104_mol-methanethiol-94ea025.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-cyanide","section":"03 Reagents","prompt":"Is CN⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; relatively weak base in this chart.\u003c/b>","why":"It commonly substitutes at a suitable primary/secondary alkyl carbon.","front":"gabe_c231_ch7_1104_mol-cyanide-07ee074.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-azide","section":"03 Reagents","prompt":"Is N₃⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Its charge is delocalized over three nitrogens, lowering basicity. It can still donate an electron pair to an accessible carbon, so it is a useful SN2 nucleophile.","front":"gabe_c231_ch7_1104_mol-azide-a76b683.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-acetate","section":"03 Reagents","prompt":"Is CH₃CO₂⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Nucleophile; weak base.\u003c/b>","why":"Resonance spreads its negative charge over two oxygens. That lowers its attraction to H⁺ and makes it a weak base. It can still substitute at a suitable alkyl carbon; it is weaker than RO⁻ as a nucleophile.","front":"gabe_c231_ch7_1104_mol-acetate-17f6d79.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-water","section":"03 Reagents","prompt":"Is H₂O mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Weak base and weak nucleophile.\u003c/b>","why":"Do not apply the HO⁻ classification to neutral H₂O.","front":"gabe_c231_ch7_1104_mol-water-3a73926.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-methanol","section":"03 Reagents","prompt":"Is CH₃OH mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Weak base and weak nucleophile.\u003c/b>","why":"Neutral CH₃OH lacks the extra negative charge of CH₃O⁻. It is weak at both jobs, but can trap a carbocation; that initially gives a positively charged oxygen.","front":"gabe_c231_ch7_1104_mol-methanol-c935efe.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-ethanol","section":"03 Reagents","prompt":"Is CH₃CH₂OH mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Weak base and weak nucleophile.\u003c/b>","why":"Do not confuse EtOH with EtO⁻. The neutral alcohol is weak at both jobs, though it can attack a carbocation or take β-H in SN1/E1.","front":"gabe_c231_ch7_1104_mol-ethanol-2548857.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]}],"recall":[{"id":"lg-hydroxide","section":"01 Leaving groups","prompt":"Is HO⁻ a good or poor leaving group in this table?","answer":"\u003cb>Poor leaving group.\u003c/b>","why":"It is too basic to leave readily in ordinary substitution/elimination.","front":"gabe_c231_ch7_1104_mol-hydroxide.png","back":"","more":"Table reference: conjugate acid = H₂O; listed pKₐ ≈ 14. These are the scan’s rounded course-table values, not universal solvent-independent constants. ","refs":["leaving"],"tags":["leaving_group"]},{"id":"lg-halide-order","section":"01 Leaving groups","prompt":"Rank these halides from best to worst leaving group.","answer":"\u003cb>I⁻ > Br⁻ > Cl⁻ ≫ F⁻.\u003c/b>","why":"For ordinary alkyl halides, fluoride is the poor leaving group in this set.","front":"gabe_c231_ch7_1104_halides-unranked.png","back":"","more":"","refs":["leaving","comparison"],"tags":[]},{"id":"lg-protonate","section":"01 Leaving groups","prompt":"How does acid make an alcohol’s OH group easier to leave?","answer":"\u003cb>Protonate OH to make OH₂⁺; then H₂O can leave.\u003c/b>","why":"The leaving species changes from strongly basic HO⁻ to neutral water.","front":"","back":"gabe_c231_ch7_1104_protonate-oh.png","more":"","refs":["leaving"],"tags":[]},{"id":"solvent-ethanol","section":"02 Solvents","prompt":"Is this solvent (ethanol) protic or polar aprotic?","answer":"\u003cb>Protic.\u003c/b>","why":"It has an O–H or N–H bond that can donate a hydrogen bond.","front":"gabe_c231_ch7_1104_mol-ethanol-d427418.png","back":"","more":"","refs":["solvents"],"tags":["solvent"]},{"id":"solvent-acetone","section":"02 Solvents","prompt":"Is this solvent (acetone) protic or polar aprotic?","answer":"\u003cb>Polar aprotic.\u003c/b>","why":"It is polar but has no O–H or N–H bond to donate a hydrogen bond.","front":"gabe_c231_ch7_1104_mol-acetone-6910dd8.png","back":"","more":"","refs":["solvents"],"tags":["solvent"]},{"id":"solvent-dmso","section":"02 Solvents","prompt":"Is this solvent (DMSO) protic or polar aprotic?","answer":"\u003cb>Polar aprotic.\u003c/b>","why":"It is polar but has no O–H or N–H bond to donate a hydrogen bond.","front":"gabe_c231_ch7_1104_mol-dmso-b2ce7b8.png","back":"","more":"","refs":["solvents"],"tags":["solvent"]},{"id":"solvent-protic-anion","section":"02 Solvents","prompt":"Why can a protic solvent slow an anionic nucleophile in S\u003csub>N\u003c/sub>2?","answer":"\u003cb>It hydrogen-bonds around the anion.\u003c/b>","why":"That solvation makes the nucleophile less available for backside attack.","front":"","back":"gabe_c231_ch7_1104_protic-solvation.png","more":"","refs":["solvents","comparison"],"tags":[]},{"id":"reagent-hydride","section":"03 Reagents","prompt":"Is NaH mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base; poor nucleophile for ordinary alkyl substitution.\u003c/b>","why":"NaH is normally used to deprotonate an alcohol, making an alkoxide and H₂. It is not a general SN2 nucleophile, and “strong base” alone does not guarantee an E2 product.","front":"gabe_c231_ch7_1104_mol-hydride-a36bc63.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-tert-butoxide","section":"03 Reagents","prompt":"Is t-BuOK mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong, bulky base; usually favors E2.\u003c/b>","why":"The active species is t-BuO⁻. With a methyl halide, S\u003csub>N\u003c/sub>2 can occur because E2 has no β-H.","front":"gabe_c231_ch7_1104_mol-tert-butoxide-aec164f.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-dbn","section":"03 Reagents","prompt":"Is DBN mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong, hindered base; poor nucleophile.\u003c/b>","why":"The basic nitrogen can take H⁺, but the bicyclic structure makes carbon attack less favorable. With a suitable β-H and leaving group, E2 is favored.","front":"gabe_c231_ch7_1104_mol-dbn-84dd76d.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-dbu","section":"03 Reagents","prompt":"Is DBU mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong, hindered base; poor nucleophile.\u003c/b>","why":"DBU is a strong amidine base. Its structure disfavors ordinary alkyl substitution, so it is commonly chosen to remove H⁺ rather than attach to carbon.","front":"gabe_c231_ch7_1104_mol-dbu-c503e8a.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-hydroxide","section":"03 Reagents","prompt":"Is HO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base and strong nucleophile.\u003c/b>","why":"It can remove β-H (E2) or attack carbon (S\u003csub>N\u003c/sub>2); check the substrate.","front":"gabe_c231_ch7_1104_mol-hydroxide-52a8cb1.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-methoxide","section":"03 Reagents","prompt":"Is MeO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base and strong nucleophile.\u003c/b>","why":"It is relatively unhindered. Primary substrates often give S\u003csub>N\u003c/sub>2; secondary/tertiary substrates favor E2 under the table’s conditions.","front":"gabe_c231_ch7_1104_mol-methoxide-7d7714b.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-ethoxide","section":"03 Reagents","prompt":"Is EtO⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Strong base and strong nucleophile.\u003c/b>","why":"The negatively charged oxygen strongly accepts H⁺. It is also accessible enough for carbon attack: strong at both. A tertiary substrate blocks SN2 even with this nucleophile.","front":"gabe_c231_ch7_1104_mol-ethoxide-a90b98e.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-iodide","section":"03 Reagents","prompt":"Is I⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Usually favors substitution over E2; the substrate and solvent still matter.","front":"gabe_c231_ch7_1104_mol-iodide-25f9b83.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-bromide","section":"03 Reagents","prompt":"Is Br⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Br⁻ is polarizable and can donate electrons to an accessible carbon. HBr is a strong acid, so Br⁻ is a weak base. A negative charge alone does not predict E2.","front":"gabe_c231_ch7_1104_mol-bromide-1a65b4d.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-chloride","section":"03 Reagents","prompt":"Is Cl⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Cl⁻ can attack an accessible carbon, but HCl is a strong acid, so Cl⁻ is a weak base. Its nucleophilicity is strongly affected by solvent.","front":"gabe_c231_ch7_1104_mol-chloride-0d09c77.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-hydrosulfide","section":"03 Reagents","prompt":"Is HS⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; relatively weak base.\u003c/b>","why":"Sulfur is large and polarizable, helping carbon attack. H₂S is more acidic than water, so HS⁻ is less basic than HO⁻. That makes it substitution-oriented.","front":"gabe_c231_ch7_1104_mol-hydrosulfide-98eb525.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-thiolate","section":"03 Reagents","prompt":"Is RS⁻ (example: MeS⁻) mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; relatively weak base.\u003c/b>","why":"Sulfur’s diffuse electrons make it a good nucleophile. Thiols are more acidic than alcohols, so RS⁻ is less basic than RO⁻. Less basic does not mean bad at carbon attack.","front":"gabe_c231_ch7_1104_mol-thiolate-7b90e2f.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-hydrogen-sulfide","section":"03 Reagents","prompt":"Is H₂S mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good sulfur nucleophile; weak base in this chart.\u003c/b>","why":"Neutral H₂S still has sulfur lone pairs. Sulfur’s polarizability makes it more nucleophilic than the analogous oxygen compound in this course comparison; it remains weakly basic.","front":"gabe_c231_ch7_1104_mol-hydrogen-sulfide-9c1babf.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-methanethiol","section":"03 Reagents","prompt":"Is RSH (example: MeSH) mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good sulfur nucleophile; weak base in this chart.\u003c/b>","why":"Neutral sulfur still has lone pairs available for carbon attack. Sulfur’s polarizability makes thiols more nucleophilic than alcohols in the course comparison. It is not a strong base.","front":"gabe_c231_ch7_1104_mol-methanethiol-94ea025.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-cyanide","section":"03 Reagents","prompt":"Is CN⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; relatively weak base in this chart.\u003c/b>","why":"It commonly substitutes at a suitable primary/secondary alkyl carbon.","front":"gabe_c231_ch7_1104_mol-cyanide-07ee074.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-azide","section":"03 Reagents","prompt":"Is N₃⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Good nucleophile; weak base.\u003c/b>","why":"Its charge is delocalized over three nitrogens, lowering basicity. It can still donate an electron pair to an accessible carbon, so it is a useful SN2 nucleophile.","front":"gabe_c231_ch7_1104_mol-azide-a76b683.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-acetate","section":"03 Reagents","prompt":"Is CH₃CO₂⁻ mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Nucleophile; weak base.\u003c/b>","why":"Resonance spreads its negative charge over two oxygens. That lowers its attraction to H⁺ and makes it a weak base. It can still substitute at a suitable alkyl carbon; it is weaker than RO⁻ as a nucleophile.","front":"gabe_c231_ch7_1104_mol-acetate-17f6d79.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-water","section":"03 Reagents","prompt":"Is H₂O mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Weak base and weak nucleophile.\u003c/b>","why":"Do not apply the HO⁻ classification to neutral H₂O.","front":"gabe_c231_ch7_1104_mol-water-3a73926.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-methanol","section":"03 Reagents","prompt":"Is CH₃OH mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Weak base and weak nucleophile.\u003c/b>","why":"Neutral CH₃OH lacks the extra negative charge of CH₃O⁻. It is weak at both jobs, but can trap a carbocation; that initially gives a positively charged oxygen.","front":"gabe_c231_ch7_1104_mol-methanol-c935efe.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"reagent-ethanol","section":"03 Reagents","prompt":"Is CH₃CH₂OH mainly a base, a nucleophile, both, or weak at both in this chart?","answer":"\u003cb>Weak base and weak nucleophile.\u003c/b>","why":"Do not confuse EtOH with EtO⁻. The neutral alcohol is weak at both jobs, though it can attack a carbocation or take β-H in SN1/E1.","front":"gabe_c231_ch7_1104_mol-ethanol-2548857.png","back":"","more":"","refs":["reagents","nucleophiles"],"tags":["reagent_classification"]},{"id":"base-bulk","section":"03 Reagents","prompt":"Does “strong base” mean “bulky base”?","answer":"\u003cb>No. Strength and size are different properties.\u003c/b>","why":"HO⁻ is strong and small; t-BuO⁻ is strong and bulky.","front":"gabe_c231_ch7_1104_strong-small-bulky.png","back":"","more":"","refs":["reagents","comparison"],"tags":[]},{"id":"sodium-spectator","section":"03 Reagents","prompt":"In NaOEt, does Na⁺ make the oxygen in EtO⁻ neutral?","answer":"\u003cb>No. EtO⁻ remains negatively charged.\u003c/b>","why":"Na⁺ is a counterion. Ethoxide’s oxygen still has the electron pair/negative charge used in reaction.","front":"","back":"gabe_c231_ch7_1104_sodium-counterion.png","more":"","refs":["reagents"],"tags":[]},{"id":"path-04","section":"04 Choose the pathway","prompt":"Which pathway is favored under these conditions?","answer":"\u003cb>S\u003csub>N\u003c/sub>2.\u003c/b>","why":"A primary carbon is accessible to a good, weakly basic nucleophile.","front":"gabe_c231_ch7_1104_path-primary-bromide-CNDMSO.png","back":"","more":"","refs":["pathways","bimolecular","flowchart"],"tags":["pathway"]},{"id":"path-11","section":"04 Choose the pathway","prompt":"Which pathway is favored under these conditions?","answer":"\u003cb>E2.\u003c/b>","why":"A tertiary halide cannot undergo ordinary S\u003csub>N\u003c/sub>2; the strong base removes β-H.","front":"gabe_c231_ch7_1104_path-tertiary-bromide-EtOEtOH.png","back":"","more":"","refs":["pathways","bimolecular","flowchart"],"tags":["pathway"]},{"id":"path-14","section":"04 Choose the pathway","prompt":"Which pathway is favored under these conditions?","answer":"\u003cb>S\u003csub>N\u003c/sub>1/E1 competition.\u003c/b>","why":"Water supports ionization of this tertiary halide. Heating generally increases the elimination share; the exact ratio is not given.","front":"gabe_c231_ch7_1104_path-tertiary-bromide-HOWater.png","back":"","more":"","refs":["pathways","bimolecular","flowchart"],"tags":["pathway"]},{"id":"one-step","section":"05 Rate and geometry","prompt":"How many steps/intermediates do S\u003csub>N\u003c/sub>2 and E2 have?","answer":"\u003cb>One step; no intermediates.\u003c/b>","why":"Bond changes occur together (concerted), through a transition state.","front":"","back":"gabe_c231_ch7_1104_concerted.png","more":"","refs":["comparison"],"tags":[]},{"id":"rate-sn2","section":"05 Rate and geometry","prompt":"Write the S\u003csub>N\u003c/sub>2 rate law.","answer":"\u003cb>rate = k[substrate][nucleophile]\u003c/b>","why":"It is first order in each reactant; second order overall.","front":"gabe_c231_ch7_1104_sn2-rate-question.png","back":"gabe_c231_ch7_1104_rate-laws.png","more":"","refs":["comparison"],"tags":[]},{"id":"rate-e2","section":"05 Rate and geometry","prompt":"Write the E2 rate law.","answer":"\u003cb>rate = k[substrate][base]\u003c/b>","why":"Both participate in the one-step reaction.","front":"gabe_c231_ch7_1104_e2-rate-question.png","back":"gabe_c231_ch7_1104_rate-laws.png","more":"","refs":["comparison"],"tags":[]},{"id":"order-not-square","section":"05 Rate and geometry","prompt":"Does “second order overall” mean the substrate must be squared?","answer":"\u003cb>No.\u003c/b>","why":"For these S\u003csub>N\u003c/sub>2/E2 laws, 1 + 1 = 2 overall: [substrate]¹[reagent]¹, not [substrate]².","front":"gabe_c231_ch7_1104_rate-laws.png","back":"","more":"","refs":["comparison"],"tags":[]},{"id":"rate-triple-substrate","section":"05 Rate and geometry","prompt":"Only [substrate] is tripled. How does the rate change?","answer":"\u003cb>3× the original rate.\u003c/b>","why":"3¹ × 1¹ = 3.","front":"gabe_c231_ch7_1104_rate-laws.png","back":"","more":"","refs":["comparison"],"tags":["rate_scaling"]},{"id":"sn2-substrate","section":"05 Rate and geometry","prompt":"What is the usual S\u003csub>N\u003c/sub>2 substrate-reactivity order?","answer":"\u003cb>Methyl > 1° > 2° ≫ 3°.\u003c/b>","why":"Crowding blocks backside approach. Ordinary tertiary alkyl centers do not undergo S\u003csub>N\u003c/sub>2.","front":"gabe_c231_ch7_1104_substrates-unranked.png","back":"","more":"","refs":["comparison"],"tags":[]},{"id":"sn2-backside","section":"05 Rate and geometry","prompt":"What is the nucleophile–carbon–leaving-group angle in an S\u003csub>N\u003c/sub>2 attack?","answer":"\u003cb>180°: backside attack.\u003c/b>","why":"The nucleophile approaches opposite the leaving group.","front":"","back":"gabe_c231_ch7_1104_sn2-backside.png","more":"","refs":["comparison"],"tags":[]},{"id":"e2-anti","section":"05 Rate and geometry","prompt":"What β-H/leaving-group alignment is normally required for E2?","answer":"\u003cb>Anti-periplanar: 180° apart.\u003c/b>","why":"View down Cα–Cβ. The C–H and C–LG bonds point opposite ways in one plane. This is a dihedral angle, not a straight H–C–LG bond angle.","front":"","back":"gabe_c231_ch7_1104_newman-anti.png","more":"","refs":["comparison"],"tags":[]},{"id":"ring-trans-diaxial","section":"05 Rate and geometry","prompt":"In a cyclohexane chair, what positions must β-H and LG occupy for ordinary E2?","answer":"\u003cb>Both axial, with opposite up/down directions.\u003c/b>","why":"This is trans-diaxial. Ring flipping swaps axial/equatorial but preserves up/down.","front":"","back":"gabe_c231_ch7_1104_trans-diaxial.png","more":"","refs":["comparison"],"tags":[]},{"id":"sn2-inversion","section":"05 Rate and geometry","prompt":"What happens to configuration at a reacting S\u003csub>N\u003c/sub>2 stereocenter?","answer":"\u003cb>It inverts.\u003c/b>","why":"Backside attack reverses the spatial arrangement. Reassign priorities afterward: inversion does not guarantee the R/S letter changes.","front":"","back":"gabe_c231_ch7_1104_sn2-configuration-inverts.png","more":"","refs":["comparison"],"tags":[]},{"id":"e2-two-h","section":"05 Rate and geometry","prompt":"Two different anti β-H arrangements are accessible at one site. Must E2 give only one alkene stereoisomer?","answer":"\u003cb>No. Both can be possible; one may predominate.\u003c/b>","why":"This is stereoselectivity when one is favored. E is often favored, but accessibility and the actual substituents must be checked.","front":"gabe_c231_ch7_1104_e2-two-h.png","back":"","more":"","refs":["comparison"],"tags":[]},{"id":"flow-classify-primary-bromide","section":"07 Mechanism decision practice","prompt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","answer":"\u003cb>1° (primary).\u003c/b>","why":"The carbon directly bonded to Br has 1 carbon
