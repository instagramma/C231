ssification"]},{"id":"base-bulk","section":"03 Reagents","prompt":"Does “strong base” mean “bulky base”?","answer":"\u003cb>No. Strength and size are different properties.\u003c/b>","why":"HO⁻ is strong and small; t-BuO⁻ is strong and bulky.","front":"gabe_c231_ch7_1104_strong-small-bulky.png","back":"","more":"","refs":["reagents","comparison"],"tags":[]},{"id":"sodium-spectator","section":"03 Reagents","prompt":"In NaOEt, does Na⁺ make the oxygen in EtO⁻ neutral?","answer":"\u003cb>No. EtO⁻ remains negatively charged.\u003c/b>","why":"Na⁺ is a counterion. Ethoxide’s oxygen still has the electron pair/negative charge used in reaction.","front":"","back":"gabe_c231_ch7_1104_sodium-counterion.png","more":"","refs":["reagents"],"tags":[]},{"id":"path-04","section":"04 Choose the pathway","prompt":"Which pathway is favored under these conditions?","answer":"\u003cb>S\u003csub>N\u003c/sub>2.\u003c/b>","why":"A primary carbon is accessible to a good, weakly basic nucleophile.","front":"gabe_c231_ch7_1104_path-primary-bromide-CNDMSO.png","back":"","more":"","refs":["pathways","bimolecular","flowchart"],"tags":["pathway"]},{"id":"path-11","section":"04 Choose the pathway","prompt":"Which pathway is favored under these conditions?","answer":"\u003cb>E2.\u003c/b>","why":"A tertiary halide cannot undergo ordinary S\u003csub>N\u003c/sub>2; the strong base removes β-H.","front":"gabe_c231_ch7_1104_path-tertiary-bromide-EtOEtOH.png","back":"","more":"","refs":["pathways","bimolecular","flowchart"],"tags":["pathway"]},{"id":"path-14","section":"04 Choose the pathway","prompt":"Which pathway is favored under these conditions?","answer":"\u003cb>S\u003csub>N\u003c/sub>1/E1 competition.\u003c/b>","why":"Water supports ionization of this tertiary halide. Heating generally increases the elimination share; the exact ratio is not given.","front":"gabe_c231_ch7_1104_path-tertiary-bromide-HOWater.png","back":"","more":"","refs":["pathways","bimolecular","flowchart"],"tags":["pathway"]},{"id":"one-step","section":"05 Rate and geometry","prompt":"How many steps/intermediates do S\u003csub>N\u003c/sub>2 and E2 have?","answer":"\u003cb>One step; no intermediates.\u003c/b>","why":"Bond changes occur together (concerted), through a transition state.","front":"","back":"gabe_c231_ch7_1104_concerted.png","more":"","refs":["comparison"],"tags":[]},{"id":"rate-sn2","section":"05 Rate and geometry","prompt":"Write the S\u003csub>N\u003c/sub>2 rate law.","answer":"\u003cb>rate = k[substrate][nucleophile]\u003c/b>","why":"It is first order in each reactant; second order overall.","front":"gabe_c231_ch7_1104_sn2-rate-question.png","back":"gabe_c231_ch7_1104_rate-laws.png","more":"","refs":["comparison"],"tags":[]},{"id":"rate-e2","section":"05 Rate and geometry","prompt":"Write the E2 rate law.","answer":"\u003cb>rate = k[substrate][base]\u003c/b>","why":"Both participate in the one-step reaction.","front":"gabe_c231_ch7_1104_e2-rate-question.png","back":"gabe_c231_ch7_1104_rate-laws.png","more":"","refs":["comparison"],"tags":[]},{"id":"order-not-square","section":"05 Rate and geometry","prompt":"Does “second order overall” mean the substrate must be squared?","answer":"\u003cb>No.\u003c/b>","why":"For these S\u003csub>N\u003c/sub>2/E2 laws, 1 + 1 = 2 overall: [substrate]¹[reagent]¹, not [substrate]².","front":"gabe_c231_ch7_1104_rate-laws.png","back":"","more":"","refs":["comparison"],"tags":[]},{"id":"rate-triple-substrate","section":"05 Rate and geometry","prompt":"Only [substrate] is tripled. How does the rate change?","answer":"\u003cb>3× the original rate.\u003c/b>","why":"3¹ × 1¹ = 3.","front":"gabe_c231_ch7_1104_rate-laws.png","back":"","more":"","refs":["comparison"],"tags":["rate_scaling"]},{"id":"sn2-substrate","section":"05 Rate and geometry","prompt":"What is the usual S\u003csub>N\u003c/sub>2 substrate-reactivity order?","answer":"\u003cb>Methyl > 1° > 2° ≫ 3°.\u003c/b>","why":"Crowding blocks backside approach. Ordinary tertiary alkyl centers do not undergo S\u003csub>N\u003c/sub>2.","front":"gabe_c231_ch7_1104_substrates-unranked.png","back":"","more":"","refs":["comparison"],"tags":[]},{"id":"sn2-backside","section":"05 Rate and geometry","prompt":"What is the nucleophile–carbon–leaving-group angle in an S\u003csub>N\u003c/sub>2 attack?","answer":"\u003cb>180°: backside attack.\u003c/b>","why":"The nucleophile approaches opposite the leaving group.","front":"","back":"gabe_c231_ch7_1104_sn2-backside.png","more":"","refs":["comparison"],"tags":[]},{"id":"e2-anti","section":"05 Rate and geometry","prompt":"What β-H/leaving-group alignment is normally required for E2?","answer":"\u003cb>Anti-periplanar: 180° apart.\u003c/b>","why":"View down Cα–Cβ. The C–H and C–LG bonds point opposite ways in one plane. This is a dihedral angle, not a straight H–C–LG bond angle.","front":"","back":"gabe_c231_ch7_1104_newman-anti.png","more":"","refs":["comparison"],"tags":[]},{"id":"ring-trans-diaxial","section":"05 Rate and geometry","prompt":"In a cyclohexane chair, what positions must β-H and LG occupy for ordinary E2?","answer":"\u003cb>Both axial, with opposite up/down directions.\u003c/b>","why":"This is trans-diaxial. Ring flipping swaps axial/equatorial but preserves up/down.","front":"","back":"gabe_c231_ch7_1104_trans-diaxial.png","more":"","refs":["comparison"],"tags":[]},{"id":"sn2-inversion","section":"05 Rate and geometry","prompt":"What happens to configuration at a reacting S\u003csub>N\u003c/sub>2 stereocenter?","answer":"\u003cb>It inverts.\u003c/b>","why":"Backside attack reverses the spatial arrangement. Reassign priorities afterward: inversion does not guarantee the R/S letter changes.","front":"","back":"gabe_c231_ch7_1104_sn2-configuration-inverts.png","more":"","refs":["comparison"],"tags":[]},{"id":"e2-two-h","section":"05 Rate and geometry","prompt":"Two different anti β-H arrangements are accessible at one site. Must E2 give only one alkene stereoisomer?","answer":"\u003cb>No. Both can be possible; one may predominate.\u003c/b>","why":"This is stereoselectivity when one is favored. E is often favored, but accessibility and the actual substituents must be checked.","front":"gabe_c231_ch7_1104_e2-two-h.png","back":"","more":"","refs":["comparison"],"tags":[]},{"id":"flow-classify-primary-bromide","section":"07 Mechanism decision practice","prompt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","answer":"\u003cb>1° (primary).\u003c/b>","why":"The carbon directly bonded to Br has 1 carbon neighbor.","front":"gabe_c231_ch7_1104_mol-primary-bromide.png","back":"","more":"Count the carbon neighbors of the reacting carbon, not every carbon in the molecule. Br itself and attached H atoms do not count toward the carbon degree.","refs":["flowchart"],"tags":["substrate_classification"]},{"id":"flow-classify-secondary-bromide","section":"07 Mechanism decision practice","prompt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","answer":"\u003cb>2° (secondary).\u003c/b>","why":"The carbon directly bonded to Br has 2 carbon neighbors.","front":"gabe_c231_ch7_1104_mol-secondary-bromide.png","back":"","more":"Count the carbon neighbors of the reacting carbon, not every carbon in the molecule. Br itself and attached H atoms do not count toward the carbon degree.","refs":["flowchart"],"tags":["substrate_classification"]},{"id":"flow-classify-tertiary-bromide","section":"07 Mechanism decision practice","prompt":"Classify the carbon bonded to Br: 1°, 2°, or 3°?","answer":"\u003cb>3° (tertiary).\u003c/b>","why":"The carbon directly bonded to Br has 3 carbon neighbors.","front":"gabe_c231_ch7_1104_mol-tertiary-bromide.png","back":"","more":"Count the carbon neighbors of the reacting carbon, not every carbon in the molecule. Br itself and attached H atoms do not count toward the carbon degree.","refs":["flowchart"],"tags":["substrate_classification"]},{"id":"flow-one-meaning","section":"07 Mechanism decision practice","prompt":"What does the “1” mean in S\u003csub>N\u003c/sub>1 and E1?","answer":"\u003cb>One substrate molecule participates in the rate-determining ionization step.\u003c/b>","why":"It does not mean one total step. These mechanisms form a carbocation intermediate.","front":"gabe_c231_ch7_1104_sn1-e1-one-question.png","back":"","more":"","refs":["flowchart"],"tags":[]}],"written":[{"id":"ch7-write-sn2","topic":"sn2","title":"Draw the SN2 arrows","card":"path-04","task":"The drawing shows a primary bromide with CN⁻ in DMSO. Draw the two curved arrows for SN2 and the organic product. Include the leaving ion.","answer":"CN⁻ attacks through carbon at the carbon bearing Br; the C–Br pair goes to Br. Replace Br with –C≡N and show Br⁻. No carbocation is drawn.","checks":["Arrow starts at the cyanide carbon lone pair and ends at Cα.","Second arrow starts on C–Br and ends on Br.","New C–C≡N bond; Br⁻; same carbon skeleton."],"why":"An accessible primary carbon + good, weakly basic nucleophile in polar aprotic solvent supports concerted SN2.","model":"sn2-two-arrows","scope":"exam"},{"id":"ch7-write-e2","topic":"e2","title":"Explain where C=C comes from","card":"path-11","task":"For the pictured tertiary bromide with ethoxide, draw one E2 step with all three arrows and the organic alkene.","answer":"Ethoxide takes β-H. The β C–H pair makes Cα=Cβ while C–Br breaks to Br⁻. The tert-butyl substrate gives 2-methylpropene.","checks":["Base lone pair → β-H.","β C–H bond → Cα–Cβ bond.","C–Br bond → Br; product is neutral alkene."],"why":"The substrate is tertiary, so ordinary SN2 is blocked. Ethoxide is a strong base; E2 uses an available β-H.","model":"e2-three-arrows","scope":"exam"},{"id":"ch7-write-water","topic":"sn1e1","title":"Water attack is not the last step","card":"path-14","task":"For the pictured tertiary bromide in water, draw the SN1 substitution pathway all the way to the final organic product. Include every charge and proton transfer.","answer":"C–Br → Br gives the tertiary carbocation + Br⁻. A water lone pair attacks C⁺, giving R–OH₂⁺. Another water takes H⁺; that O–H bond pair stays on the alcohol oxygen. Final organic product: tert-butanol. H₃O⁺ and Br⁻ account for the other species.","checks":["C⁺ is an intermediate, not the endpoint.","The immediate water-attack product has O⁺ and two H atoms.","A deprotonation arrow pair gives neutral R–OH."],"why":"Water is neutral. When its O makes a third bond, it becomes positive and must lose H⁺ to yield the neutral alcohol.","scope":"exam"},{"id":"ch7-write-e1","topic":"sn1e1","title":"Finish E1 after the carbocation","card":"path-14","task":"Use the same pictured substrate under heated solvolysis conditions. Draw the E1 elimination pathway and explain the source of the new π electrons.","answer":"Ionization gives the tert-butyl carbocation. Water removes a β-H; the C–H bonding pair goes into the adjacent C–C bond. Final organic product: 2-methylpropene, with H₃O⁺ and Br⁻ also formed.","checks":["LG departs first; carbocation charge is shown.","Water O lone pair → β-H; C–H → adjacent C–C.","Final alkene is neutral; no extra carbon or missing carbon."],"why":"The carbocation has an empty p orbital. The adjacent C–H pair supplies the second bond as H⁺ is removed.","scope":"exam"},{"id":"ch7-write-rate","topic":"rates","title":"Write and use both rate laws","task":"For SN2, write the rate law and find the change when only the substrate concentration triples. For SN1, do the same. Explain why both give that factor despite different mechanisms.","answer":"SN2: k[S][Nu], so 3×. SN1: k[S], so 3×. Both are first order in substrate, but SN2 also depends on nucleophile concentration.","checks":["SN2 includes both concentrations.","SN1 includes substrate only.","Both factors are 3, with k and other conditions fixed."],"why":"The molecularity describes the rate-determining elementary step, not simply the number of chemicals written before the reaction arrow.","scope":"quiz"},{"id":"ch7-write-anti","topic":"stereo","title":"Explain the anti requirement","card":"e2-two-h","task":"Draw a Newman view down a chosen Cα–Cβ bond. Place LG on the front carbon at 12 o’clock and a β-H on the rear carbon anti to it. Then explain whether you rotated a single or double bond.","answer":"Rear β-H is at 6 o’clock. The dihedral angle is 180°. Rotation is about the Cα–Cβ SINGLE bond before elimination; the new C=C cannot freely rotate.","checks":["Front/rear carbons are identified.","H and LG are 180° apart.","Other substituents rotate together with their carbon."],"why":"Anti-periplanar geometry aligns the breaking C–H and C–LG bonds for simultaneous π-bond formation.","model":"newman-anti","scope":"quiz"},{"id":"ch7-write-reagent","topic":"reagents","title":"Explain the four reagent families","card":"base-bulk","task":"Without a table, classify I⁻, CH₃O⁻, t-BuO⁻ and H₂O. Give one reason for each. Then state what additional information you need to choose a mechanism.","answer":"I⁻: good nucleophile/weak base. CH₃O⁻: strong at both. t-BuO⁻: strong bulky base, hindered nucleophile. H₂O: weak at both. Also inspect substrate, LG, solvent, temperature and available β-H/geometry.","checks":["Base = takes H⁺; nucleophile = carbon attack in these problems.","Size is separate from strength.","A reagent family alone does not settle every mechanism."],"why":"Nucleophilicity is a rate of carbon attack; basicity is an equilibrium preference for H⁺. They are related but not identical.","scope":"quiz"},{"id":"ch7-write-energy","topic":"rates","title":"Draw the energy profiles","task":"Sketch SN2 and SN1 solvolysis by water. Label transition states and all intermediates. Explain why proton transfer adds a step in this SN1 example.","answer":"SN2 has one peak and no intermediate. Water SN1 has ionization → carbocation; attack → oxonium; proton transfer → neutral alcohol. A complete drawing has three elementary-step peaks and two intermediate valleys; exact peak heights are not specified.","checks":["Axes: G vs reaction coordinate.","SN2 has no carbocation valley.","Water SN1 includes both C⁺ and R–OH₂⁺ valleys."],"why":"Neutral water attack makes a three-bonded O⁺; deprotonation is a separate step needed for the neutral product.","scope":"quiz"},{"id":"ch7-write-shift","topic":"rearrange","title":"Track charge in a 1,2-shift","task":"Draw CH₃–CH⁺–C(CH₃)₃ in bond-line form. A neighboring methyl migrates from the quaternary carbon to the cationic carbon. Draw the arrow and new carbocation. Keep all six carbons.","answer":"The starting formula actually contains SIX carbons: a CH₃, a CH⁺, a quaternary C and three CH₃ groups. Move a C–CH₃ bond from the quaternary neighbor to CH⁺. The donor becomes C⁺. Product connectivity: CH₃–CH(CH₃)–C⁺(CH₃)₂.","checks":["C–C bond, not a lone methyl label, is the arrow tail.","Charge ends on the donor carbon.","Six carbons remain; secondary cation becomes tertiary."],"why":"The migrated bond fills the old cation’s octet. The donor loses the pair and becomes the new, more substituted cation.","scope":"exam"},{"id":"ch7-write-synthesis","topic":"synthesis","title":"Plan a Williamson ether synthesis","task":"Make methyl ethyl ether by SN2. Draw one good alkyl-halide/alkoxide pair and both curved arrows. This task deliberately asks you to construct the structures from the name.","answer":"One valid pair: CH₃Br + Na⁺ ⁻OCH₂CH₃. Ethoxide O attacks methyl carbon; C–Br pair goes to Br. Product CH₃–O–CH₂CH₃ + NaBr. Another valid route uses CH₃O⁻ + bromoethane.","checks":["Alkyl halide has an accessible sp³ carbon.","Alkoxide oxygen retains −1 before attack; Na⁺ is a counterion.","New O–C bond is correct; no acyl halide substituted for the requested alkyl halide."],"why":"An ether can be split on either side of O, but the electrophilic carbon must be compatible with SN2.","scope":"exam"},{"id":"ch7-write-bondbasics","topic":"bondbasics","title":"Explain what the carbon count means","task":"Draw an ordinary primary carbocation. Mark its direct carbon neighbor and count all electrons around the positive carbon. Explain whether stabilization by a neighboring carbon group requires an H shift.","answer":"An example is CH₃–CH₂⁺. The positive carbon has one carbon neighbor and two H bonds: three bonds × two electrons = six electrons around it. Nearby C–H bond electron clouds can help stabilize the empty orbital without moving H. A hydrogen shift is a separate change of atom connections.","checks":["The chosen positive carbon has three bonds and no nonbonding electrons.","Primary counts one direct carbon neighbor; the H atoms are excluded from that degree.","Six surrounding electrons; electron sharing and H migration are distinguished."],"why":"Counting carbon neighbors, counting all bonds and counting electrons are three different tasks.","scope":"quiz"},{"id":"ch7-write-sn2timeline","topic":"sn2timeline","title":"Explain the SN2 timeline","task":"In words, give both curved-arrow starting points and endpoints for I⁻ attacking a suitable primary R–Br. Explain whether the arrows describe one event or two, and whether a separate C⁺ intermediate is present. No product drawing is required.","answer":"I lone pair → the carbon bearing Br; C–Br bond → Br. Both bond changes occur in the same elementary step. No separate carbocation intermediate forms.","checks":["The incoming arrow starts at the I electron pair and ends at carbon.","The departing arrow starts at the C–Br bond and ends at Br.","The description says together, one step, with no separate C⁺."],"why":"Correct arrow placement and a correct explanation of timing must agree.","scope":"quiz"},{"id":"ch7-write-rolesolvent","topic":"rolesolvent","title":"Explain your reagent classification","task":"Explain why “CH₃OH is protic” does not tell you that it is a strong base or that it cannot be a nucleophile. Compare its reactivity with CH₃O⁻ and state what I⁻ shows about using negative charge alone.","answer":"Protic describes hydrogen-bond donation by a solvent. Neutral methanol has oxygen lone pairs and can act as a weak nucleophile/base. Methoxide is stronger at both in the usual course comparison. I⁻ is a good nucleophile but weak base, so negative charge does not guarantee strong basicity.","checks":["Solvent classification is separated from nucleophile/base roles.","Neutral methanol is allowed to act as a weak nucleophile.","The iodide counterexample rejects negative-equals-strong-base."],"why":"Classify the property the question asks for, rather than using one label for every chemical behavior.","scope":"quiz"}],"scope":{"quiz":"Chapter 7 Quiz A: Nov 10 lecture. Nov 6 announcement explicitly excludes predictive questions; no complete item blueprint supplied.","source":"https://smccd.instructure.com/courses/73887/discussion_topics/1375144","exam":"Exam 3 A3 Part A Nov 12; Part B Nov 17 (Nov 4 announcement). Official topic list is non-exhaustive.","lecture":"Nov 5 SN1/E1 transcript supplied Nov 9; automated summary is not an answer key."},"visuals":{"regio-positions":{"panels":[{"label":"A · OEt attached at C3","svg":"\u003csvg role=\"img\" aria-label=\"Six-carbon backbone numbered 1–6; ethoxy oxygen bonded to carbon 3; C4=C5.\" version='1.1' baseProfile='full'\n              xmlns='http://www.w3.org/2000/svg'\n                      xmlns:rdkit='http://www.rdkit.org/xml'\n                      xmlns:xlink='http://www.w3.org/1999/xlink'\n                  xml:space='preserve'\nwidth=\"100%\" height=\"auto\" viewBox='0 0 440 250'>\n\u003c!-- END OF HEADER -->\n\u003crect style='opacity:1.0;fill:#FFFFFF;stroke:none' width='440.0' height='250.0' x='0.0' y='0.0'> \u003c/rect>\n\u003cpath class='bond-0 atom-0 atom-1' d='M 116.8,89.5 L 157.6,65.9' style='fill:none;fill-rule:evenodd;stroke:#000000;stroke-width:2.6px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1' />\n\u003cpath class='bond-1 atom-1 atom-2' d='M 157.6,65.9 L 198.5,89.5' style='fill:none;fill-rule:evenodd;stroke:#000000;stroke-width:2.6px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1' />\ e Br pulls electron density away."},{"term":"Base","means":"A proton acceptor: it takes H⁺ using an electron pair.","example":"Ethoxide can remove a β-H during E2."},{"term":"Substrate","means":"The starting molecule whose bonds are being changed.","example":"In bromoethane + I⁻, bromoethane is the substrate."},{"term":"Solvent","means":"The liquid medium surrounding the reacting molecules. It can affect their reactivity.","example":"Water can be both the solvent and the attacking nucleophile in solvolysis."},{"term":"Protic solvent","means":"A solvent with an O–H or N–H bond that can donate a hydrogen bond.","example":"Water and ethanol are protic. Their O–H groups can hydrogen-bond around an anionic nucleophile."},{"term":"Aprotic solvent","means":"A solvent without the O–H/N–H hydrogen-bond donors used in this course’s test.","example":"Acetone and DMSO are polar aprotic. C–H bonds do not make a solvent protic. Aprotic alone does not mean polar: hexane is nonpolar and aprotic."},{"term":"Hydrogen bond","means":"An attraction involving H bonded to an electronegative atom, such as O or N, and an electron-rich partner. It is not the same as forming a new covalent O–H bond.","example":"Water’s O–H groups can surround an anionic nucleophile through hydrogen bonding, slowing its carbon attack."},{"term":"Leaving group","means":"The group that departs with the C–LG bonding electron pair in an ordinary heterolytic step.","example":"C–Br breaks to Br⁻. A weak base is generally a better leaving group."},{"term":"Carbocation","means":"A carbon carrying a positive charge. A typical alkyl carbocation has three bonds, six valence-shell electrons and an empty p orbital.","example":"After a suitable C–Br bond ionizes in SN1, carbon is positive and Br is negative. The cation is an intermediate."},{"term":"Concerted","means":"The electron moves belong to one elementary step.","example":"SN2 makes C–Nu while C–LG breaks; two arrows do not mean two steps."},{"term":"Stepwise","means":"Separate elementary steps with at least one intermediate between them.","example":"SN1: leaving group loss, then nucleophile attack. Water attack can require a later proton-transfer step."},{"term":"Regiochemistry","means":"Which position in the molecule reacts: where the new bond or double bond is located.","example":"OEt attached at C3 versus C5 changes the attachment position."},{"term":"Stereochemistry","means":"How connected atoms are arranged in 3D.","example":"With the same depicted backbone and attachment carbon, wedge versus dash can change configuration."},{"term":"Allylic","means":"Directly next to a C=C double bond, rather than on a double-bond carbon.","example":"An sp³ carbon bearing Br next to C=C is allylic; its carbocation can be resonance-stabilized."},{"term":"Vinylic","means":"Directly on a carbon of a C=C double bond.","example":"Br bonded to a double-bond carbon is vinylic. Do not apply ordinary allylic SN1 behavior to it."},{"term":"Benzylic","means":"On a side-chain carbon directly next to a benzene ring.","example":"Benzene–CH₂–Br is benzylic, and can form a resonance-stabilized benzylic carbocation."},{"term":"Aryl","means":"Directly part of an aromatic ring; an aryl halide has its halogen directly bonded to that ring carbon.","example":"Bromobenzene is aryl, not benzylic. Ordinary SN1/SN2 at that ring carbon is not expected."},{"term":"Alpha carbon (Cα)","means":"In these alkyl-halide mechanisms, the carbon directly bonded to the leaving group.","example":"Find Cα first, then count its direct carbon neighbors to classify the substrate."},{"term":"Beta carbon (Cβ)","means":"A carbon directly adjacent to Cα in these elimination problems.","example":"A β-H is bonded to Cβ. Its C–H electrons can form Cα=Cβ during elimination."},{"term":"Steric hindrance","means":"Crowding that makes it harder for a reagent to reach its target.","example":"Three carbon groups around a tertiary carbon block ordinary SN2 backside approach."},{"term":"Resonance","means":"Different valid electron drawings of one delocalized species. Atoms stay in the same places and keep the same connections.","example":"An allylic carbocation has positive-charge character at more than one carbon. The drawings are not separate isolated intermediates."},{"term":"Enantiomers","means":"Nonsuperimposable mirror-image molecules with the same atom connections.","example":"With only one stereocenter and no other chirality, its two opposite configurations form an enantiomeric pair."},{"term":"Diastereomers","means":"Stereoisomers that are not mirror images of each other.","example":"If one stereocenter stays fixed and only a second center changes, the products are diastereomers."},{"term":"Racemic mixture","means":"An equal mixture of the two members of an enantiomeric pair.","example":"SN1 can form both configurations. Exact 50:50 formation is a simplified model, not a guarantee for every real SN1 reaction."},{"term":"Anti-periplanar","means":"C–H and C–leaving-group bonds are 180° apart in dihedral angle, in one plane.","example":"For ordinary E2 on a cyclohexane chair, look for trans-diaxial β-H and leaving group."},{"term":"sp² versus sp³","means":"sp² commonly has three electron regions and a trigonal-planar arrangement; sp³ commonly has four and a tetrahedral arrangement.","example":"The SN1 carbocation carbon is sp²; a saturated substitution product carbon is usually sp³."},{"term":"Nucleophilicity versus basicity","means":"Nucleophilicity concerns how fast electron-pair donation occurs; basicity concerns the equilibrium preference for accepting H⁺.","example":"I⁻ can be a good nucleophile but a weak base. Size, charge, resonance and solvent can affect the two properties differently."}]};let SOURCE={"total":77,"captured":77,"missing":[],"coverage":"Visible parts only. Not an all-parts guarantee.","slots":[]};

function newmanMarkup(){return `<section class="concept-visual"><h2>Rotate the rear carbon only</h2><svg id="newman-demo" viewBox="0 0 360 240" role="img" aria-label="Interactive Newman view down C alpha to C beta"></svg><p id="newman-status" class="visual-caption" aria-live="polite"></p><button data-lesson-action="rotate">Rotate rear carbon to anti →</button><p class="small">Front carbon stays fixed. Every group on the rear carbon turns together around the C–C single bond.</p></section>`}
function renderNewman(angle){
 const el=$('#newman-demo');if(!el)return;
 const line=(x1,y1,x2,y2,color='#173b43')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.6"/>`;
 const label=(x,y,text,color='#173b43')=>`<text x="${x}" y="${y}" fill="${color}" font-family="system-ui,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle">${text}</text>`;
 const point=(degrees,r)=>{const a=degrees*Math.PI/180;return [180+r*Math.cos(a),113+r*Math.sin(a)]};
 let out='<circle cx="180" cy="113" r="42" fill="white" stroke="#173b43" stroke-width="2.5"/>';
 for(const [a,name,color] of [[90+angle,'Hβ','#086f88'],[210+angle,'CH₃','#173b43'],[330+angle,'H','#173b43']]){out+=line(...point(a,42),...point(a,73),color)+label(...point(a,98),name,color)}

 el.innerHTML=out+'<circle cx="180" cy="113" r="4" fill="#173b43"/>';
 if(teaching)teaching.rotation=angle;
 $('#newman-status').textContent=angle<.1?'Now: Br at 12, selected rear Hβ at 6. They are 180° apart: anti.':'Before: selected rear Hβ is not opposite Br. Rotate the rear carbon to line them up.';
}
