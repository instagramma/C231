/* The exam is a secondary destination. Only explicit exam URLs enter it. */
function examNode(tag,text,attrs={}){
  const node=el(tag,attrs);
  node.textContent=text;
  return node;
}
function examLink(label,path,cls="exam-link"){
  return examNode("a",label,{href:"#"+path,class:cls});
}
function examLabel(source,index){
  if(["monday","fall","makeup","test1a"].includes(source.id)){
    const label=(source.id==="fall" && index===2)?"Concept Q2 (second)":index<3?"Concept Q"+(index+1):"Problem "+(index-2);
    return label+" · p. "+examPapers[source.id][source.keys[index]].page;
  }
  if(source.id==="worksheets") return index<4?"1D motion "+(index+1):"Projectiles "+(index-3);
  return source.id==="lecture"?"Class example "+(index+1):"Practice "+(index+1);
}
function examStoreKey(source,key,revision=midtermBank[key].revision){
  const base="midtermNov26/"+source.id+"/"+key;
  return revision?base+"/"+revision:base;
}
function examProgress(source,key){
  let stored=safeStore.get(examStoreKey(source,key),null);
  if(!stored && midtermBank[key].revision){
    const previous=safeStore.get(examStoreKey(source,key,""),{})||{};
    // The lesson order changed. Carry the learner's writing into the new first step.
    stored={step:previous.setupDone?0:-1,setupDone:previous.setupDone,
      givensDraft:previous.givensDraft,onPaper:previous.onPaper,notes:previous.notes};
  }
  stored=stored||{};
  const total=midtermBank[key].steps.length;
  const step=Number.isInteger(stored.step)?Math.max(-1,Math.min(total,stored.step)):-1;
  const revisedValues=(key==="springstick" || key==="springelastic") && stored.originalPaper!==true;
  return {step:revisedValues?-1:step, originalPaper:!!examPapers[source.id],
    setupDone:stored.setupDone===true, givensDraft:typeof stored.givensDraft==="string"?stored.givensDraft:"",
    onPaper:stored.onPaper===true, entered:typeof stored.entered==="string"?stored.entered:"",checked:!revisedValues && step>=0 && step<total && stored.checked===true,notes:typeof stored.notes==="string"?stored.notes:""};
}

  const a=examLink("",path,"exam-menu-link");
  const words=el("span"); words.append(examNode("strong",title),examNode("small",sub));
  a.append(words,examNode("span","›",{"aria-hidden":"true",class:"exam-chevron"}));parent.append(a);
}
function examPageTitle(parent,title){
  const h=examNode("h2",title,{tabindex:"-1",class:"exam-title"}); parent.append(h);return h;
}
function examIndex(root){
  examPageTitle(root,"Midterm practice");
  root.append(examNode("p","Choose a practice paper. Read the original question, write your givens, then choose an equation. Use g = 10 m/s² for this exam.",{class:"exam-desc"}));
  const last=safeStore.get("midtermNov26/last",null);
  const lastSource=last && midtermSources.find(s=>s.id===last.source && s.keys.includes(last.key));
  if(lastSource){
    const p=examProgress(lastSource,last.key);
    if((p.step>=0 || p.givensDraft || p.onPaper) && p.step<midtermBank[last.key].steps.length){
      root.append(examLink("Continue · "+midtermBank[last.key].title,"midterm/"+lastSource.id+"/"+last.key,"btn"));
    }
  }
  const list=el("div",{class:"exam-list"});
  function addSource(s,parent){
    const count=s.keys.filter(key=>examProgress(s,key).step===midtermBank[key].steps.length).length;
    examMenuLink(parent,"midterm/"+s.id,s.title,s.keys.length+" entries"+(count?" · "+count+" completed":""));
  }
  midtermSources.slice(0,4).forEach(s=>addSource(s,list));
  root.append(list);
  const extras=el("details",{class:"exam-details"});
  extras.append(examNode("summary","Lecture, homework and diagnostic practice"));
  const more=el("div",{class:"exam-list"});midtermSources.slice(4).forEach(s=>addSource(s,more));extras.append(more);root.append(extras);
}
function examSourcePage(root,s){
  root.append(examLink("‹ All practice sources","midterm"));
  examPageTitle(root,s.title);
  const list=el("div",{class:"exam-list"});
  s.keys.forEach((key,i)=>{
    const item=midtermBank[key], progress=examProgress(s,key);
    const status=progress.step===item.steps.length?" · completed":(progress.step>=0 || progress.givensDraft || progress.onPaper)?" · in progress":"";
    examMenuLink(list,"midterm/"+s.id+"/"+key,item.title,examLabel(s,i)+" · Ch. "+item.ch+status);
  });
  root.append(list);
}

function examPaperPrompt(root,paper,key){
  if(paper.context)root.append(examNode("p","From problem 2 · "+paper.context,{class:"exam-context"}));
  root.append(examNode("p",paper.text,{class:"exam-story exam-original"}));
  if(paper.fig){
    const diagram=paperDiagrams[paper.fig];
    const fig=el("figure",{class:"exam-source-figure"});
    fig.append(el("img",{src:diagram.src,alt:diagram.alt,width:diagram.width,height:diagram.height}));
    root.append(fig);
  }
  if(key==="twoballs"){
    const details=el("details",{class:"exam-hint"});
    details.append(examNode("summary","Roof sketch from the annotated copy (redrawn)"));
    const drawing=el("div",{class:"exam-roof"});
    drawing.innerHTML='<svg viewBox="0 0 345 145" role="img" aria-label="Two views of the same roof, 30 meters above ground. The red ball leaves upward at 10 meters per second. The blue ball is released at the same point one second later."><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 68h65v59 M162 68h65v59 M8 128h308 M287 71v53m-4-49 4-5 4 5m-8 44 4 5 4-5"/><path stroke="#b94636" d="M85 58V24m-5 6 5-7 5 7"/></g><circle fill="#b94636" cx="85" cy="62" r="5"/><circle fill="#2775b5" cx="227" cy="62" r="5"/><g fill="currentColor" font-family="sans-serif" font-size="12"><text x="8" y="13">Red · launch</text><text x="98" y="39">10 m/s</text><text x="163" y="13">Blue · 1.0 s later</text><text x="294" y="102">30 m</text><text x="10" y="143">Ground</text></g></svg>';
    details.append(drawing);root.append(details);
  }
}
function examSetup(parent,state,concept,onSave,onContinue){
  const label=examNode("label",concept?"What does the question tell you?":"My givens",{for:"exam-my-givens"});
  const field=el("textarea",{id:"exam-my-givens",rows:"3","aria-describedby":"exam-setup-help"});
  field.value=state.givensDraft;
  parent.append(label);
  if(onContinue){
    parent.append(examNode("p",concept?"Write your starting idea here or on paper.":"Write each known value with its unit. Add what you need to find.",{id:"exam-setup-help",class:"exam-setup-help"}));
  }else field.removeAttribute("aria-describedby");
  const paper=el("input",{type:"checkbox",id:"exam-on-paper"});paper.checked=state.onPaper;
  const paperLabel=examNode("label","I wrote mine on paper.",{for:"exam-on-paper"});
  const row=el("div",{class:"exam-paper-choice"});row.append(paper,paperLabel);
  parent.append(field,row);
  let next;
  function changed(){
    state.givensDraft=field.value;state.onPaper=paper.checked;
    if(next)next.disabled=!(field.value.trim() || paper.checked);
    onSave();
  }
  field.addEventListener("input",changed);paper.addEventListener("change",changed);
  if(onContinue){
    next=examNode("button",concept?"Choose a principle":"Choose an equation",{type:"button",class:"btn",onclick:onContinue});
    next.disabled=!(field.value.trim() || paper.checked);
    parent.append(next);
  }
}
function examGivens(parent,item){
  const table=el("dl",{class:"exam-givens"});
  item.givens.forEach(row=>{
    const [symbol, meaning]=row.split(" • ");
    table.append(examNode("dt",symbol),examNode("dd",meaning));
  });parent.append(table);

}
function examProblem(root,s,key){
  const item=midtermBank[key],i=s.keys.indexOf(key),state=examProgress(s,key),total=item.steps.length;
  const store=()=>safeStore.set(examStoreKey(s,key),state);
  const revisit=()=>{render();const target=document.querySelector(".exam-step-title")||document.querySelector(".exam-title");if(target)target.focus();};
  root.append(examLink("‹ "+s.title,"midterm/"+s.id),examNode("p",examLabel(s,i)+" · Ch. "+item.ch,{class:"exam-meta"}));
  examPageTitle(root,item.title);
  const paper=examPapers[s.id]?.[key];
  if(paper){
    examPaperPrompt(root,paper,key);
    if(!state.setupDone){
      const setup=el("div",{class:"exam-setup"});
      root.append(setup);
      examSetup(setup,state,i<3,()=>{store();safeStore.set("midtermNov26/last",{source:s.id,key});},()=>{
        state.setupDone=true;
        if(state.step<0)state.step=0;
        store();safeStore.set("midtermNov26/last",{source:s.id,key});revisit();
      });
      return;
    }
  }else root.append(examNode("p",item.story,{class:"exam-story"}));
  if(state.step===-1){
    root.append(examNode("h3","Givens"));
    examGivens(root,item);
    const concept=(["monday","fall","makeup","test1a"].includes(s.id) && i<3) || ["ifr","energy","ruler"].includes(key);
    root.append(examNode("button",concept?"Choose the principle":"Choose the equation",{class:"btn",onclick:()=>{
      state.step=0;store();safeStore.set("midtermNov26/last",{source:s.id,key});revisit();
    }}));
    return;
  }
  const facts=el("details",{class:"exam-details"});
  if(paper){
    facts.append(examNode("summary",i<3?"My starting idea":"My givens"));
    const edit=el("div",{class:"exam-setup"});examSetup(edit,state,i<3,store);facts.append(edit);
    const compare=el("details",{class:"exam-hint"});compare.append(examNode("summary","Compare with the guided setup"));
    examGivens(compare,item);facts.append(compare);
  }else{
    facts.append(examNode("summary","View givens"));examGivens(facts,item);
  }
  root.append(facts);
  if(state.step===total){
    root.append(examNode("h3","Guided practice complete",{class:"exam-step-title",tabindex:"-1"}));
    const review=el("details",{class:"exam-details"});review.append(examNode("summary","Review the worked steps"));
    const list=el("ol",{class:"exam-review"});item.steps.forEach(step=>list.append(examNode("li",step.why)));review.append(list);root.append(review);
    if(i+1<s.keys.length)root.append(examLink("Next question","midterm/"+s.id+"/"+s.keys[i+1],"btn"));
    root.append(examLink("Question list","midterm/"+s.id,"exam-link"));
    root.append(examNode("button","Practice again",{class:"exam-text-button",onclick:()=>{state.step=-1;state.setupDone=false;state.givensDraft="";state.onPaper=false;state.checked=false;state.entered="";store();revisit();}}));
  }else{
    const step=item.steps[state.step];
    if(state.step>0){
      const prior=item.steps.slice(0,state.step);
      const equations=prior.filter(prev=>prev.options && prev.options[0].includes("="));
      if(!step.options && !step.rows && equations.length){
        const selected=el("div",{class:"exam-equation"});
        selected.append(examNode("small","Selected equation"),examNode("span",equations[equations.length-1].options[0]));root.append(selected);
      }
      const history=el("details",{class:"exam-hint"});
      history.append(examNode("summary","Earlier steps ("+prior.length+")"));
      const ol=el("ol",{class:"exam-review"});prior.forEach(prev=>ol.append(examNode("li",prev.why)));history.append(ol);root.append(history);
    }
    root.append(examNode("p","Step "+(state.step+1)+" of "+total,{class:"exam-meta"}));
    root.append(examNode("h3",step.ask,{class:"exam-step-title",tabindex:"-1"}));
    if(step.rows){
      const givens=el("dl",{class:"exam-givens"});
      step.rows.forEach(([label,value])=>givens.append(examNode("dt",label),examNode("dd",value)));
      root.append(givens);
    }
    if(step.cue)root.append(examNode("p",step.cue,{class:"exam-desc"}));
    if(step.more){
      const [label,...lines]=step.more;
      const detail=el("details",{class:"exam-hint"});
      detail.append(examNode("summary",label),...lines.map(line=>examNode("p",line)));
      root.append(detail);
    }
    const task=el("div",{class:"exam-task"}),feedback=el("p",{role:"status",class:"exam-feedback"}),next=el("div");
    root.append(task,feedback,next);
    let answered=state.checked;
    function showNext(){
      feedback.className="exam-feedback correct";feedback.textContent=step.why;
      const button=examNode("button",state.step+1===total?"Finish question":"Next step",{class:"btn",onclick:()=>{
        state.step++;state.checked=false;state.entered="";store();revisit();
      }});
      next.append(button);
    }
    function correct(){
      answered=true;state.checked=true;store();safeStore.set("midtermNov26/last",{source:s.id,key});
      Array.from(task.querySelectorAll("button,input")).forEach(e=>e.disabled=true);
      showNext();
    }
    if(step.options){
      shuffle(step.options).forEach(option=>{
        const b=examNode("button",option,{class:"choice",type:"button"});
        b.disabled=answered;
        if(answered && option===step.options[0])b.classList.add("picked-right");
        b.addEventListener("click",()=>{
          if(answered)return;
          if(option===step.options[0]){b.classList.add("picked-right");correct();}
          else{b.classList.add("picked-wrong");b.disabled=true;feedback.textContent=step.misses?.[option] || "Try again. "+step.why;}
        });task.append(b);
      });
    }else{
      const form=el("form",{class:"exam-answer"}),label=examNode("label","Answer ("+step.unit+")",{for:"exam-number"});
      const input=el("input",{id:"exam-number",class:"answerbox",type:"text",inputmode:"decimal",autocomplete:"off"});
      const submit=examNode("button","Check answer",{type:"submit",class:"btn ghost"});
      form.append(label,input,submit);task.append(form);
      if(answered){input.value=state.entered || String(Number(step.value.toPrecision(4)));input.disabled=true;submit.disabled=true;}
      form.onsubmit=e=>{
        e.preventDefault();if(answered)return;
        const text=input.value.trim().replace(/−/g,"-").replace(",",".");
        const v=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(text)?Number(text):NaN;
        if(!Number.isFinite(v)){feedback.textContent="Enter a number. The unit is already shown.";return;}
        if(Math.abs(v-step.value)<=step.tol+1e-10){state.entered=input.value.trim();correct();}
        else feedback.textContent="Try again. "+step.hint;
      };
      if(!answered){
        const hint=el("details",{class:"exam-hint"});hint.append(examNode("summary","Show a hint"),examNode("p",step.hint));task.append(hint);
      }
    }
    if(answered)showNext();
  }
  const work=el("details",{class:"exam-details exam-notes"});
  work.append(examNode("summary","My written work"+(state.notes?" · saved":"")));
  const label=examNode("label",safeStore.persistent?"Equation, substitution and answer · saved in this browser":"Equation, substitution and answer · available for this session",{for:"exam-work"});
  const field=el("textarea",{id:"exam-work",rows:"4",placeholder:"Show your work here or use paper."});
  field.value=state.notes;field.oninput=()=>{state.notes=field.value;store();};work.append(label,field);root.append(work);
}
VIEWS.midterm=v=>{
  const [,source,key]=location.hash.slice(1).split("/");
  const s=midtermSources.find(p=>p.id===source);
  const root=el("section",{class:"card exam-section","aria-label":"Midterm practice"});v.append(root);
  if(s && s.keys.includes(key))examProblem(root,s,key);
  else if(s)examSourcePage(root,s);
  else examIndex(root);
};
function readCourseHash(){
  const name=location.hash.slice(1).split("/")[0];
  S.view=Object.prototype.hasOwnProperty.call(VIEWS,name)?name:"home";
}
window.addEventListener("hashchange",()=>{
  readCourseHash();render();window.scrollTo(0,0);
  const heading=document.querySelector(".exam-title");if(heading)heading.focus({preventScroll:true});
});

/* ================= BOOT ================= */
readCourseHash();
render();
cloudPull();  // v2.2: create/merge the gabe-p210 cloud row on every load
</script>
