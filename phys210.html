<style>
  :root{
    --paper:#F3F6FA;
    --paper2:#E7EDF5;
    --ink:#1B2233;
    --teal:#2E5EAA;      /* primary (blue) — variable names kept from chem template */
    --teal-dk:#1E3F78;
    --coral:#D64045;     /* action (red) */
    --gold:#F5A623;      /* highlight (amber) */
    --violet:#A23B72;    /* tags (magenta) */
    --ok:#2E7D32;
    --line:#1B2233;
    --shadow:4px 4px 0 var(--ink);
    --shadow-sm:2px 2px 0 var(--ink);
    --serif:"Iowan Old Style","Palatino","Georgia",serif;
    --mono:"SF Mono","Menlo","Consolas",monospace;
    --sans:-apple-system,"Segoe UI","Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(rgba(46,94,170,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,94,170,.07) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:90px;
  }
  header{
    background:var(--teal);
    color:var(--paper);
    border-bottom:3px solid var(--ink);
    padding:14px 18px 12px;
    display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px;
  }
  header h1{font-family:var(--serif);font-size:1.45rem;letter-spacing:.5px}
  header h1 .flask{display:inline-block;transform:rotate(-8deg);margin-right:6px}
  header .countdown{font-family:var(--mono);font-size:.8rem;background:var(--ink);color:var(--gold);padding:3px 10px;border-radius:99px}
  .menubtn{font-family:var(--mono);font-size:.8rem;background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:3px 12px;border-radius:99px;font-weight:800;text-decoration:none;box-shadow:var(--shadow-sm)}
  .menubtn:active{transform:translate(1px,1px);box-shadow:none}
  nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    display:flex;background:var(--paper);border-top:3px solid var(--ink);
  }
  nav button{
    flex:1;padding:10px 2px 12px;background:none;border:none;border-right:1px solid rgba(27,34,51,.15);
    font-family:var(--sans);font-size:.68rem;font-weight:700;color:var(--ink);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  nav button:last-child{border-right:none}
  nav button .ico{font-size:1.25rem;line-height:1}
  nav button.active{background:var(--gold)}
  main{max-width:860px;margin:0 auto;padding:18px 14px 30px}
  .card{
    background:#fff;border:2.5px solid var(--ink);border-radius:10px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px;
  }
  .card.cream{background:var(--paper2)}
  .card.teal{background:var(--teal);color:var(--paper)}
  .card h2{font-family:var(--serif);font-size:1.25rem;margin-bottom:8px}
  .card h3{font-family:var(--serif);font-size:1.05rem;margin-bottom:6px}
  .tag{
    display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    background:var(--ink);color:var(--paper);padding:3px 9px;border-radius:99px;margin-bottom:8px;
  }
  .tag.gold{background:var(--gold);color:var(--ink)}
  .tag.coral{background:var(--coral);color:#fff}
  .tag.violet{background:var(--violet);color:#fff}
  .bigbtn{
    display:block;width:100%;text-align:center;
    background:var(--coral);color:#fff;border:2.5px solid var(--ink);border-radius:10px;
    box-shadow:var(--shadow);padding:16px;font-size:1.1rem;font-weight:800;font-family:var(--serif);
    cursor:pointer;transition:transform .06s;
  }
  .bigbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .btn{
    display:inline-block;background:var(--teal);color:#fff;border:2px solid var(--ink);border-radius:8px;
    box-shadow:var(--shadow-sm);padding:8px 14px;font-size:.85rem;font-weight:700;cursor:pointer;
    transition:transform .06s;font-family:var(--sans);
  }
  .btn:active{transform:translate(2px,2px);box-shadow:none}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.coral{background:var(--coral)}
  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn.violet{background:var(--violet)}
  .btn.small{padding:5px 10px;font-size:.75rem}
  .btn:disabled{opacity:.4;pointer-events:none}
  .statrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .stat{
    flex:1;min-width:90px;background:#fff;border:2px solid var(--ink);border-radius:8px;
    box-shadow:var(--shadow-sm);padding:8px 10px;text-align:center;
  }
  .stat .n{font-family:var(--serif);font-size:1.5rem;font-weight:800}
  .stat .l{font-size:.62rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.75}
  .progressbar{height:14px;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:6px 0}
  .progressbar>div{height:100%;background:var(--teal);border-right:2px solid var(--ink);transition:width .4s}
  .daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .daycard{
    background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:var(--shadow-sm);
    padding:10px;cursor:pointer;position:relative;
  }
  .daycard.today{background:var(--gold)}
  .daycard.overdue{border-color:var(--coral);box-shadow:2px 2px 0 var(--coral)}
  .daycard.done{background:#DDEEDD}
  .daycard.done::after{content:"✓";position:absolute;top:6px;right:9px;font-weight:900;color:var(--ok);font-size:1.1rem}
  .daycard .d{font-family:var(--mono);font-size:.65rem;font-weight:700;opacity:.7}
  .duetag{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:#fff;border:1.5px solid var(--ink);border-radius:99px;padding:2px 8px;margin-top:6px}
  .duetag.today-due{background:var(--gold)}
  .duetag.overdue{background:var(--coral);color:#fff}
  .daycard .t{font-family:var(--serif);font-weight:700;font-size:.9rem;margin-top:2px}
  .qprompt{font-size:1.05rem;line-height:1.5;margin:10px 0 14px}
  .qprompt .formula{font-family:var(--mono);font-weight:700}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{
    text-align:left;background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:var(--shadow-sm);
    padding:10px 12px;font-size:.95rem;cursor:pointer;font-family:var(--sans);
  }
  .choice.picked-right{background:#CDEBCB;border-color:var(--ok)}
  .choice.picked-wrong{background:#F6CFC2;border-color:var(--coral)}
  .choice.reveal-right{background:#CDEBCB}
  .choice.selected{background:var(--accent-bg);border-color:var(--teal);box-shadow:0 0 0 2px rgba(15,95,138,.14)}
  .choice:disabled{cursor:default}
  .question-figure{margin:4px 0 16px;padding:12px;background:#fff;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .question-figure svg{display:block;width:100%;max-width:560px;height:auto;margin:auto}
  .multi-hint{font-size:.78rem;color:var(--muted-tx);margin:-5px 0 10px;font-weight:700}
  input.answerbox{
    font-family:var(--mono);font-size:1.2rem;padding:10px 12px;border:2.5px solid var(--ink);
    border-radius:8px;width:130px;background:#fff;box-shadow:inset 2px 2px 0 rgba(27,34,51,.12);
  }
  input.answerbox.wide{width:100%}
  .why{
    border-left:5px solid var(--gold);background:var(--paper2);border-radius:0 8px 8px 0;
    padding:10px 12px;margin-top:12px;font-size:.9rem;line-height:1.5;
  }
  .why b{color:var(--teal-dk)}
  .feedback-right{color:var(--ok);font-weight:800;font-family:var(--serif);font-size:1.1rem}
  .feedback-wrong{color:var(--coral);font-weight:800;font-family:var(--serif);font-size:1.1rem}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .pill{
    background:#fff;border:2px solid var(--ink);border-radius:99px;padding:6px 13px;font-size:.8rem;
    font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);
  }
  .pill.on{background:var(--teal);color:#fff}
  .pill.done{background:#DDEEDD}
  /* ---------- Problem Lab ---------- */
  .labwrap{display:flex;flex-direction:column;gap:12px}
  .stepper{display:flex;gap:6px;flex-wrap:wrap}
  .step{
    flex:1;min-width:64px;text-align:center;font-size:.62rem;font-weight:800;letter-spacing:.3px;
    border:2px solid var(--ink);border-radius:8px;padding:5px 3px;background:#fff;opacity:.45;
  }
  .step.on{background:var(--gold);opacity:1}
  .step.ok{background:#CDEBCB;opacity:1}
  .stepask{font-size:.98rem;line-height:1.5;margin:6px 0}
  .givenbox{
    font-family:var(--mono);font-size:.9rem;background:var(--ink);color:var(--paper);
    border-radius:8px;padding:10px 12px;line-height:1.6;
  }
  .givenbox .hl{color:var(--gold)}
  table.cheat{width:100%;border-collapse:collapse;font-size:.85rem;margin:8px 0}
  table.cheat th,table.cheat td{border:1.5px solid var(--ink);padding:6px 8px;text-align:left}
  table.cheat th{background:var(--teal);color:#fff;font-family:var(--serif)}
  table.cheat tr:nth-child(even){background:var(--paper2)}
  .mono{font-family:var(--mono)}
  .center{text-align:center}
  .muted{opacity:.7;font-size:.85rem}
  textarea.report{
    width:100%;height:220px;font-family:var(--mono);font-size:.75rem;border:2px solid var(--ink);
    border-radius:8px;padding:10px;background:#fff;
  }
  .confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99}
  .confetti span{position:absolute;font-size:1.4rem;animation:fall 1.4s ease-in forwards}
  @keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(105vh) rotate(340deg);opacity:.2}}
  .shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media(max-width:520px){
    header h1{font-size:1.15rem}
  }
  /* v2.10 */
  .story{font-size:1.08rem;line-height:1.65;margin:12px 0 10px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .givenlabel{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin:6px 0 4px}
  /* v2.9 */
  .symbols{font-size:.82rem;line-height:1.7;opacity:.85;margin:8px 0 4px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(255,255,255,.03)}
  .symbols .sym{white-space:nowrap}
  .bench table.cheat td,.bench table.cheat th{vertical-align:top}
  @media print{
    header,#nav,.no-print,#countdown,#confetti{display:none !important}
    body{background:#fff !important;color:#000 !important}
    .card{break-inside:avoid;border:1px solid #999 !important;background:#fff !important;color:#000 !important;box-shadow:none !important}
    .card *{color:#000 !important;background:transparent !important}
    .tag{border:1px solid #000}
  }
</style>
<style id="v25-readable-ui">

/* ============================================================================
   v2.5 — readable document UI, ported from CHEM 231 v3.30 (2026-08-28)
   Ported by Claude so both course apps share one visual language. PURE STYLESHEET
   APPEND — no markup, logic, questions or storage touched in the physics app. This preserves the useful direction of the offline UI test
   without its low-contrast text, undersized controls or white-on-white teal cards.
   ============================================================================ */
:root{
  --paper:#f7f7f4;
  --paper2:#eef1f2;
  --ink:#1d272c;
  --line:#cfd6da;
  --teal:#0f5f8a;
  --teal-dk:#0a4667;
  --coral:#9d3037;
  --gold:#7a4d00;
  --violet:#5d4b87;
  --ok:#2f6b4c;
  --muted-tx:#536169;
  --sec-tx:#3f4c53;
  --accent-bg:#e8f2f7;
  --success-bg:#e8f3ec;
  --warning-bg:#f8eed8;
  --danger-bg:#f8e9e9;
  --shadow:none;
  --shadow-sm:none;
  --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
html{font-size:17px;scroll-padding-bottom:82px}
body{
  background:var(--paper);
  background-image:none;
  color:var(--ink);
  line-height:1.6;
  text-rendering:optimizeLegibility;
}
main{max-width:800px;padding:1.5rem 1.25rem 2.5rem}

/* Quiet header, with all metadata still readable. */
header{
  align-items:center;
  background:var(--paper);
  color:var(--ink);
  border-bottom:1px solid var(--line);
  padding:1rem 1.25rem;
}
header h1{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
header h1 .flask{transform:none;margin-right:8px}
header .countdown{
  background:var(--accent-bg);
  color:var(--teal-dk);
  font-family:var(--sans);
  font-size:.78rem;
  font-weight:700;
  padding:4px 10px;
}
.menubtn{
  background:#fff;
  color:var(--ink);
  border:1px solid #aeb9bf;
  box-shadow:none;
  font-family:var(--sans);
  font-size:.78rem;
  font-weight:700;
  min-height:40px;
  padding:8px 12px;
  display:inline-flex;
  align-items:center;
}

/* Seven destinations stay intact; clearer active state and usable tap targets. */
nav{background:#fff;border-top:1px solid var(--line)}
nav button{
  min-height:64px;
  border-right:none;
  color:var(--muted-tx);
  font-size:.72rem;
  font-weight:650;
  line-height:1.2;
  padding:8px 2px 10px;
}
nav button .ico{font-size:1.2rem;opacity:.82}
nav button.active{
  background:var(--accent-bg);
  color:var(--teal-dk);
  box-shadow:inset 0 3px 0 var(--teal);
}
nav button.active .ico{opacity:1}

/* Content hierarchy: clean surfaces, but important cards still look important. */
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 1px 2px rgba(18,34,43,.06);
  padding:1.2rem 1.3rem;
  margin-bottom:1.15rem;
}
.card.cream{background:#f1f3f3}
.card.teal{
  background:var(--accent-bg);
  border-color:#82adc3;
  color:var(--ink);
  box-shadow:0 1px 2px rgba(15,95,138,.10);
}

/* ================= STORAGE (safe wrapper, p210_ keys) ================= */
const safeStore = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){ ok = false; }
  return {
    get(k, fallback){ k="p210_"+k; try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? fallback : JSON.parse(v); } catch(e){ return fallback; } },
    set(k, v){ k="p210_"+k; try { const s = JSON.stringify(v); if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch(e){} },
    persistent: ok
  };
})();


/* ============ v2.2 CLOUD SYNC (ported from chem231 v3.0; same Supabase project) ============
   One row in `progress`, profile "gabe-p210". Fixes the signals-dashboard HIGH item:
   "PHYS 210 has no cloud row — ever" — root cause was that this app had NO sync code at all. */
const SB_URL = "https://tzdreklmkntpopqncada.supabase.co";
const SB_KEY = "sb_publishable_PWdbyaBoBg8hM2kptSrwBA_I4lFrnQr";
const SB_PROFILE = "gabe-p210";
let cloudState = "init";
let _pushT = null;
function sbHeaders(){ return {"apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json"}; }
function mergeRemote(remote){
  if (!remote) return;
  ["doneDays","probDone","visits"].forEach(k=>{ S[k] = [...new Set([...(remote[k]||[]), ...(S[k]||[])])]; });
  const seenM = new Set(S.missed);
  (remote.missed||[]).forEach(id=>{ if(!seenM.has(id)){ S.missed.push(id); seenM.add(id); } });
  Object.entries(remote.qstats||{}).forEach(([id,st])=>{
    const loc = S.qstats[id];
    if (!loc || (st.r+st.w) > (loc.r+loc.w)) S.qstats[id] = st;
  });
  Object.entries(remote.stepMiss||{}).forEach(([k,v])=>{ S.stepMiss[k]=Math.max(S.stepMiss[k]||0, v||0); });
}
async function cloudPull(){
  try {
    const r = await fetch(SB_URL+"/rest/v1/progress?profile=eq."+SB_PROFILE+"&select=data", {headers:sbHeaders()});
    if (!r.ok) throw 0;
    const rows = await r.json();
    mergeRemote(rows[0] && rows[0].data);
    cloudState = "synced"; save(); if(typeof render==="function" && S.view!=="midterm") render(); cloudPush(true);
  } catch(e){ cloudState = "offline"; renderSyncDot(); }
}
async function cloudPush(now){
  if (!now){ clearTimeout(_pushT); _pushT = setTimeout(()=>cloudPush(true), 2500); return; }
  try {
    const body = JSON.stringify({ profile: SB_PROFILE,
      data: {doneDays:S.doneDays, qstats:S.qstats, missed:S.missed, probDone:S.probDone, stepMiss:S.stepMiss, visits:S.visits},
      updated_at: new Date().toISOString() });
    const r = await fetch(SB_URL+"/rest/v1/progress", {method:"POST", headers:{...sbHeaders(),"Prefer":"resolution=merge-duplicates"}, body});
    cloudState = r.ok ? "synced" : "offline";
  } catch(e){ cloudState = "offline"; }
  renderSyncDot();
}
function renderSyncDot(){
  const d = document.getElementById("syncdot"); if(!d) return;
  d.textContent = cloudState==="synced" ? "● cloud" : cloudState==="offline" ? "○ local only" : "◌ syncing…";
  d.style.color = cloudState==="synced" ? "#8FE3A1" : "#F2B705";
}

{id:"u1",topic:"units",type:"num",prompt:"Convert 72 km/h to m/s.",answer:20,why:"km/h → m/s: <b>divide by 3.6</b> (×1000 m/km ÷ 3600 s/h). 72 ÷ 3.6 = <b>20 m/s</b>. Physics answers live in m/s — this conversion is daily."},

/* --- trig --- */
{id:"t1",topic:"trig",type:"num",prompt:"A right triangle has a hypotenuse of 10 and one angle of 30°. How long is the side OPPOSITE the 30° angle? (sin 30° = 0.5)",answer:5,why:"opp = hyp × sin θ = 10 × 0.5 = <b>5</b>. SOH: <b>S</b>in = <b>O</b>pp/<b>H</b>yp."},
{id:"t2",topic:"trig",type:"num",prompt:"A right triangle has a hypotenuse of 10 and one angle of 30°. How long is the side ADJACENT to the 30° angle? (cos 30° ≈ 0.87)",answer:8.7,tolerance:0.2,why:"adj = hyp × cos θ = 10 × 0.87 ≈ <b>8.7</b>. CAH: <b>C</b>os = <b>A</b>dj/<b>H</b>yp."},
{id:"t3",topic:"trig",type:"mc",prompt:"SOH-CAH-TOA: sin θ equals…",choices:["opposite / hypotenuse","adjacent / hypotenuse","opposite / adjacent","hypotenuse / opposite"],answer:0,why:"<b>S</b>OH: sin = opp/hyp. This one mnemonic runs 80% of the early physics math."},
{id:"t4",topic:"trig",type:"num",prompt:"A right triangle has legs of 3 and 4. How long is the hypotenuse?",answer:5,why:"√(9+16) = √25 = <b>5</b>. The 3-4-5 triangle shows up constantly (as does 6-8-10). Recognize it and skip the arithmetic."},
{id:"t5",topic:"trig",type:"num",prompt:"In a right triangle, the side opposite angle θ is 3 and the side adjacent to θ is 4. What is tan θ? (decimal)",answer:0.75,why:"TOA: tan = opp/adj = 3/4 = <b>0.75</b>."},
{id:"t6",topic:"trig",type:"num",prompt:"If tan θ = 3/4, then θ ≈ ? (degrees)",answer:37,tolerance:1,why:"tan⁻¹(0.75) ≈ <b>37°</b>. The 3-4-5 triangle's angles are ~37° and ~53° — physics problems reuse these numbers on purpose."},
{id:"t7",topic:"trig",type:"num",prompt:"A right triangle has a hypotenuse of 20 and one angle of 53°. How long is the side opposite the 53° angle? (sin 53° ≈ 0.8)",answer:16,tolerance:0.5,why:"20 × 0.8 = <b>16</b>."},
{id:"t8",topic:"trig",type:"mc",prompt:"The hypotenuse is always…",choices:["Opposite the right angle (the longest side)","The horizontal side","The vertical side","Whichever side is unknown"],answer:0,why:"<b>Opposite the 90°</b>, always the longest. In vector problems the vector itself is the hypotenuse; its components are the legs."},
{id:"t9",topic:"trig",type:"num",prompt:"In a right triangle, the side adjacent to a 60° angle is 12. How long is the hypotenuse? (cos 60° = 0.5)",answer:24,why:"adj = hyp·cos θ → hyp = adj/cos θ = 12/0.5 = <b>24</b>. Dividing (not multiplying) here is the classic flip — write the equation first, then rearrange."},
/* --- vector components (THE priority topic) --- */
{id:"vc1",topic:"vectors",type:"num",prompt:"A 50 m displacement at 37° above the +x axis (cos 37° ≈ 0.8, sin 37° ≈ 0.6). x-component = ?",answer:40,why:"Ax = A cos θ = 50 × 0.8 = <b>40 m</b>. θ measured from the x-axis → x gets cos."},
{id:"vc2",topic:"vectors",type:"num",prompt:"A 50 m displacement points 37° above the +x axis (sin 37° ≈ 0.6). What is its y-component? (m)",answer:30,why:"Ay = A sin θ = 50 × 0.6 = <b>30 m</b>. Audit: √(40² + 30²) = 50 ✓ — components must rebuild the original."},
{id:"vc3",topic:"vectors",type:"mc",prompt:"With θ measured from the +x axis, the x-component is:",choices:["A cos θ","A sin θ","A tan θ","A/cos θ"],answer:0,why:"<b>x ↔ cos, y ↔ sin — WHEN θ is from the x-axis.</b> If the problem gives the angle from vertical, they swap. Don't memorize 'x = cos'; memorize 'adjacent gets cos'."},
{id:"vc4",topic:"vectors",type:"num",prompt:"A 100 m displacement points 60° above the +x axis (cos 60° = 0.5). What is its x-component? (m)",answer:50,why:"100 × 0.5 = <b>50 m</b>. Steeper angle → smaller x-share. Sanity-check direction: at 60° the vector leans more vertical than horizontal."},
{id:"vc5",topic:"vectors",type:"num",prompt:"A 100 m displacement points 60° above the +x axis (sin 60° ≈ 0.87). What is its y-component? (m)",answer:87,tolerance:1,why:"100 × 0.87 ≈ <b>87 m</b>. And 50² + 87² ≈ 100² ✓."},
{id:"vc6",topic:"vectors",type:"mc",prompt:"A vector points up-and-left (135° from +x). Signs of (x, y):",choices:["(−, +)","(+, +)","(−, −)","(+, −)"],answer:0,why:"Left = negative x, up = positive y → <b>(−, +)</b>. Signs come from the DIRECTION, and sign errors are the #1 vector mistake — write the sign before the number."},
{id:"vc7",topic:"vectors",type:"num",prompt:"A 20 m displacement points straight up, at 90° from the +x axis. What is its x-component? (m)",answer:0,why:"cos 90° = 0 → <b>0</b>. All 20 m is vertical. Extreme angles (0°, 90°) are free sanity checks."},
{id:"vc8",topic:"vectors",type:"num",prompt:"A 20 m displacement points straight up, at 90° from the +x axis. What is its y-component? (m)",answer:20,why:"sin 90° = 1 → <b>20 m</b>."},
{id:"vc9",topic:"vectors",type:"num",prompt:"A ball is kicked at 60 m/s, 30° above horizontal (sin 30° = 0.5). Vertical component = ?",answer:30,why:"60 × 0.5 = <b>30 m/s</b>. Projectile motion = this exact decomposition, done on day one of every problem."},
{id:"vc10",topic:"vectors",type:"mc",prompt:"WHY decompose vectors into components at all?",choices:["x and y motion can then be solved independently","It makes the vector longer","Professors require it","It removes the need for trig"],answer:0,why:"<b>Independence of axes</b> — gravity only touches y; horizontal motion doesn't care. Split, solve each axis alone, recombine at the end. That's the entire method of projectile problems."},
/* --- vector addition --- */
{id:"va1",topic:"vecadd",type:"num",prompt:"Vector A = (3, 4) and vector B = (1, −2). What is the x-component of the sum A + B?",answer:4,why:"3 + 1 = <b>4</b>. Add x's with x's — components never mix axes."},
{id:"va2",topic:"vecadd",type:"num",prompt:"Vector A = (3, 4) and vector B = (1, −2). What is the y-component of the sum A + B?",answer:2,why:"4 + (−2) = <b>2</b>. The minus sign rides along — that's why you write signs first."},
{id:"va3",topic:"vecadd",type:"num",prompt:"Walk 30 m east, then 40 m north. Magnitude of your displacement = ? (m)",answer:50,why:"Perpendicular legs → Pythagoras: √(30² + 40²) = <b>50 m</b> (the 3-4-5 again). Displacement ≠ distance walked (70 m)."},
{id:"va4",topic:"vecadd",type:"num",prompt:"You walk 30 m east, then 40 m north. In what direction does your total displacement point? (degrees north of east)",answer:53,tolerance:1,why:"tan θ = 40/30 → θ = tan⁻¹(1.33) ≈ <b>53°</b> N of E. Always name the reference: '53°' alone is not a direction."},
{id:"va5",topic:"vecadd",type:"num",prompt:"What is the magnitude (length) of the vector (4, 2)? (one decimal)",answer:4.5,tolerance:0.1,why:"√(16+4) = √20 ≈ <b>4.5</b>."},
{id:"va6",topic:"vecadd",type:"mc",prompt:"To add two vectors that are NOT parallel, you:",choices:["Add their components axis-by-axis","Add their magnitudes","Multiply their magnitudes","Average their angles"],answer:0,why:"<b>Components, always.</b> Magnitudes only add when vectors point the same way. 30+40 = 70 walked, but the displacement was 50 — magnitudes lie."},
{id:"va7",topic:"vecadd",type:"num",prompt:"Two velocities combine: 5 m/s east and 5 m/s west. What is the magnitude of the resultant? (m/s)",answer:0,why:"+5 + (−5) = <b>0</b>. Opposite directions cancel — vectors are signed, not just sized."},
{id:"va8",topic:"vecadd",type:"num",prompt:"What is the magnitude (length) of the vector (6, 8)?",answer:10,why:"√(36+64) = <b>10</b> — the 3-4-5 scaled ×2. Spot the family, skip the work."},
/* --- 1D kinematics concepts --- */
{id:"k1",topic:"kin1",type:"mc",prompt:"Velocity differs from speed because velocity…",choices:["Includes direction (it can be negative)","Is always larger","Is measured in different units","Only applies to cars"],answer:0,why:"Velocity is a <b>vector</b>: −8 m/s means 8 m/s in the negative direction. The sign IS information — never drop it."},
{id:"k2",topic:"kin1",type:"num",prompt:"A car speeds up from 0 to 20 m/s in 4 s. What is its acceleration? (m/s²)",answer:5,why:"a = Δv/Δt = 20/4 = <b>5 m/s²</b> — it gains 5 m/s of speed every second."},
{id:"k3",topic:"kin1",type:"num",prompt:"A cyclist rides at a constant 15 m/s for 6 s. What is her displacement? (m)",answer:90,why:"Δx = vt = 15 × 6 = <b>90 m</b>. Constant v → no ½at² term, don't overcomplicate it."},
{id:"k4",topic:"kin1",type:"mc",prompt:"On a position-time graph, the SLOPE is the:",choices:["Velocity","Acceleration","Displacement","Distance"],answer:0,why:"Slope = rise/run = Δx/Δt = <b>velocity</b>. (On a velocity-time graph, slope = acceleration.) Graph questions are free points once these two facts are cold."},
{id:"k5",topic:"kin1",type:"mc",prompt:"A ball is thrown straight up. At the very top of its flight:",choices:["v = 0 but a = −9.8 m/s² still","v = 0 and a = 0","Both v and a point up","a = 0 but v is maximum"],answer:0,why:"Velocity passes through zero, but gravity never turns off: <b>a = −9.8 m/s² the whole flight</b>. 'v = 0 so a = 0' is the single most-tested misconception in kinematics."},
{id:"k6",topic:"kin1",type:"num",prompt:"A runner's displacement is +120 m over 60 s. What is his average velocity? (m/s)",answer:2,why:"v̄ = Δx/Δt = 120/60 = <b>+2 m/s</b>. (Velocity needs displacement, a signed vector — distance alone only gives average speed.)"},
{id:"k7",topic:"kin1",type:"mc",prompt:"On a velocity-time graph, the AREA under the curve is the:",choices:["Displacement","Acceleration","Average speed","Jerk"],answer:0,why:"Area = v × t summed = <b>displacement</b>. Slope-and-area on the two graphs: four facts that answer every graph question the course will throw."},
{id:"k8",topic:"kin1",type:"num",prompt:"A car moving at 10 m/s brakes with a steady deceleration of 2 m/s². How long does it take to stop? (s)",answer:5,why:"t = Δv/a = 10/2 = <b>5 s</b>."},
{id:"k9",topic:"kin1",type:"mc",prompt:"'Uniform acceleration' means:",choices:["Velocity changes by equal amounts in equal times","Velocity is constant","The object moves equal distances each second","Speed only increases"],answer:0,why:"Uniform a → <b>Δv is the same every second</b> (distances are NOT — they grow). This is exactly when the kinematic equations apply, and only then."},
/* --- saved homework sources + close transfer: speed, velocity, and motion graphs --- */
{id:"g1",topic:"graphs",type:"multi",origin:"Pearson HW source · 2026-09-09",prompt:"Which statements about average speed are correct? <b>Select all that apply.</b>",choices:["The average speed can never be greater than the magnitude of the average velocity.","If the average speed is zero, then the average velocity must be zero.","The average speed is equal to the magnitude of the average velocity.","If the average velocity is zero, then the average speed must be zero.","The average speed can never be less than the magnitude of the average velocity."],answer:[1,4],why:"Average speed = total distance/Δt; |average velocity| = |displacement|/Δt. Because distance ≥ |displacement|, <b>average speed ≥ |average velocity|</b>. Zero distance forces zero displacement, but a round trip can have zero displacement and positive distance."},
{id:"g2",topic:"graphs",type:"multi",origin:"Close transfer",prompt:"A cart travels 30 m east and then 30 m west in 12 s, ending where it began. Which statements must be true? <b>Select all that apply.</b>",choices:["Its total distance is 60 m.","Its displacement is 60 m.","Its average speed is 5 m/s.","Its average velocity is 0 m/s.","Its average speed is 0 m/s."],answer:[0,2,3],why:"Distance counts the whole path: 30 + 30 = <b>60 m</b>, so average speed = 60/12 = <b>5 m/s</b>. Displacement is final minus initial position = 0, so average velocity = <b>0 m/s</b>."},
{id:"g3",topic:"graphs",type:"mc",origin:"Close transfer",prompt:"Average speed equals the magnitude of average velocity over an interval only when:",choices:["The object does not reverse direction along its path","The object returns to its starting point","The velocity is zero at least once","The acceleration is constant"],answer:0,why:"Equality requires distance = |displacement|. Along a straight line, that happens when no traveled distance is canceled by reversing direction. Returning to the start makes displacement zero while distance can be positive."},
{id:"g4",topic:"graphs",type:"multi",origin:"Pearson HW source · 2026-09-09",prompt:"The graph shows a wildebeest's velocity as a function of time. Which statements must be true? <b>Select all that apply.</b>",figure:"vtRise",choices:["It is moving to the left between a and b and to the right between b and c.","It is moving to the right between a and c.","Its acceleration is increasing.","Its speed is decreasing from a to b and increasing from b to c."],answer:[0,3],why:"Below the time axis, <b>v &lt; 0</b>, so the animal moves left; above it, <b>v &gt; 0</b>, so it moves right. Speed is |v|, so it falls toward zero at b and then grows. The v–t line has one constant positive slope, so acceleration is <b>constant positive</b>, not increasing."},
{id:"g5",topic:"graphs",type:"multi",origin:"Close transfer",prompt:"The velocity–time graph slopes downward through zero. Which statements must be true? <b>Select all that apply.</b>",figure:"vtFall",choices:["The object moves right from p to q and left from q to r.","Its acceleration is constant and negative.","Its speed increases during the entire interval.","Its speed decreases from p to q and increases from q to r.","The object is at the origin at q."],answer:[0,1,3],why:"Positive v means right; negative v means left. A straight downward v–t line has <b>constant negative acceleration</b>. Speed is |v|: it shrinks to zero at q, then grows. v = 0 tells you it stops momentarily—not where it is."},
{id:"g6",topic:"graphs",type:"multi",origin:"Close transfer",prompt:"What does this velocity–time graph tell you? <b>Select all that apply.</b>",figure:"vtFlat",choices:["The object moves in the positive direction.","Its speed is constant.","Its acceleration is zero.","Its position is constant.","It must be at a positive position."],answer:[0,1,2],why:"The graph's positive height is velocity, so motion is in the positive direction at constant speed. Its slope is zero, so acceleration is zero. A v–t graph does not directly reveal the object's position."},
/* --- kinematic equations --- */
{id:"q1",topic:"kin2",type:"mc",prompt:"Which kinematic equation contains NO Δx?",choices:["v = v₀ + at","v² = v₀² + 2aΔx","Δx = v₀t + ½at²","Δx = ½(v₀ + v)t"],answer:0,why:"<b>v = v₀ + at</b>. Pick the equation by the variable you DON'T have/need — that's the entire selection method, not vibes."},
{id:"q2",topic:"kin2",type:"num",prompt:"A rock is dropped from rest (g ≈ 9.8 m/s²). How fast is it moving after 2 s? (m/s)",answer:19.6,tolerance:0.3,why:"v = 0 + 9.8 × 2 = <b>19.6 m/s</b>. Free fall = kinematics with a = g, nothing more."},
{id:"q3",topic:"kin2",type:"num",prompt:"A rock is dropped from rest (g ≈ 9.8 m/s²). How far has it fallen after 2 s? (m)",answer:19.6,tolerance:0.3,why:"Δy = ½gt² = ½ × 9.8 × 4 = <b>19.6 m</b>. (Same number as v is a 2-second coincidence — don't generalize it.)"},
{id:"q4",topic:"kin2",type:"num",prompt:"A ball is thrown straight up at 20 m/s (use g ≈ 10 m/s²). How high above the launch point does it go? (m)",answer:20,why:"At the top v = 0: 0 = 20² − 2(10)Δy → Δy = 400/20 = <b>20 m</b>. v² = v₀² + 2aΔx is THE no-time equation — reach for it whenever t isn't given."},
{id:"q5",topic:"kin2",type:"num",prompt:"A car starts from rest and accelerates at a constant 3 m/s² until it reaches 30 m/s. How far has it travelled? (m)",answer:150,why:"v² = 2aΔx → Δx = 900/6 = <b>150 m</b>."},
{id:"q6",topic:"kin2",type:"mc",prompt:"The FIRST move of every kinematics problem:",choices:["List knowns/unknowns and pick a positive direction","Plug numbers into the first equation you remember","Compute the average of the given numbers","Draw the answer"],answer:0,why:"<b>Setup first</b>: knowns, unknown, axis + sign convention. Most lost points are setup errors, not math errors — which is why the Problem Lab makes you do this step explicitly."},
{id:"q7",topic:"kin2",type:"num",prompt:"An object starts from rest and accelerates at 2 m/s² for 5 s. How far does it travel? (m)",answer:25,why:"Δx = 0 + ½ × 2 × 25 = <b>25 m</b>."},
{id:"q8",topic:"kin2",type:"num",prompt:"A rock is dropped from rest and falls 45 m (use g ≈ 10 m/s²). How long does the fall take? (s)",answer:3,why:"45 = ½ × 10 × t² → t² = 9 → <b>3 s</b>. Rearrange symbolically first: t = √(2Δy/g)."},
{id:"q9",topic:"kin2",type:"mc",prompt:"One ball is dropped; another is thrown HORIZONTALLY at the same instant from the same height. Which lands first?",choices:["They land together — vertical motion is independent of horizontal","The dropped one","The thrown one","Depends on the throw speed"],answer:0,why:"<b>Axes are independent</b> — both start with v_y = 0 and fall under the same g. The horizontal throw adds x-motion, not flight time. This is vc10's 'why components' as an exam classic."},
/* --- Newton's laws --- */
{id:"n1",topic:"newton",type:"num",prompt:"A net force of 5 N acts on a 10 kg box. What is the box's acceleration? (m/s²)",answer:0.5,why:"a = F/m = 5/10 = <b>0.5 m/s²</b>. Big mass, small force → small a. Sanity-check magnitudes."},
{id:"n2",topic:"newton",type:"num",prompt:"What is the weight of a 5.0 kg object on Earth? (N, g ≈ 9.8 m/s²)",answer:49,tolerance:0.5,why:"W = mg = 5 × 9.8 = <b>49 N</b>. Weight is a FORCE (newtons); mass is kg. Mixing them is the classic week-4 error."},
{id:"n3",topic:"newton",type:"mc",prompt:"A car moves at constant 25 m/s in a straight line. The net force on it is:",choices:["Zero","Forward, constant","Forward, growing","Equal to its weight"],answer:0,why:"Constant velocity = zero acceleration = <b>zero NET force</b> (N1). Engine force exists — it just cancels friction/drag. Net ≠ individual."},
{id:"n4",topic:"newton",type:"num",prompt:"A 1200 kg car accelerates at 2.5 m/s². What net force is acting on it? (N)",answer:3000,why:"F = ma = 1200 × 2.5 = <b>3000 N</b>."},
{id:"n5",topic:"newton",type:"mc",prompt:"Newton's 3rd law pairs (equal & opposite forces) never cancel because they…",choices:["Act on DIFFERENT objects","Are different sizes","Act at different times","Only exist during collisions"],answer:0,why:"You push the wall, the wall pushes YOU — one force per object. Forces only cancel when they act <b>on the same object</b>. This resolves every '3rd-law paradox' question."},
{id:"n6",topic:"newton",type:"num",prompt:"A 20 N force pushes a box to the right while a 6 N force pushes it to the left. What is the net force on the box? (N, take right as positive)",answer:14,why:"20 − 6 = <b>14 N</b> (rightward). Net force is a signed SUM — this is vectors again, just wearing forces."},
{id:"n7",topic:"newton",type:"mc",prompt:"Take a 10 kg dumbbell to the Moon. What changes?",choices:["Weight drops; mass stays 10 kg","Mass drops; weight stays","Both drop","Neither"],answer:0,why:"<b>Mass is intrinsic</b>; weight = mg depends on the local g (Moon ≈ 1.6 m/s²). The dumbbell is just as hard to shake side-to-side up there."},
{id:"n8",topic:"newton",type:"num",prompt:"A 20 N book rests on a table. The normal force on it = ? (N)",answer:20,why:"At rest → net = 0 → N balances W: <b>20 N</b> up. (Normal = weight only when nothing else pushes vertically — on inclines this breaks.)"},
{id:"n9",topic:"newton",type:"mc",prompt:"The net force on an object always points in the direction of its:",choices:["Acceleration","Velocity","Displacement","Motion history"],answer:0,why:"F_net ∥ <b>a</b>, NOT v. A braking car moves forward while its net force points backward. Divorcing force from velocity is half of understanding Newton."},
{id:"n10",topic:"newton",type:"num",prompt:"A 4 kg box is pushed with 26 N while friction pushes back with 6 N. What is the box's acceleration? (m/s²)",answer:5,why:"Net = 26 − 6 = 20 N → a = 20/4 = <b>5 m/s²</b>. NET force in F = ma — always subtract the opposition first."},
{id:"n11",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"Newton's First Law is valid when motion is described from:",choices:["An inertial frame of reference","Any accelerating frame","Absolute space","Only the surface of Earth"],answer:0,why:"The missing condition is the frame. <b>In an inertial frame</b>, zero net external force means constant velocity, including rest. 'At rest' or 'moving' has no meaning until the reference frame is named."},
{id:"n12",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"You are sitting still relative to the classroom. Are you also at rest relative to the Sun?",choices:["No — rest and motion depend on the chosen reference frame","Yes — rest is absolute","Yes, unless a force acts on you","There is not enough information to discuss any motion"],answer:0,why:"You are at rest relative to the room but moving with Earth relative to the Sun. <b>Motion is relative</b>; always name what the motion is measured against."},
{id:"n13",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"Which situation is closest to an inertial frame for a passenger?",choices:["An airplane cruising straight at constant velocity","An airplane speeding up for takeoff","A car turning a corner","A car braking hard"],answer:0,why:"A frame is inertial when it is <b>not accelerating</b>. Speeding up, slowing down, and changing direction are all acceleration. A smooth straight cruise at constant velocity is the inertial choice."},
{id:"n14",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"A passenger feels pushed into the seat as a car speeds up. Relative to the accelerating car, that car frame is:",choices:["Non-inertial","Inertial","Absolute","Frictionless"],answer:0,why:"The car is accelerating, so its frame is <b>non-inertial</b>. This is why Newton's laws cannot be used there in their simplest form without accounting for the accelerating frame."},
{id:"n15",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"In Galileo's two-incline experiment, lowering the angle of the second incline made the marble travel:",choices:["Farther before reaching the same height","A shorter distance","To a lower final height even without friction","At zero speed immediately"],answer:0,why:"As the return incline became flatter, the marble had to travel <b>farther</b> to regain the same height. At zero angle on an ideal frictionless surface, the argument leads to motion continuing indefinitely."},
{id:"n16",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"On an ideal horizontal surface with no friction and no net force, Galileo's inertia argument predicts that a moving marble will:",choices:["Continue at constant velocity","Slow down naturally","Speed up forever","Stop when its force runs out"],answer:0,why:"No net force means no acceleration. The marble keeps the <b>same velocity</b>; motion does not require a continuing force. Friction is what makes ordinary objects appear to stop on their own."},
{id:"n17",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"Aristotle called motion caused by an external push or kick:",choices:["Violent motion","Natural motion","Inertial motion","Relative motion"],answer:0,why:"In Aristotle's model, <b>natural motion</b> carried elements toward their natural places; an outside push or kick produced <b>violent motion</b>. Galileo's experiments later challenged this account."},
{id:"n18",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-12",prompt:"According to the relativity principle discussed in class, which statement is correct?",choices:["There is no absolute inertial frame of reference","Earth is the one absolute frame","The Sun is the one absolute frame","The center of the galaxy is perfectly stationary"],answer:0,why:"No experiment identifies one absolute state of rest. Choose a useful <b>inertial frame</b> for the problem—Earth for a car, the Sun for a planet—but do not call it absolute."},
{id:"n19",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"Which statement matches the professor's STRONG form of Newton's First Law?",choices:["In an inertial frame, if no force acts on an object, it maintains its state of motion","In an inertial frame, an object maintains its motion if and only if its net force is zero","Every force has an equal and opposite partner","Net force equals inertial mass times acceleration"],answer:0,why:"The class wording for the <b>strong form</b> uses <b>if</b> and <b>no force</b>: in an inertial frame, if no force acts, the state of motion is maintained."},
{id:"n20",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"Which statement matches the professor's WEAK form of Newton's First Law?",choices:["In an inertial frame, an object maintains its state of motion if and only if the net force is zero","If no force acts anywhere in the universe, an object maintains its motion","Mass measures weight","Action and reaction act on one object"],answer:0,why:"The class wording for the <b>weak form</b> changes 'if' to <b>if and only if</b> and 'no force' to <b>no net force</b>. It is the zero-net-force case of the Second Law."},
{id:"n21",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"A student sits motionless on a chair. Which force statement is correct?",choices:["Gravity and the chair's upward normal force cancel, so the net force is zero","No forces act on the student","Only gravity acts on the student","The chair removes gravity"],answer:0,why:"The student is not force-free. Weight acts down and the chair's normal force acts up. Their vector sum is zero, so this is the lecture's example of <b>no net force</b>, not no force."},
{id:"n22",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"What is the statement behind Newton's Second Law?",choices:["The net force on an object is proportional to its acceleration","Force is proportional to velocity","Mass is proportional to position","Acceleration exists only when an object moves"],answer:0,why:"Newton's Second Law connects <b>net force</b> to <b>acceleration</b>. In F_net = ma, inertial mass m is the constant of proportionality."},
{id:"n23",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"Inertial mass measures an object's resistance to:",choices:["A change in its linear motion","Gravity only","A change in its color","Having any force on it"],answer:0,why:"A bowling ball resists a change in motion more than a soccer ball. That resistance is what <b>inertial mass</b> measures."},
{id:"n24",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"Newton's Third Law always involves:",choices:["Two objects exerting forces on each other","One object with two cancelling forces","An inertial frame and no forces","Two objects with equal acceleration"],answer:0,why:"Third-law forces are an interaction pair: object C pushes D, and D pushes C. The two forces are equal in magnitude and opposite in direction, but they act on <b>different objects</b>."},
{id:"n25",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"Why do Newton's Third Law force pairs not cancel each other on one free-body diagram?",choices:["They act on different objects","One force is always larger","They occur at different times","One of the forces is imaginary"],answer:0,why:"F_CD acts on D while F_DC acts on C. Equal and opposite does not mean they cancel, because cancellation requires forces acting on the <b>same object</b>."},
{id:"n26",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-14",prompt:"According to the professor, why does Newton's Third Law not need the phrase 'in an inertial frame'?",choices:["It describes the relationship between two forces rather than an object's motion","It only works on Earth","It is really part of the First Law","It assumes both objects are at rest"],answer:0,why:"The Third Law relates two interaction forces. It is not a statement about an object's motion, so the class explicitly said <b>do not add</b> the inertial-frame phrase to its test definition."},
{id:"n27",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"Which list contains the four natural forces discussed in class?",choices:["Gravitational, electromagnetic, weak nuclear, and strong nuclear","Gravitational, normal, friction, and tension","Static, kinetic, rolling, and air resistance","Weight, mass, acceleration, and momentum"],answer:0,why:"The four natural interactions are <b>gravitational, electromagnetic, weak nuclear, and strong nuclear</b>. Normal force and friction are macroscopic contact effects of electromagnetism, not additional fundamental forces."},
{id:"n28",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"How did the lecture relate gravitational mass to inertial mass?",choices:["They describe different roles but are numerically equal","They are the same definition and always use the same equation","Gravitational mass is measured in newtons while inertial mass has no units","Only gravitational mass resists a change in motion"],answer:0,why:"<b>Inertial mass</b> measures resistance to a change in linear motion. <b>Gravitational mass</b> determines gravitational interaction. They play different roles but are observed to be numerically equal."},
{id:"n29",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"Which natural forces are long-range according to the lecture?",choices:["Gravity and electromagnetism","Weak and strong nuclear forces","Normal force and friction","Only gravity"],answer:0,why:"Gravity and electromagnetism weaken with distance but remain <b>long-range</b>. The weak and strong nuclear interactions act only over extremely short distances."},
{id:"n30",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"At the microscopic level, ordinary contact forces are mainly effects of which natural force?",choices:["Electromagnetic force","Gravitational force","Weak nuclear force","Strong nuclear force"],answer:0,why:"Atoms at contacting surfaces interact electromagnetically. Normal force, friction, tension, and compression are macroscopic ways those <b>electromagnetic interactions</b> appear."},
{id:"n31",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"A contact force at a surface is separated into which two perpendicular components?",choices:["Normal force and friction","Weight and mass","Velocity and acceleration","Strong and weak force"],answer:0,why:"The <b>normal force</b> is perpendicular to the tangent line of the surface. <b>Friction</b> acts along that tangent line."},
{id:"n32",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"Which equation correctly describes static friction before an object begins sliding?",choices:["F_s ≤ μ_sF_N","F_s = μ_sF_N at all times","F_s = ma","F_s = mg"],answer:0,why:"Static friction adjusts to match the needed opposing force up to a maximum: <b>F_s ≤ μ_sF_N</b>. Equality applies only at the threshold of slipping."},
{id:"n33",topic:"newton",type:"num",origin:"Close transfer from Janatpour lecture · 2026-10-19",prompt:"A surface has μ_s = 0.40 and a normal force of 50 N. What is the maximum static friction? (N)",answer:20,tolerance:0.1,why:"At the threshold of motion, F_s,max = μ_sF_N = 0.40 × 50 = <b>20 N</b>. Below that threshold, static friction can be any smaller value needed."},
{id:"n34",topic:"newton",type:"num",origin:"Close transfer from Janatpour lecture · 2026-10-19",prompt:"A sliding box has μ_k = 0.25 and a normal force of 40 N. What is the kinetic friction? (N)",answer:10,tolerance:0.1,why:"For sliding surfaces, F_k = μ_kF_N = 0.25 × 40 = <b>10 N</b>, directed opposite the relative sliding motion."},
{id:"n35",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"For the same two surfaces, why is μ_k usually less than μ_s?",choices:["Sliding surface irregularities have less time to settle into one another","Kinetic friction has no normal-force dependence","Gravity stops acting once motion begins","Static friction acts only on perfectly smooth surfaces"],answer:0,why:"Microscopic surfaces are rough. While at rest, their irregularities can settle and interlock more fully. During sliding, they glide past with less time to settle, so typically <b>μ_k &lt; μ_s</b>."},
{id:"n36",topic:"newton",type:"mc",origin:"Janatpour lecture · 2026-10-19",prompt:"On a slowly raised incline, what does the critical angle mark?",choices:["The angle where maximum static friction is reached and the object begins to slide","The angle where gravity becomes zero","The angle where normal force equals mass","The angle where kinetic friction changes into gravity"],answer:0,why:"As the incline rises, the needed static friction increases until it reaches F_s,max. The <b>critical angle</b> is the threshold where static friction can no longer prevent sliding."},
/* --- Mastering Physics homework · 2026-09-16 — scaling/ratio reasoning --- */
{id:"sc1",topic:"scale",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"The radius of a circle of area A is doubled. The new area is ___ × A.",answer:4,why:"A = πr². Replace r with 2r: π(2r)² = π·4r² = <b>4A</b>. The exponent on r does the work — r is squared, so the factor gets squared too (2² = 4)."},
{id:"sc2",topic:"scale",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"A circle has circumference C. Its radius is doubled. The new circumference is ___ × C.",answer:2,why:"C = 2πr → 2π(2r) = <b>2C</b>. Here r is to the FIRST power, so the factor passes straight through. Same circle, two different scaling laws — read the exponent, never assume."},
{id:"sc3",topic:"scale",type:"num",origin:"Close transfer",prompt:"The radius of a sphere is tripled. Its volume (V = ⁴⁄₃πr³) becomes ___ × V.",answer:27,why:"3³ = <b>27</b>. Cube the factor when the variable is cubed. Seen as \u0027raise the factor to the same power\u0027, all of these are one move."},
{id:"sc4",topic:"scale",type:"mc",origin:"Close transfer",prompt:"Q = kx². If x is multiplied by 5, then Q is multiplied by:",choices:["25","5","10","2.5"],answer:0,why:"5² = <b>25</b>. The general rule worth writing on your cheat sheet once: <b>if Q ∝ xⁿ and x → cx, then Q → cⁿQ.</b> Stop re-deriving it per problem."},
{id:"sc5",topic:"scale",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"Two cars at equal speeds brake at the same instant. Car A\u0027s braking acceleration is 4× car B\u0027s. If car A stops in a distance D, car B stops in ___ × D.",answer:4,why:"From v² = v₀² + 2a·x with v = 0: x = v₀²/(2a). Same v₀, so <b>distance ∝ 1/a</b>. A quarter of the acceleration → <b>4D</b>. Sanity check: the car that brakes harder must stop shorter ✓."},
{id:"sc6",topic:"scale",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"Two cars at equal speeds brake at the same instant. Car A\u0027s braking acceleration is 4× car B\u0027s. If car B stops in time T, car A stops in ___ × T.",answer:0.25,tolerance:0.01,why:"From v = v₀ + at with v = 0: t = v₀/a, so <b>time ∝ 1/a</b> as well. Four times the acceleration → a quarter of the time: <b>0.25T</b>."},
{id:"sc7",topic:"scale",type:"num",origin:"Close transfer",prompt:"You double your car\u0027s speed and brake just as hard. Your stopping distance is multiplied by ___.",answer:4,why:"x = v₀²/(2a) — v₀ is <b>squared</b>. Double the speed, quadruple the stopping distance. Probably the most useful scaling fact in the chapter."},
{id:"sc8",topic:"scale",type:"mc",origin:"Close transfer",prompt:"With the initial speed fixed, how do stopping DISTANCE and stopping TIME scale with the braking acceleration a?",choices:["Both ∝ 1/a","Distance ∝ 1/a, time ∝ 1/a²","Distance ∝ 1/a², time ∝ 1/a","Both ∝ 1/a²"],answer:0,why:"x = v₀²/(2a) and t = v₀/a — a sits to the first power in both denominators, so <b>both are ∝ 1/a</b>. What differs is how they scale with v₀: squared for distance, linear for time."},
/* --- Mastering Physics homework · 2026-09-16 — free fall, other planets, big-a/short-t --- */
{id:"mn1",topic:"kin2",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"An astronaut throws a wrench 15.0 m straight up on Earth. With the SAME launch speed on the Moon (g_moon = 0.165g), how high does it go? (m)",answer:90.9,tolerance:0.8,why:"At the top v = 0, so 0 = v₀² − 2gh → h = v₀²/(2g). Same v₀ means <b>h ∝ 1/g</b>: h = 15.0/0.165 = <b>90.9 m</b>. You never have to find v₀ — everything that stays the same cancels."},
{id:"mn2",topic:"kin2",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"An astronaut throws a wrench straight up on Earth and it reaches a maximum height of 15.0 m. What launch speed did that take? (m/s, g = 9.80)",answer:17.1,tolerance:0.3,why:"v₀² = 2gh = 2(9.80)(15.0) = 294 → v₀ = √294 = <b>17.1 m/s</b>. You need this the moment the question turns to TIME, because time does not cancel the way height did."},
{id:"mn3",topic:"kin2",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"An astronaut throws a wrench 15.0 m straight up on Earth. With the same launch speed on the Moon (g_moon = 0.165g), how much LONGER is it in the air (up and down) than on Earth? (s)",answer:17.7,tolerance:0.6,why:"Flight time t = 2v₀/g. Earth: 2(17.1)/9.80 = 3.50 s. Moon: g = 0.165(9.80) = 1.617 m/s², t = 2(17.1)/1.617 = 21.2 s. The word is <b>longer</b>, so subtract: 21.2 − 3.50 = <b>17.7 s</b>. Writing 21.2 is the trap — the comparison word turns the problem into a subtraction."},
{id:"mn4",topic:"kin2",type:"mc",origin:"Close transfer",prompt:"Thrown up with the same speed, how do an object\u0027s MAXIMUM HEIGHT and TOTAL FLIGHT TIME depend on g?",choices:["h ∝ 1/g and t ∝ 1/g","h ∝ 1/g² and t ∝ 1/g","h ∝ 1/g and t ∝ 1/g²","Both ∝ 1/g²"],answer:0,why:"h = v₀²/(2g) and t = 2v₀/g — <b>both inversely proportional to g</b>. On the Moon g is 0.165×, so both come out about 6× bigger."},
{id:"ab1",topic:"units",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"An airbag acts for 31 ms. Express that in seconds.",answer:0.031,tolerance:0.0005,why:"milli = 10⁻³, so 31 ms = <b>0.031 s</b>. Every kinematic equation wants seconds. Convert on the line where you list knowns, not later — this is the same slip as reading 876 mg as 0.876 g too late."},
{id:"ab2",topic:"kin2",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"An airbag brings a passenger to a complete stop at a constant 60g over 31 ms. How far does the person travel while stopping? (m, g = 9.80)",answer:0.28,tolerance:0.03,why:"a = 60(9.80) = 588 m/s², t = 0.031 s. Ending at rest lets you use d = ½at² straight away: ½(588)(0.031)² = <b>0.28 m</b>. (Long route: v₀ = at = 18.2 m/s, then d = v₀t − ½at² = the same 0.28 m.)"},
{id:"ab3",topic:"kin2",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"An airbag brings a passenger to a complete stop at a constant 60g over 31 ms. How fast was the passenger moving when the bag first reached them? (m/s, g = 9.80)",answer:18.2,tolerance:0.4,why:"v = v₀ + at with v = 0 → v₀ = at = 588 × 0.031 = <b>18.2 m/s</b> (≈ 41 mph). Working backwards from \u0027comes to a complete stop\u0027 is standard: the final condition is a given, not a missing piece."},
{id:"ab4",topic:"kin2",type:"mc",origin:"Close transfer",prompt:"An object starts OR ends at rest under constant acceleration. The fastest distance formula is:",choices:["d = ½at²","d = v₀t","d = v₀t + ½at²","d = v²/2"],answer:0,why:"With one velocity equal to zero the v₀t term vanishes (from rest) or the two terms collapse to the same value (to rest): <b>d = ½at²</b>. Spotting \u0027from rest\u0027 or \u0027to a complete stop\u0027 saves a whole step."},
{id:"jf1",topic:"kin2",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"A pilot accelerates from rest at a constant 5.00g. How long does it take to reach 993 m/s? (s, g = 9.80)",answer:20.3,tolerance:0.5,why:"a = 5.00(9.80) = 49.0 m/s². t = v/a = 993/49.0 = <b>20.3 s</b>. Set that against the ~4.9 s a pilot can take 5g before blacking out — the answer to \u0027does he black out\u0027 is the COMPARISON, not the number."},
{id:"jf2",topic:"kin2",type:"num",origin:"Mastering Physics HW · 2026-09-16",prompt:"A pilot accelerates from rest at a constant 5.00g. What speed has he reached after 4.90 s? (m/s, g = 9.80)",answer:240,tolerance:4,why:"v = v₀ + at = 0 + 49.0(4.90) = <b>240 m/s</b> — as fast as he can get before the blackout limit, and well short of 993 m/s."},
/* --- v2.9: WHICH EQUATION? — selection only, no arithmetic. The skill is: list knowns,
   mark the want, find what is MISSING, pick the equation that leaves it out. --- */
{id:"pk0",topic:"pick",type:"mc",prompt:"You've listed what you know and what you want. The equation to use is the one that:",choices:["leaves OUT the one variable you neither have nor want","has the most variables in it","you remember best","has the unknown on the left side"],answer:0,why:"That is the entire method. Every kinematic equation is missing exactly one of {Δx, v, v₀, a, t}. Find which one you don't have and don't need — grab the equation without it. No vibes, no 'which one fits the situation'."},
{id:"pk1",topic:"pick",type:"mc",prompt:"A car doing 20 m/s brakes to a stop in 50 m. You want the deceleration.<br><span class='muted'>Have: starting speed, final speed (0), distance · Want: a · Missing: ?</span>",choices:["v = v₀ + at &nbsp;<span class='muted'>(no Δx)</span>","Δx = v₀t + ½at² &nbsp;<span class='muted'>(no v)</span>","v² = v₀² + 2aΔx &nbsp;<span class='muted'>(no t)</span>","Δx = ½(v₀ + v)t &nbsp;<span class='muted'>(no a)</span>"],answer:2,why:"Have v₀, v, Δx. Want a. <b>Missing: t.</b> The equation with no t is <b>v² = v₀² + 2aΔx</b>."},
{id:"pk2",topic:"pick",type:"mc",prompt:"A ball is dropped from rest and falls for 3.0 s. You want how far it fell.<br><span class='muted'>Have: v₀ = 0, a = g, time · Want: Δy · Missing: ?</span>",choices:["v = v₀ + at &nbsp;<span class='muted'>(no Δx)</span>","Δx = v₀t + ½at² &nbsp;<span class='muted'>(no v)</span>","v² = v₀² + 2aΔx &nbsp;<span class='muted'>(no t)</span>","Δx = ½(v₀ + v)t &nbsp;<span class='muted'>(no a)</span>"],answer:1,why:"Have v₀, a, t. Want Δx (Δy here). <b>Missing: v.</b> The equation with no v is <b>Δx = v₀t + ½at²</b>. 'Dropped from rest' handed you v₀ = 0 for free."},
{id:"pk3",topic:"pick",type:"mc",prompt:"A sprinter starts from rest and accelerates at 3 m/s² for 4 s. You want her final speed.<br><span class='muted'>Have: v₀ = 0, a, t · Want: v · Missing: ?</span>",choices:["v = v₀ + at &nbsp;<span class='muted'>(no Δx)</span>","Δx = v₀t + ½at² &nbsp;<span class='muted'>(no v)</span>","v² = v₀² + 2aΔx &nbsp;<span class='muted'>(no t)</span>","Δx = ½(v₀ + v)t &nbsp;<span class='muted'>(no a)</span>"],answer:0,why:"Have v₀, a, t. Want v. <b>Missing: Δx.</b> The equation with no Δx is <b>v = v₀ + at</b>."},
{id:"pk4",topic:"pick",type:"mc",prompt:"A train slows from 30 m/s to 10 m/s over 20 s. You want how far it travelled while slowing.<br><span class='muted'>Have: v₀, v, t · Want: Δx · Missing: ?</span>",choices:["v = v₀ + at &nbsp;<span class='muted'>(no Δx)</span>","Δx = v₀t + ½at² &nbsp;<span class='muted'>(no v)</span>","v² = v₀² + 2aΔx &nbsp;<span class='muted'>(no t)</span>","Δx = ½(v₀ + v)t &nbsp;<span class='muted'>(no a)</span>"],answer:3,why:"Have v₀, v, t. Want Δx. <b>Missing: a.</b> The equation with no a is <b>Δx = ½(v₀ + v)t</b> — the average-velocity one. (You could also find a first and use another; this is the one-step route.)"},
{id:"pk5",topic:"pick",type:"mc",prompt:"A ball is thrown straight up at 15 m/s. You want how high it goes.<br><span class='muted'>Have: v₀, v at the top = 0, a = −g · Want: Δy · Missing: ?</span>",choices:["v = v₀ + at &nbsp;<span class='muted'>(no Δx)</span>","Δx = v₀t + ½at² &nbsp;<span class='muted'>(no v)</span>","v² = v₀² + 2aΔx &nbsp;<span class='muted'>(no t)</span>","Δx = ½(v₀ + v)t &nbsp;<span class='muted'>(no a)</span>"],answer:2,why:"Have v₀, v (0 at the top), a. Want Δy. <b>Missing: t.</b> → <b>v² = v₀² + 2aΔy</b>. 'How high' means the top, and the top hands you v = 0 for free."},
{id:"pk6",topic:"pick",type:"mc",prompt:"A ball is thrown straight up at 15 m/s. You want how long it takes to reach the top.<br><span class='muted'>Have: v₀, v = 0, a = −g · Want: t · Missing: ?</span>",choices:["v = v₀ + at &nbsp;<span class='muted'>(no Δx)</span>","Δx = v₀t + ½at² &nbsp;<span class='muted'>(no v)</span>","v² = v₀² + 2aΔx &nbsp;<span class='muted'>(no t)</span>","Δx = ½(v₀ + v)t &nbsp;<span class='muted'>(no a)</span>"],answer:0,why:"Have v₀, v, a. Want t. <b>Missing: Δy.</b> → <b>v = v₀ + at</b>. Same story as pk5, different want, different missing variable, different equation."},
{id:"pk7",topic:"pick",type:"mc",prompt:"A bike moving at 5 m/s speeds up at 2 m/s² for 6 s. You want the distance covered.<br><span class='muted'>Have: v₀, a, t · Want: Δx · Missing: ?</span>",choices:["v = v₀ + at &nbsp;<span class='muted'>(no Δx)</span>","Δx = v₀t + ½at² &nbsp;<span class='muted'>(no v)</span>","v² = v₀² + 2aΔx &nbsp;<span class='muted'>(no t)</span>","Δx = ½(v₀ + v)t &nbsp;<span class='muted'>(no a)</span>"],answer:1,why:"Have v₀, a, t. Want Δx. <b>Missing: v.</b> → <b>Δx = v₀t + ½at²</b>."},
{id:"pk8",topic:"pick",type:"mc",prompt:"The phrase <b>\"comes to a stop\"</b> hands you which known for free?",choices:["v = 0","v₀ = 0","a = 0","t = 0"],answer:0,why:"Final velocity is zero. The word bank: <b>from rest</b> → v₀ = 0 · <b>comes to a stop</b> → v = 0 · <b>at the top</b> → v_y = 0 · <b>dropped / thrown / in flight</b> → a = g downward · <b>constant velocity</b> → a = 0. Half the knowns in a problem are words, not numbers."},
{id:"pk9",topic:"pick",type:"mc",prompt:"The word <b>\"dropped\"</b> hands you:",choices:["v₀ = 0 AND a = g downward","only a = g downward","only v₀ = 0","v = 0"],answer:0,why:"Two knowns from one word: it starts at rest (v₀ = 0) and gravity is the only acceleration (a = g, down). Missing knowns are usually hiding in the verbs."},
{id:"pk10",topic:"pick",type:"mc",prompt:"A launcher fires a ball at an angle. You know the launch height, the landing distance, and the angle. You want the launch speed. There is NO time given. How many equations, and which?",choices:["Two: the position equation once for x and once for y, sharing the same t","One: v² = v₀² + 2aΔx","One: Δx = v₀t + ½at²","Four: all of them"],answer:0,why:"Two unknowns (v₀ and t) need two equations. x and y are independent, so each axis gets its own copy of Δx = v₀t + ½at² — with subscripts. The ONE thing shared between them is <b>t</b>: solve one for t, substitute into the other. That is exactly what the Projectile Motion lab was."},
{id:"pk11",topic:"pick",type:"mc",prompt:"A ball rolls horizontally off a table of height h. You want the flight time. Which axis and which equation?",choices:["y-axis: Δy = v₀ᵧt + ½aᵧt², with v₀ᵧ = 0 and aᵧ = −g","x-axis: Δx = v₀ₓt","y-axis: vᵧ = v₀ᵧ + aᵧt","x-axis: vₓ² = v₀ₓ² + 2aₓΔx"],answer:0,why:"Time in the air is decided by the DROP, so it's a y-axis question. 'Rolls horizontally' means v₀ᵧ = 0, so Δy = ½aᵧt² → t = √(2h/g). The x-axis has nothing to say about time here; it only tells you how far it went once you know t."},
{id:"pk12",topic:"pick",type:"mc",prompt:"In projectile motion, what is the ONE quantity the x-axis and y-axis share?",choices:["t (time)","a (acceleration)","v₀ (launch speed)","Δx"],answer:0,why:"The clock is the same for both axes — that's the bridge. Accelerations differ (aₓ = 0, aᵧ = −g), velocities differ, displacements differ. When you have two equations and two unknowns, t is what you eliminate."},
{id:"pk13",topic:"pick",type:"mc",prompt:"Lab data: range R and flight time t for a ball launched at 45°. R ÷ t gives you:",choices:["only the horizontal component v₀ₓ — not the launch speed","the launch speed v₀","the vertical component v₀ᵧ","the acceleration"],answer:0,why:"Δx = v₀ₓ t, so R/t = v₀ₓ = v₀ cos 45°. To get v₀ you'd divide by cos 45° (or use the geometry route). Reporting R/t as 'the speed' is the one mistake that sinks the lab."},
{id:"pk14",topic:"pick",type:"mc",prompt:"You're stuck in lecture and can't see which equation. What's the first thing to write?",choices:["Knowns with numbers, the want with a ?, then the missing variable","The equation you remember best","The answer you expect","The diagram from the textbook"],answer:0,why:"Three lines, ten seconds. The missing variable picks the equation FOR you. If the missing variable appears in every equation you have (two unknowns), you need a second equation — usually the other axis."},

/* --- v2.9: PROJECTILE MOTION — the lab's own numbers, so the reps are things you lived. --- */
{id:"pj1",topic:"proj",type:"num",prompt:"Ignoring air, a ball's horizontal acceleration during flight is ? (m/s²)",answer:0,why:"<b>0.</b> Nothing pushes sideways once it leaves the launcher. That's why x = v₀ₓ t is so simple — constant velocity sideways."},
{id:"pj2",topic:"proj",type:"num",prompt:"Up is positive. A ball's vertical acceleration during flight is ? (m/s²)",answer:-9.8,tolerance:0.05,why:"<b>−9.8 m/s²</b>, every instant, including at the top. Sign comes from your choice of positive direction; with up positive, gravity is negative."},
{id:"pj3",topic:"proj",type:"num",origin:"Projectile Motion lab · 2026-09-22",prompt:"A ball rolls horizontally off a ledge 1.164 m high. Flight time ≈ ? (s)",answer:0.49,tolerance:0.02,why:"y-axis, v₀ᵧ = 0: h = ½gt² → t = √(2h/g) = √(2 × 1.164 / 9.8) = <b>0.49 s</b>. Only the height matters — how fast it was rolling doesn't change the fall time."},
{id:"pj4",topic:"proj",type:"num",origin:"Projectile Motion lab · 2026-09-22",prompt:"A ball rolls horizontally off a ledge 1.164 m high and lands 2.00 m away horizontally. How fast was it moving when it left the ledge? (m/s)",answer:4.1,tolerance:0.1,why:"x-axis: x = v₀ₓ t → v₀ₓ = 2.00 / 0.487 = <b>4.1 m/s</b>. Horizontal launch means v₀ IS v₀ₓ (no vertical component), so this is the launch speed."},
{id:"pj5",topic:"proj",type:"mc",prompt:"At the very top of a projectile's arc, which of these is zero?",choices:["vᵧ (vertical velocity)","v (the whole velocity)","aᵧ (vertical acceleration)","vₓ (horizontal velocity)"],answer:0,why:"Only <b>vᵧ = 0</b>. It's still moving sideways (vₓ ≠ 0), and gravity never switches off (aᵧ = −g). 'Velocity is zero at the top' is a one-dimensional fact that does NOT survive into 2D."},
{id:"pj6",topic:"proj",type:"num",prompt:"A ball is launched at 6.0 m/s, 30° above horizontal (cos 30° ≈ 0.866). What is v₀ₓ, the horizontal part of its launch velocity? (m/s)",answer:5.2,tolerance:0.1,why:"v₀ₓ = v₀ cos θ = 6.0 × 0.866 = <b>5.2 m/s</b>. Adjacent gets cos — same rule as the hiker."},
{id:"pj7",topic:"proj",type:"num",prompt:"A ball is launched at 6.0 m/s, 30° above horizontal (sin 30° = 0.5). What is v₀ᵧ, the vertical part of its launch velocity? (m/s)",answer:3.0,tolerance:0.1,why:"v₀ᵧ = v₀ sin θ = 6.0 × 0.5 = <b>3.0 m/s</b>. Check: √(5.2² + 3.0²) ≈ 6.0 ✓."},
{id:"pj8",topic:"proj",type:"mc",prompt:"Horizontal launch. You double the launch height. Flight time is multiplied by:",choices:["√2 ≈ 1.41","2","4","½"],answer:0,why:"t = √(2h/g) — t goes as h to the ½ power, so doubling h multiplies t by 2^½ = <b>√2</b>. Same scaling rule as the doubled-radius circle: raise the factor to the power the variable carries."},
{id:"pj9",topic:"proj",type:"num",origin:"Projectile Motion lab · 2026-09-22",prompt:"Your lab: launched at 45° from h = 1.164 m, average range R = 5.045 m. Launch speed v₀ ≈ ? (m/s)",answer:6.3,tolerance:0.15,why:"At 45° the two-axis solution collapses to v₀ = R √(g / (R + h)) = 5.045 × √(9.8 / 6.209) = <b>6.3 m/s</b>. No stopwatch needed — three tape/protractor numbers pin it down."},

/* v2.9 — words ↔ symbols. Shown under every Problem Lab givens box and on the Bench Card,
   because "what the heck is R" is a real, logged failure point: the WORD is tracked, the
   letter isn't. Name the quantity in words first, symbol second, every time. */
const SYMBOLS = {
  "x":"position / horizontal distance (m)", "Δx":"displacement — change in position (m)", "y":"vertical position (m)",
  "R":"range — horizontal distance travelled (m)", "h":"height — vertical drop or rise (m)", "d":"distance / displacement magnitude (m)",
  "v":"final velocity (m/s)", "v₀":"initial (launch) velocity (m/s)", "v₀ₓ":"initial velocity, horizontal part (m/s)", "v₀ᵧ":"initial velocity, vertical part (m/s)",
  "a":"acceleration (m/s²)", "Δy":"vertical displacement — change in height (m)", "g":"gravity's acceleration, 9.8 m/s² downward", "t":"time in flight / elapsed time (s)",
  "θ":"angle (from the horizontal unless told otherwise)", "F":"force (N)", "m":"mass (kg)", "F_net":"net force — all forces added as vectors (N)"
};
function autoSymbols(givenHtml){
  const txt=givenHtml.replace(/<[^>]+>/g," ");
  const order=["Δx","Δy","v₀ₓ","v₀ᵧ","v₀","F_net","θ","R","h","d","x","y","v","a","g","t"];
  const found=[]; const isWord=c=>/[A-Za-z0-9₀-₉ₓᵧ_Δ]/.test(c);
  order.forEach(k=>{ let i=txt.indexOf(k); while(i>=0){ const before=i>0?txt[i-1]:" ", after=txt[i+k.length]||" "; if(!isWord(before)&&!isWord(after)){ found.push(k); break; } i=txt.indexOf(k,i+1); } });
  return found;
}
function symbolsLegend(list){
  if(!list||!list.length) return null;
  const d=el("div",{class:"symbols"});
  d.innerHTML='<b>Symbols here:</b> '+list.map(k=>'<span class="sym"><span class="mono">'+k+'</span> = '+(SYMBOLS[k]||"?")+'</span>').join(' · ');
  return d;
}

/* ---- DRILL ---- */
function startDiagnostic(){
  // 1 question per topic, unseen/missed first — the "walk in ahead of the curve" check
  const pool=[];
  Object.keys(TOPICS).filter(k=>k!=="diag").forEach(k=>{
    const qs=QUESTIONS.filter(q=>q.topic===k);
    if(!qs.length)return;
    const seen=id=>(S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
    pool.push(shuffle(qs).sort((a,b)=>seen(a.id)-seen(b.id))[0]);
  });
  S.drill={queue:shuffle(pool),i:0,right:0,wrong:0,topic:"__diag",answered:false};
  go("drill");
}
function startDrill(topic){
  let pool;
  if (topic==="__missed"){ const ids=[...new Set(S.missed)]; pool=QUESTIONS.filter(q=>ids.includes(q.id)); if(!pool.length){ alert("No missed questions yet — go earn some."); return; } }
  else pool = QUESTIONS.filter(q=>q.topic===topic);
  // unseen first, then wrong-heavy first
  const seen = id => (S.qstats[id]?.r||0)+(S.qstats[id]?.w||0);
  pool = shuffle(pool).sort((a,b)=>seen(a.id)-seen(b.id));
  S.drill = {queue:pool.slice(0,10), i:0, right:0, wrong:0, topic, answered:false};
  go("drill");
}
VIEWS.drill = (v) => {
  if (!S.drill){ // topic chooser
    v.appendChild(el("div",{class:"card"},'<span class="tag violet">Drill</span><h2>Pick a topic</h2><p class="muted">Or better: go back to Today and press the one button. (The chooser exists for review, not for deciding.)</p>'));
    const pr = el("div",{class:"pill-row"});
    Object.entries(TOPICS).filter(([k])=>k!=="diag").forEach(([k,t])=>{
      const qs = QUESTIONS.filter(q=>q.topic===k);
      const done = qs.filter(q=>S.qstats[q.id]?.r).length;
      pr.appendChild(el("button",{class:"pill"+(done===qs.length&&qs.length?" done":""),onclick:()=>startDrill(k)},t.ico+" "+t.name+" <span class='mono'>"+done+"/"+qs.length+"</span>"));
    });
    pr.appendChild(el("button",{class:"pill bright-gold",onclick:()=>startDiagnostic()},"🧪 Mixed diagnostic"));
    pr.appendChild(el("button",{class:"pill bright-coral",onclick:()=>startDrill("__missed")},"🔥 Review missed ("+[...new Set(S.missed)].length+")"));
    v.appendChild(pr);
    return;
  }
  const D = S.drill;
  if (D.i>=D.queue.length){ // round over
    const pct = D.queue.length?Math.round(100*D.right/D.queue.length):0;
    if (pct>=80) confetti();
    const c = el("div",{class:"card"+(pct>=80?" teal":"")});
    c.innerHTML='<span class="tag gold">Round complete</span><h2>'+D.right+' / '+D.queue.length+' ('+pct+'%)</h2>'+
      '<p style="margin:8px 0">'+(pct>=80?"That clears the bar. Mark the day and stop — consistency beats intensity.":"Below 80 — the misses just joined your Review queue. Read each 'why', then re-run them tomorrow (spacing, not re-cramming today).")+'</p>';
    const row=el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"});
    if (pct>=70){ row.appendChild(el("button",{class:"btn gold",onclick:()=>{ const t=todayStr(); if(!S.doneDays.includes(t)) S.doneDays.push(t); save(); S.drill=null; go("home"); }},"✓ Mark today done")); }
    row.appendChild(el("button",{class:"btn ghost",onclick:()=>{S.drill=null; render();}},"Another topic"));
    c.appendChild(row); v.appendChild(c); return;
  }
  const q = D.queue[D.i];
  const c = el("div",{class:"card"});
  c.innerHTML='<span class="tag violet">'+(TOPICS[q.topic]?.name||"Review")+' · '+(D.i+1)+'/'+D.queue.length+'</span>'+
    (q.origin?'<span class="tag gold" style="margin-left:6px">'+q.origin+'</span>':'')+
    '<div class="qprompt">'+q.prompt+'</div>';
  if(q.figure) c.appendChild(el("div",{class:"question-figure"},FIGURES[q.figure]));
  const fb = el("div");
  const finish = (ok, revealHtml) => {
    D.answered=true;
    const st=S.qstats[q.id]||(S.qstats[q.id]={r:0,w:0});
    if(ok){st.r++;D.right++;}else{st.w++;D.wrong++;S.missed.push(q.id);}
    save();
    fb.innerHTML='<p class="'+(ok?"feedback-right":"feedback-wrong")+'">'+(ok?"✓ Right":"✗ Not quite"+(revealHtml?" — answer: "+revealHtml:""))+'</p><div class="why">'+q.why+'</div>';
    fb.appendChild(el("button",{class:"btn coral",style:"margin-top:10px",onclick:()=>{D.i++;D.answered=false;render();}},"Next →"));
    if(!ok)c.classList.add("shake");
  };
  if (q.type==="multi"){
    c.appendChild(el("div",{class:"multi-hint"},"Choose every true statement, then press Check."));
    const ch=el("div",{class:"choices"});
    const selected=new Set();
    q.choices.forEach((txt,i)=>{
      const b=el("button",{class:"choice",onclick:(e)=>{
        if(D.answered)return;
        if(selected.has(i)){selected.delete(i);e.currentTarget.classList.remove("selected");e.currentTarget.innerHTML="☐ &nbsp;"+txt;}
        else{selected.add(i);e.currentTarget.classList.add("selected");e.currentTarget.innerHTML="☑ &nbsp;"+txt;}
      }},"☐ &nbsp;"+txt);
      ch.appendChild(b);
    });
    c.appendChild(ch);
    c.appendChild(el("button",{class:"btn",style:"margin-top:12px",onclick:()=>{
      if(D.answered||!selected.size)return;
      const correct=new Set(q.answer);
      const ok=selected.size===correct.size&&[...selected].every(i=>correct.has(i));
      [...ch.children].forEach((b,i)=>{b.disabled=true;if(correct.has(i))b.classList.add("reveal-right");else if(selected.has(i))b.classList.add("picked-wrong");});
      finish(ok,"");
    }},"Check selections"));
  } else if (q.type==="mc"){
    const ch=el("div",{class:"choices"});
    const order=shuffle(q.choices.map((txt,i)=>({txt,i})));
    order.forEach(o=>{
      ch.appendChild(el("button",{class:"choice",onclick:(e)=>{
        if(D.answered)return;
        const ok=o.i===q.answer;
        e.currentTarget.classList.add(ok?"picked-right":"picked-wrong");
        if(!ok){ [...ch.children].forEach((b,bi)=>{ if(order[bi].i===q.answer)b.classList.add("reveal-right"); }); }
        finish(ok,"");
      }},o.txt));
    });
    c.appendChild(ch);
  } else {
    const inp=el("input",{class:"answerbox"+(q.type==="text"?" wide":""),type:"text",inputmode:q.type==="num"?"decimal":"text",placeholder:q.type==="num"?"#":"answer"});
    const sub=el("button",{class:"btn",style:"margin-left:8px",onclick:()=>{
      if(D.answered)return;
      let ok=false, val=inp.value.trim();
      if(!val)return;
      if(q.type==="num"){ const n=parseFloat(val.replace("−","-").replace(",",".")); const tol=q.tolerance||0; ok=Math.abs(n-q.answer)<=tol; }
      else { const norm=s=>s.toLowerCase().replace(/[\s−]/g,"-").replace(/-+/g,"-").replace(/[^a-z0-9+\-]/g,""); const acc=(q.accept||[String(q.answer)]).map(norm); ok=acc.includes(norm(val)); }
      finish(ok,"<b class='mono'>"+q.answer+"</b>");
    }},"Check");
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")sub.click();});
    const row=el("div"); row.appendChild(inp); row.appendChild(sub); c.appendChild(row);
    setTimeout(()=>inp.focus(),50);
  }
  c.appendChild(fb);
  v.appendChild(c);
  v.appendChild(el("div",{class:"center"},'<button class="btn ghost small" onclick="S.drill=null;render()">quit round</button>'));
};

    if (!S.probDone.includes(p.key)) S.probDone.push(p.key);
    // lab-day auto-credit
    const t=todayStr(); const plan=TRACK.find(x=>x.day===t);
    if (plan && plan.topic==="lab" && !S.doneDays.includes(t)) S.doneDays.push(t);

    const c=el("div",{class:"card teal"},'<h2>✓ '+p.formula+' — every step checks out</h2><p>Setup ✓ · equation ✓ · algebra ✓ · numbers with units ✓. That is what "blank-page solved" means.</p>');

    const row=el("div"); row.appendChild(inp); row.appendChild(sub); card.appendChild(row);
    setTimeout(()=>inp.focus(),50);
  }
  card.appendChild(fb);
  wrap.appendChild(card);
  wrap.appendChild(el("button",{class:"btn ghost small",onclick:()=>{S.lab=null;render();}},"← problems"));
  v.appendChild(wrap);

VIEWS.report = (v) => {

"PHYS 210 BOOTCAMP REPORT — "+todayStr()+"\n"+
"(paste this to Claude in the PHYS 210 session)\n\n"+
"Track: "+S.doneDays.length+"/"+TRACK.length+" days marked done ("+S.doneDays.join(", ")+")\n"+
"Visits: "+S.visits.join(", ")+"\n"+
"Questions: "+a.r+" right / "+a.w+" wrong ("+a.pct+"% overall)\n"+
(perTopic?("By topic:\n"+perTopic+"\n"):"")+
"Problems solved: "+(S.probDone.join(", ")||"none")+"\n"+
"Step-type misses (Problem Lab): setup "+m.setup+" · equation "+m.equation+" · algebra "+m.algebra+" · number/units "+m.number+"\n"+
(missedIds.length?("Recent misses:\n"+missedTxt+"\n"):"")+
"Storage: "+(safeStore.persistent?"persistent":"SESSION-ONLY (progress not saved!)")+"\n";

  c.innerHTML='<span class="tag coral">Close the loop</span><h2>Report to Claude</h2><p class="muted" style="margin-bottom:10px">This feeds your Learning Profile — adherence, error patterns by STEP TYPE, what stuck. Copy it, paste it into the chat, and the ledger gets updated with real data instead of vibes.</p>';
  const ta=el("textarea",{class:"report",readonly:"readonly"}); ta.value=txt; c.appendChild(ta);
  const b=el("button",{class:"btn coral",style:"margin-top:10px",onclick:()=>{ ta.select(); try{ navigator.clipboard.writeText(txt); b.textContent="✓ Copied";}catch(e){ document.execCommand("copy"); b.textContent="✓ Copied"; } setTimeout(()=>b.textContent="Copy report",1600); }},"Copy report");
